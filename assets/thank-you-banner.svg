<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 195" width="460" height="195">
  <defs>
    <!-- Soft anime warm glow + outer sticker shadow -->
    <filter id="anGlow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#4c1d4b" flood-opacity="0.32"/>
    </filter>
    <!-- Glossy Anime Pastel Cel-Shading Gradients -->
    <linearGradient id="anLav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="28%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="anPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="28%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="anSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="28%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="anMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="28%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="anGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="28%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="anPeach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="28%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="anStar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <style>
      .an-outer {
        font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Nunito', 'Comic Sans MS', sans-serif;
        font-weight: 900;
        fill: #ffffff;
        stroke: #ffffff;
        stroke-width: 13;
        stroke-linejoin: round;
        paint-order: stroke fill;
      }
      .an-ext {
        font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Nunito', 'Comic Sans MS', sans-serif;
        font-weight: 900;
        fill: #5b3158;
        stroke: #5b3158;
        stroke-width: 7.5;
        stroke-linejoin: round;
        paint-order: stroke fill;
      }
      .an-face {
        font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Nunito', 'Comic Sans MS', sans-serif;
        font-weight: 900;
        stroke: #5b3158;
        stroke-width: 4.5;
        stroke-linejoin: round;
        paint-order: stroke fill;
      }
      .an-gloss {
        font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Nunito', 'Comic Sans MS', sans-serif;
        font-weight: 900;
        fill: #ffffff;
        opacity: 0.36;
      }
      .l1 { transform-origin: 96px 76px; animation: anBob 1.3s cubic-bezier(0.37, 0, 0.63, 1) 0.00s infinite alternate; }
      .l2 { transform-origin: 162px 72px; animation: anBob 1.3s cubic-bezier(0.37, 0, 0.63, 1) 0.12s infinite alternate; }
      .l3 { transform-origin: 230px 70px; animation: anBob 1.3s cubic-bezier(0.37, 0, 0.63, 1) 0.24s infinite alternate; }
      .l4 { transform-origin: 298px 72px; animation: anBob 1.3s cubic-bezier(0.37, 0, 0.63, 1) 0.36s infinite alternate; }
      .l5 { transform-origin: 364px 76px; animation: anBob 1.3s cubic-bezier(0.37, 0, 0.63, 1) 0.48s infinite alternate; }
      .l6 { transform-origin: 146px 148px; animation: anBob 1.3s cubic-bezier(0.37, 0, 0.63, 1) 0.18s infinite alternate; }
      .l7 { transform-origin: 214px 150px; animation: anBob 1.3s cubic-bezier(0.37, 0, 0.63, 1) 0.32s infinite alternate; }
      .l8 { transform-origin: 282px 148px; animation: anBob 1.3s cubic-bezier(0.37, 0, 0.63, 1) 0.46s infinite alternate; }
      .l9 { transform-origin: 334px 146px; animation: anBob 1.3s cubic-bezier(0.37, 0, 0.63, 1) 0.58s infinite alternate; }
      .st1 { animation: anStarPop 1.4s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .st2 { animation: anStarPop 1.4s cubic-bezier(0.37, 0, 0.63, 1) 0.55s infinite alternate; }
      .st3 { animation: anStarPop 1.6s cubic-bezier(0.37, 0, 0.63, 1) 0.25s infinite alternate; }
      @keyframes anBob {
        0% { transform: translateY(0px) rotate(-2.5deg); }
        100% { transform: translateY(-7px) rotate(2.5deg); }
      }
      @keyframes anStarPop {
        0% { transform: scale(0.84) rotate(-8deg); opacity: 0.85; }
        100% { transform: scale(1.14) rotate(8deg); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Anime Cel-Shaded Stars & Petals Around Lettering -->
  <g transform="translate(52, 54)"><g class="st1">
    <polygon points="0,-13 3.6,-4.2 13,-3.2 5.8,2.8 8,12 0,7 -8,12 -5.8,2.8 -13,-3.2 -3.6,-4.2" fill="url(#anStar)" stroke="#5b3158" stroke-width="2.2" stroke-linejoin="round"/>
  </g></g>
  <g transform="translate(406, 48)"><g class="st2">
    <polygon points="0,-14 3.8,-4.5 14,-3.5 6.2,3 8.5,13 0,7.5 -8.5,13 -6.2,3 -14,-3.5 -3.8,-4.5" fill="url(#anStar)" stroke="#5b3158" stroke-width="2.2" stroke-linejoin="round"/>
  </g></g>
  <g transform="translate(90, 146)"><g class="st3">
    <polygon points="0,-11 3,-3.6 11,-2.8 5,2.4 6.8,10 0,6 -6.8,10 -5,2.4 -11,-2.8 -3,-3.6" fill="url(#anStar)" stroke="#5b3158" stroke-width="2" stroke-linejoin="round"/>
  </g></g>
  <g transform="translate(376, 142)"><g class="st1">
    <polygon points="0,-11 3,-3.6 11,-2.8 5,2.4 6.8,10 0,6 -6.8,10 -5,2.4 -11,-2.8 -3,-3.6" fill="url(#anPink)" stroke="#5b3158" stroke-width="2" stroke-linejoin="round"/>
  </g></g>
  <!-- 4-point anime light glints -->
  <g transform="translate(230, 18)"><g class="st2">
    <path d="M0,-9 L2.2,-2.2 L9,0 L2.2,2.2 L0,9 L-2.2,2.2 L-9,0 L-2.2,-2.2 Z" fill="#ffffff" stroke="#a855f7" stroke-width="1"/>
  </g></g>
  <g transform="translate(132, 24)"><g class="st3">
    <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z" fill="#fef08a"/>
  </g></g>
  <g transform="translate(332, 22)"><g class="st1">
    <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z" fill="#fda4af"/>
  </g></g>

  <!-- Row 1: T H A N K (Gently Arched Anime Cel-Shaded Glossy Letters) -->
  <g filter="url(#anGlow)" font-size="68" text-anchor="middle">
    <g class="l1" transform="rotate(-7, 96, 86)">
      <text x="96" y="92" class="an-outer">T</text>
      <text x="96" y="96" class="an-ext">T</text>
      <text x="96" y="92" class="an-face" fill="url(#anLav)">T</text>
      <text x="95" y="88" class="an-gloss" font-size="64">T</text>
    </g>
    <g class="l2" transform="rotate(-3, 162, 82)">
      <text x="162" y="88" class="an-outer">H</text>
      <text x="162" y="92" class="an-ext">H</text>
      <text x="162" y="88" class="an-face" fill="url(#anPink)">H</text>
      <text x="161" y="84" class="an-gloss" font-size="64">H</text>
    </g>
    <g class="l3">
      <text x="230" y="86" class="an-outer">A</text>
      <text x="230" y="90" class="an-ext">A</text>
      <text x="230" y="86" class="an-face" fill="url(#anSky)">A</text>
      <text x="229" y="82" class="an-gloss" font-size="64">A</text>
    </g>
    <g class="l4" transform="rotate(3, 298, 82)">
      <text x="298" y="88" class="an-outer">N</text>
      <text x="298" y="92" class="an-ext">N</text>
      <text x="298" y="88" class="an-face" fill="url(#anMint)">N</text>
      <text x="297" y="84" class="an-gloss" font-size="64">N</text>
    </g>
    <g class="l5" transform="rotate(7, 364, 86)">
      <text x="364" y="92" class="an-outer">K</text>
      <text x="364" y="96" class="an-ext">K</text>
      <text x="364" y="92" class="an-face" fill="url(#anGold)">K</text>
      <text x="363" y="88" class="an-gloss" font-size="64">K</text>
    </g>
  </g>

  <!-- Row 2: Y O U ! -->
  <g filter="url(#anGlow)" font-size="66" text-anchor="middle">
    <g class="l6" transform="rotate(-5, 146, 154)">
      <text x="146" y="162" class="an-outer">Y</text>
      <text x="146" y="166" class="an-ext">Y</text>
      <text x="146" y="162" class="an-face" fill="url(#anPink)">Y</text>
      <text x="145" y="158" class="an-gloss" font-size="62">Y</text>
    </g>
    <g class="l7" transform="rotate(-1, 214, 156)">
      <text x="214" y="164" class="an-outer">O</text>
      <text x="214" y="168" class="an-ext">O</text>
      <text x="214" y="164" class="an-face" fill="url(#anGold)">O</text>
      <text x="213" y="160" class="an-gloss" font-size="62">O</text>
    </g>
    <g class="l8" transform="rotate(3, 282, 154)">
      <text x="282" y="162" class="an-outer">U</text>
      <text x="282" y="166" class="an-ext">U</text>
      <text x="282" y="162" class="an-face" fill="url(#anMint)">U</text>
      <text x="281" y="158" class="an-gloss" font-size="62">U</text>
    </g>
    <g class="l9" transform="rotate(9, 336, 152)">
      <text x="336" y="160" class="an-outer">!</text>
      <text x="336" y="164" class="an-ext">!</text>
      <text x="336" y="160" class="an-face" fill="url(#anLav)">!</text>
      <text x="335" y="156" class="an-gloss" font-size="60">!</text>
    </g>
  </g>
</svg>
