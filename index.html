<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Custom Theme Engine — Live Interactive Preview</title>
  <link rel="stylesheet" href="./src/views/styles/mascots.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      color: #f1f5f9;
      user-select: none;
    }
    body.ag-light-mode { color: #0f172a; }

    #ag-custom-bg, #ag-custom-overlay, #ag-custom-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      transition: background 0.35s ease, background-color 0.2s ease;
    }
    #ag-custom-overlay {
      background-color: var(--ag-overlay-color, rgba(0, 0, 0, 0.34));
    }
    #ag-custom-decor { overflow: hidden; }
    #ag-custom-decor .ag-art {
      position: absolute;
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
    }
    #ag-custom-decor .ag-p { position: absolute; line-height: 1; }
    #ag-custom-decor .ag-p.dot { border-radius: 50%; }
    #ag-custom-decor .ag-p.bubble {
      border-radius: 50%;
      border: 1.5px solid rgba(165, 243, 252, 0.65);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.7), rgba(34,211,238,0.1) 70%);
    }
    #ag-custom-decor .ag-p.flame { border-radius: 50% 0 50% 50%; filter: blur(1px); }
    #ag-custom-decor .ag-p.bokeh { border-radius: 50%; filter: blur(14px); }
    #ag-custom-decor .ag-p.shoot {
      height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(160,210,255,0.4) 30%, transparent);
    }
    body.ag-light-mode #ag-custom-decor { filter: brightness(0.62) saturate(2.5) contrast(1.35); }
    body.ag-light-mode #ag-custom-decor .ag-art { opacity: 0.42 !important; }

    @keyframes agRise { 0% { transform: translate3d(0,0,0); opacity: 0; } 10%,90% { opacity: var(--o,0.8); } 50% { transform: translate3d(calc(var(--sx,20px)*-0.6),-55vh,0); } 100% { transform: translate3d(var(--sx,20px),-112vh,0); opacity: 0; } }
    @keyframes agFall { 0% { transform: translate3d(0,0,0) rotate(0deg); opacity: 0; } 10%,90% { opacity: var(--o,0.7); } 50% { transform: translate3d(var(--sx,40px),56vh,0) rotate(180deg); } 100% { transform: translate3d(0,115vh,0) rotate(360deg); opacity: 0; } }
    @keyframes agDrift { 0% { transform: translate3d(-15vw,0,0); } 50% { transform: translate3d(55vw,var(--sy,-5vh),0); } 100% { transform: translate3d(125vw,0,0); } }
    @keyframes agDragonSoar { 0%,100% { transform: translate3d(0,0,0) rotate(-2deg); } 50% { transform: translate3d(60px,-18px,0) rotate(3deg); } }
    @keyframes agPhoenixSoar { 0%,100% { transform: translate3d(0,0,0) scale(1); opacity: 0.22; } 50% { transform: translate3d(0,-28px,0) scale(1.07,0.94); opacity: 0.34; } }
    @keyframes agAuroraWave { 0%,100% { transform: scaleY(1); opacity: 0.28; } 50% { transform: translate3d(25px,-12px,0) scaleY(1.22) skewX(-6deg); opacity: 0.45; } }
    @keyframes agFloatBob { 0%,100% { transform: translateY(0) rotate(-45deg); opacity: var(--o,0.7); } 50% { transform: translateY(-24px) translateX(12px) scale(1.12) rotate(-35deg); } }
    @keyframes agShoot { 0% { transform: translate3d(0,0,0) rotate(-35deg); opacity: 0; } 2% { opacity: 1; } 12%,100% { transform: translate3d(-42vw,30vw,0) rotate(-35deg); opacity: 0; } }
    @keyframes agBokeh { 0%,100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(var(--sx,40px),-40px,0); } }
    @keyframes agArtFloat { 0%,100% { transform: translate(0,0); } 50% { transform: translate(12px,-16px); } }
    @keyframes agArtGlow { 0%,100% { opacity: var(--o,0.5); transform: scale(1); } 50% { opacity: calc(var(--o,0.5)*0.65); transform: scale(1.05); } }

    /* App Shell */
    .shell {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 350px 1fr;
      grid-template-rows: 60px 1fr;
      height: 100vh;
    }

    /* Top Header */
    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: rgba(12, 14, 20, 0.78);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    }
    body.ag-light-mode .topbar {
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
    .badge {
      font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
      background: var(--ag-theme-bubble-bg); border: 1px solid var(--ag-theme-bubble-border);
      color: var(--ag-theme-bubble-text);
    }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .seg-btn {
      padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06); color: inherit; cursor: pointer; font-size: 12.5px; font-weight: 600;
      transition: all 0.18s ease;
    }
    body.ag-light-mode .seg-btn { border-color: rgba(15,23,42,0.14); background: rgba(15,23,42,0.04); }
    .seg-btn.active, .seg-btn:hover, .lang-select:hover, .lang-select:focus {
      border-color: var(--ag-theme-accent);
      box-shadow: 0 0 0 1px var(--ag-theme-accent);
    }
    .lang-select {
      padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.16);
      background: rgba(20,24,34,0.88); color: inherit; cursor: pointer; font-size: 12.5px; font-weight: 600;
      outline: none; transition: all 0.18s ease;
    }
    body.ag-light-mode .lang-select { border-color: rgba(15,23,42,0.14); background: rgba(255,255,255,0.92); color: #0f172a; }
    .dim-ctrl { display: flex; align-items: center; gap: 7px; font-size: 12px; opacity: 0.9; }
    .dim-ctrl input { width: 82px; accent-color: var(--ag-theme-accent); cursor: pointer; }
    .gh-link {
      text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
      background: var(--ag-theme-accent); color: #fff !important;
    }

    /* Left Sidebar Theme Picker */
    .sidebar {
      background: var(--ag-theme-panel, rgba(18, 14, 16, 0.8));
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 14px 16px;
      overflow-y: auto;
    }
    body.ag-light-mode .sidebar { border-right: 1px solid rgba(15, 23, 42, 0.08); }
    .season-sync-card {
      padding: 12px 12px 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.11);
      margin-bottom: 14px;
    }
    body.ag-light-mode .season-sync-card {
      background: rgba(255, 255, 255, 0.82);
      border-color: rgba(15, 23, 42, 0.11);
    }
    .season-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .season-title { font-size: 13px; font-weight: 700; }
    .season-desc {
      font-size: 11.5px; line-height: 1.45; opacity: 0.78; margin-top: 5px;
    }
    .ag-switch {
      position: relative; display: inline-block; width: 42px; height: 22px; flex-shrink: 0;
    }
    .ag-switch input { opacity: 0; width: 0; height: 0; }
    .ag-toggle-slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: #3f3f46; transition: 0.22s; border-radius: 22px;
    }
    body.ag-light-mode .ag-toggle-slider { background-color: #cbd5e1; }
    .ag-toggle-slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: #fff; transition: 0.22s; border-radius: 50%;
    }
    .ag-switch input:checked + .ag-toggle-slider { background-color: #10b981; }
    .ag-switch input:checked + .ag-toggle-slider:before { transform: translateX(20px); }
    .ag-season-callout {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
      margin-top: 9px; padding: 6px 10px 6px 8px; border-radius: 12px;
      font-size: 11.5px; cursor: pointer; transition: transform 0.16s ease;
    }
    .ag-season-callout:hover { transform: translateY(-1px); }
    .ag-season-callout-icon { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }
    .ag-season-status-pill {
      margin-left: auto; padding: 2px 7px; border-radius: 99px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.02em;
    }
    .side-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; margin-bottom: 12px; padding: 0 4px; }
    .theme-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 24px; }
    .ag-theme-card {
      position: relative; padding: 12px 12px 11px; border-radius: 12px;
      background: rgba(25, 25, 32, 0.62); border: 1px solid rgba(255, 255, 255, 0.09);
      cursor: pointer; transition: all 0.18s ease; overflow: visible;
    }
    body.ag-light-mode .ag-theme-card { background: rgba(255,255,255,0.78); border-color: rgba(15,23,42,0.1); }
    .ag-theme-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.28); }
    .ag-theme-card.selected {
      border-color: var(--ag-theme-accent);
      box-shadow: 0 0 0 1.5px var(--ag-theme-accent), 0 6px 18px rgba(0,0,0,0.25);
    }
    .card-swatch { position: absolute; inset: 0; border-radius: 11px; opacity: 0.42; pointer-events: none; }
    .card-quote {
      position: relative; display: inline-block; max-width: calc(100% - 46px);
      padding: 3px 9px; margin-bottom: 6px; border-radius: 99px;
      font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-name { font-size: 13.5px; font-weight: 700; }
    .card-desc { position: relative; font-size: 11.5px; opacity: 0.75; margin-top: 3px; }
    .ag-card-sticker { width: 42px; height: 42px; object-fit: contain; transition: opacity 0.15s ease; }
    .ag-card-sticker-action {
      position: absolute; top: -22px; right: -4px; width: 165px; height: 60px;
      object-fit: contain; pointer-events: none; opacity: 0; transition: opacity 0.18s ease; z-index: 20;
    }
    .ag-theme-card:hover .ag-card-sticker { opacity: 0; }
    .ag-theme-card:hover .ag-card-sticker-action { opacity: 1; }

    /* Main Stage */
    .stage { position: relative; display: flex; flex-direction: column; height: calc(100vh - 60px); overflow: hidden; }

    /* Chat Simulator View */
    .chat-sim {
      flex: 1; display: flex; flex-direction: column; max-width: 860px; width: 100%;
      margin: 0 auto; padding: 24px 28px 22px; height: 100%;
    }
    .hint-banner {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
      padding: 10px 15px; border-radius: 12px; font-size: 12.5px;
      background: rgba(15, 23, 42, 0.55); border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px); margin-bottom: 14px;
    }
    body.ag-light-mode .hint-banner { background: rgba(255,255,255,0.82); border-color: rgba(15,23,42,0.1); }
    .messages {
      flex: 1; overflow-y: auto; padding: 36px 14px 20px; display: flex; flex-direction: column; gap: 14px;
    }
    .ai-msg {
      align-self: flex-start; max-width: 78%; padding: 12px 16px; border-radius: 14px;
      background: rgba(15, 23, 42, 0.58); border: 1px solid rgba(255,255,255,0.09);
      backdrop-filter: blur(8px); font-size: 13.5px; line-height: 1.55; user-select: text;
    }
    body.ag-light-mode .ai-msg { background: rgba(255,255,255,0.86); border-color: rgba(15,23,42,0.09); }

    .ag-custom-user-bubble {
      align-self: flex-end; max-width: 75%; position: relative;
      background: var(--ag-theme-bubble-bg); border: 1.5px solid var(--ag-theme-bubble-border);
      color: var(--ag-theme-bubble-text); border-radius: 18px 18px 4px 18px;
      padding: 12px 18px; margin-top: 34px; font-size: 14px; line-height: 1.5;
      box-shadow: 0 4px 18px rgba(0,0,0,0.45), 0 0 14px var(--ag-theme-bubble-border);
      backdrop-filter: blur(8px); cursor: pointer; transition: transform 0.2s ease;
    }
    .ag-custom-user-bubble:hover { transform: translateY(-2px); }
    .ag-custom-user-bubble > .ag-bubble-sticker {
      position: absolute; top: -55px; right: 8px; width: 68px; height: 68px;
      object-fit: contain; pointer-events: none; z-index: 50; transition: opacity 0.14s ease;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.55)); transform-origin: 50% 85%;
    }
    .ag-custom-user-bubble > .ag-bubble-sticker-action {
      position: absolute; top: -76px; right: 6px; width: 280px; height: 104px;
      object-fit: contain; pointer-events: none; z-index: 55; opacity: 0;
      transform: translateY(6px) scale(0.96); transition: opacity 0.18s ease, transform 0.22s ease;
    }
    .ag-custom-user-bubble:hover > .ag-bubble-sticker { opacity: 0 !important; }
    .ag-custom-user-bubble:hover > .ag-bubble-sticker-action { opacity: 1 !important; transform: translateY(0) scale(1) !important; }

    /* Input Composer */
    .ag-custom-input-wrapper {
      position: relative; margin-top: 36px; padding: 12px 14px; border-radius: 16px;
      background: rgba(22, 20, 26, 0.88); backdrop-filter: blur(14px);
      border: 1.5px solid var(--ag-theme-input-border); display: flex; align-items: center; gap: 10px;
    }
    body.ag-light-mode .ag-custom-input-wrapper { background: rgba(255,255,255,0.94); box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
    .ag-custom-input-wrapper:focus-within { border-color: var(--ag-theme-accent); box-shadow: 0 0 14px var(--ag-theme-bubble-border); }
    .ag-custom-input-wrapper > .ag-input-sticker {
      position: absolute; top: -56px; right: 14px; width: 66px; height: 66px;
      object-fit: contain; pointer-events: none; z-index: 50; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
      transform-origin: 50% 90%;
    }
    #demo-input {
      flex: 1; background: transparent; border: none; outline: none; color: inherit;
      font-size: 14px; font-family: inherit; resize: none; height: 24px; line-height: 24px;
    }
    .send-btn {
      padding: 7px 14px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; font-size: 12.5px;
      background: var(--ag-theme-accent); color: #fff;
    }

    /* Gallery View (All 105 SVGs) */
    .gallery-view {
      display: none; flex: 1; overflow-y: auto; padding: 22px 26px 40px;
    }
    .gallery-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px;
    }
    .gal-card {
      border-radius: 14px; padding: 16px; background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(12px);
    }
    body.ag-light-mode .gal-card { background: rgba(255,255,255,0.88); border-color: rgba(15,23,42,0.1); }
    .gal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-weight: 700; font-size: 14.5px; }
    .gal-stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: stretch; }
    .gal-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8px 6px; border-radius: 10px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07); min-height: 96px; text-align: center;
    }
    .gal-box.is-wide { grid-column: 1 / -1; min-height: 88px; }
    body.ag-light-mode .gal-box { background: rgba(15,23,42,0.03); border-color: rgba(15,23,42,0.07); }
    .gal-box img.sq { width: 58px; height: 58px; object-fit: contain; }
    .gal-box img.wide { width: 100%; max-width: 240px; height: 68px; object-fit: contain; }
    .gal-lbl { font-size: 10px; opacity: 0.75; margin-top: 5px; font-weight: 600; }
    .ai-demo-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }

    /* Donate Button, Modal & Grand Mascot Thank-You Celebration */
    .donate-btn {
      padding: 6px 12px; border-radius: 9px; font-size: 12px; font-weight: 700; cursor: pointer;
      background: linear-gradient(135deg, #0070ba, #003087); color: #fff;
      border: 1px solid rgba(255,255,255,0.22); box-shadow: 0 2px 10px rgba(0, 112, 186, 0.35);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }
    .donate-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0, 112, 186, 0.55); }

    .donate-backdrop {
      position: fixed; inset: 0; z-index: 900; display: none; align-items: center; justify-content: center;
      background: rgba(2, 6, 23, 0.72); backdrop-filter: blur(8px); padding: 16px;
    }
    .donate-backdrop.open { display: flex; animation: donFadeIn 0.22s ease; }
    @keyframes donFadeIn { from { opacity: 0; } to { opacity: 1; } }

    .donate-card {
      width: 100%; max-width: 390px; border-radius: 20px; padding: 22px 22px 20px;
      background: rgba(15, 23, 42, 0.94); border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 22px 60px rgba(0,0,0,0.6), 0 0 28px var(--ag-theme-bubble-border);
      text-align: center; position: relative; color: #f8fafc;
      animation: donPop 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.ag-light-mode .donate-card { background: rgba(255,255,255,0.97); color: #0f172a; border-color: rgba(15,23,42,0.14); }
    @keyframes donPop { from { opacity: 0; transform: scale(0.9) translateY(14px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .donate-close {
      position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 50%;
      border: none; background: rgba(255,255,255,0.1); color: inherit; cursor: pointer; font-size: 13px;
    }
    .donate-qr-wrap {
      display: inline-flex; padding: 10px; border-radius: 16px; background: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28); margin: 12px 0 10px;
    }
    .donate-qr-wrap img { width: 176px; height: 176px; display: block; border-radius: 8px; }
    .donate-amounts { display: flex; justify-content: center; gap: 7px; flex-wrap: wrap; margin: 10px 0 14px; }
    .amt-chip {
      padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.07); color: inherit;
      transition: all 0.15s ease;
    }
    body.ag-light-mode .amt-chip { border-color: rgba(15,23,42,0.16); background: rgba(15,23,42,0.05); }
    .amt-chip.active { background: var(--ag-theme-accent); color: #fff; border-color: transparent; }
    .donate-primary-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      padding: 11px 16px; border-radius: 12px; border: none; cursor: pointer; text-decoration: none;
      font-weight: 700; font-size: 13.5px; color: #fff;
      background: linear-gradient(135deg, #0070ba, #003087);
      box-shadow: 0 6px 20px rgba(0, 112, 186, 0.4); transition: transform 0.15s ease;
    }
    .donate-primary-btn:hover { transform: translateY(-1px); }
    .donate-done-btn {
      margin-top: 9px; width: 100%; padding: 8px 12px; border-radius: 10px; cursor: pointer;
      border: 1px solid rgba(244, 114, 182, 0.45); background: rgba(244, 114, 182, 0.14);
      color: inherit; font-weight: 600; font-size: 12px; transition: all 0.15s ease;
    }
    .donate-done-btn:hover { background: rgba(244, 114, 182, 0.26); }

    /* Grand Mascot Thank-You Parade Overlay */
    #donate-celebration {
      position: fixed; inset: 0; z-index: 950; pointer-events: none; overflow: hidden;
    }
    .don-toast {
      position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
      padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 14px;
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.94), rgba(168, 85, 247, 0.94));
      color: #fff; border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 12px 36px rgba(236, 72, 153, 0.45); white-space: nowrap;
      animation: donToastIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes donToastIn {
      0% { opacity: 0; transform: translate(-50%, -20px) scale(0.85); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    .don-mascot-pop {
      position: fixed; width: 92px; height: 92px; object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.55));
      animation: donMascotRise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both, donMascotCheer 1.2s ease-in-out 0.6s infinite alternate;
    }
    @keyframes donMascotRise {
      0% { opacity: 0; transform: translateY(70px) scale(0.4) rotate(-12deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    }
    @keyframes donMascotCheer {
      0% { transform: translateY(0) rotate(-5deg) scale(1); }
      100% { transform: translateY(-12px) rotate(6deg) scale(1.08); }
    }
    .don-confetti {
      position: fixed; font-size: 20px; line-height: 1;
      animation: donConfettiFall var(--dur, 3.2s) cubic-bezier(0.2, 0.7, 0.4, 1) forwards;
    }
    @keyframes donConfettiFall {

        // Summon 8 cheering mascots (done.svg) around the screen perimeter!

          activeId, 'valentine-cupid', 'jade-dragon', 'tet-lion',
          'noel-snowman', 'sakura-bunny', 'summer-corgi', 'code-cat'

          layer.appendChild(img);

        // Shower of hearts, stars, coins & sparkles

          p.style.setProperty('--dx', ((Math.random() - 0.5) * 140).toFixed(0) + 'px');

          p.style.setProperty('--dur', (2.2 + Math.random() * 1.8).toFixed(2) + 's');

        setAiSimState('done', 5500);

      function getTheme(id) {
        return THEMES.find(t => t.id === (id || activeId)) || THEMES[0];

      function rnd(a, b) { return a + Math.random() * (b - a); }

      function renderDecor(themeId) {
        decorEl.innerHTML = '';
        const cfg = DECOR[themeId];
        if (!cfg) return;
        (cfg.art || []).forEach(a => {
          const el = document.createElement('div');
          el.className = 'ag-art';
          el.style.cssText = a.css;
          el.style.backgroundImage = svgUri(a.svg);
          decorEl.appendChild(el);
        });
        (cfg.particles || []).forEach(p => {
          for (let i = 0; i < p.count; i++) {
            const el = document.createElement('span');
            el.className = 'ag-p ' + p.type;
            const size = rnd(p.size[0], p.size[1]);
            const dur = rnd(p.dur[0], p.dur[1]);
            const delay = -rnd(0, dur);
            const s = el.style;
            s.setProperty('--o', String(p.o == null ? 0.8 : p.o));
            s.setProperty('--sx', rnd(-60, 60).toFixed(0) + 'px');
            s.setProperty('--sy', rnd(-12, 8).toFixed(0) + 'vh');
            s.left = rnd(0, 100).toFixed(2) + 'vw';
            if (p.type === 'dot' || p.type === 'flame' || p.type === 'bokeh' || p.type === 'bubble') {
              s.width = size + 'px'; s.height = size + 'px';
              if (p.type !== 'bubble') {
                s.background = p.type === 'flame'
                  ? 'radial-gradient(circle at 60% 40%, #fff3c0, ' + p.color + ' 55%, transparent 75%)'
                  : p.color;
              }
              if (p.glow) s.boxShadow = '0 0 ' + (size * 2).toFixed(0) + 'px ' + p.glow;
            } else if (p.type === 'char') {
              el.textContent = p.chars[Math.floor(Math.random() * p.chars.length)];
              s.fontSize = size + 'px';
              if (p.color) s.color = p.color;
              if (p.glow) s.textShadow = '0 0 8px ' + p.glow;
              if (p.font) s.fontFamily = p.font;
            } else if (p.type === 'shoot') {
              s.width = size + 'px';
            }
            if (p.anim === 'rise') { s.bottom = '-30px'; s.animation = 'agRise ' + dur + 's linear ' + delay + 's infinite'; }
            else if (p.anim === 'fall') { s.top = '-30px'; s.animation = 'agFall ' + dur + 's linear ' + delay + 's infinite'; }
            else if (p.anim === 'twinkle') { s.top = rnd(0, 100).toFixed(2) + 'vh'; s.animation = 'agTwinkle ' + dur + 's ease-in-out ' + delay + 's infinite'; }
            else if (p.anim === 'drift') { s.left = '0'; s.top = rnd(5, 45).toFixed(2) + 'vh'; s.animation = 'agDrift ' + dur + 's linear ' + delay + 's infinite'; }
            else if (p.anim === 'bob') { s.top = rnd(15, 85).toFixed(2) + 'vh'; s.animation = 'agFloatBob ' + dur + 's ease-in-out ' + delay + 's infinite'; }
            else if (p.anim === 'shoot') { s.left = rnd(45, 100).toFixed(2) + 'vw'; s.top = rnd(0, 35).toFixed(2) + 'vh'; s.animation = 'agShoot ' + dur + 's linear ' + delay + 's infinite'; }
            else if (p.anim === 'bokeh') { s.top = rnd(0, 90).toFixed(2) + 'vh'; s.animation = 'agBokeh ' + dur + 's ease-in-out ' + delay + 's infinite'; }
            decorEl.appendChild(el);
          }
        });
      }

      function spawnHoverBurst(container, themeId) {
        const list = getTheme(themeId).hoverBursts || ['✨'];
        for (let i = 0; i < 6; i++) {
          const p = document.createElement('span');
          p.className = 'ag-burst-p';
          p.textContent = list[i % list.length];
          const angle = (-Math.PI * 0.92) + (i / 5) * (Math.PI * 0.84) + (Math.random() - 0.5) * 0.25;
          const dist = 28 + Math.random() * 26;
          p.style.setProperty('--bx', (Math.cos(angle) * dist).toFixed(1) + 'px');
          p.style.setProperty('--by', (Math.sin(angle) * dist - 10).toFixed(1) + 'px');
          p.style.setProperty('--br', ((Math.random() - 0.5) * 90).toFixed(0) + 'deg');
          container.appendChild(p);
          setTimeout(() => p.remove(), 860);
        }
      }

      function syncInputSticker() {
        const t = getTheme();
        const typingNow = composer.classList.contains('ag-typing') && !composer.classList.contains('ag-typing-pause');
        const aiThinkNow = !typingNow && aiSimState === 'thinking' && !!t.thinkingSticker;
        const aiDoneNow = !typingNow && aiSimState === 'done' && !!t.doneSticker;

        composer.classList.toggle('ag-ai-thinking', aiSimState === 'thinking' && !typingNow);
        composer.classList.toggle('ag-ai-done', aiSimState === 'done' && !typingNow);
        composer.classList.toggle('ag-has-ai-svg', aiThinkNow || aiDoneNow);

        let want = t.sticker;
        if (typingNow) want = t.typingSticker;
        else if (aiThinkNow) want = t.thinkingSticker;
        else if (aiDoneNow) want = t.doneSticker;
        inputSticker.src = want;

        const existingBadge = composer.querySelector(':scope > .ag-ai-badge');
        const effState = typingNow ? 'idle' : aiSimState;
        if (effState === 'thinking' || effState === 'done') {
          const badge = existingBadge || document.createElement('span');
          badge.className = 'ag-ai-badge ' + (effState === 'done' ? 'is-done' : 'is-thinking');
          badge.textContent = effState === 'thinking'
            ? (lang === 'en' ? t.aiThinkingEn : t.aiThinking)
            : (lang === 'en' ? t.aiDoneEn : t.aiDone);
          if (!existingBadge) composer.appendChild(badge);
        } else if (existingBadge) {
          existingBadge.remove();
        }

        const tb = document.getElementById('ai-think-btn');
        const db = document.getElementById('ai-done-btn');
        if (tb) tb.classList.toggle('active', aiSimState === 'thinking');
        if (db) db.classList.toggle('active', aiSimState === 'done');
      }

      function setAiSimState(nextState, autoResetMs) {
        clearTimeout(aiSimTimer);
        aiSimState = nextState;
        syncInputSticker();
        if (nextState === 'done') {
          spawnHoverBurst(composer, activeId);
          SoundService.playDoneChime(activeId, true);
        }
        if (autoResetMs > 0) {
          aiSimTimer = setTimeout(() => {
            aiSimState = 'idle';
            syncInputSticker();
          }, autoResetMs);
        }
      }

      function buildCards() {
        const ui = UI_TEXT[lang];
        listEl.innerHTML = '';
        galGrid.innerHTML = '';

        THEMES.forEach(t => {
          const loc = localizeTheme(t, lang);
          const card = document.createElement('div');
          card.className = 'ag-theme-card' + (t.id === activeId ? ' selected' : '');
          card.dataset.themeId = t.id;
          card.innerHTML = `
            <div class="card-swatch" style="background: ${THEME_BG[t.id]};"></div>
            <img class="ag-card-sticker-action" src="${t.actionSticker}" alt="" />
            <div class="card-row">
              <div style="min-width: 0;">
                <div class="card-quote" style="background: ${t.bubbleBg}; border: 1px solid ${t.bubbleBorder}; color: ${t.bubbleText};">${loc.previewText}</div>
                <div class="card-name">${loc.name}</div>
                <div class="card-desc">${loc.motionDesc}</div>
                <div class="card-desc" style="opacity:0.88; color:${t.accent}; font-weight:600;">🎧 ${SoundService.getMeta(t.id, lang)}</div>
              </div>
              <img class="ag-card-sticker" src="${t.sticker}" alt="" />
            </div>
          `;
          card.addEventListener('click', () => {
            autoSeason = false;
            activeId = t.id;
            syncSeasonBtn();
            applyAll();
            if (sfxEnabled) SoundService.playKeystroke(t.id, true);
          });
          listEl.appendChild(card);

          const gCard = document.createElement('div');
          gCard.className = 'gal-card';
          gCard.innerHTML = `
            <div class="gal-head">
              <div>
                <div>${loc.name}</div>
                <div style="font-size:11px; font-weight:600; opacity:0.8; margin-top:2px;">🎧 ${SoundService.getMeta(t.id, lang)}</div>
              </div>
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:11.5px; color:${t.accent};">${loc.previewText}</span>
                <button type="button" class="seg-btn gal-play-btn" data-play-id="${t.id}" style="padding:3px 8px; font-size:11px;">▶️</button>
              </div>
            </div>
            <div class="gal-stages">
              <div class="gal-box">
                <img class="sq" src="${t.sticker}" alt="${loc.name} idle" />
                <div class="gal-lbl">${ui.galIdle}</div>
              </div>
              <div class="gal-box">
                <img class="sq" src="${t.typingSticker}" alt="${loc.name} typing" />
                <div class="gal-lbl">${ui.galTyping}</div>
              </div>
              <div class="gal-box">
                <img class="sq" src="${t.thinkingSticker}" alt="${loc.name} thinking" />
                <div class="gal-lbl">${ui.galThinking}</div>
              </div>
              <div class="gal-box">
                <img class="sq" src="${t.doneSticker}" alt="${loc.name} done" />
                <div class="gal-lbl">${ui.galDone}</div>
              </div>
              <div class="gal-box is-wide">
                <img class="wide" src="${t.actionSticker}" alt="${loc.name} hover" />
                <div class="gal-lbl">${ui.galHover}</div>
              </div>
            </div>
          `;
          galGrid.appendChild(gCard);
        });

        galGrid.querySelectorAll('.gal-play-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const tid = btn.getAttribute('data-play-id');
            autoSeason = false;
            activeId = tid;
            bgmEnabled = true;
            syncSeasonBtn();
            applyAll();
            SoundService.playSample(tid);
          });
        });
      }

      function syncSeasonBtn() {
        const btn = document.getElementById('season-btn');
        const sw = document.getElementById('season-switch');
        const callout = document.getElementById('season-callout');
        const ui = UI_TEXT[lang];
        const info = resolveSeasonalTheme();
        const seasonTheme = getTheme(info.themeId);
        const seasonLoc = localizeTheme(seasonTheme, lang);
        const seasonLbl = lang === 'en' ? info.labelEn : info.labelVi;

        btn.classList.toggle('active', autoSeason);
        btn.textContent = autoSeason ? ui.seasonOn(seasonLbl) : ui.seasonOff;
        if (sw) sw.checked = autoSeason;

        document.getElementById('season-card-title').textContent = ui.seasonCardTitle;
        document.getElementById('season-card-desc').textContent = ui.seasonCardDesc;

        callout.style.background = seasonTheme.bubbleBg;
        callout.style.border = '1px solid ' + seasonTheme.bubbleBorder;
        callout.style.boxShadow = '0 2px 10px rgba(0,0,0,0.25)';
        callout.innerHTML = `
          <img class="ag-season-callout-icon" src="${seasonTheme.sticker}" alt="" />
          <span style="opacity:0.82; color:${seasonTheme.bubbleText};">${ui.seasonTodayLabel}</span>
          <strong style="color:${seasonTheme.bubbleText}; font-weight:600;">${seasonLbl}</strong>
          <span style="opacity:0.6; color:${seasonTheme.bubbleText};">•</span>
          <strong style="color:${seasonTheme.accent}; font-weight:700;">${seasonLoc.name}</strong>
          <span class="ag-season-status-pill" style="background:${autoSeason ? 'rgba(16,185,129,0.22)' : 'rgba(255,255,255,0.12)'}; color:${autoSeason ? '#6ee7b7' : '#e4e4e7'}; border:1px solid ${autoSeason ? 'rgba(16,185,129,0.45)' : 'rgba(255,255,255,0.18)'};">
            ${autoSeason ? ui.seasonActiveTag : ui.seasonReadyTag}
          </span>
        `;
      }

      function syncAudioControls() {
        const ui = UI_TEXT[lang];
        const sfxBtn = document.getElementById('sfx-btn');
        const bgmBtn = document.getElementById('bgm-btn');
        sfxBtn.classList.toggle('active', sfxEnabled);
        bgmBtn.classList.toggle('active', bgmEnabled);
        sfxBtn.textContent = sfxEnabled ? ui.sfxOn : ui.sfxOff;
        bgmBtn.textContent = bgmEnabled ? ui.bgmOn : ui.bgmOff;
        SoundService.configure({
          enabled: true,
          sfxEnabled: sfxEnabled,
          bgmEnabled: bgmEnabled,
          volume: soundVol,
          themeId: activeId
        });
      }

      function applyLanguageText() {
        const ui = UI_TEXT[lang];
        document.documentElement.lang = lang;
        document.getElementById('tab-sim').textContent = ui.tabSim;
        document.getElementById('tab-gal').textContent = ui.tabGal;
        document.getElementById('ai-think-btn').textContent = ui.aiThinkBtn;
        document.getElementById('ai-done-btn').textContent = ui.aiDoneBtn;
        document.getElementById('donate-btn').textContent = ui.donBtn;
        document.getElementById('don-title').textContent = ui.donTitle;
        document.getElementById('don-desc').textContent = ui.donDesc;
        document.getElementById('don-done-label').textContent = ui.donDoneBtn;
        const customChip = document.querySelector('#don-amounts .amt-chip[data-amt=""]');
        if (customChip) customChip.textContent = ui.donCustom;
        syncDonateAmount(selectedDonAmt);
        document.getElementById('dim-title').textContent = ui.dim;
        document.getElementById('lang-select').value = lang;
        document.getElementById('side-title').textContent = ui.sideTitle(THEMES.length);
        document.getElementById('hint-text').innerHTML = ui.hint;
        document.getElementById('sample-bubble-1').textContent = ui.bubble1;
        document.getElementById('sample-ai-msg').innerHTML = ui.aiMsg;
        inputEl.placeholder = ui.placeholder;
        document.getElementById('send-btn').textContent = ui.send;
        syncSeasonBtn();
        syncAudioControls();
        buildCards();
      }

      function applyAll() {
        syncAudioControls();
        const t = getTheme();
        const loc = localizeTheme(t, lang);
        document.body.setAttribute('data-ag-theme', t.id);
        document.body.classList.toggle('ag-light-mode', isLight);
        document.getElementById('active-badge').textContent = loc.name;
        document.getElementById('sample-greeting').textContent = loc.previewText;

        const root = document.documentElement;
        root.style.setProperty('--ag-theme-accent', t.accent);
        root.style.setProperty('--ag-theme-bubble-bg', t.bubbleBg);
        root.style.setProperty('--ag-theme-bubble-border', t.bubbleBorder);
        root.style.setProperty('--ag-theme-bubble-text', t.bubbleText);
        root.style.setProperty('--ag-theme-input-border', t.inputBorder);
        root.style.setProperty('--ag-theme-panel', (isLight ? THEME_PANEL_LIGHT : THEME_PANEL)[t.id]);

        const bgMap = isLight ? THEME_BG_LIGHT : THEME_BG;
        bgEl.style.background = bgMap[t.id];

        if (isLight) {
          root.style.setProperty('--ag-overlay-color', 'rgba(255,255,255,' + (((100 - bgDim) / 100) * 0.45).toFixed(2) + ')');
        } else {
          root.style.setProperty('--ag-overlay-color', 'rgba(0,0,0,' + ((bgDim / 100) * 0.5).toFixed(2) + ')');
        }

        if (decorEl.dataset.theme !== t.id) {
          renderDecor(t.id);
          decorEl.dataset.theme = t.id;
        }

        document.querySelectorAll('.ag-custom-user-bubble').forEach(b => {
          const s = b.querySelector('.ag-bubble-sticker');
          const a = b.querySelector('.ag-bubble-sticker-action');
          if (s) s.src = t.sticker;
          if (a) a.src = t.actionSticker;
          b.querySelectorAll('.ag-sparkle').forEach(sp => { sp.textContent = t.sparkle || '✦'; });
        });

        syncInputSticker();
        document.querySelectorAll('.ag-theme-card').forEach(c => {
          c.classList.toggle('selected', c.dataset.themeId === t.id);
        });
      }

      // Wire bubble hover burst
      function wireBubbleHover(b) {
        b.addEventListener('mouseenter', () => spawnHoverBurst(b, activeId));
      }
      document.querySelectorAll('.ag-custom-user-bubble').forEach(wireBubbleHover);

      // Wire Typing Reaction in Simulator
      function clearTyping() {
        composer.classList.remove('ag-typing', 'ag-typing-fast', 'ag-typing-pause');
        composer.querySelectorAll('.ag-think-bubble, .ag-type-p').forEach(n => n.remove());
        clearTimeout(typeState.pauseTimer);
        clearTimeout(typeState.clearTimer);
        typeState.keys = [];
        syncInputSticker();
      }

      const IGNORED_PREVIEW_KEYS = /^(Shift|Control|Alt|Meta|CapsLock|Tab|Escape|ArrowUp|ArrowDown|ArrowLeft|ArrowRight)$/;
      inputEl.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey || IGNORED_PREVIEW_KEYS.test(e.key || '')) return;
        SoundService.playKeystroke(activeId, e.key === 'Enter' || e.key === ' ');
      });

      inputEl.addEventListener('input', () => {
        const val = inputEl.value.trim();
        if (!val) { clearTyping(); return; }
        const now = Date.now();
        typeState.keys.push(now);
        typeState.keys = typeState.keys.filter(k => now - k < 1000);
        const fast = typeState.keys.length > 6;

        composer.classList.add('ag-typing');
        composer.classList.toggle('ag-typing-fast', fast);
        composer.classList.remove('ag-typing-pause');
        composer.querySelectorAll('.ag-think-bubble').forEach(n => n.remove());
        syncInputSticker();

        const fx = getTheme().typingFx;
        if (now - typeState.lastParticle > 120 && composer.querySelectorAll('.ag-type-p').length < 6) {
          typeState.lastParticle = now;
          const p = document.createElement('span');
          p.className = 'ag-type-p' + (fx.mono ? ' mono' : '');
          p.textContent = fx.particles[Math.floor(Math.random() * fx.particles.length)];
          p.style.setProperty('--tx', (-12 - Math.random() * 30).toFixed(0) + 'px');
          p.style.setProperty('--ty', (-26 - Math.random() * 18).toFixed(0) + 'px');
          p.style.setProperty('--tr', ((Math.random() - 0.5) * 60).toFixed(0) + 'deg');
          composer.appendChild(p);
          setTimeout(() => p.remove(), 900);
        }

        clearTimeout(typeState.pauseTimer);
        clearTimeout(typeState.clearTimer);
        typeState.pauseTimer = setTimeout(() => {
          composer.classList.remove('ag-typing-fast');
          composer.classList.add('ag-typing-pause');
          syncInputSticker();
          if (!composer.querySelector('.ag-think-bubble')) {
            const b = document.createElement('span');
            b.className = 'ag-think-bubble' + (fx.mono ? ' mono' : '');
            b.textContent = (lang === 'en' && fx.thinkEn) ? fx.thinkEn : fx.think;
            composer.appendChild(b);
          }
        }, 1500);
        typeState.clearTimer = setTimeout(clearTyping, 6000);
      });

      composer.addEventListener('submit', (e) => {
        e.preventDefault();
        const txt = inputEl.value.trim();
        if (!txt) return;
        const t = getTheme();
        const b = document.createElement('div');
        b.className = 'ag-custom-user-bubble';
        b.innerHTML = `
          <img class="ag-bubble-sticker" src="${t.sticker}" alt="" />
          <img class="ag-bubble-sticker-action" src="${t.actionSticker}" alt="" />
          <span class="ag-sparkle s1">${t.sparkle || '✦'}</span>
          <span class="ag-sparkle s2">${t.sparkle || '✦'}</span>
          <span class="ag-sparkle s3">${t.sparkle || '✦'}</span>
          <div></div>
        `;
        b.lastElementChild.textContent = txt;
        wireBubbleHover(b);
        msgList.appendChild(b);
        msgList.scrollTop = msgList.scrollHeight;
        inputEl.value = '';
        clearTyping();
        // Simulate AI Thinking -> AI Done + Chime cycle
        setAiSimState('thinking', 0);
        aiSimTimer = setTimeout(() => setAiSimState('done', 5000), 2200);
      });

      document.getElementById('ai-think-btn').addEventListener('click', () => {
        setAiSimState(aiSimState === 'thinking' ? 'idle' : 'thinking', 0);
      });
      document.getElementById('ai-done-btn').addEventListener('click', () => {
        setAiSimState('done', 5000);
      });

      // Donate Modal & Mascot Celebration Wiring
      const donateModal = document.getElementById('donate-modal');
      document.getElementById('donate-btn').addEventListener('click', () => {
        donateModal.classList.add('open');
      });
      document.getElementById('donate-close').addEventListener('click', () => {
        donateModal.classList.remove('open');
      });
      donateModal.addEventListener('click', (e) => {
        if (e.target === donateModal) donateModal.classList.remove('open');
      });
      document.querySelectorAll('#don-amounts .amt-chip').forEach(ch => {
        ch.addEventListener('click', () => syncDonateAmount(ch.getAttribute('data-amt')));
      });
      document.getElementById('don-paypal-link').addEventListener('click', () => {
        donateModal.classList.remove('open');
        setTimeout(triggerDonateCelebration, 350);
      });
      document.getElementById('don-done-btn').addEventListener('click', () => {
        donateModal.classList.remove('open');
        triggerDonateCelebration();
      });

      // Top & Sidebar Seasonal Sync Controls
      function toggleAutoSeason(forceState) {
        autoSeason = typeof forceState === 'boolean' ? forceState : !autoSeason;
        if (autoSeason) {
          activeId = resolveSeasonalTheme().themeId;
        }
        syncSeasonBtn();
        applyAll();
      }

      document.getElementById('season-btn').addEventListener('click', () => toggleAutoSeason());
      document.getElementById('season-switch').addEventListener('change', (e) => toggleAutoSeason(e.target.checked));
      document.getElementById('season-callout').addEventListener('click', () => toggleAutoSeason());

      document.getElementById('sfx-btn').addEventListener('click', () => {
        sfxEnabled = !sfxEnabled;
        syncAudioControls();
        if (sfxEnabled) SoundService.playSample(activeId);
      });

      document.getElementById('bgm-btn').addEventListener('click', () => {
        bgmEnabled = !bgmEnabled;
        syncAudioControls();
      });

      document.getElementById('vol-range').addEventListener('input', (e) => {
        soundVol = parseInt(e.target.value, 10) || 0;
        syncAudioControls();
      });

      document.getElementById('mode-btn').addEventListener('click', (e) => {
        isLight = !isLight;
        e.target.textContent = isLight ? '☀️ Light' : '🌙 Dark';
        applyAll();
      });

      document.getElementById('dim-range').addEventListener('input', (e) => {
        bgDim = parseInt(e.target.value, 10);
        document.getElementById('dim-label').textContent = bgDim + '%';
        applyAll();
      });

      document.getElementById('lang-select').addEventListener('change', (e) => {
        lang = e.target.value === 'vi' ? 'vi' : 'en';
        try { localStorage.setItem('ag_preview_lang', lang); } catch (err) {}
        applyLanguageText();
        applyAll();
      });

      const tabSim = document.getElementById('tab-sim');
      const tabGal = document.getElementById('tab-gal');
      const viewSim = document.getElementById('view-sim');
      const viewGal = document.getElementById('view-gal');
      tabSim.addEventListener('click', () => {
        tabSim.classList.add('active'); tabGal.classList.remove('active');
        viewSim.style.display = 'flex'; viewGal.style.display = 'none';
      });
      tabGal.addEventListener('click', () => {
        tabGal.classList.add('active'); tabSim.classList.remove('active');
        viewGal.style.display = 'block'; viewSim.style.display = 'none';
      });

      applyLanguageText();
      applyAll();
    })();
  </script>
</body>
</html>
