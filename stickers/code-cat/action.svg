<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <!-- Clean clip at y=71 so zero chat text is overlapped -->
    <clipPath id="cc-clip">
      <rect x="0" y="0" width="260" height="71"/>
    </clipPath>

    <!-- Cat and hoodie gradients -->
    <linearGradient id="cc-fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="cc-hoodie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Terminal and neon circuit gradients -->
    <linearGradient id="cc-term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="cc-circuit-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="cc-trail-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>

    <style>
      /* Matrix rain glyphs in dark background */
      .cc-rain1 { animation: ccMatrixFall 4.2s linear infinite; }
      .cc-rain2 { animation: ccMatrixFall 5.4s linear -2.1s infinite; }

      /* Glowing syntax brackets pulse */
      .cc-glow-sym { animation: ccSymPulse 2.4s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }

      /* Neon circuit grid travelling pulse */
      .cc-pulse-dot { animation: ccCircuitPulse 2.8s linear infinite; }

      /* Cat rides giant mouse cursor: linear X + decoupled pure-sine Y bob */
      .cc-rider { animation: ccFly 3.2s linear infinite; }
      .cc-bob { animation: ccBob 0.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .cc-net {
        transform-origin: 30px 30px;
        animation: ccSwing 0.53s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .cc-trail { animation: ccTrail 0.4s linear infinite; }
      .cc-spark1 { animation: ccSparkDrift 0.6s linear infinite; }
      .cc-spark2 { animation: ccSparkDrift 0.6s linear -0.3s infinite; }

      /* Bugs crawling and popping into "✓ fixed" */
      .cc-bug1 { transform-origin: 150px 52px; animation: ccBug1 3.2s linear infinite; }
      .cc-bug2 { transform-origin: 95px 34px; animation: ccBug2 3.2s linear infinite; }
      .cc-bug3 { transform-origin: 40px 54px; animation: ccBug3 3.2s linear infinite; }
      .cc-pop1 { animation: ccPop1 3.2s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; opacity: 0; }
      .cc-pop2 { animation: ccPop2 3.2s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; opacity: 0; }
      .cc-pop3 { animation: ccPop3 3.2s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; opacity: 0; }
      .cc-bug-legs { animation: ccLegs 0.18s linear infinite alternate; }

      @keyframes ccMatrixFall {
        0% { transform: translateY(-28px); }
        100% { transform: translateY(68px); }
      }
      @keyframes ccSymPulse {
        0% { opacity: 0.42; }
        100% { opacity: 0.88; }
      }
      @keyframes ccCircuitPulse {
        0% { transform: translateX(0px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(244px); opacity: 0; }
      }
      @keyframes ccFly {
        0% { transform: translate(160px, -4px); }
        100% { transform: translate(-100px, -4px); }
      }
      @keyframes ccBob {
        0% { transform: translateY(-3px) rotate(-2deg); }
        100% { transform: translateY(3px) rotate(2deg); }
      }
      @keyframes ccSwing {
        0% { transform: rotate(-24deg); }
        100% { transform: rotate(20deg); }
      }
      @keyframes ccTrail {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -16; }
      }
      @keyframes ccSparkDrift {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.95; }
        100% { transform: translate(26px, -4px) scale(0.2); opacity: 0; }
      }
      @keyframes ccLegs {
        0% { transform: translateX(-0.6px); }
        100% { transform: translateX(0.6px); }
      }

      @keyframes ccBug1 {
        0%, 8% { opacity: 1; transform: scale(1); }
        11%, 100% { opacity: 0; transform: scale(0) rotate(180deg); }
      }
      @keyframes ccBug2 {
        0%, 30% { opacity: 1; transform: scale(1); }
        33%, 100% { opacity: 0; transform: scale(0) rotate(180deg); }
      }
      @keyframes ccBug3 {
        0%, 52% { opacity: 1; transform: scale(1); }
        55%, 96% { opacity: 0; transform: scale(0) rotate(180deg); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes ccPop1 {
        0%, 9% { opacity: 0; transform: translateY(0); }
        12% { opacity: 1; }
        28%, 100% { opacity: 0; transform: translateY(-16px); }
      }
      @keyframes ccPop2 {
        0%, 31% { opacity: 0; transform: translateY(0); }
        34% { opacity: 1; }
        50%, 100% { opacity: 0; transform: translateY(-16px); }
      }
      @keyframes ccPop3 {
        0%, 53% { opacity: 0; transform: translateY(0); }
        56% { opacity: 1; }
        72%, 100% { opacity: 0; transform: translateY(-16px); }
      }
    </style>
  </defs>

  <g clip-path="url(#cc-clip)">
    <!-- DARK MATRIX / TERMINAL EDITOR WINDOW BACKDROP -->
    <g opacity="0.72">
      <rect x="6" y="3" width="248" height="65" rx="7" fill="url(#cc-term-bg)" stroke="#1e293b" stroke-width="1.3"/>
      <rect x="6" y="3" width="248" height="10" rx="7" fill="#161b22"/>
      <circle cx="15" cy="8" r="2.1" fill="#ef4444"/>
      <circle cx="23" cy="8" r="2.1" fill="#facc15"/>
      <circle cx="31" cy="8" r="2.1" fill="#22c55e"/>
      <text x="108" y="10.2" font-size="5.8" fill="#8b949e" text-anchor="middle" font-family="monospace">main.ts</text>

      <!-- Secondary terminal split pane on right -->
      <line x1="168" y1="13" x2="168" y2="66" stroke="#21262d" stroke-width="1"/>
      <text x="176" y="22" font-size="5.5" fill="#4ade80" font-family="monospace" opacity="0.8">$ debug</text>
      <text x="176" y="30" font-size="5" fill="#8b949e" font-family="monospace" opacity="0.65">0 errors</text>

      <!-- Subtle matrix code rain inside backdrop -->
      <g class="cc-rain1" font-family="monospace" font-size="5.5" fill="#22c55e" opacity="0.28">
        <text x="142" y="16">1</text>
        <text x="142" y="25">0</text>
        <text x="196" y="12">0</text>
        <text x="196" y="21">1</text>
        <text x="238" y="18">1</text>
        <text x="238" y="27">0</text>
      </g>
      <g class="cc-rain2" font-family="monospace" font-size="5.5" fill="#4ade80" opacity="0.22">
        <text x="122" y="10">0</text>
        <text x="122" y="19">1</text>
        <text x="180" y="24">1</text>
        <text x="220" y="14">0</text>
        <text x="220" y="23">1</text>
      </g>

      <!-- Line numbers -->
      <g font-family="monospace" font-size="6" fill="#484f58">
        <text x="14" y="23">1</text>
        <text x="14" y="33">2</text>
        <text x="14" y="43">3</text>
        <text x="14" y="53">4</text>
        <text x="14" y="63">5</text>
      </g>

      <!-- Syntax-highlighted code lines -->
      <rect x="26" y="19" width="30" height="3.2" rx="1.6" fill="#c084fc"/>
      <rect x="60" y="19" width="44" height="3.2" rx="1.6" fill="#38bdf8"/>
      <rect x="34" y="29" width="56" height="3.2" rx="1.6" fill="#4ade80"/>
      <rect x="34" y="39" width="38" height="3.2" rx="1.6" fill="#facc15"/>
      <rect x="76" y="39" width="52" height="3.2" rx="1.6" fill="#38bdf8"/>
      <rect x="34" y="49" width="70" height="3.2" rx="1.6" fill="#f87171"/>
      <rect x="26" y="59" width="16" height="3.2" rx="1.6" fill="#c084fc"/>

      <!-- Glowing syntax brackets { } and </> -->
      <g class="cc-glow-sym" font-family="monospace" font-weight="900">
        <text x="148" y="34" font-size="13" fill="#22c55e" text-anchor="middle">{ }</text>
        <text x="214" y="52" font-size="18" fill="#4ade80" text-anchor="middle">&lt;/&gt;</text>
      </g>
    </g>

    <!-- NEON GREEN CIRCUIT GRID ACCENTS ALONG Y=64..71 -->
    <g stroke-linecap="round">
      <line x1="6" y1="69" x2="254" y2="69" stroke="url(#cc-circuit-glow)" stroke-width="1.6"/>
      <path d="M 18 69 L 24 64 L 46 64 M 76 69 L 82 65 L 110 65 M 150 69 L 156 64 L 188 64 M 214 69 L 220 65 L 244 65" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.72"/>
      <circle cx="46" cy="64" r="1.5" fill="#4ade80"/>
      <circle cx="110" cy="65" r="1.5" fill="#4ade80"/>
      <circle cx="188" cy="64" r="1.5" fill="#4ade80"/>
      <circle cx="244" cy="65" r="1.5" fill="#4ade80"/>
      <!-- Travelling neon data packet along the circuit bus -->
      <rect class="cc-pulse-dot" x="6" y="67.8" width="10" height="2.4" rx="1.2" fill="#86efac"/>
    </g>

    <!-- BUGS CRAWLING ON THE CODE -->
    <g class="cc-bug1">
      <g transform="translate(150, 52)">
        <g class="cc-bug-legs" stroke="#7f1d1d" stroke-width="1.1" stroke-linecap="round">
          <path d="M -4 -2 L -7 -4 M -4 0 L -8 0 M -4 2 L -7 4 M 4 -2 L 7 -4 M 4 0 L 8 0 M 4 2 L 7 4"/>
        </g>
        <ellipse cx="0" cy="0" rx="4.5" ry="5.5" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.8"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="#7f1d1d" stroke-width="0.8"/>
        <circle cx="0" cy="-6.5" r="2.4" fill="#1e293b"/>
      </g>
    </g>
    <g class="cc-bug2">
      <g transform="translate(95, 34)">
        <g class="cc-bug-legs" stroke="#7f1d1d" stroke-width="1.1" stroke-linecap="round">
          <path d="M -4 -2 L -7 -4 M -4 0 L -8 0 M -4 2 L -7 4 M 4 -2 L 7 -4 M 4 0 L 8 0 M 4 2 L 7 4"/>
        </g>
        <ellipse cx="0" cy="0" rx="4.5" ry="5.5" fill="#f97316" stroke="#7c2d12" stroke-width="0.8"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="#7c2d12" stroke-width="0.8"/>
        <circle cx="0" cy="-6.5" r="2.4" fill="#1e293b"/>
      </g>
    </g>
    <g class="cc-bug3">
      <g transform="translate(40, 54)">
        <g class="cc-bug-legs" stroke="#7f1d1d" stroke-width="1.1" stroke-linecap="round">
          <path d="M -4 -2 L -7 -4 M -4 0 L -8 0 M -4 2 L -7 4 M 4 -2 L 7 -4 M 4 0 L 8 0 M 4 2 L 7 4"/>
        </g>
        <ellipse cx="0" cy="0" rx="4.5" ry="5.5" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.8"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="#7f1d1d" stroke-width="0.8"/>
        <circle cx="0" cy="-6.5" r="2.4" fill="#1e293b"/>
      </g>
    </g>

    <!-- "✓ fixed" POPS -->
    <text class="cc-pop1" x="150" y="42" font-size="8" font-weight="900" fill="#4ade80" text-anchor="middle" font-family="monospace">✓ fixed</text>
    <text class="cc-pop2" x="95" y="24" font-size="8" font-weight="900" fill="#4ade80" text-anchor="middle" font-family="monospace">✓ fixed</text>
    <text class="cc-pop3" x="40" y="44" font-size="8" font-weight="900" fill="#4ade80" text-anchor="middle" font-family="monospace">✓ fixed</text>

    <!-- FOREGROUND: HACKER CAT SURFING A GIANT MOUSE CURSOR -->
    <g class="cc-rider">
      <g class="cc-bob">
        <!-- Neon speed trail + sparkling green particle stream -->
        <path class="cc-trail" d="M 46 51 L 92 51 M 50 59 L 98 59" stroke="url(#cc-trail-grad)" stroke-width="2.2" stroke-dasharray="6 4" stroke-linecap="round"/>
        <g class="cc-spark1">
          <circle cx="58" cy="48" r="1.8" fill="#86efac"/>
          <rect x="66" y="55" width="2.6" height="2.6" rx="0.6" fill="#4ade80"/>
          <circle cx="74" cy="45" r="1.3" fill="#22d3ee"/>
        </g>
        <g class="cc-spark2">
          <circle cx="62" cy="61" r="1.6" fill="#4ade80"/>
          <rect x="70" y="49" width="2.2" height="2.2" rx="0.5" fill="#bbf7d0"/>
        </g>

        <!-- Giant mouse cursor arrow (pointing left = flying direction) -->
        <path d="M 4 48 L 44 34 L 36 47 L 52 60 L 46 66 L 30 53 L 24 66 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

        <!-- Cat in neon green hoodie -->
        <path d="M 26 44 Q 24 28 36 26 Q 48 28 46 44 Z" fill="url(#cc-hoodie)" stroke="#14532d" stroke-width="1"/>
        <!-- Tail -->
        <path d="M 44 42 Q 58 40 56 28 Q 55 24 52 26 Q 54 36 43 38 Z" fill="url(#cc-fur)" stroke="#334155" stroke-width="0.8"/>
        <!-- Head and ears -->
        <polygon points="24,16 25,4 32,12" fill="url(#cc-fur)" stroke="#334155" stroke-width="0.8"/>
        <polygon points="40,16 39,4 33,12" fill="url(#cc-fur)" stroke="#334155" stroke-width="0.8"/>
        <ellipse cx="32" cy="20" rx="11" ry="9.5" fill="url(#cc-fur)" stroke="#334155" stroke-width="1"/>
        <ellipse cx="27" cy="23" rx="5" ry="3.5" fill="#e2e8f0"/>
        <path d="M 23 21 L 25.5 21 L 24 23 Z" fill="#fb7185"/>
        <!-- Glasses + eyes -->
        <ellipse cx="27" cy="18" rx="1.6" ry="2" fill="#0f172a"/>
        <ellipse cx="35" cy="18" rx="1.6" ry="2" fill="#0f172a"/>
        <rect x="23" y="15" width="8" height="6" rx="2" fill="none" stroke="#0f172a" stroke-width="1.4"/>
        <rect x="32" y="15" width="8" height="6" rx="2" fill="none" stroke="#0f172a" stroke-width="1.4"/>

        <!-- Swinging bug net -->
        <g class="cc-net">
          <line x1="30" y1="30" x2="10" y2="20" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="6" cy="18" rx="6" ry="7" fill="#e2e8f0" fill-opacity="0.35" stroke="#e2e8f0" stroke-width="1.4"/>
          <path d="M 2 14 L 10 22 M 10 14 L 2 22" stroke="#e2e8f0" stroke-width="0.6"/>
        </g>
        <!-- Paw holding net -->
        <circle cx="28" cy="31" r="3" fill="#e2e8f0" stroke="#334155" stroke-width="0.8"/>

        <!-- Bug sack -->
        <path d="M 46 46 Q 44 38 50 36 Q 56 38 54 46 Q 50 50 46 46 Z" fill="#a16207" stroke="#713f12" stroke-width="0.9"/>
        <text x="50" y="45" font-size="5" fill="#fef08a" text-anchor="middle" font-family="monospace">BUG</text>
      </g>
    </g>
  </g>
</svg>
