<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ccDnFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="ccDnHoodie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="ccDnBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="ccDnGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#4ade80" flood-opacity="0.7"/>
    </filter>
    <style>
      .ccDn-cheer { transform-origin: 60px 104px; animation: ccDnJump 2.1s ease-in-out infinite; }
      .ccDn-tail { transform-origin: 84px 96px; animation: ccDnTail 1.4s ease-in-out infinite alternate; }
      .ccDn-paw-l { transform-origin: 36px 80px; animation: ccDnWaveL 1.8s ease-in-out infinite; }
      .ccDn-paw-r { transform-origin: 84px 80px; animation: ccDnWaveR 1.8s ease-in-out infinite; }
      .ccDn-badge { transform-origin: 60px 95px; animation: ccDnPulse 2.2s ease-in-out infinite; }
      .ccDn-conf1 { animation: ccDnFall 2.4s ease-in-out infinite; }
      .ccDn-conf2 { animation: ccDnFall 2.4s 0.8s ease-in-out infinite; }
      .ccDn-conf3 { animation: ccDnFall 2.4s 1.5s ease-in-out infinite; }

      @keyframes ccDnJump { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-5px) scale(1.02, 0.98); } }
      @keyframes ccDnTail { 0% { transform: rotate(-12deg); } 100% { transform: rotate(16deg); } }
      @keyframes ccDnWaveL { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(14deg) translateY(-3px); } }
      @keyframes ccDnWaveR { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(-14deg) translateY(-3px); } }
      @keyframes ccDnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes ccDnFall { 0% { opacity: 0; transform: translateY(-6px) rotate(0deg); } 35%, 75% { opacity: 1; transform: translateY(4px) rotate(25deg); } 100% { opacity: 0; transform: translateY(12px) rotate(50deg); } }
    </style>
  </defs>

  <ellipse cx="60" cy="109" rx="34" ry="6" fill="#020617" opacity="0.5"/>

  <!-- Green Confetti -->
  <g class="ccDn-conf1">
    <rect x="14" y="18" width="6" height="4" rx="1" transform="rotate(-25 17 20)" fill="#4ade80"/>
    <circle cx="24" cy="34" r="2.2" fill="#facc15"/>
  </g>
  <g class="ccDn-conf2">
    <rect x="98" y="16" width="6" height="4" rx="1" transform="rotate(28 101 18)" fill="#22c55e"/>
    <circle cx="94" cy="34" r="2.2" fill="#bbf7d0"/>
  </g>
  <g class="ccDn-conf3">
    <rect x="18" y="54" width="5" height="3.5" rx="1" transform="rotate(15 20 56)" fill="#86efac"/>
    <rect x="97" y="52" width="5" height="3.5" rx="1" transform="rotate(-20 99 54)" fill="#4ade80"/>
  </g>

  <g class="ccDn-cheer">
    <!-- Bouncing Tail -->
    <path class="ccDn-tail" d="M 82 98 Q 104 92 100 68 Q 98 60 93 64 Q 98 84 80 92 Z" fill="url(#ccDnFur)" stroke="#334155" stroke-width="1"/>

    <!-- Body in Green Hoodie -->
    <path d="M 34 106 Q 32 76 60 72 Q 88 76 86 106 Z" fill="url(#ccDnHoodie)" stroke="#14532d" stroke-width="1.2"/>
    <path d="M 54 76 L 56 88 M 66 76 L 64 88" stroke="#bbf7d0" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Raised Cheering Paws -->
    <g class="ccDn-paw-l">
      <path d="M 36 82 L 22 62" stroke="url(#ccDnHoodie)" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="21" cy="59" rx="6.5" ry="5.2" transform="rotate(-28 21 59)" fill="#e2e8f0" stroke="#334155" stroke-width="1.1"/>
      <circle cx="21" cy="59.5" r="2" fill="#fda4af"/>
    </g>
    <g class="ccDn-paw-r">
      <path d="M 84 82 L 98 62" stroke="url(#ccDnHoodie)" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="99" cy="59" rx="6.5" ry="5.2" transform="rotate(28 99 59)" fill="#e2e8f0" stroke="#334155" stroke-width="1.1"/>
      <circle cx="99" cy="59.5" r="2" fill="#fda4af"/>
    </g>

    <!-- Head -->
    <polygon points="38,40 40,16 54,32" fill="url(#ccDnFur)" stroke="#334155" stroke-width="1"/>
    <polygon points="82,40 80,16 66,32" fill="url(#ccDnFur)" stroke="#334155" stroke-width="1"/>
    <polygon points="42,35 43,22 51,31" fill="#fda4af"/>
    <polygon points="78,35 77,22 69,31" fill="#fda4af"/>
    <ellipse cx="60" cy="50" rx="25" ry="22" fill="url(#ccDnFur)" stroke="#334155" stroke-width="1.2"/>
    <path d="M 54 30 L 55 37 M 60 29 L 60 37 M 66 30 L 65 37" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Muzzle va Happy Smile -->
    <ellipse cx="60" cy="60" rx="11" ry="7.5" fill="#e2e8f0"/>
    <path d="M 57.5 55.5 L 62.5 55.5 L 60 58.5 Z" fill="#fb7185"/>
    <path d="M 55 61 Q 60 68 65 61 Z" fill="#fb7185"/>
    <path d="M 60 58.5 Q 56.5 62.5 53.5 60.5 M 60 58.5 Q 63.5 62.5 66.5 60.5" fill="none" stroke="#1e293b" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 46 58 L 34 56 M 46 61 L 34 62 M 74 58 L 86 56 M 74 61 L 86 62" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>

    <!-- Happy Victorious Eyes ^ ^ behind Nerd Glasses -->
    <path d="M 45.5 49 Q 49.5 44 53.5 49" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 66.5 49 Q 70.5 44 74.5 49" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="41" y="41" width="17" height="13" rx="4" fill="#4ade80" fill-opacity="0.16" stroke="#0f172a" stroke-width="2.2"/>
    <rect x="62" y="41" width="17" height="13" rx="4" fill="#4ade80" fill-opacity="0.16" stroke="#0f172a" stroke-width="2.2"/>
    <line x1="58" y1="46" x2="62" y2="46" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Glowing "0 BUGS ✓" Badge in Front -->
  <g class="ccDn-badge" filter="url(#ccDnGlow)">
    <rect x="25" y="85" width="70" height="20" rx="10" fill="#052e16" stroke="url(#ccDnBadge)" stroke-width="2"/>
    <text x="60" y="98.5" font-size="10" font-weight="900" fill="#4ade80" text-anchor="middle" font-family="Consolas, monospace">0 BUGS ✓</text>
  </g>
</svg>
