<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ctFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="ctHoodie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="ctLaptop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <clipPath id="ctClip"><rect x="39" y="69" width="42" height="20" rx="1.5"/></clipPath>
  </defs>
  <style>
    .t-body { transform-origin: 60px 104px; animation: tBody 0.5s ease-in-out infinite alternate; }
    .t-head { transform-origin: 60px 70px; animation: tHead 0.9s ease-in-out infinite; }
    .t-ear { transform-origin: 80px 30px; animation: tEar 1.3s ease-in-out infinite; }
    .t-tail { transform-origin: 84px 96px; animation: tTail 0.5s ease-in-out infinite alternate; }
    .t-pawL { animation: tPaw 0.26s ease-in-out infinite alternate; }
    .t-pawR { animation: tPaw 0.26s ease-in-out 0.13s infinite alternate; }
    .t-code { animation: tCode 0.5s linear infinite; }
    .t-glow { animation: tGlow 0.5s ease-in-out infinite alternate; }
    .t-sym1 { animation: tSym 1.2s ease-out infinite; opacity: 0; }
    .t-sym2 { animation: tSym 1.2s ease-out 0.4s infinite; opacity: 0; }
    .t-sym3 { animation: tSym 1.2s ease-out 0.8s infinite; opacity: 0; }
    .t-sweat { animation: tSweat 1.6s ease-in infinite; opacity: 0; }
    @keyframes tBody { 0% { transform: translateY(0); } 100% { transform: translateY(-2px); } }
    @keyframes tHead { 0%,100% { transform: rotate(-2deg) translateY(2px); } 50% { transform: rotate(3deg) translateY(1px); } }
    @keyframes tEar { 0%,70%,100% { transform: rotate(0deg); } 80% { transform: rotate(-14deg); } 90% { transform: rotate(4deg); } }
    @keyframes tTail { 0% { transform: rotate(-16deg); } 100% { transform: rotate(18deg); } }
    @keyframes tPaw { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
    @keyframes tCode { 0% { transform: translateY(0); } 100% { transform: translateY(-12px); } }
    @keyframes tGlow { 0% { opacity: 0.15; } 100% { opacity: 0.4; } }
    @keyframes tSym { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -26px) scale(1.15); } }
    @keyframes tSweat { 0%,40% { opacity: 0; transform: translateY(0); } 55% { opacity: 1; } 100% { opacity: 0; transform: translateY(14px); } }
  </style>

  <ellipse cx="60" cy="109" rx="34" ry="6" fill="#020617" opacity="0.5"/>

  <g class="t-body">
    <path class="t-tail" d="M 82 98 Q 104 92 100 70 Q 98 62 93 66 Q 98 84 80 92 Z" fill="url(#ctFur)" stroke="#334155" stroke-width="1"/>
    <path d="M 34 106 Q 32 76 60 72 Q 88 76 86 106 Z" fill="url(#ctHoodie)" stroke="#14532d" stroke-width="1.2"/>

    <!-- Screen glow reflecting on face -->
    <ellipse class="t-glow" cx="60" cy="62" rx="24" ry="14" fill="#4ade80"/>

    <g class="t-head">
      <polygon points="38,40 40,16 54,32" fill="url(#ctFur)" stroke="#334155" stroke-width="1"/>
      <g class="t-ear"><polygon points="82,40 80,16 66,32" fill="url(#ctFur)" stroke="#334155" stroke-width="1"/></g>
      <polygon points="42,35 43,22 51,31" fill="#fda4af"/>
      <polygon points="78,35 77,22 69,31" fill="#fda4af"/>
      <ellipse cx="60" cy="50" rx="25" ry="22" fill="url(#ctFur)" stroke="#334155" stroke-width="1.2"/>
      <path d="M 54 30 L 55 37 M 60 29 L 60 37 M 66 30 L 65 37" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="60" cy="60" rx="11" ry="7.5" fill="#e2e8f0"/>
      <path d="M 57.5 56 L 62.5 56 L 60 59 Z" fill="#fb7185"/>
      <path d="M 54 61 Q 60 64 66 61" fill="none" stroke="#1e293b" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 46 58 L 34 56 M 46 61 L 34 62 M 74 58 L 86 56 M 74 61 L 86 62" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
      <!-- Eyes looking DOWN at the screen -->
      <ellipse cx="50" cy="49" rx="3.4" ry="3.6" fill="#ffffff"/>
      <ellipse cx="70" cy="49" rx="3.4" ry="3.6" fill="#ffffff"/>
      <circle cx="50" cy="50.6" r="2.2" fill="#0f172a"/>
      <circle cx="70" cy="50.6" r="2.2" fill="#0f172a"/>
      <circle cx="50.6" cy="49.8" r="0.8" fill="#4ade80"/>
      <circle cx="70.6" cy="49.8" r="0.8" fill="#4ade80"/>
      <rect x="41" y="41" width="17" height="13" rx="4" fill="#22c55e" fill-opacity="0.18" stroke="#0f172a" stroke-width="2.2"/>
      <rect x="62" y="41" width="17" height="13" rx="4" fill="#22c55e" fill-opacity="0.18" stroke="#0f172a" stroke-width="2.2"/>
      <line x1="58" y1="46" x2="62" y2="46" stroke="#0f172a" stroke-width="2"/>
    </g>

    <!-- Laptop with fast scrolling code -->
    <rect x="36" y="66" width="48" height="26" rx="3" fill="#0f172a" stroke="url(#ctLaptop)" stroke-width="2.5"/>
    <g clip-path="url(#ctClip)">
      <g class="t-code">
        <rect x="41" y="71" width="14" height="2" rx="1" fill="#c084fc"/>
        <rect x="57" y="71" width="10" height="2" rx="1" fill="#38bdf8"/>
        <rect x="44" y="75" width="20" height="2" rx="1" fill="#4ade80"/>
        <rect x="44" y="79" width="12" height="2" rx="1" fill="#facc15"/>
        <rect x="58" y="79" width="14" height="2" rx="1" fill="#38bdf8"/>
        <rect x="41" y="83" width="8" height="2" rx="1" fill="#c084fc"/>
        <rect x="44" y="87" width="22" height="2" rx="1" fill="#4ade80"/>
        <rect x="44" y="91" width="10" height="2" rx="1" fill="#facc15"/>
        <rect x="41" y="95" width="16" height="2" rx="1" fill="#38bdf8"/>
        <rect x="41" y="99" width="14" height="2" rx="1" fill="#c084fc"/>
        <rect x="57" y="99" width="10" height="2" rx="1" fill="#38bdf8"/>
        <rect x="44" y="103" width="20" height="2" rx="1" fill="#4ade80"/>
        <rect x="44" y="107" width="12" height="2" rx="1" fill="#facc15"/>
        <rect x="58" y="107" width="14" height="2" rx="1" fill="#38bdf8"/>
      </g>
    </g>
    <path d="M 30 92 L 90 92 L 94 98 L 26 98 Z" fill="url(#ctLaptop)" stroke="#64748b" stroke-width="1"/>
    <path d="M 38 94.5 H 82 M 36 96.5 H 84" stroke="#64748b" stroke-width="0.8" stroke-dasharray="2 1.5"/>

    <!-- Paws hammering the keyboard (alternating) -->
    <g class="t-pawL"><ellipse cx="46" cy="94" rx="6" ry="4" fill="#e2e8f0" stroke="#334155" stroke-width="1"/></g>
    <g class="t-pawR"><ellipse cx="74" cy="94" rx="6" ry="4" fill="#e2e8f0" stroke="#334155" stroke-width="1"/></g>

    <!-- Flying code symbols -->
    <text class="t-sym1" x="86" y="48" font-size="10" font-weight="900" fill="#4ade80" font-family="monospace">{ }</text>
    <text class="t-sym2" x="22" y="52" font-size="10" font-weight="900" fill="#38bdf8" font-family="monospace">;</text>
    <text class="t-sym3" x="92" y="64" font-size="10" font-weight="900" fill="#c084fc" font-family="monospace">=&gt;</text>
    <!-- Concentration sweat drop -->
    <path class="t-sweat" d="M 84 38 Q 87 43 84 46 Q 81 43 84 38 Z" fill="#7dd3fc"/>
  </g>
</svg>
