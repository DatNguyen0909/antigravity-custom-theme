<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="fxFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="55%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="fxCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <radialGradient id="fxFire" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fde047"/>
      <stop offset="80%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <radialGradient id="fxBlueFire" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <style>
      /* Hồ ly vẫy hai đuôi nhanh, xoay vòng 3 quả cầu lửa hồ ly ma mị quanh người! */
      .fx-tailL { transform-origin: 40px 88px; animation: fxTailL 0.35s ease-in-out infinite alternate; }
      .fx-tailR { transform-origin: 80px 88px; animation: fxTailR 0.35s ease-in-out infinite alternate; }
      .fx-head { transform-origin: 60px 68px; animation: fxHead 0.7s ease-in-out infinite alternate; }
      .fx-orbit { transform-origin: 60px 62px; animation: fxOrbit 1.4s linear infinite; }
      .fx-pawL { transform-origin: 46px 86px; animation: fxPaw 0.4s ease-in-out infinite alternate; }
      .fx-pawR { transform-origin: 74px 86px; animation: fxPaw 0.4s ease-in-out 0.2s infinite alternate; }

      @keyframes fxTailL { 0% { transform: rotate(-16deg); } 100% { transform: rotate(12deg); } }
      @keyframes fxTailR { 0% { transform: rotate(16deg); } 100% { transform: rotate(-12deg); } }
      @keyframes fxHead { 0% { transform: rotate(-5deg); } 100% { transform: rotate(5deg) translateY(-2px); } }
      @keyframes fxOrbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes fxPaw { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }
    </style>
  </defs>

  <!-- Hai đuôi hồ ly xòe vẫy cực nhanh -->
  <g class="fx-tailL">
    <path d="M36 92 C10 96, 4 70, 18 54 C26 58, 32 76, 40 86 Z" fill="url(#fxFur)" stroke="#431407" stroke-width="2"/>
    <path d="M18 54 C11 62, 12 71, 21 72 C24 66, 23 59, 18 54 Z" fill="url(#fxCream)"/>
  </g>
  <g class="fx-tailR">
    <path d="M84 92 C110 96, 116 70, 102 54 C94 58, 88 76, 80 86 Z" fill="url(#fxFur)" stroke="#431407" stroke-width="2"/>
    <path d="M102 54 C109 62, 108 71, 99 72 C96 66, 97 59, 102 54 Z" fill="url(#fxCream)"/>
  </g>

  <!-- Thân va vòng cổ chuông -->
  <ellipse cx="60" cy="86" rx="22" ry="18" fill="url(#fxFur)" stroke="#431407" stroke-width="2.2"/>
  <ellipse cx="60" cy="88" rx="14" ry="14" fill="url(#fxCream)"/>
  <path d="M42 73 Q60 80 78 73" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="77" r="4.5" fill="#fbbf24" stroke="#431407" stroke-width="1.4"/>

  <!-- Đầu hồ ly vểnh tai nghiêng tinh nghịch -->
  <g class="fx-head">
    <path d="M34 42 C24 18, 22 6, 30 8 C40 10, 48 24, 50 34 Z" fill="url(#fxFur)" stroke="#431407" stroke-width="2.2"/>
    <path d="M35 38 C28 22, 27 13, 31 14 C37 16, 43 26, 45 34 Z" fill="url(#fxCream)"/>
    <path d="M86 42 C96 18, 98 6, 90 8 C80 10, 72 24, 70 34 Z" fill="url(#fxFur)" stroke="#431407" stroke-width="2.2"/>
    <path d="M85 38 C92 22, 93 13, 89 14 C83 16, 77 26, 75 34 Z" fill="url(#fxCream)"/>

    <path d="M30 50 C30 32, 44 26, 60 26 C76 26, 90 32, 90 50 C96 56, 92 66, 84 69 C76 74, 68 75, 60 75 C52 75, 44 74, 36 69 C28 66, 24 56, 30 50 Z" fill="url(#fxFur)" stroke="#431407" stroke-width="2.2"/>
    <path d="M30 55 C38 48, 48 52, 60 52 C72 52, 82 48, 90 55 C88 68, 74 74, 60 74 C46 74, 32 68, 30 55 Z" fill="url(#fxCream)"/>
    <path d="M60 32 C63 37, 62 42, 60 44 C58 42, 57 37, 60 32 Z" fill="#dc2626"/>

    <!-- Mắt tinh ranh híp cười -->
    <path d="M 40 53 Q 46 47 52 53" fill="none" stroke="#431407" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 68 53 Q 74 47 80 53" fill="none" stroke="#431407" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="36" cy="59" rx="4.5" ry="2.3" fill="#fb7185" opacity="0.75"/>
    <ellipse cx="84" cy="59" rx="4.5" ry="2.3" fill="#fb7185" opacity="0.75"/>
    <polygon points="58,56 62,56 60,58.5" fill="#431407"/>
    <path d="M54 60 Q57 63 60 60 Q63 63 66 60" fill="none" stroke="#431407" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <ellipse cx="46" cy="103" rx="6.5" ry="4" fill="#431407"/>
  <ellipse cx="74" cy="103" rx="6.5" ry="4" fill="#431407"/>
  <g class="fx-pawL"><ellipse cx="45" cy="84" rx="5.5" ry="4.2" fill="url(#fxFur)" stroke="#431407" stroke-width="1.8"/></g>
  <g class="fx-pawR"><ellipse cx="75" cy="84" rx="5.5" ry="4.2" fill="url(#fxFur)" stroke="#431407" stroke-width="1.8"/></g>

  <!-- 3 quả cầu lửa hồ ly xoay vòng quanh người -->
  <g class="fx-orbit">
    <path d="M 60 12 C 66 17, 67 24, 60 27 C 53 24, 54 17, 60 12 Z" fill="url(#fxFire)" stroke="#ea580c" stroke-width="1"/>
    <path d="M 16 84 C 22 89, 23 96, 16 99 C 9 96, 10 89, 16 84 Z" fill="url(#fxBlueFire)" stroke="#0284c7" stroke-width="1"/>
    <path d="M 104 84 C 110 89, 111 96, 104 99 C 97 96, 98 89, 104 84 Z" fill="url(#fxFire)" stroke="#ea580c" stroke-width="1"/>
  </g>
</svg>
