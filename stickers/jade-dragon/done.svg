<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="jdDnBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="jdDnBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="jdDnGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="jdDnPearl" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <style>
      .jdDnBounce { animation: jdDnBounceAnim 2.2s ease-in-out infinite; }
      .jdDnWingL { transform-origin: 28px 74px; animation: jdDnWingLAnim 2s ease-in-out infinite; }
      .jdDnWingR { transform-origin: 92px 74px; animation: jdDnWingRAnim 2s ease-in-out infinite; }
      .jdDnTail { transform-origin: 84px 88px; animation: jdDnTailAnim 2s ease-in-out infinite alternate; }
      .jdDnPawL { transform-origin: 46px 90px; animation: jdDnClapL 2s ease-in-out infinite; }
      .jdDnPawR { transform-origin: 74px 90px; animation: jdDnClapR 2s ease-in-out infinite; }
      .jdDnPearlToss { transform-origin: 60px 14px; animation: jdDnTossAnim 2.2s ease-in-out infinite; }
      .jdDnSparkle1 { transform-origin: 22px 22px; animation: jdDnTwinkle 2.2s ease-in-out infinite; }
      .jdDnSparkle2 { transform-origin: 98px 20px; animation: jdDnTwinkle 2.2s ease-in-out 0.7s infinite; }
      .jdDnSparkle3 { transform-origin: 60px 14px; animation: jdDnTwinkle 2.2s ease-in-out 0.35s infinite; }

      @keyframes jdDnBounceAnim { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes jdDnWingLAnim { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(16deg); } }
      @keyframes jdDnWingRAnim { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(-16deg); } }
      @keyframes jdDnTailAnim { 0% { transform: rotate(-9deg); } 100% { transform: rotate(10deg); } }
      @keyframes jdDnClapL { 0%, 100% { transform: translateX(0px) rotate(-8deg); } 50% { transform: translateX(5px) rotate(12deg); } }
      @keyframes jdDnClapR { 0%, 100% { transform: translateX(0px) rotate(8deg); } 50% { transform: translateX(-5px) rotate(-12deg); } }
      @keyframes jdDnTossAnim { 0%, 100% { transform: translateY(4px) scale(0.95); } 50% { transform: translateY(-6px) scale(1.08); } }
      @keyframes jdDnTwinkle { 0%, 100% { transform: scale(0.7); opacity: 0.45; } 50% { transform: scale(1.25); opacity: 1; } }
    </style>
  </defs>

  <!-- Jade Clouds Base -->
  <path d="M 8 103 Q 8 95 17 95 Q 21 89 29 91 Q 36 91 36 99 Q 36 105 28 105 L 13 105 Q 8 105 8 103 Z" fill="#a7f3d0" stroke="#10b981" stroke-width="1.2"/>
  <path d="M 84 103 Q 84 95 92 95 Q 96 89 104 91 Q 112 91 112 99 Q 112 105 104 105 L 89 105 Q 84 105 84 103 Z" fill="#a7f3d0" stroke="#10b981" stroke-width="1.2"/>

  <!-- Tossed Glowing Jade Pearl High Above -->
  <g class="jdDnPearlToss">
    <circle cx="60" cy="14" r="12" fill="#6ee7b7" opacity="0.3"/>
    <circle cx="60" cy="14" r="8" fill="url(#jdDnPearl)" stroke="#ffffff" stroke-width="1.3"/>
    <circle cx="57.5" cy="11.5" r="2.2" fill="#ffffff"/>
  </g>

  <!-- Sparkles -->
  <g class="jdDnSparkle1">
    <polygon points="22,16 24,20 28,22 24,24 22,28 20,24 16,22 20,20" fill="#fef08a"/>
  </g>
  <g class="jdDnSparkle2">
    <polygon points="98,14 100,18 104,20 100,22 98,26 96,22 92,20 96,18" fill="#fef08a"/>
  </g>
  <g class="jdDnSparkle3">
    <circle cx="42" cy="13" r="2.2" fill="#6ee7b7"/>
    <circle cx="78" cy="13" r="2.2" fill="#fef08a"/>
  </g>

  <g class="jdDnBounce">
    <!-- Tail -->
    <g class="jdDnTail">
      <path d="M 84 92 Q 108 88 106 68 Q 104 56 94 60 Q 99 70 90 78" fill="none" stroke="url(#jdDnBody)" stroke-width="7.5" stroke-linecap="round"/>
      <path d="M 94 58 C 98 48, 112 50, 108 62 C 114 60, 112 70, 102 66 Z" fill="url(#jdDnGold)"/>
    </g>

    <!-- Happy Flapping Wings -->
    <g class="jdDnWingL">
      <path d="M 28 72 C 8 58, 6 78, 16 86 C 12 90, 20 94, 30 88 Z" fill="#059669" stroke="#6ee7b7" stroke-width="1.5"/>
      <path d="M 26 75 C 14 66, 13 79, 20 84" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g class="jdDnWingR">
      <path d="M 92 72 C 112 58, 114 78, 104 86 C 108 90, 100 94, 90 88 Z" fill="#059669" stroke="#6ee7b7" stroke-width="1.5"/>
      <path d="M 94 75 C 106 66, 107 79, 100 84" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Body -->
    <ellipse cx="60" cy="90" rx="23" ry="17" fill="url(#jdDnBody)" stroke="#065f46" stroke-width="1.5"/>
    <ellipse cx="60" cy="92" rx="15" ry="13" fill="url(#jdDnBelly)"/>
    <path d="M 48 88 Q 60 92 72 88" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
    <path d="M 50 95 Q 60 99 70 95" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>

    <!-- Horns -->
    <path d="M 43 38 C 38 24, 26 18, 20 22 C 24 28, 32 30, 36 40 Z" fill="url(#jdDnGold)" stroke="#b45309" stroke-width="1"/>
    <path d="M 33 28 C 32 20, 26 16, 24 18 C 26 22, 28 25, 30 30 Z" fill="url(#jdDnGold)"/>
    <path d="M 77 38 C 82 24, 94 18, 100 22 C 96 28, 88 30, 84 40 Z" fill="url(#jdDnGold)" stroke="#b45309" stroke-width="1"/>
    <path d="M 87 28 C 88 20, 94 16, 96 18 C 94 22, 92 25, 90 30 Z" fill="url(#jdDnGold)"/>

    <!-- Ears -->
    <path d="M 28 50 C 12 42, 10 58, 26 64 Z" fill="url(#jdDnBody)" stroke="#065f46" stroke-width="1.5"/>
    <path d="M 26 53 C 16 48, 16 57, 25 60 Z" fill="#fde68a"/>
    <path d="M 92 50 C 108 42, 110 58, 94 64 Z" fill="url(#jdDnBody)" stroke="#065f46" stroke-width="1.5"/>
    <path d="M 94 53 C 104 48, 104 57, 95 60 Z" fill="#fde68a"/>

    <!-- Head -->
    <path d="M 28 60 C 28 38, 42 30, 60 30 C 78 30, 92 38, 92 60 C 95 76, 82 85, 60 85 C 38 85, 25 76, 28 60 Z" fill="url(#jdDnBody)" stroke="#064e3b" stroke-width="1.8"/>
    <polygon points="60,26 55,33 65,33" fill="url(#jdDnGold)" stroke="#b45309" stroke-width="0.8"/>
    <polygon points="60,33 56,39 64,39" fill="url(#jdDnGold)"/>
    <polygon points="60,39 64,45 60,51 56,45" fill="#fef08a" stroke="#d97706" stroke-width="1"/>

    <!-- Joyful Happy Curved Eyes -->
    <path d="M 37 59 Q 44 50 51 59" fill="none" stroke="#064e3b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 69 59 Q 76 50 83 59" fill="none" stroke="#064e3b" stroke-width="3" stroke-linecap="round"/>

    <!-- Happy Brows va Bright Blush -->
    <path d="M 38 47 Q 44 43 49 47" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 71 47 Q 76 43 82 47" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="34" cy="66" rx="6" ry="3.4" fill="#fb7185" opacity="0.8"/>
    <ellipse cx="86" cy="66" rx="6" ry="3.4" fill="#fb7185" opacity="0.8"/>

    <!-- Snout va Big Joyful Smile -->
    <ellipse cx="60" cy="66" rx="11" ry="7.5" fill="#6ee7b7" stroke="#047857" stroke-width="1.2"/>
    <circle cx="56" cy="63.5" r="1.5" fill="#064e3b"/>
    <circle cx="64" cy="63.5" r="1.5" fill="#064e3b"/>
    <path d="M 53 67 Q 60 75 67 67 Z" fill="#064e3b"/>
    <path d="M 56 70 Q 60 73 64 70" fill="#fb7185"/>
    <polygon points="62,67 64,70.5 65.5,67" fill="#ffffff"/>

    <!-- Whiskers -->
    <path d="M 49 66 C 36 64, 24 70, 16 65" fill="none" stroke="url(#jdDnGold)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 71 66 C 84 64, 96 70, 104 65" fill="none" stroke="url(#jdDnGold)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Clapping Paws -->
    <g class="jdDnPawL">
      <ellipse cx="47" cy="91" rx="7" ry="5.5" fill="url(#jdDnBody)" stroke="#064e3b" stroke-width="1.5"/>
      <circle cx="50" cy="89" r="1.4" fill="#fef08a"/>
      <circle cx="50" cy="93" r="1.4" fill="#fef08a"/>
    </g>
    <g class="jdDnPawR">
      <ellipse cx="73" cy="91" rx="7" ry="5.5" fill="url(#jdDnBody)" stroke="#064e3b" stroke-width="1.5"/>
      <circle cx="70" cy="89" r="1.4" fill="#fef08a"/>
      <circle cx="70" cy="93" r="1.4" fill="#fef08a"/>
    </g>
  </g>
</svg>
