<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="jadeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="jadeBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="goldHorn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="pearlGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <style>
      /* Mỗi 15s: Rồng con hít hơi rồi lỡ HẮT XÌ khè lửa ngọc làm viên ngọc nảy lên va mặt lem khói */
      .head-sneeze { animation: drgHead 15s ease-in-out infinite; transform-origin: 60px 65px; }
      .fire-sneeze { animation: drgFire 15s ease-out infinite; transform-origin: 60px 66px; }
      .orb-bounce { animation: drgOrb 15s ease-in-out infinite; transform-origin: 60px 92px; }
      .soot-face { animation: drgSoot 15s ease-in-out infinite; }
      .eye-normal { animation: drgEyeNorm 15s linear infinite; }
      .eye-squint { animation: drgEyeSquint 15s linear infinite; }
      .drg-blink { transform-origin: 60px 55.5px; animation: drgBlink 3.8s infinite; }
      .drg-wing-l { transform-origin: 28px 74px; animation: drgWingL 2.1s ease-in-out infinite alternate; }
      .drg-wing-r { transform-origin: 92px 74px; animation: drgWingR 2.1s ease-in-out infinite alternate; }
      .drg-tail { transform-origin: 84px 88px; animation: drgTail 2.6s ease-in-out infinite alternate; }

      @keyframes drgBlink { 0%, 45%, 49%, 95%, 100% { transform: scaleY(1); } 47%, 97% { transform: scaleY(0.08); } }
      @keyframes drgWingL { 0% { transform: rotate(-6deg); } 100% { transform: rotate(9deg); } }
      @keyframes drgWingR { 0% { transform: rotate(6deg); } 100% { transform: rotate(-9deg); } }
      @keyframes drgTail { 0% { transform: rotate(-6deg); } 100% { transform: rotate(8deg); } }

      @keyframes drgHead {
        0%, 72% { transform: translateY(0) rotate(0deg) scale(1); }
        76% { transform: translateY(-5px) rotate(-6deg) scale(1.06); }
        79% { transform: translateY(-7px) rotate(-10deg) scale(1.1); }
        81% { transform: translateY(5px) rotate(8deg) scale(0.95); }
        85%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      }
      @keyframes drgFire {
        0%, 80% { opacity: 0; transform: scale(0.2); }
        82% { opacity: 1; transform: translateY(6px) scale(1.35); }
        87% { opacity: 0.85; transform: translateY(14px) scale(1.6); }
        91%, 100% { opacity: 0; transform: translateY(20px) scale(0.4); }
      }
      @keyframes drgOrb {
        0%, 80% { transform: translateY(0) scale(1); }
        83% { transform: translateY(10px) scale(1.25); }
        87% { transform: translateY(-14px) scale(1.1); }
        91% { transform: translateY(3px) scale(0.95); }
        95%, 100% { transform: translateY(0) scale(1); }
      }
      @keyframes drgSoot {
        0%, 84% { opacity: 0; }
        86%, 95% { opacity: 0.85; }
        98%, 100% { opacity: 0; }
      }
      @keyframes drgEyeNorm { 0%, 74% { opacity: 1; } 75%, 94% { opacity: 0; } 95%, 100% { opacity: 1; } }
      @keyframes drgEyeSquint { 0%, 74% { opacity: 0; } 75%, 94% { opacity: 1; } 95%, 100% { opacity: 0; } }
    </style>
  </defs>

  <g class="drg-tail">
    <path d="M 84 88 Q 108 84 106 64 Q 104 52 94 56 Q 99 66 90 74" fill="none" stroke="url(#jadeBody)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 94 54 C 98 44, 112 46, 108 58 C 114 56, 112 66, 102 62 Z" fill="url(#goldHorn)"/>
  </g>

  <g class="drg-wing-l">
    <path d="M 28 68 C 8 54, 6 74, 16 82 C 12 86, 20 90, 30 84 Z" fill="#059669" stroke="#6ee7b7" stroke-width="1.5"/>
    <path d="M 26 71 C 14 62, 13 75, 20 80" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g class="drg-wing-r">
    <path d="M 92 68 C 112 54, 114 74, 104 82 C 108 86, 100 90, 90 84 Z" fill="#059669" stroke="#6ee7b7" stroke-width="1.5"/>
    <path d="M 94 71 C 106 62, 107 75, 100 80" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <ellipse cx="60" cy="86" rx="24" ry="18" fill="url(#jadeBody)" stroke="#065f46" stroke-width="1.5"/>
  <ellipse cx="60" cy="88" rx="16" ry="14" fill="url(#jadeBelly)"/>
  <path d="M 48 84 Q 60 88 72 84" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
  <path d="M 50 91 Q 60 95 70 91" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>

  <g class="head-sneeze">
    <path d="M 43 34 C 38 18, 26 12, 20 16 C 24 22, 32 24, 36 36 Z" fill="url(#goldHorn)" stroke="#b45309" stroke-width="1"/>
    <path d="M 33 23 C 32 14, 26 10, 24 12 C 26 16, 28 20, 30 25 Z" fill="url(#goldHorn)"/>
    <path d="M 77 34 C 82 18, 94 12, 100 16 C 96 22, 88 24, 84 36 Z" fill="url(#goldHorn)" stroke="#b45309" stroke-width="1"/>
    <path d="M 87 23 C 88 14, 94 10, 96 12 C 94 16, 92 20, 90 25 Z" fill="url(#goldHorn)"/>

    <path d="M 28 46 C 12 38, 10 54, 26 60 Z" fill="url(#jadeBody)" stroke="#065f46" stroke-width="1.5"/>
    <path d="M 26 49 C 16 44, 16 53, 25 56 Z" fill="#fde68a"/>
    <path d="M 92 46 C 108 38, 110 54, 94 60 Z" fill="url(#jadeBody)" stroke="#065f46" stroke-width="1.5"/>
    <path d="M 94 49 C 104 44, 104 53, 95 56 Z" fill="#fde68a"/>

    <path d="M 28 56 C 28 34, 42 26, 60 26 C 78 26, 92 34, 92 56 C 95 72, 82 82, 60 82 C 38 82, 25 72, 28 56 Z" fill="url(#jadeBody)" stroke="#064e3b" stroke-width="1.8"/>
    <polygon points="60,21 55,29 65,29" fill="url(#goldHorn)" stroke="#b45309" stroke-width="0.8"/>
    <polygon points="60,29 56,35 64,35" fill="url(#goldHorn)"/>
    <polygon points="60,35 64,41 60,47 56,41" fill="#fef08a" stroke="#d97706" stroke-width="1"/>

    <g class="eye-normal">
      <g class="drg-blink">
        <ellipse cx="44" cy="55" rx="7.5" ry="8.5" fill="#064e3b"/>
        <ellipse cx="44" cy="56" rx="6" ry="7" fill="#fbbf24"/>
        <ellipse cx="44" cy="56" rx="3.5" ry="5" fill="#022c22"/>
        <circle cx="41.5" cy="52.5" r="2.6" fill="#ffffff"/>
        <circle cx="46.5" cy="58.5" r="1.3" fill="#ffffff"/>
        <ellipse cx="76" cy="55" rx="7.5" ry="8.5" fill="#064e3b"/>
        <ellipse cx="76" cy="56" rx="6" ry="7" fill="#fbbf24"/>
        <ellipse cx="76" cy="56" rx="3.5" ry="5" fill="#022c22"/>
        <circle cx="73.5" cy="52.5" r="2.6" fill="#ffffff"/>
        <circle cx="78.5" cy="58.5" r="1.3" fill="#ffffff"/>
      </g>
    </g>
    <!-- Mắt nhắm tịt khi hắt xì -->
    <g class="eye-squint">
      <path d="M 37 52 L 49 56 L 37 60" fill="none" stroke="#064e3b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 83 52 L 71 56 L 83 60" fill="none" stroke="#064e3b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="M 38 44 Q 44 41 49 44" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 71 44 Q 76 41 82 44" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="34" cy="63" rx="5.5" ry="3.2" fill="#fb7185" opacity="0.65"/>
    <ellipse cx="86" cy="63" rx="5.5" ry="3.2" fill="#fb7185" opacity="0.65"/>

    <ellipse cx="60" cy="62" rx="11" ry="7.5" fill="#6ee7b7" stroke="#047857" stroke-width="1.2"/>
    <circle cx="56" cy="60" r="1.6" fill="#064e3b"/>
    <circle cx="64" cy="60" r="1.6" fill="#064e3b"/>
    <path d="M 54 65 Q 57 68 60 65 Q 63 68 66 65" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>
    <polygon points="62,66 64,70 65.5,66" fill="#ffffff"/>

    <path d="M 49 62 C 36 60, 24 66, 16 61" fill="none" stroke="url(#goldHorn)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 71 62 C 84 60, 96 66, 104 61" fill="none" stroke="url(#goldHorn)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Vệt bồ hóng đen va khói sau khi hắt xì lửa -->
    <g class="soot-face">
      <ellipse cx="60" cy="61" rx="9" ry="5" fill="#1f2937" opacity="0.55"/>
      <circle cx="52" cy="48" r="3.5" fill="#374151" opacity="0.5"/>
      <circle cx="72" cy="22" r="4" fill="#9ca3af" opacity="0.7"/>
      <circle cx="78" cy="15" r="5.5" fill="#d1d5db" opacity="0.6"/>
    </g>
  </g>

  <!-- Ngọn lửa ngọc hắt xì phun ra -->
  <g class="fire-sneeze">
    <path d="M 60 64 C 46 74, 44 90, 60 98 C 76 90, 74 74, 60 64 Z" fill="#fef08a" stroke="#10b981" stroke-width="2"/>
    <circle cx="60" cy="82" r="6" fill="#ffffff"/>
  </g>

  <!-- Viên Ngọc Rồng nảy tưng lên -->
  <g class="orb-bounce">
    <circle cx="60" cy="92" r="9" fill="url(#pearlGlow)" stroke="#ffffff" stroke-width="1"/>
  </g>
  <ellipse cx="45" cy="91" rx="7" ry="5.5" fill="url(#jadeBody)" stroke="#064e3b" stroke-width="1.5"/>
  <circle cx="48" cy="89" r="1.5" fill="#fef08a"/>
  <circle cx="48" cy="93" r="1.5" fill="#fef08a"/>
  <ellipse cx="75" cy="91" rx="7" ry="5.5" fill="url(#jadeBody)" stroke="#064e3b" stroke-width="1.5"/>
  <circle cx="72" cy="89" r="1.5" fill="#fef08a"/>
  <circle cx="72" cy="93" r="1.5" fill="#fef08a"/>
</svg>
