<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95">
  <defs>
    <linearGradient id="jdScale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="45%" stop-color="#34d399"/>
      <stop offset="85%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="jdBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="jdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cloudBig" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.96"/>
      <stop offset="60%" stop-color="#6ee7b7" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="cloudSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#a7f3d0" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.88"/>
    </linearGradient>
    <radialGradient id="pearlGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#a7f3d0"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <style>
      .cloud-l-bg { animation: floatCloudL 3.2s ease-in-out infinite alternate; }
      .cloud-r-fg { animation: floatCloudR 2.6s ease-in-out infinite alternate; }
      .dragon-fly { animation: dragonFlight 3.6s ease-in-out infinite; }
      .body-wave { animation: slither 0.65s ease-in-out infinite alternate; transform-origin: 65px 46px; }
      .tail-wag { animation: wagTail 0.45s ease-in-out infinite alternate; transform-origin: 30px 46px; }
      .whisker { animation: whiskerWave 0.55s ease-in-out infinite alternate; transform-origin: 96px 46px; }
      .pearl { animation: pearlBob 0.7s ease-in-out infinite alternate; }
      @keyframes floatCloudL {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(6px, -4px); }
      }
      @keyframes floatCloudR {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-5px, 3px); }
      }
      @keyframes dragonFlight {
        0% { transform: translate(118px, 6px) rotate(-3deg); }
        25% { transform: translate(55px, -8px) rotate(6deg); }
        50% { transform: translate(4px, 4px) rotate(-4deg); }
        75% { transform: translate(62px, 10px) rotate(-7deg); }
        100% { transform: translate(118px, 6px) rotate(-3deg); }
      }
      @keyframes slither {
        0% { transform: scaleY(0.95) skewY(-3deg); }
        100% { transform: scaleY(1.05) skewY(3deg); }
      }
      @keyframes wagTail {
        0% { transform: rotate(-12deg); }
        100% { transform: rotate(14deg); }
      }
      @keyframes whiskerWave {
        0% { transform: rotate(-8deg); }
        100% { transform: rotate(10deg); }
      }
      @keyframes pearlBob {
        0% { transform: translateY(-3px) scale(0.94); }
        100% { transform: translateY(3px) scale(1.08); }
      }
    </style>
  </defs>

  <!-- MÂY LỚN BÊN TRÁI (Lớp sau) -->
  <g class="cloud-l-bg">
    <ellipse cx="64" cy="52" rx="48" ry="18" fill="#10b981" opacity="0.22"/>
    <path d="M 22 58 C 12 58, 8 46, 18 40 C 16 28, 30 20, 44 26 C 52 14, 74 14, 82 26 C 96 22, 110 32, 106 44 C 114 50, 108 60, 96 60 Z" fill="url(#cloudBig)" stroke="#fbbf24" stroke-width="1.6"/>
    <!-- Vân mây cổ phong vàng kim -->
    <path d="M 32 48 C 38 42, 48 42, 52 48 C 55 52, 48 55, 44 51" fill="none" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 66 38 C 74 32, 86 34, 88 42 C 90 48, 82 50, 78 45" fill="none" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="2" fill="#fef08a" opacity="0.9"/>
    <circle cx="96" cy="20" r="1.8" fill="#a7f3d0" opacity="0.9"/>
  </g>

  <!-- THẦN LONG BAY LƯỢN GIỮA MÂY -->
  <g class="dragon-fly">
    <ellipse cx="68" cy="48" rx="52" ry="18" fill="#10b981" opacity="0.18"/>
    <!-- Chân sau -->
    <g transform="translate(36, 52)">
      <path d="M 0 0 C -4 6, -2 11, 4 12" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
      <path d="M 2 12 L 0 15 M 4 12 L 5 15 M 6 11 L 8 14" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- Thân rồng uốn lượn sóng -->
    <g class="body-wave">
      <path d="M 16 44 C 26 28, 42 28, 54 44 C 66 60, 80 58, 92 42" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 7"/>
      <path d="M 16 46 C 28 30, 42 30, 54 46 C 66 62, 80 60, 94 44" fill="none" stroke="url(#jdScale)" stroke-width="13" stroke-linecap="round"/>
      <path d="M 18 49 C 29 34, 42 34, 54 49 C 66 64, 79 62, 92 47" fill="none" stroke="url(#jdBelly)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="4 3"/>
      <path d="M 32 37 Q 35 40 32 43 M 50 42 Q 53 45 50 48 M 70 50 Q 73 53 70 56" fill="none" stroke="#ecfdf5" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
      <!-- Đuôi rồng vẫy -->
      <g class="tail-wag">
        <path d="M 18 46 C 10 42, 4 32, 2 24 C 8 27, 13 33, 18 39 C 11 38, 5 44, 3 51 C 9 50, 14 49, 18 46 Z" fill="url(#jdGold)" stroke="#78350f" stroke-width="1"/>
      </g>
    </g>
    <!-- Chân trước -->
    <g transform="translate(76, 52)">
      <path d="M 0 0 C 3 6, 7 10, 12 9" fill="none" stroke="#10b981" stroke-width="4.2" stroke-linecap="round"/>
      <path d="M 11 9 L 13 13 M 13 9 L 16 11 M 12 7 L 16 8" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- Đầu rồng Chibi nhìn nghiêng -->
    <g transform="translate(90, 38)">
      <path d="M -6 -4 C -14 -8, -18 -2, -12 4 C -16 8, -10 14, -4 10" fill="url(#jdGold)" stroke="#78350f" stroke-width="1"/>
      <path d="M -2 -8 C -6 -17, -14 -20, -18 -16 C -13 -14, -10 -10, -8 -5" fill="url(#jdGold)" stroke="#78350f" stroke-width="1.1"/>
      <path d="M -6 -13 L -10 -19" stroke="url(#jdGold)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -8 -2 C -8 -11, 4 -13, 12 -8 C 18 -5, 22 -2, 22 4 C 22 9, 15 11, 8 10 C 1 11, -8 8, -8 -2 Z" fill="url(#jdScale)" stroke="#064e3b" stroke-width="1.3"/>
      <ellipse cx="11" cy="5" rx="3.2" ry="1.8" fill="#f43f5e" opacity="0.55"/>
      <ellipse cx="6" cy="-2" rx="4.2" ry="4.6" fill="#064e3b"/>
      <ellipse cx="6.5" cy="-2" rx="3.4" ry="3.8" fill="#fbbf24"/>
      <ellipse cx="7" cy="-2" rx="1.6" ry="2.6" fill="#022c22"/>
      <circle cx="5.2" cy="-3.8" r="1.4" fill="#ffffff"/>
      <path d="M 1 -7 Q 7 -10 12 -6" fill="none" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 10 6 Q 15 9 19 6" fill="none" stroke="#064e3b" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 14 7 L 15 10 L 17 7" fill="#ffffff"/>
      <path class="whisker" d="M 19 2 C 25 -4, 31 4, 36 -2" fill="none" stroke="url(#jdGold)" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Ngọc Rồng phát sáng -->
    <g class="pearl" transform="translate(124, 41)">
      <circle cx="0" cy="0" r="10" fill="url(#pearlGlow)"/>
      <circle cx="0" cy="0" r="5" fill="#ecfdf5" stroke="#fbbf24" stroke-width="1.2"/>
      <circle cx="-1.5" cy="-1.5" r="1.6" fill="#ffffff"/>
    </g>
  </g>

  <!-- MÂY NHỎ BÊN PHẢI (Lớp trước để rồng xuyên mây) -->
  <g class="cloud-r-fg">
    <ellipse cx="212" cy="56" rx="34" ry="13" fill="#10b981" opacity="0.2"/>
    <path d="M 180 62 C 172 62, 170 52, 178 48 C 178 38, 190 34, 198 38 C 204 30, 220 30, 226 39 C 236 37, 246 44, 242 53 C 248 58, 242 64, 232 64 Z" fill="url(#cloudSmall)" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M 190 54 C 195 49, 204 49, 207 54 C 209 57, 203 59, 200 56" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 215 48 C 220 44, 228 45, 230 50" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="242" cy="34" r="2" fill="#fef08a"/>
  </g>
</svg>
