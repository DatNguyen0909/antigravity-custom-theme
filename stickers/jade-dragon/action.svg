<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <clipPath id="jdActClip">
      <rect x="0" y="0" width="260" height="95"/>
    </clipPath>
    <linearGradient id="jdActScale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="jdActBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="55%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="jdActGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="jdActCloudBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#6ee7b7" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="jdActCloudFg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.96"/>
      <stop offset="50%" stop-color="#a7f3d0" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="jdActMist" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="25%" stop-color="#6ee7b7" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.28"/>
      <stop offset="75%" stop-color="#34d399" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="jdActAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jdActPearl" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#a7f3d0"/>
      <stop offset="75%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <style>
      .jd-cloud-bg-l { animation: jdCloudBgL 4.4s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .jd-cloud-bg-c { animation: jdCloudBgC 5.2s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .jd-cloud-fg-r { animation: jdCloudFgR 3.4s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .jd-cloud-fg-l { animation: jdCloudFgL 3.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .jd-fly-x { animation: jdFlyX 3.8s linear infinite; }
      .jd-wave-y {
        transform-origin: 0px 42px;
        animation: jdWaveY 1.1s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .jd-slither {
        transform-origin: -8px 44px;
        animation: jdSlither 0.55s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .jd-tail-wag {
        transform-origin: -34px 44px;
        animation: jdTailWag 0.42s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .jd-whisker {
        transform-origin: 31px 40px;
        animation: jdWhisker 0.5s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .jd-pearl {
        transform-origin: 48px 39px;
        animation: jdPearlBob 0.7s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .jd-spark-1 { animation: jdTwinkle 1.4s ease-in-out infinite alternate; }
      .jd-spark-2 { animation: jdTwinkle 1.8s ease-in-out 0.6s infinite alternate; }
      .jd-spark-3 { animation: jdTwinkle 1.6s ease-in-out 1.1s infinite alternate; }

      @keyframes jdFlyX {
        0% { transform: translateX(-45px); opacity: 0; }
        8% { opacity: 1; }
        92% { opacity: 1; }
        100% { transform: translateX(305px); opacity: 0; }
      }
      @keyframes jdWaveY {
        0% { transform: translateY(-7px) rotate(-4deg); }
        100% { transform: translateY(7px) rotate(4deg); }
      }
      @keyframes jdSlither {
        0% { transform: scaleY(0.95) skewY(-2.5deg); }
        100% { transform: scaleY(1.05) skewY(2.5deg); }
      }
      @keyframes jdTailWag {
        0% { transform: rotate(-12deg); }
        100% { transform: rotate(14deg); }
      }
      @keyframes jdWhisker {
        0% { transform: rotate(-9deg); }
        100% { transform: rotate(10deg); }
      }
      @keyframes jdPearlBob {
        0% { transform: translateY(-2.5px) scale(0.94); }
        100% { transform: translateY(2.5px) scale(1.08); }
      }
      @keyframes jdCloudBgL {
        0% { transform: translate(-4px, 0px); }
        100% { transform: translate(6px, -3px); }
      }
      @keyframes jdCloudBgC {
        0% { transform: translate(5px, -2px); }
        100% { transform: translate(-5px, 2px); }
      }
      @keyframes jdCloudFgR {
        0% { transform: translate(6px, 2px); }
        100% { transform: translate(-7px, -2px); }
      }
      @keyframes jdCloudFgL {
        0% { transform: translate(-5px, 1px); }
        100% { transform: translate(6px, -2px); }
      }
      @keyframes jdTwinkle {
        0% { opacity: 0.25; transform: scale(0.75); }
        100% { opacity: 1; transform: scale(1.15); }
      }
    </style>
  </defs>

  <g clip-path="url(#jdActClip)">
    <!-- Ambient Celestial Jade Haze -->
    <ellipse cx="130" cy="46" rx="122" ry="34" fill="url(#jdActAura)"/>
    <path d="M 0 72 Q 65 60 130 68 T 260 66 L 260 80 L 0 80 Z" fill="url(#jdActMist)"/>

    <!-- BACKGROUND PARALLAX: Left Auspicious Jade Cloud -->
    <g class="jd-cloud-bg-l">
      <ellipse cx="62" cy="58" rx="48" ry="15" fill="#059669" opacity="0.22"/>
      <path d="M 18 62 C 8 62, 5 50, 15 44 C 13 31, 28 22, 42 28 C 51 15, 74 15, 83 28 C 97 24, 111 34, 107 47 C 115 53, 108 64, 95 64 Z" fill="url(#jdActCloudBg)" stroke="#fbbf24" stroke-width="1.5"/>
      <path d="M 28 52 C 35 45, 46 45, 50 51 C 53 56, 46 59, 41 55" fill="none" stroke="#fef08a" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M 65 40 C 73 33, 86 36, 88 44 C 90 50, 81 52, 77 47" fill="none" stroke="#fef08a" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M 46 32 Q 56 26 65 32" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- BACKGROUND PARALLAX: Center-High Distant Jade Mist Cloud -->
    <g class="jd-cloud-bg-c" opacity="0.72">
      <path d="M 122 36 C 116 36, 115 28, 122 25 C 124 18, 136 16, 144 21 C 152 15, 166 17, 170 25 C 178 24, 184 30, 180 36 Z" fill="url(#jdActCloudBg)" stroke="#fde68a" stroke-width="1.1"/>
      <path d="M 134 30 Q 144 26 152 30" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Twinkling Jade va Gold Sparkles (Midground) -->
    <g class="jd-spark-1" style="transform-origin: 24px 20px;">
      <path d="M 24 15 L 25.3 18.7 L 29 20 L 25.3 21.3 L 24 25 L 22.7 21.3 L 19 20 L 22.7 18.7 Z" fill="#fef08a"/>
    </g>
    <g class="jd-spark-2" style="transform-origin: 112px 16px;">
      <path d="M 112 12 L 113 15 L 116 16 L 113 17 L 112 20 L 111 17 L 108 16 L 111 15 Z" fill="#a7f3d0"/>
    </g>
    <g class="jd-spark-3" style="transform-origin: 196px 20px;">
      <path d="M 196 15 L 197.3 18.7 L 201 20 L 197.3 21.3 L 196 25 L 194.7 21.3 L 191 20 L 194.7 18.7 Z" fill="#fef08a"/>
    </g>
    <circle cx="96" cy="24" r="1.6" fill="#fef08a" opacity="0.85"/>
    <circle cx="164" cy="54" r="1.8" fill="#6ee7b7" opacity="0.8"/>
    <circle cx="240" cy="24" r="1.5" fill="#a7f3d0" opacity="0.85"/>

    <!-- JADE DRAGON: Decoupled Linear Horizontal Travel + Smooth Sine Wave -->
    <g class="jd-fly-x">
      <g class="jd-wave-y">
        <!-- Floating Mystic Pearl va Jade Energy Trail -->
        <path d="M -72 46 Q -56 38 -42 45" fill="none" stroke="url(#jdActGold)" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.78"/>
        <circle cx="-64" cy="43" r="2.6" fill="url(#jdActPearl)" opacity="0.85"/>
        <circle cx="-54" cy="40" r="1.8" fill="#fef08a" opacity="0.85"/>
        <circle cx="-46" cy="47" r="2.2" fill="#a7f3d0" opacity="0.9"/>

        <!-- Subtle Jade Glow Aura around Dragon -->
        <ellipse cx="4" cy="44" rx="46" ry="16" fill="#10b981" opacity="0.18"/>

        <!-- Hind Leg -->
        <g transform="translate(-26, 48)">
          <path d="M 0 0 C -4 5, -2 10, 4 11" fill="none" stroke="#059669" stroke-width="3.6" stroke-linecap="round"/>
          <path d="M 2 11 L 0 14 M 4 11 L 5 14 M 6 10 L 8 13" stroke="#fef08a" stroke-width="1.4" stroke-linecap="round"/>
        </g>

        <!-- Serpentine Jade Dragon Body -->
        <g class="jd-slither">
          <!-- Golden Dorsal Spines -->
          <path d="M -42 41 C -33 27, -19 27, -8 41 C 3 55, 16 54, 27 39" fill="none" stroke="#fbbf24" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 6.5"/>
          <!-- Main Jade Scaled Torso -->
          <path d="M -42 43 C -31 29, -19 29, -8 43 C 3 57, 16 56, 28 41" fill="none" stroke="url(#jdActScale)" stroke-width="11.5" stroke-linecap="round"/>
          <!-- Segmented Cream-Gold Belly -->
          <path d="M -40 46 C -30 33, -19 33, -8 46 C 3 59, 15 58, 26 44" fill="none" stroke="url(#jdActBelly)" stroke-width="4.8" stroke-linecap="round" stroke-dasharray="3.5 2.5"/>
          <!-- Specular Scale Gleams -->
          <path d="M -28 36 Q -25 39 -28 42 M -12 40 Q -9 43 -12 46 M 6 47 Q 9 50 6 53" fill="none" stroke="#ecfdf5" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
          <!-- Golden Wagging Tail Fan -->
          <g class="jd-tail-wag">
            <path d="M -40 43 C -47 39, -53 31, -55 24 C -49 26, -44 32, -40 37 C -46 37, -51 42, -53 48 C -48 47, -43 46, -40 43 Z" fill="url(#jdActGold)" stroke="#78350f" stroke-width="0.9"/>
          </g>
        </g>

        <!-- Front Leg -->
        <g transform="translate(12, 48)">
          <path d="M 0 0 C 3 5, 6 9, 11 8" fill="none" stroke="#10b981" stroke-width="3.8" stroke-linecap="round"/>
          <path d="M 10 8 L 12 12 M 12 8 L 15 10 M 11 6 L 15 7" stroke="#fef08a" stroke-width="1.4" stroke-linecap="round"/>
        </g>

        <!-- Chibi Dragon Head (Profile Facing Right) -->
        <g transform="translate(24, 36)">
          <!-- Golden Mane -->
          <path d="M -5 -3 C -12 -7, -16 -2, -11 4 C -14 7, -9 13, -3 9" fill="url(#jdActGold)" stroke="#78350f" stroke-width="0.9"/>
          <!-- Branched Golden Antler -->
          <path d="M -2 -7 C -5 -15, -13 -18, -16 -14 C -12 -12, -9 -9, -7 -4" fill="url(#jdActGold)" stroke="#78350f" stroke-width="1"/>
          <path d="M -5 -12 L -9 -17" stroke="url(#jdActGold)" stroke-width="2" stroke-linecap="round"/>
          <!-- Head Shape -->
          <path d="M -7 -2 C -7 -10, 4 -12, 11 -7 C 16 -4, 20 -2, 20 4 C 20 8, 13 10, 7 9 C 1 10, -7 7, -7 -2 Z" fill="url(#jdActScale)" stroke="#064e3b" stroke-width="1.2"/>
          <!-- Rosy Cheek Blush -->
          <ellipse cx="10" cy="4.5" rx="3" ry="1.6" fill="#fb7185" opacity="0.6"/>
          <!-- Golden Dragon Eye -->
          <ellipse cx="5.5" cy="-1.5" rx="3.8" ry="4.2" fill="#064e3b"/>
          <ellipse cx="6" cy="-1.5" rx="3" ry="3.4" fill="#fbbf24"/>
          <ellipse cx="6.5" cy="-1.5" rx="1.5" ry="2.4" fill="#022c22"/>
          <circle cx="4.8" cy="-3.2" r="1.3" fill="#ffffff"/>
          <circle cx="7.4" cy="0.2" r="0.6" fill="#ffffff"/>
          <!-- Golden Brow -->
          <path d="M 1 -6.5 Q 6 -9.5 11 -5.5" fill="none" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round"/>
          <!-- Cute Smile va Fang -->
          <path d="M 9 5.5 Q 13.5 8 17.5 5.5" fill="none" stroke="#064e3b" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M 13 6.2 L 14 9 L 15.8 6.2" fill="#ffffff"/>
          <!-- Animated Flowing Whisker -->
          <path class="jd-whisker" d="M 17 2 C 23 -3, 28 4, 33 -2" fill="none" stroke="url(#jdActGold)" stroke-width="1.6" stroke-linecap="round"/>
        </g>

        <!-- Leading Glowing Mystic Pearl -->
        <g class="jd-pearl">
          <circle cx="48" cy="39" r="9.5" fill="url(#jdActPearl)"/>
          <circle cx="48" cy="39" r="4.6" fill="#ecfdf5" stroke="#fbbf24" stroke-width="1.1"/>
          <circle cx="46.6" cy="37.6" r="1.5" fill="#ffffff"/>
        </g>
      </g>
    </g>

    <!-- FOREGROUND PARALLAX: Left Lower Mist Wisp -->
    <g class="jd-cloud-fg-l" opacity="0.88">
      <path d="M -4 74 C -4 66, 6 62, 16 64 C 22 57, 36 58, 42 65 C 50 64, 56 69, 52 75 Z" fill="url(#jdActCloudFg)" stroke="#fde68a" stroke-width="1.2"/>
      <path d="M 10 70 Q 19 65 28 70" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <!-- FOREGROUND PARALLAX: Right Auspicious Jade-Gold Cloud (Dragon weaves behind it) -->
    <g class="jd-cloud-fg-r">
      <ellipse cx="212" cy="64" rx="38" ry="12" fill="#059669" opacity="0.24"/>
      <path d="M 176 68 C 167 68, 165 57, 174 52 C 174 41, 187 36, 196 41 C 203 31, 221 31, 228 41 C 239 39, 250 47, 246 57 C 253 62, 246 70, 234 70 Z" fill="url(#jdActCloudFg)" stroke="#fbbf24" stroke-width="1.5"/>
      <path d="M 186 59 C 192 53, 202 53, 206 59 C 208 62, 201 64, 198 61" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 215 51 C 221 46, 230 47, 232 53" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="244" cy="36" r="2" fill="#fef08a"/>
      <circle cx="176" cy="40" r="1.4" fill="#a7f3d0"/>
    </g>
  </g>
</svg>
