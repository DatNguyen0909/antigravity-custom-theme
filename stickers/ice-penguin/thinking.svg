<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="pgThBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="pgThBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="pgThHat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pgThScarf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="pgThIce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <style>
      .pgThBlink { transform-origin: 60px 51px; animation: pgThBlink 3.5s infinite; }
      .pgThSpin { transform-origin: 60px 88px; animation: pgThCompassSpin 3.2s linear infinite; }
      .pgThFlipL { transform-origin: 34px 66px; animation: pgThHoldL 2.4s ease-in-out infinite alternate; }
      .pgThFlipR { transform-origin: 86px 66px; animation: pgThHoldR 2.4s ease-in-out infinite alternate; }
      .pgThGlow { animation: pgThPulse 2.2s ease-in-out infinite alternate; }

      @keyframes pgThBlink { 0%, 44%, 48%, 94%, 100% { transform: scaleY(1); } 46%, 96% { transform: scaleY(0.08); } }
      @keyframes pgThCompassSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes pgThHoldL { 0% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }
      @keyframes pgThHoldR { 0% { transform: rotate(4deg); } 100% { transform: rotate(-4deg); } }
      @keyframes pgThPulse { 0% { opacity: 0.45; } 100% { opacity: 0.9; } }
    </style>
  </defs>

  <!-- Glacier ice floe -->
  <polygon points="16,104 30,96 90,96 104,104 94,113 26,113" fill="url(#pgThIce)" stroke="#0284c7" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M26 103 L44 103 M74 106 L90 106" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <g>
    <!-- Body -->
    <path d="M31 58 C29 32, 42 22, 60 22 C78 22, 91 32, 89 58 C91 84, 78 100, 60 100 C42 100, 29 84, 31 58 Z" fill="url(#pgThBack)" stroke="#0f172a" stroke-width="2.2"/>
    <path d="M36 50 C36 37, 52 38, 60 45 C68 38, 84 37, 84 50 C86 75, 76 97, 60 97 C44 97, 34 75, 36 50 Z" fill="url(#pgThBelly)"/>

    <!-- Winter beanie hat -->
    <circle cx="60" cy="9" r="7.5" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8"/>
    <path d="M33 32 C35 15, 46 11, 60 11 C74 11, 85 15, 87 32 Z" fill="url(#pgThHat)" stroke="#0f172a" stroke-width="2"/>
    <rect x="30" y="27" width="60" height="9.5" rx="4.8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <path d="M40 27 V36.5 M50 27 V36.5 M60 27 V36.5 M70 27 V36.5 M80 27 V36.5" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Focused eyes looking down at frost compass -->
    <g class="pgThBlink">
      <ellipse cx="46" cy="51" rx="6" ry="6.8" fill="#0f172a"/>
      <ellipse cx="46.5" cy="52.5" rx="4.7" ry="5.2" fill="#3b82f6"/>
      <ellipse cx="46.5" cy="54.2" rx="3.2" ry="2.8" fill="#93c5fd"/>
      <circle cx="44" cy="49.2" r="2.2" fill="#ffffff"/>
      <circle cx="48.5" cy="54.5" r="1" fill="#ffffff"/>

      <ellipse cx="74" cy="51" rx="6" ry="6.8" fill="#0f172a"/>
      <ellipse cx="73.5" cy="52.5" rx="4.7" ry="5.2" fill="#3b82f6"/>
      <ellipse cx="73.5" cy="54.2" rx="3.2" ry="2.8" fill="#93c5fd"/>
      <circle cx="71" cy="49.2" r="2.2" fill="#ffffff"/>
      <circle cx="75.5" cy="54.5" r="1" fill="#ffffff"/>
    </g>

    <!-- Focused eyebrows -->
    <path d="M40 43 L51 45" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M80 43 L69 45" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>

    <ellipse cx="36" cy="57" rx="4.3" ry="2.2" fill="#fb7185" opacity="0.75"/>
    <ellipse cx="84" cy="57" rx="4.3" ry="2.2" fill="#fb7185" opacity="0.75"/>
    <ellipse cx="60" cy="55" rx="5.5" ry="3.4" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
    <ellipse cx="59" cy="54" rx="2.2" ry="1" fill="#fef08a"/>

    <!-- Scarf -->
    <path d="M33 64 Q60 72 87 64 Q89 72 85 74 Q60 81 35 74 Q31 72 33 64 Z" fill="url(#pgThScarf)" stroke="#881337" stroke-width="2"/>
    <path d="M70 71 L76 86 L66 87 L63 72 Z" fill="url(#pgThScarf)" stroke="#881337" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Sitting feet -->
    <ellipse cx="44" cy="100" rx="8" ry="4.5" fill="#f59e0b" stroke="#78350f" stroke-width="1.8"/>
    <ellipse cx="76" cy="100" rx="8" ry="4.5" fill="#f59e0b" stroke="#78350f" stroke-width="1.8"/>

    <!-- Flippers holding frost compass -->
    <path class="pgThFlipL" d="M31 66 C26 76, 34 88, 46 88 C48 82, 42 74, 34 66 Z" fill="url(#pgThBack)" stroke="#0f172a" stroke-width="2"/>
    <path class="pgThFlipR" d="M89 66 C94 76, 86 88, 74 88 C72 82, 78 74, 86 66 Z" fill="url(#pgThBack)" stroke="#0f172a" stroke-width="2"/>

    <!-- Frost compass outer ring -->
    <circle class="pgThGlow" cx="60" cy="88" r="14" fill="#bae6fd" opacity="0.5"/>
    <circle cx="60" cy="88" r="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>

    <!-- Spinning frost compass / snowflake needle -->
    <g class="pgThSpin">
      <g transform="translate(60, 88)" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round">
        <line x1="-9" y1="0" x2="9" y2="0"/>
        <line x1="0" y1="-9" x2="0" y2="9"/>
        <line x1="-6.2" y1="-6.2" x2="6.2" y2="6.2"/>
        <line x1="-6.2" y1="6.2" x2="6.2" y2="-6.2"/>
        <polygon points="0,-9 2.5,-2 0,-3.5 -2.5,-2" fill="#e11d48" stroke="none"/>
        <circle cx="0" cy="0" r="2.6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      </g>
    </g>
  </g>
</svg>
