<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="pengBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="pengBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="hatG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="scarfG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <style>
      /* Mỗi 15s: Cánh Cụt ăn kem ốc quế bị buốt não (Brain Freeze) đóng băng thành khối nước đá rồi lắc mình vỡ băng */
      .ice-cream { animation: pgIceCream 15s ease-in-out infinite; transform-origin: 78px 86px; }
      .ice-cube { animation: pgFreeze 15s ease-in-out infinite; transform-origin: 60px 60px; }
      .shiver-body { animation: pgShiver 15s linear infinite; transform-origin: 60px 60px; }
      .pg-blink { transform-origin: 60px 53.5px; animation: pgBlink 3.5s infinite; }
      .pg-flip-l { transform-origin: 32px 64px; animation: pgFlipL 1.8s ease-in-out infinite alternate; }
      .pg-flip-r { transform-origin: 88px 64px; animation: pgFlipR 1.8s ease-in-out infinite alternate; }

      @keyframes pgBlink { 0%, 44%, 48%, 94%, 100% { transform: scaleY(1); } 46%, 96% { transform: scaleY(0.08); } }
      @keyframes pgFlipL { 0% { transform: rotate(-5deg); } 100% { transform: rotate(12deg); } }
      @keyframes pgFlipR { 0% { transform: rotate(5deg); } 100% { transform: rotate(-12deg); } }

      @keyframes pgIceCream {
        0%, 72% { opacity: 0; transform: translateY(20px) rotate(30deg); }
        76% { opacity: 1; transform: translate(-10px, -16px) rotate(-18deg); }
        82% { opacity: 1; transform: translate(-10px, -16px) rotate(-18deg); }
        85%, 100% { opacity: 0; transform: translateY(20px) rotate(30deg); }
      }
      @keyframes pgFreeze {
        0%, 81% { opacity: 0; transform: scale(0.8); }
        83%, 92% { opacity: 0.72; transform: scale(1); }
        95%, 100% { opacity: 0; transform: scale(1.25); }
      }
      @keyframes pgShiver {
        0%, 82% { transform: translateX(0); }
        84% { transform: translateX(-3px); }
        86% { transform: translateX(3px); }
        88% { transform: translateX(-3px); }
        90% { transform: translateX(3px); }
        92% { transform: translateX(-3px); }
        94%, 100% { transform: translateX(0); }
      }
    </style>
  </defs>

  <g class="shiver-body">
    <path class="pg-flip-l" d="M30 62 C16 68, 16 86, 26 90 C32 88, 34 76, 33 66 Z" fill="url(#pengBack)" stroke="#0f172a" stroke-width="2"/>
    <path class="pg-flip-r" d="M90 62 C104 68, 104 86, 94 90 C88 88, 86 76, 87 66 Z" fill="url(#pengBack)" stroke="#0f172a" stroke-width="2"/>

    <path d="M31 60 C29 34, 42 24, 60 24 C78 24, 91 34, 89 60 C91 88, 78 104, 60 104 C42 104, 29 88, 31 60 Z" fill="url(#pengBack)" stroke="#0f172a" stroke-width="2.2"/>
    <path d="M36 52 C36 39, 52 40, 60 47 C68 40, 84 39, 84 52 C86 78, 76 101, 60 101 C44 101, 34 78, 36 52 Z" fill="url(#pengBelly)"/>

    <circle cx="60" cy="10" r="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8"/>
    <path d="M33 34 C35 16, 46 12, 60 12 C74 12, 85 16, 87 34 Z" fill="url(#hatG)" stroke="#0f172a" stroke-width="2"/>
    <rect x="30" y="29" width="60" height="10" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <path d="M40 29 V39 M50 29 V39 M60 29 V39 M70 29 V39 M80 29 V39" stroke="#cbd5e1" stroke-width="1.5"/>

    <g class="pg-blink">
      <ellipse cx="46" cy="53" rx="6" ry="7" fill="#0f172a"/>
      <ellipse cx="46" cy="53.5" rx="4.8" ry="5.5" fill="#3b82f6"/>
      <ellipse cx="46" cy="55.5" rx="3.4" ry="3" fill="#93c5fd"/>
      <circle cx="43.5" cy="50.5" r="2.3" fill="#ffffff"/>
      <circle cx="48.5" cy="56" r="1.1" fill="#ffffff"/>

      <ellipse cx="74" cy="53" rx="6" ry="7" fill="#0f172a"/>
      <ellipse cx="74" cy="53.5" rx="4.8" ry="5.5" fill="#3b82f6"/>
      <ellipse cx="74" cy="55.5" rx="3.4" ry="3" fill="#93c5fd"/>
      <circle cx="71.5" cy="50.5" r="2.3" fill="#ffffff"/>
      <circle cx="76.5" cy="56" r="1.1" fill="#ffffff"/>
    </g>

    <ellipse cx="36" cy="59" rx="4.5" ry="2.3" fill="#fb7185" opacity="0.8"/>
    <ellipse cx="84" cy="59" rx="4.5" ry="2.3" fill="#fb7185" opacity="0.8"/>
    <ellipse cx="60" cy="57" rx="5.5" ry="3.5" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
    <ellipse cx="59" cy="56" rx="2.2" ry="1" fill="#fef08a"/>

    <path d="M33 67 Q60 75 87 67 Q89 75 85 77 Q60 84 35 77 Q31 75 33 67 Z" fill="url(#scarfG)" stroke="#881337" stroke-width="2"/>
    <path d="M70 74 L77 92 L66 93 L63 75 Z" fill="url(#scarfG)" stroke="#881337" stroke-width="1.8" stroke-linejoin="round"/>

    <ellipse cx="46" cy="104" rx="7.5" ry="4" fill="#f59e0b" stroke="#78350f" stroke-width="1.8"/>
    <ellipse cx="74" cy="104" rx="7.5" ry="4" fill="#f59e0b" stroke="#78350f" stroke-width="1.8"/>

    <g transform="translate(54, 88)" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round">
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
      <line x1="-6.5" y1="-6.5" x2="6.5" y2="6.5"/>
      <line x1="-6.5" y1="6.5" x2="6.5" y2="-6.5"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    </g>

    <!-- Kem ốc quế đưa lên ăn -->
    <g class="ice-cream">
      <polygon points="72,78 82,78 77,94" fill="#f59e0b" stroke="#78350f" stroke-width="1.2"/>
      <circle cx="77" cy="74" r="6.5" fill="#fda4af" stroke="#be123c" stroke-width="1.2"/>
      <circle cx="77" cy="67" r="4.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    </g>

    <!-- Khối băng đóng băng toàn thân khi buốt não -->
    <g class="ice-cube">
      <rect x="20" y="10" width="80" height="96" rx="12" fill="#bae6fd" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="30" y1="22" x2="52" y2="44" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="72" y1="70" x2="88" y2="86" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
