<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95">
  <defs>
    <linearGradient id="pgBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="pgScarf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="iceTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="iceSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <style>
      .floe-1 { animation: bobIce1 2.2s ease-in-out infinite alternate; }
      .floe-2 { animation: bobIce2 1.8s ease-in-out infinite alternate; }
      .floe-3 { animation: bobIce1 2.5s ease-in-out infinite alternate-reverse; }
      /* Cánh cụt trượt qua tảng băng phải, nhảy vọt qua khe nước sang tảng băng giữa rồi trượt sang tảng băng trái */
      .penguin-journey {
        animation: penguinSlideHop 3.6s ease-in-out infinite;
      }
      .flipper { animation: flapFlipper 0.3s ease-in-out infinite alternate; transform-origin: 48px 50px; }
      .feet { animation: kickFeet 0.25s ease-in-out infinite alternate; transform-origin: 24px 52px; }
      @keyframes bobIce1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(3px); }
      }
      @keyframes bobIce2 {
        0% { transform: translateY(2px); }
        100% { transform: translateY(-2px); }
      }
      @keyframes penguinSlideHop {
        0% { transform: translate(155px, 6px) rotate(0deg) scaleX(-1); }
        18% { transform: translate(118px, 6px) rotate(6deg) scaleX(-1); }
        28% { transform: translate(92px, -14px) rotate(-12deg) scaleX(-1); }
        38% { transform: translate(68px, 5px) rotate(4deg) scaleX(-1); }
        50% { transform: translate(18px, 4px) rotate(0deg) scaleX(-1); }
        53% { transform: translate(18px, 4px) rotate(0deg) scaleX(1); }
        68% { transform: translate(68px, 5px) rotate(-6deg) scaleX(1); }
        78% { transform: translate(95px, -14px) rotate(12deg) scaleX(1); }
        88% { transform: translate(122px, 6px) rotate(-4deg) scaleX(1); }
        97% { transform: translate(155px, 6px) rotate(0deg) scaleX(1); }
        100% { transform: translate(155px, 6px) rotate(0deg) scaleX(-1); }
      }
      @keyframes flapFlipper {
        0% { transform: rotate(-14deg); }
        100% { transform: rotate(16deg); }
      }
      @keyframes kickFeet {
        0% { transform: rotate(-15deg); }
        100% { transform: rotate(15deg); }
      }
    </style>
  </defs>

  <!-- NÚI BĂNG TRÔI NỀN XA (Background Icebergs) -->
  <g opacity="0.75">
    <polygon points="28,66 44,32 58,48 68,26 88,66" fill="url(#iceSide)" stroke="#e0f2fe" stroke-width="1"/>
    <polygon points="44,32 52,48 40,66 28,66" fill="#ffffff" opacity="0.6"/>
    <polygon points="184,66 198,38 212,50 222,34 240,66" fill="url(#iceSide)" stroke="#e0f2fe" stroke-width="1"/>
  </g>

  <!-- TẢNG BĂNG NỔI 1 (BÊN TRÁI) -->
  <g class="floe-1">
    <polygon points="10,62 22,55 78,55 88,62 82,70 16,70" fill="url(#iceSide)" stroke="#ffffff" stroke-width="1.2"/>
    <polygon points="10,62 22,55 78,55 88,62 76,64 20,64" fill="url(#iceTop)"/>
    <path d="M 6 70 Q 48 73 92 70" fill="none" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- TẢNG BĂNG NỔI 2 (Ở GIỮA) -->
  <g class="floe-2">
    <polygon points="98,63 108,56 156,56 166,63 160,71 104,71" fill="url(#iceSide)" stroke="#ffffff" stroke-width="1.2"/>
    <polygon points="98,63 108,56 156,56 166,63 154,65 108,65" fill="url(#iceTop)"/>
    <path d="M 95 71 Q 132 74 170 71" fill="none" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- TẢNG BĂNG NỔI 3 (BÊN PHẢI) -->
  <g class="floe-3">
    <polygon points="176,62 188,55 242,55 252,62 246,70 182,70" fill="url(#iceSide)" stroke="#ffffff" stroke-width="1.2"/>
    <polygon points="176,62 188,55 242,55 252,62 240,64 186,64" fill="url(#iceTop)"/>
    <path d="M 172 70 Q 214 73 255 70" fill="none" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- CHIM CÁNH CỤT CHIBI TRƯỢT BỤNG va NHẢY QUA CÁC TẢNG BĂNG NỔI -->
  <g class="penguin-journey">
    <!-- Bông tuyết va hạt băng bắn lên sau chân -->
    <circle cx="8" cy="52" r="2.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="14" cy="46" r="1.6" fill="#bae6fd" opacity="0.85"/>
    <!-- Hai chân vàng đập nước/băng -->
    <g class="feet">
      <ellipse cx="19" cy="51" rx="5.5" ry="2.8" transform="rotate(-25 19 51)" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
      <ellipse cx="22" cy="54" rx="5.5" ry="2.8" transform="rotate(-10 22 54)" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
    </g>
    <!-- Thân cánh cụt nằm sấp trượt băng -->
    <path d="M 21 46 C 28 32, 54 30, 74 37 C 84 40, 90 46, 88 52 C 86 58, 72 60, 52 59 C 34 59, 20 54, 21 46 Z" fill="url(#pgBody)" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Bụng trắng tròn trịa áp sát mặt băng -->
    <path d="M 27 51 C 38 47, 58 47, 74 50 C 82 51, 86 54, 84 56 C 78 60, 62 60, 46 59 C 34 59, 26 55, 27 51 Z" fill="#ffffff"/>
    <!-- Khăn choàng cổ đỏ bay phấp phới -->
    <path d="M 66 35 C 69 43, 68 52, 64 58" fill="none" stroke="url(#pgScarf)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 65 38 C 53 33, 41 35, 32 31 C 37 26, 51 28, 65 34 Z" fill="url(#pgScarf)" stroke="#881337" stroke-width="1"/>
    <!-- Mũ len mùa đông va quả bông trắng -->
    <path d="M 66 34 C 66 23, 78 21, 84 29 Z" fill="url(#pgScarf)" stroke="#881337" stroke-width="1.2"/>
    <path d="M 65 34 Q 75 31 85 30" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="69" cy="22" r="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Mắt to long lanh va má hồng -->
    <ellipse cx="79" cy="42" rx="3.8" ry="4.2" fill="#0f172a"/>
    <circle cx="80.2" cy="40.6" r="1.5" fill="#ffffff"/>
    <circle cx="77.8" cy="43.2" r="0.8" fill="#7dd3fc"/>
    <ellipse cx="75" cy="46.5" rx="2.8" ry="1.5" fill="#fb7185" opacity="0.65"/>
    <!-- Mỏ vàng xinh xắn -->
    <path d="M 87 43 C 93 44, 94 47, 87 48 Z" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
    <!-- Cánh vẫy giữ thăng bằng -->
    <g class="flipper">
      <path d="M 52 46 C 43 52, 35 56, 31 53 C 34 48, 43 43, 52 46 Z" fill="url(#pgBody)" stroke="#0f172a" stroke-width="1.3"/>
    </g>
  </g>
</svg>
