<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95">
  <defs>
    <linearGradient id="foxFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="toriiRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <style>
      .fox-dash { animation: kitsuneRun 3.4s ease-in-out infinite; }
      .fox-tail { animation: wagFoxTail 0.35s ease-in-out infinite alternate; transform-origin: 36px 46px; }
      .fire-orb { animation: floatOrb 1.2s ease-in-out infinite alternate; }
      @keyframes kitsuneRun {
        0% { transform: translate(118px, 8px) rotate(-3deg); }
        25% { transform: translate(58px, -6px) rotate(6deg); }
        50% { transform: translate(10px, 6px) rotate(-4deg); }
        75% { transform: translate(64px, 10px) rotate(-5deg); }
        100% { transform: translate(118px, 8px) rotate(-3deg); }
      }
      @keyframes wagFoxTail { 0% { transform: rotate(-12deg); } 100% { transform: rotate(14deg); } }
      @keyframes floatOrb { 0% { transform: translateY(-3px); } 100% { transform: translateY(3px); } }
    </style>
  </defs>

  <!-- CỔNG TORII ĐỎ NHẬT BẢN BÊN TRÁI -->
  <g opacity="0.92">
    <path d="M 16 26 Q 46 31 76 26 L 74 31 Q 46 35 18 31 Z" fill="url(#toriiRed)" stroke="#fef08a" stroke-width="1"/>
    <rect x="22" y="35" width="48" height="4" rx="1.5" fill="url(#toriiRed)"/>
    <rect x="27" y="30" width="5.5" height="36" rx="1" fill="url(#toriiRed)"/>
    <rect x="59" y="30" width="5.5" height="36" rx="1" fill="url(#toriiRed)"/>
  </g>

  <!-- HỒ LY CHIBI (KITSUNE) PHÓNG QUA CỔNG TORII va LỬA HỒ LY -->
  <g class="fox-dash">
    <!-- Chiếc đuôi bông xù vẫy -->
    <g class="fox-tail">
      <path d="M 38 46 C 22 32, 6 32, 2 44 C 6 56, 22 58, 38 50 Z" fill="url(#foxFur)" stroke="#7c2d12" stroke-width="1.3"/>
      <path d="M 2 44 C 6 38, 12 37, 16 42 C 12 48, 6 49, 2 44 Z" fill="#fff7ed"/>
    </g>
    <!-- Thân Hồ Ly Chibi đang phóng -->
    <path d="M 34 46 C 42 36, 62 36, 72 44 C 76 50, 70 58, 56 58 C 42 58, 32 52, 34 46 Z" fill="url(#foxFur)" stroke="#7c2d12" stroke-width="1.3"/>
    <!-- Yếm trắng va Chuông vàng -->
    <path d="M 60 44 C 68 44, 72 48, 70 54 C 64 56, 58 54, 60 44 Z" fill="#fff7ed"/>
    <circle cx="69" cy="49" r="3.2" fill="#fbbf24" stroke="#78350f" stroke-width="0.9"/>
    <!-- Đầu Hồ Ly va Đôi tai nhọn -->
    <circle cx="72" cy="36" r="11" fill="url(#foxFur)" stroke="#7c2d12" stroke-width="1.3"/>
    <polygon points="64,28 60,14 72,24" fill="url(#foxFur)" stroke="#7c2d12" stroke-width="1.2"/>
    <polygon points="74,26 78,12 82,28" fill="url(#foxFur)" stroke="#7c2d12" stroke-width="1.2"/>
    <ellipse cx="77" cy="36" rx="2.8" ry="3.2" fill="#431407"/>
    <circle cx="78" cy="34.8" r="1.2" fill="#ffffff"/>
    <ellipse cx="74" cy="40" rx="2.4" ry="1.2" fill="#fb7185" opacity="0.65"/>
  </g>

  <!-- ĐÈN LỒNG ĐỎ va LỬA HỒ LY (KITSUNE-BI) BÊN PHẢI -->
  <g class="fire-orb">
    <circle cx="206" cy="46" r="9" fill="#fb923c" opacity="0.3"/>
    <path d="M 206 52 C 201 52, 199 46, 203 41 C 205 37, 206 33, 206 33 C 206 33, 211 39, 211 45 C 211 50, 209 52, 206 52 Z" fill="#fbbf24" stroke="#ea580c" stroke-width="1.2"/>
    <circle cx="232" cy="38" r="7" fill="#fef08a" opacity="0.25"/>
    <path d="M 232 43 C 228 43, 227 38, 230 34 C 232 31, 232 28, 232 28 C 232 28, 236 33, 236 38 C 236 41, 234 43, 232 43 Z" fill="#fde047" stroke="#f97316" stroke-width="1"/>
  </g>
</svg>
