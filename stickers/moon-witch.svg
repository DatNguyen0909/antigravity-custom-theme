<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="witchHat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="55%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="witchHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="55%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fde6d8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="eyeViolet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <style>
      /* Mỗi 15s: Vẫy đũa phép nhưng phép lỗi nổ khói tím BÙM và biến ra chú ếch xanh nhảy lên chóp mũ */
      .wand-cast { animation: witchWand 15s ease-in-out infinite; transform-origin: 44px 92px; }
      .magic-poof { animation: witchPoof 15s ease-out infinite; transform-origin: 87px 86px; }
      .frog-hat { animation: witchFrog 15s ease-out infinite; transform-origin: 60px 18px; }
      .sweat-witch { animation: witchSweat 15s linear infinite; }

      @keyframes witchWand {
        0%, 72% { transform: rotate(0deg); }
        75% { transform: rotate(-22deg); }
        78% { transform: rotate(15deg); }
        81% { transform: rotate(-18deg); }
        85%, 100% { transform: rotate(0deg); }
      }
      @keyframes witchPoof {
        0%, 79% { opacity: 0; transform: scale(0.2); }
        82% { opacity: 1; transform: scale(1.5); }
        86% { opacity: 0.7; transform: scale(2.1); }
        89%, 100% { opacity: 0; transform: scale(0.2); }
      }
      @keyframes witchFrog {
        0%, 81% { opacity: 0; transform: translateY(60px) scale(0.2); }
        85% { opacity: 1; transform: translateY(-4px) scale(1.1); }
        89% { opacity: 1; transform: translateY(2px) scale(1); }
        93% { opacity: 1; transform: translateY(-6px) scale(1.05); }
        97%, 100% { opacity: 0; transform: translateY(-25px) scale(0.2); }
      }
      @keyframes witchSweat {
        0%, 82% { opacity: 0; }
        85%, 96% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <path d="M 24 54 C 14 68, 12 88, 22 96 C 26 90, 28 82, 32 78 Z" fill="url(#witchHair)" stroke="#581c87" stroke-width="1.5"/>
  <path d="M 96 54 C 106 68, 108 88, 98 96 C 94 90, 92 82, 88 78 Z" fill="url(#witchHair)" stroke="#581c87" stroke-width="1.5"/>

  <path d="M 32 80 C 30 92, 36 100, 60 100 C 84 100, 90 92, 88 80 Z" fill="url(#witchHat)" stroke="#a855f7" stroke-width="1.5"/>
  <path d="M 46 82 L 60 96 L 74 82 Z" fill="#f3e8ff"/>
  <polygon points="60,80 62,84 66,85 62,87 60,91 58,87 54,85 58,84" fill="url(#goldGrad)"/>

  <path d="M 32 58 C 32 42, 44 36, 60 36 C 76 36, 88 42, 88 58 C 90 74, 78 84, 60 84 C 42 84, 30 74, 32 58 Z" fill="url(#skinGrad)" stroke="#701a75" stroke-width="1.5"/>

  <ellipse cx="45" cy="63" rx="7.5" ry="8.5" fill="url(#eyeViolet)"/>
  <path d="M 36 57 Q 45 52 53 57" fill="none" stroke="#3b0764" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="45" cy="63" rx="3.5" ry="4.5" fill="#2e1065"/>
  <circle cx="42.5" cy="59.5" r="2.6" fill="#ffffff"/>
  <circle cx="47.5" cy="66" r="1.4" fill="#ffffff"/>
  <polygon points="45,67 46,69 48,69.5 46,70 45,72 44,70 42,69.5 44,69" fill="#fef08a"/>

  <ellipse cx="75" cy="63" rx="7.5" ry="8.5" fill="url(#eyeViolet)"/>
  <path d="M 67 57 Q 75 52 84 57" fill="none" stroke="#3b0764" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="75" cy="63" rx="3.5" ry="4.5" fill="#2e1065"/>
  <circle cx="72.5" cy="59.5" r="2.6" fill="#ffffff"/>
  <circle cx="77.5" cy="66" r="1.4" fill="#ffffff"/>
  <polygon points="75,67 76,69 78,69.5 76,70 75,72 74,70 72,69.5 74,69" fill="#fef08a"/>

  <ellipse cx="35" cy="70" rx="5" ry="2.8" fill="#f472b6" opacity="0.65"/>
  <ellipse cx="85" cy="70" rx="5" ry="2.8" fill="#f472b6" opacity="0.65"/>
  <path d="M 55 72 Q 58 75 60 73 Q 62 75 65 72" fill="none" stroke="#9d174d" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Giọt mồ hôi khi phép lỗi -->
  <path class="sweat-witch" d="M 83 54 C 85 58, 85 61, 83 61 C 81 61, 81 58, 83 54 Z" fill="#38bdf8"/>

  <path d="M 28 54 C 24 66, 26 82, 33 88 C 34 78, 34 66, 36 58 Z" fill="url(#witchHair)" stroke="#581c87" stroke-width="1.3"/>
  <path d="M 92 54 C 96 66, 94 82, 87 88 C 86 78, 86 66, 84 58 Z" fill="url(#witchHair)" stroke="#581c87" stroke-width="1.3"/>
  <path d="M 32 48 C 36 58, 44 52, 48 60 C 52 50, 58 58, 62 60 C 66 50, 74 58, 76 52 C 82 56, 86 58, 88 48 Z" fill="url(#witchHair)" stroke="#581c87" stroke-width="1.3"/>

  <ellipse cx="60" cy="44" rx="46" ry="11" fill="#1e1b4b"/>
  <path d="M 26 42 C 34 22, 52 8, 78 6 C 88 6, 96 14, 92 22 C 84 18, 76 18, 72 24 C 76 30, 82 36, 92 42 Z" fill="url(#witchHat)" stroke="#c084fc" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="91" y1="20" x2="98" y2="30" stroke="#fbbf24" stroke-width="1.3"/>
  <path d="M 103 28 A 7 7 0 1 1 94 37 A 5.5 5.5 0 1 0 103 28 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="0.8"/>
  <path d="M 29 40 Q 60 47 90 40" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
  <rect x="53" y="36" width="14" height="11" rx="2.5" fill="url(#goldGrad)" stroke="#92400e" stroke-width="1.2"/>
  <rect x="56" y="39" width="8" height="5" rx="1" fill="#581c87"/>
  <path d="M 12 44 C 28 34, 92 34, 108 44 C 94 52, 26 52, 12 44 Z" fill="url(#witchHat)" stroke="#c084fc" stroke-width="1.6"/>
  <polygon points="48,22 49.5,25 53,26 49.5,27.5 48,31 46.5,27.5 43,26 46.5,25" fill="#fef08a"/>

  <!-- Đũa phép vẫy va Khói phép nổ BÙM -->
  <g class="wand-cast">
    <line x1="42" y1="95" x2="82" y2="87" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="84,86 87,79 90,85 97,86 91,90 93,97 87,93 81,96 83,90 78,86" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1"/>
  </g>
  <ellipse cx="44" cy="92" rx="6" ry="5" fill="url(#skinGrad)" stroke="#701a75" stroke-width="1.3"/>
  <ellipse cx="74" cy="92" rx="6" ry="5" fill="url(#skinGrad)" stroke="#701a75" stroke-width="1.3"/>

  <g class="magic-poof">
    <circle cx="87" cy="86" r="10" fill="#d8b4fe" opacity="0.85"/>
    <circle cx="80" cy="82" r="7" fill="#f0abfc" opacity="0.85"/>
    <circle cx="94" cy="82" r="7" fill="#a855f7" opacity="0.85"/>
  </g>

  <!-- Chú ếch xanh ngơ ngác nhảy lên mũ phù thủy -->
  <g class="frog-hat">
    <ellipse cx="58" cy="18" rx="9" ry="6.5" fill="#4ade80" stroke="#15803d" stroke-width="1.2"/>
    <circle cx="53" cy="12" r="3.2" fill="#4ade80" stroke="#15803d" stroke-width="1"/>
    <circle cx="63" cy="12" r="3.2" fill="#4ade80" stroke="#15803d" stroke-width="1"/>
    <circle cx="53" cy="12" r="1.4" fill="#052e16"/>
    <circle cx="63" cy="12" r="1.4" fill="#052e16"/>
    <path d="M 54 19 Q 58 21 62 19" fill="none" stroke="#15803d" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
