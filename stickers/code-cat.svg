<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ccFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="ccHoodie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="ccLaptop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="ccGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#22c55e" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .cc-body { transform-origin: 60px 104px; animation: ccBreath 3s ease-in-out infinite; }
    .cc-tail { transform-origin: 84px 96px; animation: ccTail 2.4s ease-in-out infinite; }
    .cc-eyes { transform-origin: 60px 50px; animation: ccBlink 4s infinite; }
    .cc-paws { animation: ccType 0.28s ease-in-out infinite alternate; }
    .cc-paws-slam { animation: ccSlam15s 15s ease-in-out infinite; }
    .cc-code { animation: ccScroll 1.6s linear infinite; }

    /* 15s gag: ERROR -> angry -> smash laptop -> pulls out a brand new one */
    .cc-laptop-15s { transform-origin: 60px 86px; animation: ccLaptopSmash15s 15s ease-in-out infinite; }
    .cc-error-15s { animation: ccError15s 15s steps(1) infinite; opacity: 0; }
    .cc-anger-15s { transform-origin: 82px 30px; animation: ccAnger15s 15s ease-in-out infinite; opacity: 0; }
    .cc-shards-15s { transform-origin: 60px 84px; animation: ccShards15s 15s ease-out infinite; opacity: 0; }
    .cc-new-15s { animation: ccNew15s 15s ease-in-out infinite; opacity: 0; }

    @keyframes ccBreath { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes ccTail { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(14deg); } }
    @keyframes ccBlink { 0%,46%,50%,100% { transform: scaleY(1); } 48% { transform: scaleY(0.1); } }
    @keyframes ccType { 0% { transform: translateY(0); } 100% { transform: translateY(-2px); } }
    @keyframes ccScroll { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }

    @keyframes ccError15s {
      0%, 66% { opacity: 0; }
      67%, 69%, 71%, 73% { opacity: 1; }
      68%, 70%, 72% { opacity: 0.25; }
      75%, 100% { opacity: 0; }
    }
    @keyframes ccAnger15s {
      0%, 68% { opacity: 0; transform: scale(0.3); }
      70%, 80% { opacity: 1; transform: scale(1.15); }
      72%, 76% { opacity: 1; transform: scale(0.9); }
      84%, 100% { opacity: 0; transform: scale(0.3); }
    }
    @keyframes ccSlam15s {
      0%, 72% { transform: translateY(0); }
      74% { transform: translateY(-14px); }
      76% { transform: translateY(4px); }
      80%, 100% { transform: translateY(0); }
    }
    @keyframes ccLaptopSmash15s {
      0%, 75% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
      76% { opacity: 1; transform: translate(0, 3px) scale(1.05, 0.85); }
      82% { opacity: 0; transform: translate(40px, -30px) rotate(70deg) scale(0.6); }
      86% { opacity: 0; transform: translate(0, 30px) scale(1); }
      91%, 100% { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes ccShards15s {
      0%, 75% { opacity: 0; transform: scale(0.4); }
      77% { opacity: 1; transform: scale(1); }
      85%, 100% { opacity: 0; transform: scale(1.7) translateY(-6px); }
    }
    @keyframes ccNew15s {
      0%, 88% { opacity: 0; transform: translateY(4px); }
      91%, 96% { opacity: 1; transform: translateY(-3px); }
      99%, 100% { opacity: 0; transform: translateY(-8px); }
    }
  </style>

  <ellipse cx="60" cy="109" rx="34" ry="6" fill="#020617" opacity="0.5"/>

  <g class="cc-body" filter="url(#ccGlow)">
    <!-- Tail -->
    <path class="cc-tail" d="M 82 98 Q 104 92 100 70 Q 98 62 93 66 Q 98 84 80 92 Z" fill="url(#ccFur)" stroke="#334155" stroke-width="1"/>

    <!-- Body in green hoodie -->
    <path d="M 34 106 Q 32 76 60 72 Q 88 76 86 106 Z" fill="url(#ccHoodie)" stroke="#14532d" stroke-width="1.2"/>
    <path d="M 54 76 L 56 90 M 66 76 L 64 90" stroke="#bbf7d0" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Head -->
    <polygon points="38,40 40,16 54,32" fill="url(#ccFur)" stroke="#334155" stroke-width="1"/>
    <polygon points="82,40 80,16 66,32" fill="url(#ccFur)" stroke="#334155" stroke-width="1"/>
    <polygon points="42,35 43,22 51,31" fill="#fda4af"/>
    <polygon points="78,35 77,22 69,31" fill="#fda4af"/>
    <ellipse cx="60" cy="50" rx="25" ry="22" fill="url(#ccFur)" stroke="#334155" stroke-width="1.2"/>
    <!-- Tabby stripes -->
    <path d="M 54 30 L 55 37 M 60 29 L 60 37 M 66 30 L 65 37" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <!-- Muzzle -->
    <ellipse cx="60" cy="60" rx="11" ry="7.5" fill="#e2e8f0"/>
    <path d="M 57.5 56 L 62.5 56 L 60 59 Z" fill="#fb7185"/>
    <path d="M 60 59 Q 57 63 54 61 M 60 59 Q 63 63 66 61" fill="none" stroke="#1e293b" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 46 58 L 34 56 M 46 61 L 34 62 M 74 58 L 86 56 M 74 61 L 86 62" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>

    <!-- Eyes + nerd glasses -->
    <g class="cc-eyes">
      <ellipse cx="50" cy="48" rx="3.2" ry="4" fill="#0f172a"/>
      <ellipse cx="70" cy="48" rx="3.2" ry="4" fill="#0f172a"/>
      <circle cx="49" cy="46.5" r="1.2" fill="#ffffff"/>
      <circle cx="69" cy="46.5" r="1.2" fill="#ffffff"/>
    </g>
    <rect x="41" y="41" width="17" height="13" rx="4" fill="#22c55e" fill-opacity="0.12" stroke="#0f172a" stroke-width="2.2"/>
    <rect x="62" y="41" width="17" height="13" rx="4" fill="#22c55e" fill-opacity="0.12" stroke="#0f172a" stroke-width="2.2"/>
    <line x1="58" y1="46" x2="62" y2="46" stroke="#0f172a" stroke-width="2"/>

    <!-- Anger mark (15s) -->
    <g class="cc-anger-15s">
      <path d="M 78 26 Q 82 30 86 26 M 78 34 Q 82 30 86 34 M 78 26 Q 74 30 78 34 M 86 26 Q 90 30 86 34" fill="none" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- Laptop (smashed + replaced every 15s) -->
    <g class="cc-laptop-15s">
      <!-- Screen (back of lid faces viewer slightly, we show the screen) -->
      <rect x="36" y="66" width="48" height="26" rx="3" fill="#0f172a" stroke="url(#ccLaptop)" stroke-width="2.5"/>
      <clipPath id="ccScreenClip"><rect x="39" y="69" width="42" height="20" rx="1.5"/></clipPath>
      <g clip-path="url(#ccScreenClip)">
        <g class="cc-code">
          <rect x="41" y="71" width="14" height="2" rx="1" fill="#c084fc"/>
          <rect x="57" y="71" width="10" height="2" rx="1" fill="#38bdf8"/>
          <rect x="44" y="75" width="20" height="2" rx="1" fill="#4ade80"/>
          <rect x="44" y="79" width="12" height="2" rx="1" fill="#facc15"/>
          <rect x="58" y="79" width="14" height="2" rx="1" fill="#38bdf8"/>
          <rect x="41" y="83" width="8" height="2" rx="1" fill="#c084fc"/>
          <rect x="44" y="87" width="22" height="2" rx="1" fill="#4ade80"/>
          <rect x="44" y="91" width="10" height="2" rx="1" fill="#facc15"/>
          <rect x="41" y="95" width="16" height="2" rx="1" fill="#38bdf8"/>
        </g>
        <!-- ERROR overlay -->
        <g class="cc-error-15s">
          <rect x="39" y="69" width="42" height="20" fill="#7f1d1d"/>
          <text x="60" y="82.5" font-size="9" font-weight="900" fill="#fecaca" text-anchor="middle" font-family="monospace">ERROR</text>
        </g>
      </g>
      <!-- Keyboard base -->
      <path d="M 30 92 L 90 92 L 94 98 L 26 98 Z" fill="url(#ccLaptop)" stroke="#64748b" stroke-width="1"/>
      <circle cx="60" cy="79" r="0" fill="none"/>
    </g>

    <!-- Paws typing on keyboard -->
    <g class="cc-paws-slam"><g class="cc-paws">
      <ellipse cx="46" cy="94" rx="6" ry="4" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
      <ellipse cx="74" cy="94" rx="6" ry="4" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
    </g></g>

    <!-- Shards burst when smashed -->
    <g class="cc-shards-15s">
      <polygon points="30,80 36,76 34,84" fill="#94a3b8"/>
      <polygon points="88,78 94,82 87,86" fill="#94a3b8"/>
      <polygon points="40,64 44,60 46,67" fill="#38bdf8"/>
      <polygon points="76,62 82,60 79,67" fill="#4ade80"/>
      <text x="60" y="64" font-size="10" font-weight="900" fill="#facc15" text-anchor="middle" font-family="sans-serif">RẦM!</text>
    </g>

    <!-- New laptop sparkle -->
    <g class="cc-new-15s">
      <rect x="44" y="102" width="32" height="10" rx="5" fill="#22c55e"/>
      <text x="60" y="109.5" font-size="7" font-weight="900" fill="#052e16" text-anchor="middle" font-family="monospace">NEW!</text>
      <path d="M 32 66 L 34 70 L 38 71 L 34 72 L 32 76 L 30 72 L 26 71 L 30 70 Z" fill="#facc15"/>
      <path d="M 90 64 L 91.5 67 L 94.5 68 L 91.5 69 L 90 72 L 88.5 69 L 85.5 68 L 88.5 67 Z" fill="#facc15"/>
    </g>
  </g>
</svg>
