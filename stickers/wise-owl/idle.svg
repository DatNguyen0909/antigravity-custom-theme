<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="owlBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="owlBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="scrollP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <style>
      /* Mỗi 15s: Cú học giả ngủ gật, phồng bong bóng mũi + Zzz rồi nổ BỤP làm kính tụt lệch xuống, giật mình đẩy kính lên */
      .eyelid-sleep { animation: owlSleep 15s linear infinite; }
      .snot-bubble { animation: owlBubble 15s ease-in-out infinite; transform-origin: 64px 58px; }
      .glasses-slip { animation: owlGlasses 15s ease-in-out infinite; transform-origin: 60px 49px; }
      .zzz-float { animation: owlZzz 15s ease-out infinite; }
      .owl-blink { transform-origin: 60px 49px; animation: owlBlink 4.3s infinite; }
      .owl-tassel { transform-origin: 60px 21px; animation: owlTassel 2.5s ease-in-out infinite alternate; }
      .owl-wing-l { transform-origin: 32px 62px; animation: owlWingL 2.8s ease-in-out infinite alternate; }
      .owl-wing-r { transform-origin: 88px 62px; animation: owlWingR 2.8s ease-in-out infinite alternate; }

      @keyframes owlBlink { 0%, 45%, 49%, 95%, 100% { transform: scaleY(1); } 47%, 97% { transform: scaleY(0.08); } }
      @keyframes owlTassel { 0% { transform: rotate(-4deg); } 100% { transform: rotate(6deg); } }
      @keyframes owlWingL { 0% { transform: rotate(0deg); } 100% { transform: rotate(6deg); } }
      @keyframes owlWingR { 0% { transform: rotate(0deg); } 100% { transform: rotate(-6deg); } }

      @keyframes owlSleep {
        0%, 72% { opacity: 0; }
        75%, 89% { opacity: 1; }
        90%, 100% { opacity: 0; }
      }
      @keyframes owlBubble {
        0%, 74% { opacity: 0; transform: scale(0.1); }
        80% { opacity: 0.85; transform: scale(0.8); }
        86% { opacity: 0.9; transform: scale(1.45); }
        89% { opacity: 1; transform: scale(1.85); }
        90%, 100% { opacity: 0; transform: scale(0.1); }
      }
      @keyframes owlGlasses {
        0%, 88% { transform: translateY(0) rotate(0deg); }
        90% { transform: translateY(7px) rotate(12deg); }
        94% { transform: translateY(7px) rotate(12deg); }
        97%, 100% { transform: translateY(0) rotate(0deg); }
      }
      @keyframes owlZzz {
        0%, 75% { opacity: 0; transform: translate(0, 0); }
        82% { opacity: 1; transform: translate(6px, -8px); }
        89% { opacity: 1; transform: translate(10px, -14px); }
        91%, 100% { opacity: 0; transform: translate(12px, -18px); }
      }
    </style>
  <ellipse cx="60" cy="110" rx="28" ry="4.5" fill="#020617" opacity="0.34"/>
  </defs>

  <g>
    <path class="owl-wing-l" d="M30 56 C16 64, 15 86, 28 94 C34 88, 35 72, 34 62 Z" fill="url(#owlBody)" stroke="#270e02" stroke-width="2"/>
    <path class="owl-wing-r" d="M90 56 C104 64, 105 86, 92 94 C86 88, 85 72, 86 62 Z" fill="url(#owlBody)" stroke="#270e02" stroke-width="2"/>

    <ellipse cx="60" cy="64" rx="32" ry="38" fill="url(#owlBody)" stroke="#270e02" stroke-width="2.2"/>
    <ellipse cx="60" cy="78" rx="22" ry="21" fill="url(#owlBelly)"/>
    <path d="M47 70 Q51 74 55 70 M56 70 Q60 74 64 70 M65 70 Q69 74 73 70" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M51 77 Q55 81 59 77 M61 77 Q65 81 69 77" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/>

    <circle cx="46" cy="49" r="15" fill="url(#owlBelly)" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="74" cy="49" r="15" fill="url(#owlBelly)" stroke="#78350f" stroke-width="1.5"/>

    <path d="M27 36 Q38 32 49 38" fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
    <path d="M93 36 Q82 32 71 38" fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>

    <polygon points="60,10 92,22 60,32 28,22" fill="#291507" stroke="url(#goldG)" stroke-width="2"/>
    <path d="M40 26 L40 34 Q60 40 80 34 L80 26" fill="#451a03" stroke="url(#goldG)" stroke-width="1.8"/>
    <circle cx="60" cy="21" r="3.5" fill="url(#goldG)"/>
    <g class="owl-tassel">
      <path d="M60 21 Q78 24 85 38" fill="none" stroke="url(#goldG)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="85" cy="40" r="3" fill="#ef4444"/>
    </g>

    <g class="owl-blink">
      <circle cx="46" cy="49" r="9.5" fill="#451a03"/>
      <circle cx="46" cy="49" r="7.5" fill="url(#goldG)"/>
      <circle cx="46" cy="49" r="4.2" fill="#270e02"/>
      <circle cx="43.5" cy="46" r="2.6" fill="#ffffff"/>
      <circle cx="48.5" cy="51.5" r="1.3" fill="#ffffff"/>

      <circle cx="74" cy="49" r="9.5" fill="#451a03"/>
      <circle cx="74" cy="49" r="7.5" fill="url(#goldG)"/>
      <circle cx="74" cy="49" r="4.2" fill="#270e02"/>
      <circle cx="71.5" cy="46" r="2.6" fill="#ffffff"/>
      <circle cx="76.5" cy="51.5" r="1.3" fill="#ffffff"/>
    </g>

    <!-- Mí mắt nhắm ngủ gật mỗi 15s -->
    <g class="eyelid-sleep">
      <circle cx="46" cy="49" r="9.8" fill="url(#owlBelly)"/>
      <path d="M 38 49 Q 46 55 54 49" fill="none" stroke="#451a03" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="74" cy="49" r="9.8" fill="url(#owlBelly)"/>
      <path d="M 66 49 Q 74 55 82 49" fill="none" stroke="#451a03" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- Kính tròn học giả bị tụt lệch khi bóng ngủ nổ -->
    <g class="glasses-slip">
      <circle cx="46" cy="49" r="12" fill="none" stroke="url(#goldG)" stroke-width="2.4"/>
      <circle cx="74" cy="49" r="12" fill="none" stroke="url(#goldG)" stroke-width="2.4"/>
      <path d="M58 49 Q60 46 62 49" fill="none" stroke="url(#goldG)" stroke-width="2.4"/>
    </g>

    <polygon points="56,54 64,54 60,62" fill="url(#goldG)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="34" cy="56" rx="3.8" ry="2" fill="#fb7185" opacity="0.65"/>
    <ellipse cx="86" cy="56" rx="3.8" ry="2" fill="#fb7185" opacity="0.65"/>

    <!-- Bong bóng ngủ gật va chữ Zzz -->
    <g class="snot-bubble">
      <circle cx="72" cy="56" r="9" fill="#bae6fd" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1.4"/>
      <circle cx="69" cy="53" r="2.5" fill="#ffffff"/>
    </g>
    <g class="zzz-float">
      <text x="86" y="28" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#fef08a" stroke="#451a03" stroke-width="0.8">Zzz</text>
    </g>

    <path d="M44 101 C44 106, 52 106, 52 101" fill="url(#goldG)" stroke="#451a03" stroke-width="1.8"/>
    <path d="M68 101 C68 106, 76 106, 76 101" fill="url(#goldG)" stroke="#451a03" stroke-width="1.8"/>

    <g transform="translate(0, 3)">
      <rect x="26" y="79" width="68" height="19" rx="3" fill="url(#scrollP)" stroke="#92400e" stroke-width="2"/>
      <rect x="22" y="76" width="6.5" height="25" rx="3" fill="#991b1b" stroke="url(#goldG)" stroke-width="1.6"/>
      <rect x="91.5" y="76" width="6.5" height="25" rx="3" fill="#991b1b" stroke="url(#goldG)" stroke-width="1.6"/>
      <circle cx="60" cy="88.5" r="5" fill="#dc2626" stroke="#fef08a" stroke-width="1"/>
      <path d="M36 86 H49 M36 91 H46 M71 86 H84 M74 91 H84" stroke="#78350f" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
