<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="woThBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="woThBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="woThGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="woThScroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <radialGradient id="woThLens" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </radialGradient>
    <style>
      .woThNod { transform-origin: 60px 66px; animation: woThNodAnim 2.8s ease-in-out infinite; }
      .woThTassel { transform-origin: 60px 21px; animation: woThTasselAnim 2.4s ease-in-out infinite alternate; }
      .woThMag { transform-origin: 84px 72px; animation: woThMagAnim 2.6s ease-in-out infinite; }
      .woThScrollGlow { animation: woThGlowAnim 2.2s ease-in-out infinite alternate; }
      .woThMote1 { animation: woThMoteAnim 2.5s ease-in-out infinite; }
      .woThMote2 { animation: woThMoteAnim 2.5s ease-in-out 0.8s infinite; }

      @keyframes woThNodAnim {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        45% { transform: rotate(2.5deg) translateY(2px); }
        70% { transform: rotate(-1.5deg) translateY(-1px); }
      }
      @keyframes woThTasselAnim { 0% { transform: rotate(-4deg); } 100% { transform: rotate(7deg); } }
      @keyframes woThMagAnim {
        0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
        50% { transform: translate(-4px, 3px) rotate(-8deg); }
      }
      @keyframes woThGlowAnim { 0% { opacity: 0.45; } 100% { opacity: 1; } }
      @keyframes woThMoteAnim {
        0%, 100% { transform: translateY(0px) scale(0.8); opacity: 0.3; }
        50% { transform: translateY(-6px) scale(1.15); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Wings -->
  <path d="M30 56 C16 64, 15 86, 28 94 C34 88, 35 72, 34 62 Z" fill="url(#woThBody)" stroke="#270e02" stroke-width="2"/>
  <path d="M90 56 C104 64, 105 86, 92 94 C86 88, 85 72, 86 62 Z" fill="url(#woThBody)" stroke="#270e02" stroke-width="2"/>

  <!-- Body -->
  <ellipse cx="60" cy="64" rx="32" ry="38" fill="url(#woThBody)" stroke="#270e02" stroke-width="2.2"/>
  <ellipse cx="60" cy="78" rx="22" ry="21" fill="url(#woThBelly)"/>
  <path d="M47 70 Q51 74 55 70 M56 70 Q60 74 64 70 M65 70 Q69 74 73 70" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Nodding Head va Scholar Cap -->
  <g class="woThNod">
    <circle cx="46" cy="49" r="15" fill="url(#woThBelly)" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="74" cy="49" r="15" fill="url(#woThBelly)" stroke="#78350f" stroke-width="1.5"/>

    <path d="M27 36 Q38 32 49 38" fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
    <path d="M93 36 Q82 32 71 38" fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>

    <!-- Mortarboard Cap -->
    <polygon points="60,10 92,22 60,32 28,22" fill="#291507" stroke="url(#woThGold)" stroke-width="2"/>
    <path d="M40 26 L40 34 Q60 40 80 34 L80 26" fill="#451a03" stroke="url(#woThGold)" stroke-width="1.8"/>
    <circle cx="60" cy="21" r="3.5" fill="url(#woThGold)"/>
    <g class="woThTassel">
      <path d="M60 21 Q78 24 85 38" fill="none" stroke="url(#woThGold)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="85" cy="40" r="3" fill="#ef4444"/>
    </g>

    <!-- Thoughtful Eyes Looking Down at Scroll -->
    <circle cx="46" cy="49" r="9.5" fill="#451a03"/>
    <circle cx="46" cy="49" r="7.5" fill="url(#woThGold)"/>
    <circle cx="46" cy="51" r="4.2" fill="#270e02"/>
    <circle cx="44" cy="47.5" r="2.3" fill="#ffffff"/>

    <circle cx="74" cy="49" r="9.5" fill="#451a03"/>
    <circle cx="74" cy="49" r="7.5" fill="url(#woThGold)"/>
    <circle cx="74" cy="51" r="4.2" fill="#270e02"/>
    <circle cx="72" cy="47.5" r="2.3" fill="#ffffff"/>

    <!-- Round Glasses -->
    <circle cx="46" cy="49" r="12" fill="none" stroke="url(#woThGold)" stroke-width="2.4"/>
    <circle cx="74" cy="49" r="12" fill="none" stroke="url(#woThGold)" stroke-width="2.4"/>
    <path d="M58 49 Q60 46 62 49" fill="none" stroke="url(#woThGold)" stroke-width="2.4"/>

    <!-- Beak va Blush -->
    <polygon points="56,54 64,54 60,62" fill="url(#woThGold)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="34" cy="56" rx="3.8" ry="2" fill="#fb7185" opacity="0.6"/>
    <ellipse cx="86" cy="56" rx="3.8" ry="2" fill="#fb7185" opacity="0.6"/>
  </g>

  <!-- Feet -->
  <path d="M44 101 C44 106, 52 106, 52 101" fill="url(#woThGold)" stroke="#451a03" stroke-width="1.8"/>
  <path d="M68 101 C68 106, 76 106, 76 101" fill="url(#woThGold)" stroke="#451a03" stroke-width="1.8"/>

  <!-- Glowing Ancient Scroll -->
  <g transform="translate(0, 3)">
    <rect x="24" y="77" width="72" height="23" rx="4" fill="#fef08a" opacity="0.35" class="woThScrollGlow"/>
    <rect x="26" y="79" width="68" height="19" rx="3" fill="url(#woThScroll)" stroke="#92400e" stroke-width="2"/>
    <rect x="22" y="76" width="6.5" height="25" rx="3" fill="#991b1b" stroke="url(#woThGold)" stroke-width="1.6"/>
    <rect x="91.5" y="76" width="6.5" height="25" rx="3" fill="#991b1b" stroke="url(#woThGold)" stroke-width="1.6"/>
    <g class="woThScrollGlow">
      <path d="M35 85 H52 M35 90 H48 M66 85 H84 M70 90 H84" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
      <circle cx="59" cy="88" r="3.2" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Magnifying Glass Examining the Scroll -->
  <g class="woThMag">
    <line x1="82" y1="68" x2="94" y2="82" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="82" y1="68" x2="94" y2="82" stroke="url(#woThGold)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="74" cy="58" r="13.5" fill="url(#woThLens)" stroke="url(#woThGold)" stroke-width="3"/>
    <path d="M67 52 Q72 48 79 51" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Floating Knowledge Motes -->
  <polygon class="woThMote1" points="16,38 18,34 20,38 24,40 20,42 18,46 16,42 12,40" fill="#fef08a"/>
  <circle class="woThMote2" cx="104" cy="36" r="2.8" fill="#fcd34d"/>
</svg>
