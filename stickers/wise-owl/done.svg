<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="woDnBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="woDnBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="woDnGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="woDnScroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <style>
      .woDnBounce { animation: woDnBounceAnim 2.2s ease-in-out infinite; }
      .woDnWingL { transform-origin: 32px 62px; animation: woDnWingLAnim 2s ease-in-out infinite; }
      .woDnWingR { transform-origin: 88px 62px; animation: woDnWingRAnim 2s ease-in-out infinite; }
      .woDnTassel { transform-origin: 60px 21px; animation: woDnTasselAnim 2s ease-in-out infinite alternate; }
      .woDnStamp { transform-origin: 60px 88px; animation: woDnStampAnim 2.4s ease-in-out infinite; }
      .woDnSealPop { transform-origin: 60px 91px; animation: woDnSealAnim 2.4s ease-in-out infinite; }
      .woDnSpark1 { transform-origin: 18px 26px; animation: woDnSparkAnim 2.2s ease-in-out infinite; }
      .woDnSpark2 { transform-origin: 102px 26px; animation: woDnSparkAnim 2.2s ease-in-out 0.6s infinite; }

      @keyframes woDnBounceAnim { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3.5px); } }
      @keyframes woDnWingLAnim { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(28deg); } }
      @keyframes woDnWingRAnim { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(-28deg); } }
      @keyframes woDnTasselAnim { 0% { transform: rotate(-7deg); } 100% { transform: rotate(9deg); } }
      @keyframes woDnStampAnim {
        0%, 100% { transform: translateY(-10px) rotate(-12deg); opacity: 0.95; }
        45%, 60% { transform: translateY(0px) rotate(0deg); opacity: 1; }
      }
      @keyframes woDnSealAnim {
        0%, 35% { transform: scale(0.85); opacity: 0.7; }
        50%, 85% { transform: scale(1.18); opacity: 1; }
        100% { transform: scale(0.85); opacity: 0.7; }
      }
      @keyframes woDnSparkAnim { 0%, 100% { transform: scale(0.65); opacity: 0.4; } 50% { transform: scale(1.25); opacity: 1; } }
    </style>
  </defs>

  <!-- Sparkles -->
  <g class="woDnSpark1">
    <polygon points="18,19 20,24 25,26 20,28 18,33 16,28 11,26 16,24" fill="#fef08a"/>
  </g>
  <g class="woDnSpark2">
    <polygon points="102,19 104,24 109,26 104,28 102,33 100,28 95,26 100,24" fill="#fef08a"/>
    <circle cx="96" cy="44" r="2.2" fill="#fcd34d"/>
  </g>

  <g class="woDnBounce">
    <!-- Flapping Happy Wings -->
    <path class="woDnWingL" d="M30 56 C12 52, 8 74, 22 86 C30 82, 34 70, 34 62 Z" fill="url(#woDnBody)" stroke="#270e02" stroke-width="2"/>
    <path class="woDnWingR" d="M90 56 C108 52, 112 74, 98 86 C90 82, 86 70, 86 62 Z" fill="url(#woDnBody)" stroke="#270e02" stroke-width="2"/>

    <!-- Body -->
    <ellipse cx="60" cy="64" rx="32" ry="38" fill="url(#woDnBody)" stroke="#270e02" stroke-width="2.2"/>
    <ellipse cx="60" cy="78" rx="22" ry="21" fill="url(#woDnBelly)"/>
    <path d="M47 70 Q51 74 55 70 M56 70 Q60 74 64 70 M65 70 Q69 74 73 70" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Face Discs -->
    <circle cx="46" cy="49" r="15" fill="url(#woDnBelly)" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="74" cy="49" r="15" fill="url(#woDnBelly)" stroke="#78350f" stroke-width="1.5"/>

    <!-- Ear Tufts -->
    <path d="M27 36 Q38 32 49 38" fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
    <path d="M93 36 Q82 32 71 38" fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>

    <!-- Mortarboard Cap -->
    <polygon points="60,10 92,22 60,32 28,22" fill="#291507" stroke="url(#woDnGold)" stroke-width="2"/>
    <path d="M40 26 L40 34 Q60 40 80 34 L80 26" fill="#451a03" stroke="url(#woDnGold)" stroke-width="1.8"/>
    <circle cx="60" cy="21" r="3.5" fill="url(#woDnGold)"/>
    <g class="woDnTassel">
      <path d="M60 21 Q78 24 85 38" fill="none" stroke="url(#woDnGold)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="85" cy="40" r="3" fill="#ef4444"/>
    </g>

    <!-- Happy Curved Eyes Behind Glasses -->
    <path d="M39 50 Q46 42 53 50" fill="none" stroke="#451a03" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M67 50 Q74 42 81 50" fill="none" stroke="#451a03" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Gold Round Glasses -->
    <circle cx="46" cy="49" r="12" fill="none" stroke="url(#woDnGold)" stroke-width="2.4"/>
    <circle cx="74" cy="49" r="12" fill="none" stroke="url(#woDnGold)" stroke-width="2.4"/>
    <path d="M58 49 Q60 46 62 49" fill="none" stroke="url(#woDnGold)" stroke-width="2.4"/>

    <!-- Beak va Rosy Cheeks -->
    <polygon points="56,54 64,54 60,62" fill="url(#woDnGold)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="34" cy="56" rx="4.4" ry="2.4" fill="#fb7185" opacity="0.85"/>
    <ellipse cx="86" cy="56" rx="4.4" ry="2.4" fill="#fb7185" opacity="0.85"/>

    <!-- Feet -->
    <path d="M44 101 C44 106, 52 106, 52 101" fill="url(#woDnGold)" stroke="#451a03" stroke-width="1.8"/>
    <path d="M68 101 C68 106, 76 106, 76 101" fill="url(#woDnGold)" stroke="#451a03" stroke-width="1.8"/>
  </g>

  <!-- Open Scroll With Stamped Red Seal Mark -->
  <g transform="translate(0, 3)">
    <rect x="26" y="79" width="68" height="19" rx="3" fill="url(#woDnScroll)" stroke="#92400e" stroke-width="2"/>
    <rect x="22" y="76" width="6.5" height="25" rx="3" fill="#991b1b" stroke="url(#woDnGold)" stroke-width="1.6"/>
    <rect x="91.5" y="76" width="6.5" height="25" rx="3" fill="#991b1b" stroke="url(#woDnGold)" stroke-width="1.6"/>
    <path d="M35 86 H47 M35 91 H45 M73 86 H85 M75 91 H85" stroke="#78350f" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Popping Red Wax Seal With Checkmark -->
  <g class="woDnSealPop">
    <circle cx="60" cy="91.5" r="7.2" fill="#dc2626" stroke="#fef08a" stroke-width="1.4"/>
    <path d="M56.5 91.5 L59 94 L64 89" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wooden Stamp Tool Tapping Seal -->
  <g class="woDnStamp">
    <rect x="65" y="74" width="12" height="4.5" rx="1.5" fill="#991b1b" stroke="#451a03" stroke-width="1.2"/>
    <path d="M68 74 L69.5 64 C69.5 61, 72.5 61, 72.5 64 L74 74 Z" fill="url(#woDnGold)" stroke="#78350f" stroke-width="1.2"/>
  </g>
</svg>
