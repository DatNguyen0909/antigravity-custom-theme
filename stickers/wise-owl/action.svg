<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <clipPath id="woActClip">
      <rect x="0" y="0" width="260" height="95"/>
    </clipPath>
    <radialGradient id="woActMoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.88"/>
      <stop offset="42%" stop-color="#fde68a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woActMtnFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.72"/>
      <stop offset="65%" stop-color="#334155" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="woActMtnNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#451a03" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="woActMist" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0"/>
      <stop offset="25%" stop-color="#fef3c7" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#fde68a" stop-opacity="0.36"/>
      <stop offset="85%" stop-color="#fef3c7" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="woActLanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.88"/>
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woActLanternBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="65%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="woActOwlBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="woActGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="woActScroll" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="woActScrollGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.72"/>
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <style>
      .wo-mist-drift { animation: woMistDrift 4.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .wo-cloud-fg { animation: woCloudFg 3.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .wo-lantern-l {
        transform-origin: 22px 4px;
        animation: woLanternSwayL 2.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .wo-lantern-r {
        transform-origin: 234px 4px;
        animation: woLanternSwayR 2.9s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .wo-fly-x { animation: woFlyX 3.9s linear infinite; }
      .wo-wave-y {
        transform-origin: 0px 42px;
        animation: woWaveY 1.1s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .wo-wing-front {
        transform-origin: -2px 37px;
        animation: woWingFront 0.38s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .wo-wing-back {
        transform-origin: 4px 36px;
        animation: woWingBack 0.38s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .wo-tassel {
        transform-origin: -2px 24px;
        animation: woTassel 0.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .wo-mote-1 { animation: woMoteFloat 2.6s linear infinite; }
      .wo-mote-2 { animation: woMoteFloat 3.1s linear 1.0s infinite; }
      .wo-mote-3 { animation: woMoteFloat 2.8s linear 1.8s infinite; }

      @keyframes woFlyX {
        0% { transform: translateX(-45px); opacity: 0; }
        8% { opacity: 1; }
        92% { opacity: 1; }
        100% { transform: translateX(305px); opacity: 0; }
      }
      @keyframes woWaveY {
        0% { transform: translateY(-7px) rotate(-4deg); }
        100% { transform: translateY(7px) rotate(4deg); }
      }
      @keyframes woWingFront {
        0% { transform: rotate(-22deg) scaleY(0.9); }
        100% { transform: rotate(20deg) scaleY(1.06); }
      }
      @keyframes woWingBack {
        0% { transform: rotate(-14deg); }
        100% { transform: rotate(15deg); }
      }
      @keyframes woTassel {
        0% { transform: rotate(-8deg); }
        100% { transform: rotate(10deg); }
      }
      @keyframes woMistDrift {
        0% { transform: translateX(-6px); }
        100% { transform: translateX(6px); }
      }
      @keyframes woCloudFg {
        0% { transform: translate(5px, 1px); }
        100% { transform: translate(-5px, -2px); }
      }
      @keyframes woLanternSwayL {
        0% { transform: rotate(-5deg); }
        100% { transform: rotate(5deg); }
      }
      @keyframes woLanternSwayR {
        0% { transform: rotate(5deg); }
        100% { transform: rotate(-5deg); }
      }
      @keyframes woMoteFloat {
        0% { transform: translate(0px, 6px) scale(0.7); opacity: 0; }
        25% { opacity: 0.95; }
        80% { opacity: 0.85; }
        100% { transform: translate(10px, -16px) scale(1.05); opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#woActClip)">
    <!-- Soft Warm Moon Halo -->
    <circle cx="94" cy="24" r="24" fill="url(#woActMoon)"/>
    <circle cx="94" cy="24" r="9.5" fill="#fef9c3" opacity="0.88"/>

    <!-- FAR LAYER: Misty Ink-Wash Mountain Range -->
    <g>
      <path d="M 4 74 L 46 28 L 82 54 L 124 22 L 164 56 L 204 30 L 254 74 Z" fill="url(#woActMtnFar)"/>
      <path d="M 124 22 L 136 33 L 128 31 L 124 36 L 119 30 Z" fill="#fef3c7" opacity="0.32"/>
    </g>

    <!-- MID LAYER: Ink-Wash Scholar Peaks va Pine Silhouettes -->
    <g>
      <!-- Left Peaks -->
      <polygon points="8,74 38,24 68,74" fill="url(#woActMtnNear)" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.72"/>
      <polygon points="44,74 68,36 92,74" fill="url(#woActMtnNear)" stroke="#fde68a" stroke-width="0.9" stroke-opacity="0.65"/>
      <!-- Right Peak -->
      <polygon points="168,74 198,32 232,74" fill="url(#woActMtnNear)" stroke="#fbbf24" stroke-width="0.95" stroke-opacity="0.68"/>
      <!-- Tiny Ink Pine Silhouettes on Ridge -->
      <path d="M 65 40 L 68 33 L 71 40 Z M 66 36 L 68 30 L 70 36 Z" fill="#1c1917" opacity="0.82"/>
      <path d="M 194 37 L 198 29 L 202 37 Z" fill="#1c1917" opacity="0.78"/>
    </g>

    <!-- Drifting Golden Mist Ribbon between Peaks -->
    <g class="wo-mist-drift">
      <path d="M 0 68 Q 55 56 125 65 T 260 62 L 260 76 L 0 76 Z" fill="url(#woActMist)"/>
      <path d="M 12 64 C 32 57, 56 57, 74 64" fill="none" stroke="#fef3c7" stroke-width="2.4" stroke-linecap="round" opacity="0.78"/>
      <path d="M 142 62 C 166 56, 194 56, 214 63" fill="none" stroke="#fef3c7" stroke-width="2.2" stroke-linecap="round" opacity="0.72"/>
    </g>

    <!-- Drifting Golden Calligraphy va Scroll Motes -->
    <g class="wo-mote-1">
      <path d="M 86 48 L 87.2 51 L 90 52 L 87.2 53 L 86 56 L 84.8 53 L 82 52 L 84.8 51 Z" fill="#fef08a"/>
    </g>
    <g class="wo-mote-2">
      <path d="M 148 42 Q 152 38 156 42 Q 152 46 148 42 Z" fill="#fde68a"/>
      <circle cx="152" cy="42" r="1" fill="#ffffff"/>
    </g>
    <g class="wo-mote-3">
      <path d="M 184 26 L 185 28.6 L 187.5 29.5 L 185 30.4 L 184 33 L 183 30.4 L 180.5 29.5 L 183 28.6 Z" fill="#fef08a"/>
    </g>

    <!-- WISE SCHOLAR OWL: Decoupled Linear Horizontal Travel + Smooth Sine Wave -->
    <g class="wo-fly-x">
      <g class="wo-wave-y">
        <!-- Golden Ink-Sparkle Flight Trail -->
        <path d="M -54 44 Q -38 40 -26 44" fill="none" stroke="url(#woActGold)" stroke-width="1.8" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.78"/>
        <circle cx="-46" cy="42" r="1.8" fill="#fef08a" opacity="0.85"/>
        <circle cx="-34" cy="46" r="1.4" fill="#fde68a" opacity="0.8"/>

        <!-- Back Wing -->
        <g class="wo-wing-back">
          <path d="M 4 36 C -4 22, -16 20, -22 27 C -15 34, -4 39, 6 39 Z" fill="#78350f" stroke="#fde68a" stroke-width="0.9"/>
        </g>

        <!-- Glowing Ancient Scroll carried underneath -->
        <ellipse cx="0" cy="56" rx="18" ry="8.5" fill="url(#woActScrollGlow)"/>
        <!-- Fluttering Crimson Ribbon Tails -->
        <path d="M -1 58 Q -10 61 -16 58 M 1 59 Q -8 64 -14 63" fill="none" stroke="#e11d48" stroke-width="1.7" stroke-linecap="round"/>
        <!-- Scroll Parchment va Rollers -->
        <rect x="-12" y="52.5" width="24" height="7" rx="3.2" fill="url(#woActScroll)" stroke="#92400e" stroke-width="1.1"/>
        <rect x="-14" y="51.5" width="3.2" height="9" rx="1.4" fill="#991b1b" stroke="#fbbf24" stroke-width="0.8"/>
        <rect x="10.8" y="51.5" width="3.2" height="9" rx="1.4" fill="#991b1b" stroke="#fbbf24" stroke-width="0.8"/>
        <rect x="-2" y="51.5" width="4" height="9" rx="1" fill="#e11d48"/>
        <circle cx="0" cy="56" r="1.6" fill="#fef08a"/>

        <!-- Owl Body (Facing Right) -->
        <ellipse cx="0" cy="41" rx="18.5" ry="13" fill="url(#woActOwlBody)" stroke="#451a03" stroke-width="1.3"/>
        <ellipse cx="6" cy="43" rx="11" ry="9" fill="#fef3c7"/>
        <!-- Scalloped Belly Plumage -->
        <path d="M 0 43 Q 3 46 6 43 M 7 43 Q 10 46 13 43 M 3 47 Q 6 50 9 47" fill="none" stroke="#b45309" stroke-width="1.1" stroke-linecap="round"/>

        <!-- Golden Talons Gripping Scroll -->
        <path d="M -4 51 L -5 54 M -2 51 L -2 54 M 5 51 L 4 54 M 7 51 L 7 54" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

        <!-- Scholar Mortarboard Cap va Tassel -->
        <polygon points="-7,26 9,21 24,26 9,30" fill="#1e293b" stroke="#fbbf24" stroke-width="1.1"/>
        <path d="M 0 28 L 0 31 Q 9 34 17 31 L 17 28" fill="#291507" stroke="#fbbf24" stroke-width="0.9"/>
        <g class="wo-tassel">
          <path d="M 9 25 Q -2 27 -8 33" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="-9" cy="34" r="2" fill="#ef4444"/>
        </g>

        <!-- Round Golden Scholar Spectacles va Wise Eye -->
        <circle cx="13" cy="37.5" r="5.2" fill="#ffffff" stroke="url(#woActGold)" stroke-width="1.6"/>
        <circle cx="13.8" cy="37.5" r="3.2" fill="#f59e0b"/>
        <circle cx="14.2" cy="37.5" r="1.8" fill="#270e02"/>
        <circle cx="12.8" cy="36.2" r="1.1" fill="#ffffff"/>
        <ellipse cx="10.5" cy="43" rx="2.4" ry="1.3" fill="#fb7185" opacity="0.6"/>
        <!-- Golden Beak -->
        <polygon points="19,38 25.5,40.5 19,42.5" fill="url(#woActGold)" stroke="#78350f" stroke-width="0.9" stroke-linejoin="round"/>

        <!-- Front Flapping Wing -->
        <g class="wo-wing-front">
          <path d="M 0 38 C -12 20, -27 18, -33 27 C -24 35, -12 42, 0 42 Z" fill="url(#woActOwlBody)" stroke="#fef3c7" stroke-width="1.1"/>
          <path d="M -6 37 C -14 27, -23 25, -28 29" fill="none" stroke="#fde68a" stroke-width="1.1" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- FOREGROUND: Warm Golden Cloud Bottom-Right -->
    <g class="wo-cloud-fg">
      <path d="M 186 70 C 178 70, 176 60, 184 56 C 184 46, 196 42, 204 46 C 210 38, 226 38, 232 47 C 242 45, 249 52, 245 61 C 251 66, 243 72, 233 72 Z" fill="url(#woActScroll)" stroke="#b45309" stroke-width="1.3" opacity="0.92"/>
      <path d="M 196 62 C 202 57, 211 57, 215 62" fill="none" stroke="#fffbeb" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- FOREGROUND: Hanging Glowing Red Lantern (Left) -->
    <g class="wo-lantern-l">
      <circle cx="22" cy="24" r="17" fill="url(#woActLanternGlow)"/>
      <line x1="22" y1="0" x2="22" y2="14" stroke="#fbbf24" stroke-width="1.3"/>
      <rect x="18" y="13" width="8" height="2.6" rx="1" fill="#fbbf24"/>
      <ellipse cx="22" cy="24" rx="7.5" ry="9.5" fill="url(#woActLanternBody)" stroke="#fbbf24" stroke-width="1.1"/>
      <path d="M 18.5 16 Q 17 24 18.5 32 M 25.5 16 Q 27 24 25.5 32" fill="none" stroke="#fde68a" stroke-width="0.8" opacity="0.7"/>
      <rect x="18.5" y="32.5" width="7" height="2.2" rx="0.8" fill="#fbbf24"/>
      <line x1="22" y1="34.7" x2="22" y2="41" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- FOREGROUND: Hanging Glowing Red Lantern (Right) -->
    <g class="wo-lantern-r">
      <circle cx="234" cy="28" r="18" fill="url(#woActLanternGlow)"/>
      <line x1="234" y1="0" x2="234" y2="17" stroke="#fbbf24" stroke-width="1.3"/>
      <rect x="230" y="16" width="8" height="2.6" rx="1" fill="#fbbf24"/>
      <ellipse cx="234" cy="27.5" rx="8" ry="10" fill="url(#woActLanternBody)" stroke="#fbbf24" stroke-width="1.1"/>
      <path d="M 230.2 19 Q 228.5 27.5 230.2 36 M 237.8 19 Q 239.5 27.5 237.8 36" fill="none" stroke="#fde68a" stroke-width="0.8" opacity="0.7"/>
      <rect x="230.5" y="36.5" width="7" height="2.2" rx="0.8" fill="#fbbf24"/>
      <line x1="234" y1="38.7" x2="234" y2="45" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
