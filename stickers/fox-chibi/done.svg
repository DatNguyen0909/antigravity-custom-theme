<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="foxDnFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="55%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="foxDnCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="foxDnGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <style>
      .foxDnBounce { transform-origin: 60px 104px; animation: foxDnHop 2s ease-in-out infinite; }
      .foxDnTailL { transform-origin: 38px 88px; animation: foxDnTailL 1.8s ease-in-out infinite alternate; }
      .foxDnTailR { transform-origin: 82px 88px; animation: foxDnTailR 1.8s ease-in-out infinite alternate; }
      .foxDnBell { transform-origin: 90px 76px; animation: foxDnRing 1.4s ease-in-out infinite; }
      .foxDnLeaf1 { animation: foxDnFall1 3.2s ease-in-out infinite; }
      .foxDnLeaf2 { animation: foxDnFall2 3s ease-in-out -1.2s infinite; }
      .foxDnSpark1 { transform-origin: 20px 26px; animation: foxDnTwinkle 2.2s ease-in-out infinite; }
      .foxDnSpark2 { transform-origin: 102px 24px; animation: foxDnTwinkle 2.2s ease-in-out -1.1s infinite; }
      .foxDnSpark3 { transform-origin: 26px 52px; animation: foxDnTwinkle 2.4s ease-in-out -0.6s infinite; }

      @keyframes foxDnHop {
        0%, 100% { transform: translateY(0px) scale(1, 1); }
        45% { transform: translateY(-5px) scale(0.98, 1.03); }
        65% { transform: translateY(0px) scale(1.03, 0.97); }
      }
      @keyframes foxDnTailL { 0% { transform: rotate(-12deg); } 100% { transform: rotate(10deg); } }
      @keyframes foxDnTailR { 0% { transform: rotate(12deg); } 100% { transform: rotate(-10deg); } }
      @keyframes foxDnRing {
        0%, 100% { transform: rotate(-14deg); }
        25% { transform: rotate(18deg); }
        50% { transform: rotate(-14deg); }
        75% { transform: rotate(14deg); }
      }
      @keyframes foxDnFall1 {
        0% { transform: translate(0px, -6px) rotate(0deg); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(-10px, 28px) rotate(42deg); opacity: 0; }
      }
      @keyframes foxDnFall2 {
        0% { transform: translate(0px, -6px) rotate(0deg); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(10px, 26px) rotate(-38deg); opacity: 0; }
      }
      @keyframes foxDnTwinkle {
        0%, 100% { transform: scale(0.55) rotate(0deg); opacity: 0.45; }
        50% { transform: scale(1.2) rotate(25deg); opacity: 1; }
      }
    </style>
  </defs>

  <g class="foxDnBounce">
    <!-- Joyfully wagging tails -->
    <g class="foxDnTailL">
      <path d="M36 92 C12 96, 6 72, 18 58 C26 62, 32 76, 40 86 Z" fill="url(#foxDnFur)" stroke="#431407" stroke-width="2"/>
      <path d="M18 58 C12 65, 13 73, 21 74 C24 68, 23 62, 18 58 Z" fill="url(#foxDnCream)"/>
    </g>
    <g class="foxDnTailR">
      <path d="M84 92 C108 96, 114 72, 102 58 C94 62, 88 76, 80 86 Z" fill="url(#foxDnFur)" stroke="#431407" stroke-width="2"/>
      <path d="M102 58 C108 65, 107 73, 99 74 C96 68, 97 62, 102 58 Z" fill="url(#foxDnCream)"/>
    </g>

    <!-- Ears -->
    <g>
      <path d="M34 42 C24 18, 22 6, 30 8 C40 10, 48 24, 50 34 Z" fill="url(#foxDnFur)" stroke="#431407" stroke-width="2.2"/>
      <path d="M35 38 C28 22, 27 13, 31 14 C37 16, 43 26, 45 34 Z" fill="url(#foxDnCream)"/>
      <path d="M27 11 C25 8, 28 7, 32 9 C30 12, 28 12, 27 11 Z" fill="#431407"/>
    </g>
    <g>
      <path d="M86 42 C96 18, 98 6, 90 8 C80 10, 72 24, 70 34 Z" fill="url(#foxDnFur)" stroke="#431407" stroke-width="2.2"/>
      <path d="M85 38 C92 22, 93 13, 89 14 C83 16, 77 26, 75 34 Z" fill="url(#foxDnCream)"/>
      <path d="M93 11 C95 8, 92 7, 88 9 C90 12, 92 12, 93 11 Z" fill="#431407"/>
    </g>

    <!-- Body -->
    <ellipse cx="60" cy="86" rx="22" ry="18" fill="url(#foxDnFur)" stroke="#431407" stroke-width="2.2"/>
    <ellipse cx="60" cy="88" rx="14" ry="14" fill="url(#foxDnCream)"/>
    <path d="M42 73 Q60 80 78 73" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="77" r="4.5" fill="url(#foxDnGold)" stroke="#431407" stroke-width="1.4"/>

    <!-- Head -->
    <path d="M30 50 C30 32, 44 26, 60 26 C76 26, 90 32, 90 50 C96 56, 92 66, 84 69 C76 74, 68 75, 60 75 C52 75, 44 74, 36 69 C28 66, 24 56, 30 50 Z" fill="url(#foxDnFur)" stroke="#431407" stroke-width="2.2"/>
    <path d="M30 55 C38 48, 48 52, 60 52 C72 52, 82 48, 90 55 C88 68, 74 74, 60 74 C46 74, 32 68, 30 55 Z" fill="url(#foxDnCream)"/>
    <path d="M60 32 C63 37, 62 42, 60 44 C58 42, 57 37, 60 32 Z" fill="#dc2626"/>
    <circle cx="53" cy="39" r="1.8" fill="#dc2626"/>
    <circle cx="67" cy="39" r="1.8" fill="#dc2626"/>

    <!-- Happy smiling curved eyes -->
    <path d="M39 53 Q46 45 53 53" fill="none" stroke="#431407" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M67 53 Q74 45 81 53" fill="none" stroke="#431407" stroke-width="2.8" stroke-linecap="round"/>

    <ellipse cx="36" cy="59" rx="5" ry="2.5" fill="#fb7185" opacity="0.85"/>
    <ellipse cx="84" cy="59" rx="5" ry="2.5" fill="#fb7185" opacity="0.85"/>
    <polygon points="58,56 62,56 60,58.5" fill="#431407"/>
    <!-- Happy open mouth with fang -->
    <path d="M53 60 Q60 69 67 60 Z" fill="#dc2626" stroke="#431407" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon points="62.5,60.5 64,63.5 65.5,60.5" fill="#ffffff"/>

    <!-- Feet -->
    <ellipse cx="46" cy="103" rx="6.5" ry="4" fill="#431407"/>
    <ellipse cx="74" cy="103" rx="6.5" ry="4" fill="#431407"/>

    <!-- Left paw raised happily -->
    <ellipse cx="38" cy="79" rx="5.5" ry="4.2" transform="rotate(-25 38 79)" fill="url(#foxDnFur)" stroke="#431407" stroke-width="1.8"/>

    <!-- Right paw ringing golden shrine bell -->
    <g class="foxDnBell">
      <line x1="90" y1="81" x2="96" y2="66" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
      <path d="M90 66 Q96 63 102 66" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="98" cy="58" r="8.5" fill="url(#foxDnGold)" stroke="#431407" stroke-width="1.8"/>
      <line x1="91" y1="59" x2="105" y2="57" stroke="#92400e" stroke-width="1.5"/>
      <circle cx="98" cy="58" r="2.2" fill="#431407"/>
      <circle cx="95" cy="54" r="2" fill="#ffffff" opacity="0.85"/>
      <!-- Ringing sound arcs -->
      <path d="M108 50 Q112 56 109 62" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M86 50 Q83 55 86 60" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="86" cy="80" rx="5.5" ry="4.2" transform="rotate(20 86 80)" fill="url(#foxDnFur)" stroke="#431407" stroke-width="1.8"/>
    </g>
  </g>

  <!-- Celebratory autumn maple leaves -->
  <g class="foxDnLeaf1">
    <path d="M18 16 L20 21 L25 19 L21 24 L24 27 L19 26 L18 30 L17 26 L12 27 L15 24 L11 19 L16 21 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.9"/>
  </g>
  <g class="foxDnLeaf2">
    <path d="M104 34 L106 39 L111 37 L107 42 L110 45 L105 44 L104 48 L103 44 L98 45 L101 42 L97 37 L102 39 Z" fill="#f97316" stroke="#7c2d12" stroke-width="0.9"/>
  </g>

  <!-- Golden sparkles -->
  <path class="foxDnSpark1" d="M20 20 L21.8 24.2 L26 26 L21.8 27.8 L20 32 L18.2 27.8 L14 26 L18.2 24.2 Z" fill="#fde047" stroke="#b45309" stroke-width="0.8"/>
  <path class="foxDnSpark2" d="M102 18 L103.6 22.4 L108 24 L103.6 25.6 L102 30 L100.4 25.6 L96 24 L100.4 22.4 Z" fill="#fde047" stroke="#b45309" stroke-width="0.8"/>
  <path class="foxDnSpark3" d="M26 48 L27.2 50.8 L30 52 L27.2 53.2 L26 56 L24.8 53.2 L22 52 L24.8 50.8 Z" fill="#fef08a" stroke="#d97706" stroke-width="0.7"/>
</svg>
