<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="foxFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="55%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="foxCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="foxFire" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fde047"/>
      <stop offset="80%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <style>
      /* Mỗi 15s: Hồ ly hóa phép biến ngọn lửa thành miếng đậu phụ Inari thơm phức, định ăn thì BỤP biến lại thành chiếc lá khô rơi xuống */
      .orb-hide { animation: foxOrbHide 15s linear infinite; }
      .tofu-appear { animation: foxTofu 15s ease-in-out infinite; transform-origin: 60px 84px; }
      .leaf-fail { animation: foxLeaf 15s ease-in-out infinite; transform-origin: 60px 82px; }
      .poof-smoke { animation: foxPoof 15s ease-out infinite; transform-origin: 60px 84px; }
      .fox-blink { transform-origin: 60px 52.5px; animation: foxBlink 3.6s infinite; }
      .fox-tail-l { transform-origin: 38px 88px; animation: foxTailL 2.2s ease-in-out infinite alternate; }
      .fox-tail-r { transform-origin: 82px 88px; animation: foxTailR 2.2s ease-in-out infinite alternate; }
      .fox-ear-l { transform-origin: 42px 34px; animation: foxEarL 3.2s ease-in-out infinite; }
      .fox-ear-r { transform-origin: 78px 34px; animation: foxEarR 3.2s ease-in-out -1.6s infinite; }

      @keyframes foxBlink { 0%, 45%, 49%, 95%, 100% { transform: scaleY(1); } 47%, 97% { transform: scaleY(0.08); } }
      @keyframes foxTailL { 0% { transform: rotate(-6deg); } 100% { transform: rotate(8deg); } }
      @keyframes foxTailR { 0% { transform: rotate(6deg); } 100% { transform: rotate(-8deg); } }
      @keyframes foxEarL { 0%, 86%, 100% { transform: rotate(0deg); } 92% { transform: rotate(-9deg); } }
      @keyframes foxEarR { 0%, 86%, 100% { transform: rotate(0deg); } 92% { transform: rotate(9deg); } }

      @keyframes foxOrbHide {
        0%, 73% { opacity: 1; }
        75%, 95% { opacity: 0; }
        97%, 100% { opacity: 1; }
      }
      @keyframes foxTofu {
        0%, 74% { opacity: 0; transform: scale(0.2); }
        77% { opacity: 1; transform: translateY(-6px) scale(1.15); }
        84% { opacity: 1; transform: translateY(-10px) scale(1.1); }
        86%, 100% { opacity: 0; transform: scale(0.2); }
      }
      @keyframes foxPoof {
        0%, 73% { opacity: 0; transform: scale(0.3); }
        75% { opacity: 0.9; transform: scale(1.4); }
        78% { opacity: 0; transform: scale(0.3); }
        84% { opacity: 0; transform: scale(0.3); }
        86% { opacity: 0.95; transform: scale(1.5); }
        89%, 100% { opacity: 0; transform: scale(0.3); }
      }
      @keyframes foxLeaf {
        0%, 85% { opacity: 0; transform: translateY(-12px) rotate(0deg); }
        87% { opacity: 1; transform: translateY(-10px) rotate(-15deg); }
        92% { opacity: 1; transform: translateY(4px) rotate(25deg); }
        96%, 100% { opacity: 0; transform: translateY(10px) rotate(45deg); }
      }
    </style>
  </defs>

  <g>
    <g class="fox-tail-l">
      <path d="M36 92 C12 96, 6 72, 18 58 C26 62, 32 76, 40 86 Z" fill="url(#foxFur)" stroke="#431407" stroke-width="2"/>
      <path d="M18 58 C12 65, 13 73, 21 74 C24 68, 23 62, 18 58 Z" fill="url(#foxCream)"/>
    </g>

    <g class="fox-tail-r">
      <path d="M84 92 C108 96, 114 72, 102 58 C94 62, 88 76, 80 86 Z" fill="url(#foxFur)" stroke="#431407" stroke-width="2"/>
      <path d="M102 58 C108 65, 107 73, 99 74 C96 68, 97 62, 102 58 Z" fill="url(#foxCream)"/>
    </g>

    <g class="fox-ear-l">
      <path d="M34 42 C24 18, 22 6, 30 8 C40 10, 48 24, 50 34 Z" fill="url(#foxFur)" stroke="#431407" stroke-width="2.2"/>
      <path d="M35 38 C28 22, 27 13, 31 14 C37 16, 43 26, 45 34 Z" fill="url(#foxCream)"/>
      <path d="M27 11 C25 8, 28 7, 32 9 C30 12, 28 12, 27 11 Z" fill="#431407"/>
    </g>

    <g class="fox-ear-r">
      <path d="M86 42 C96 18, 98 6, 90 8 C80 10, 72 24, 70 34 Z" fill="url(#foxFur)" stroke="#431407" stroke-width="2.2"/>
      <path d="M85 38 C92 22, 93 13, 89 14 C83 16, 77 26, 75 34 Z" fill="url(#foxCream)"/>
      <path d="M93 11 C95 8, 92 7, 88 9 C90 12, 92 12, 93 11 Z" fill="#431407"/>
    </g>

    <ellipse cx="60" cy="86" rx="22" ry="18" fill="url(#foxFur)" stroke="#431407" stroke-width="2.2"/>
    <ellipse cx="60" cy="88" rx="14" ry="14" fill="url(#foxCream)"/>

    <path d="M42 73 Q60 80 78 73" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="77" r="4.5" fill="url(#goldG)" stroke="#431407" stroke-width="1.4"/>

    <path d="M30 50 C30 32, 44 26, 60 26 C76 26, 90 32, 90 50 C96 56, 92 66, 84 69 C76 74, 68 75, 60 75 C52 75, 44 74, 36 69 C28 66, 24 56, 30 50 Z" fill="url(#foxFur)" stroke="#431407" stroke-width="2.2"/>
    <path d="M30 55 C38 48, 48 52, 60 52 C72 52, 82 48, 90 55 C88 68, 74 74, 60 74 C46 74, 32 68, 30 55 Z" fill="url(#foxCream)"/>

    <path d="M60 32 C63 37, 62 42, 60 44 C58 42, 57 37, 60 32 Z" fill="#dc2626"/>
    <circle cx="53" cy="39" r="1.8" fill="#dc2626"/>
    <circle cx="67" cy="39" r="1.8" fill="#dc2626"/>

    <g class="fox-blink">
      <ellipse cx="46" cy="52" rx="6.5" ry="7.5" fill="#431407"/>
      <ellipse cx="46" cy="52.5" rx="5.2" ry="6" fill="#ea580c"/>
      <ellipse cx="46" cy="54.5" rx="3.8" ry="3.2" fill="#fde047"/>
      <circle cx="43.5" cy="49" r="2.5" fill="#ffffff"/>
      <circle cx="48.5" cy="55" r="1.2" fill="#ffffff"/>

      <ellipse cx="74" cy="52" rx="6.5" ry="7.5" fill="#431407"/>
      <ellipse cx="74" cy="52.5" rx="5.2" ry="6" fill="#ea580c"/>
      <ellipse cx="74" cy="54.5" rx="3.8" ry="3.2" fill="#fde047"/>
      <circle cx="71.5" cy="49" r="2.5" fill="#ffffff"/>
      <circle cx="76.5" cy="55" r="1.2" fill="#ffffff"/>
    </g>

    <ellipse cx="36" cy="59" rx="4.5" ry="2.3" fill="#fb7185" opacity="0.75"/>
    <ellipse cx="84" cy="59" rx="4.5" ry="2.3" fill="#fb7185" opacity="0.75"/>
    <polygon points="58,56 62,56 60,58.5" fill="#431407"/>
    <path d="M54 60 Q57 63 60 60 Q63 63 66 60" fill="none" stroke="#431407" stroke-width="1.8" stroke-linecap="round"/>
    <polygon points="63,60.5 64.5,63.5 65.5,60.5" fill="#ffffff"/>

    <ellipse cx="46" cy="103" rx="6.5" ry="4" fill="#431407"/>
    <ellipse cx="74" cy="103" rx="6.5" ry="4" fill="#431407"/>

    <g class="orb-hide">
      <path d="M60 76 C68 82, 70 92, 60 96 C50 92, 52 82, 60 76 Z" fill="url(#foxFire)" stroke="#ea580c" stroke-width="1.4"/>
      <circle cx="58" cy="88" r="2.5" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Miếng đậu phụ Inari-zushi biến ra rồi nổ BỤP thành chiếc lá -->
    <g class="tofu-appear">
      <path d="M 48 88 C 48 76, 72 76, 72 88 Z" fill="#f59e0b" stroke="#78350f" stroke-width="1.4"/>
      <ellipse cx="60" cy="88" rx="11" ry="4" fill="#ffffff" stroke="#78350f" stroke-width="1"/>
    </g>
    <g class="leaf-fail">
      <path d="M 52 82 C 56 74, 68 74, 68 82 C 68 88, 56 88, 52 82 Z" fill="#4ade80" stroke="#15803d" stroke-width="1.3"/>
      <line x1="50" y1="82" x2="66" y2="82" stroke="#15803d" stroke-width="1.2"/>
    </g>
    <g class="poof-smoke">
      <circle cx="60" cy="84" r="10" fill="#fffbeb" opacity="0.9"/>
      <circle cx="53" cy="80" r="6" fill="#fed7aa" opacity="0.85"/>
      <circle cx="67" cy="80" r="6" fill="#fed7aa" opacity="0.85"/>
    </g>

    <ellipse cx="47" cy="86" rx="5.5" ry="4.2" fill="url(#foxFur)" stroke="#431407" stroke-width="1.8"/>
    <ellipse cx="73" cy="86" rx="5.5" ry="4.2" fill="url(#foxFur)" stroke="#431407" stroke-width="1.8"/>
  </g>
</svg>
