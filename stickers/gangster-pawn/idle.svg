<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="gpIvory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="gpBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="gpGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="45%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gpCigar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <style>
      /* Chu kỳ 15s: ~11s đứng ngầu, ~4s diễn cảnh móc xì gà - quẹt lửa hỏng - quăng xì gà */
      .cigar { animation: cigarSeq 15s ease-in-out infinite; transform-origin: 74px 66px; }
      .lighter { animation: lighterSeq 15s ease-in-out infinite; }
      .spark { animation: sparkSeq 15s linear infinite; transform-origin: 94px 56px; }
      .smoke { animation: smokeSeq 15s ease-out infinite; }
      .brow { animation: browSeq 15s ease-in-out infinite; transform-origin: 60px 44px; }
      .mouth-cool { animation: mouthCool 15s linear infinite; }
      .mouth-mad { animation: mouthMad 15s linear infinite; }
      .anger { animation: angerSeq 15s ease-out infinite; transform-origin: 84px 26px; }
      .glint { animation: glintSeq 3s ease-in-out infinite; }

      @keyframes cigarSeq {
        0%, 72% { transform: translate(-30px, 40px) rotate(0deg); opacity: 0; }
        75% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
        90% { transform: translate(0, 0) rotate(-4deg); opacity: 1; }
        93% { transform: translate(-14px, -14px) rotate(-60deg); opacity: 1; }
        97% { transform: translate(-60px, 26px) rotate(-320deg); opacity: 1; }
        100% { transform: translate(-70px, 50px) rotate(-400deg); opacity: 0; }
      }
      @keyframes lighterSeq {
        0%, 76% { transform: translate(30px, 40px); opacity: 0; }
        79%, 89% { transform: translate(0, 0); opacity: 1; }
        92%, 100% { transform: translate(30px, 40px); opacity: 0; }
      }
      @keyframes sparkSeq {
        0%, 80% { opacity: 0; transform: scale(0.3); }
        81% { opacity: 1; transform: scale(1.1); }
        82% { opacity: 0; transform: scale(0.4); }
        84% { opacity: 1; transform: scale(0.9); }
        85% { opacity: 0; transform: scale(0.3); }
        87% { opacity: 1; transform: scale(0.7); }
        88%, 100% { opacity: 0; transform: scale(0.3); }
      }
      @keyframes smokeSeq {
        0%, 87% { opacity: 0; transform: translate(0, 0) scale(0.6); }
        89% { opacity: 0.85; transform: translate(2px, -4px) scale(1); }
        93%, 100% { opacity: 0; transform: translate(6px, -16px) scale(1.5); }
      }
      @keyframes browSeq {
        0%, 86% { transform: rotate(0deg) translateY(0); }
        88%, 97% { transform: rotate(0deg) translateY(2.5px); }
        100% { transform: rotate(0deg) translateY(0); }
      }
      @keyframes mouthCool { 0%, 87% { opacity: 1; } 88%, 98% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes mouthMad { 0%, 87% { opacity: 0; } 88%, 98% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes angerSeq {
        0%, 88% { opacity: 0; transform: scale(0.3); }
        90% { opacity: 1; transform: scale(1.2); }
        96% { opacity: 1; transform: scale(1); }
        99%, 100% { opacity: 0; transform: scale(0.6); }
      }
      @keyframes glintSeq {
        0%, 70% { transform: translateX(-10px); opacity: 0; }
        80% { opacity: 1; }
        100% { transform: translateX(26px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Bóng đổ -->
  <ellipse cx="60" cy="110" rx="34" ry="6" fill="#000000" opacity="0.35"/>

  <!-- Đế quân chốt -->
  <ellipse cx="60" cy="103" rx="32" ry="8" fill="url(#gpBase)" stroke="#374151" stroke-width="1.5"/>
  <rect x="30" y="94" width="60" height="9" rx="4" fill="url(#gpIvory)" stroke="#374151" stroke-width="1.5"/>

  <!-- Thân chốt -->
  <path d="M 38 95 C 40 80, 46 70, 50 64 L 70 64 C 74 70, 80 80, 82 95 Z" fill="url(#gpIvory)" stroke="#374151" stroke-width="1.6"/>
  <!-- Cổ áo vest gangster + dây chuyền vàng -->
  <path d="M 44 86 C 50 80, 56 78, 60 84 C 64 78, 70 80, 76 86 L 80 95 L 40 95 Z" fill="#111827" stroke="#030712" stroke-width="1.2"/>
  <path d="M 56 82 L 60 92 L 64 82 Z" fill="#f9fafb"/>
  <path d="M 47 80 Q 60 90 73 80" fill="none" stroke="#d1d5db" stroke-width="2" stroke-dasharray="2 1.5"/>
  <circle cx="60" cy="88" r="3" fill="#e5e7eb" stroke="#6b7280" stroke-width="0.8"/>

  <!-- Vành cổ chốt -->
  <ellipse cx="60" cy="64" rx="15" ry="4.5" fill="url(#gpIvory)" stroke="#374151" stroke-width="1.5"/>

  <!-- Đầu chốt -->
  <circle cx="60" cy="42" r="21" fill="url(#gpIvory)" stroke="#374151" stroke-width="1.6"/>

  <!-- Mũ phớt Fedora gangster -->
  <path d="M 34 30 Q 60 36 86 30 Q 88 34 84 35 Q 60 40 36 35 Q 32 34 34 30 Z" fill="#111827" stroke="#030712" stroke-width="1"/>
  <path d="M 42 31 C 42 18, 50 13, 60 14 C 70 13, 78 18, 78 31 Q 60 35 42 31 Z" fill="#1f2937" stroke="#030712" stroke-width="1.2"/>
  <path d="M 42 28 Q 60 32 78 28 L 78 31 Q 60 35 42 31 Z" fill="#9ca3af"/>
  <path d="M 52 15 Q 60 20 68 15" fill="none" stroke="#030712" stroke-width="1.2"/>

  <!-- Lông mày cau có -->
  <g class="brow">
    <path d="M 44 37 L 56 40" stroke="#111827" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 76 37 L 64 40" stroke="#111827" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- Kính đen gangster -->
  <path d="M 41 42 L 79 42" stroke="#030712" stroke-width="2.2"/>
  <path d="M 42 42 L 57 42 L 56 49 Q 50 52 44 49 Z" fill="url(#gpGlass)" stroke="#030712" stroke-width="1.2"/>
  <path d="M 63 42 L 78 42 L 76 49 Q 70 52 64 49 Z" fill="url(#gpGlass)" stroke="#030712" stroke-width="1.2"/>
  <!-- Ánh lóe trên kính -->
  <g class="glint">
    <path d="M 46 43 L 49 43 L 46 48 L 44 48 Z" fill="#ffffff" opacity="0.75"/>
  </g>
  <path d="M 66 43.5 L 69 43.5 L 67 46.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

  <!-- Miệng: nhếch mép ngầu / mặt cáu -->
  <path class="mouth-cool" d="M 54 56 Q 60 58 67 54" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/>
  <path class="mouth-mad" d="M 54 57 Q 60 53 67 57" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Vết sẹo chéo -->
  <path d="M 72 52 L 76 57 M 73 56 L 75 53" stroke="#6b7280" stroke-width="1" stroke-linecap="round"/>

  <!-- XÌ GÀ (xuất hiện mỗi 15s, bị quăng đi) -->
  <g class="cigar">
    <rect x="66" y="54" width="22" height="5" rx="2.5" fill="url(#gpCigar)" stroke="#1c0a00" stroke-width="0.8"/>
    <rect x="70" y="54" width="4" height="5" fill="#dc2626"/>
    <circle cx="88" cy="56.5" r="2.5" fill="#57534e"/>
  </g>

  <!-- HỘT QUẸT ZIPPO -->
  <g class="lighter">
    <rect x="90" y="60" width="9" height="13" rx="1.5" fill="#d1d5db" stroke="#374151" stroke-width="1"/>
    <rect x="90" y="56" width="9" height="5" rx="1" fill="#9ca3af" stroke="#374151" stroke-width="1"/>
    <!-- Bàn tay nhỏ cầm hột quẹt -->
    <ellipse cx="95" cy="72" rx="6" ry="4" fill="url(#gpIvory)" stroke="#374151" stroke-width="1"/>
  </g>
  <!-- Tia lửa tạch tạch không cháy -->
  <g class="spark">
    <path d="M 94 56 L 92 50 M 94 56 L 98 51 M 94 56 L 90 54 M 94 56 L 99 55" stroke="#fde047" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="94" cy="55" r="1.4" fill="#ffffff"/>
  </g>
  <!-- Khói xịt -->
  <g class="smoke">
    <circle cx="95" cy="50" r="3" fill="#9ca3af"/>
    <circle cx="99" cy="47" r="2.2" fill="#d1d5db"/>
  </g>
  <!-- Dấu tức giận -->
  <g class="anger">
    <path d="M 80 22 Q 84 26 80 30 M 88 22 Q 84 26 88 30 M 80 22 Q 84 18 88 22 M 80 30 Q 84 34 88 30" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
