<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gpDnIvory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="gpDnBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="gpDnGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="45%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gpDnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <style>
      .gpDnSwagger { transform-origin: 60px 105px; animation: gpDnBounce 2.2s ease-in-out infinite; }
      .gpDnCrown { transform-origin: 60px 24px; animation: gpDnCrownBob 2.2s ease-in-out infinite alternate; }
      .gpDnGlint { animation: gpDnShine 2.6s ease-in-out infinite; }
      .gpDnGG { transform-origin: 96px 26px; animation: gpDnFloatGG 2.4s ease-in-out infinite; }
      .gpDnSpark1 { transform-origin: 20px 28px; animation: gpDnTwinkle 2.2s ease-in-out infinite; }
      .gpDnSpark2 { transform-origin: 100px 64px; animation: gpDnTwinkle 2.2s ease-in-out -1.1s infinite; }
      .gpDnSpark3 { transform-origin: 24px 66px; animation: gpDnTwinkle 2.5s ease-in-out -0.6s infinite; }

      @keyframes gpDnBounce {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes gpDnCrownBob {
        0% { transform: rotate(-6deg) translateY(0px); }
        100% { transform: rotate(4deg) translateY(-2px); }
      }
      @keyframes gpDnShine {
        0%, 60% { transform: translateX(-8px); opacity: 0; }
        75% { opacity: 0.9; }
        100% { transform: translateX(24px); opacity: 0; }
      }
      @keyframes gpDnFloatGG {
        0%, 100% { transform: translateY(0px) rotate(-6deg) scale(0.96); }
        50% { transform: translateY(-5px) rotate(4deg) scale(1.08); }
      }
      @keyframes gpDnTwinkle {
        0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.45; }
        50% { transform: scale(1.2) rotate(30deg); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Shadow -->
  <ellipse cx="60" cy="111" rx="34" ry="6" fill="#000000" opacity="0.32"/>

  <g class="gpDnSwagger">
    <!-- Base -->
    <ellipse cx="60" cy="104" rx="32" ry="8" fill="url(#gpDnBase)" stroke="#374151" stroke-width="1.5"/>
    <rect x="30" y="95" width="60" height="9" rx="4" fill="url(#gpDnIvory)" stroke="#374151" stroke-width="1.5"/>

    <!-- Body and vest with gold chain -->
    <path d="M38 96 C40 81, 46 71, 50 65 L70 65 C74 71, 80 81, 82 96 Z" fill="url(#gpDnIvory)" stroke="#374151" stroke-width="1.6"/>
    <path d="M44 87 C50 81, 56 79, 60 85 C64 79, 70 81, 76 87 L80 96 L40 96 Z" fill="#111827" stroke="#030712" stroke-width="1.2"/>
    <path d="M56 83 L60 93 L64 83 Z" fill="#f9fafb"/>
    <path d="M47 81 Q60 91 73 81" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="2.5 1.5"/>
    <circle cx="60" cy="89" r="3.4" fill="url(#gpDnGold)" stroke="#78350f" stroke-width="0.9"/>

    <!-- Neck collar -->
    <ellipse cx="60" cy="65" rx="15" ry="4.5" fill="url(#gpDnIvory)" stroke="#374151" stroke-width="1.5"/>

    <!-- Head -->
    <circle cx="60" cy="44" r="21" fill="url(#gpDnIvory)" stroke="#374151" stroke-width="1.6"/>

    <!-- Gleaming gold king/queen promotion crown -->
    <g class="gpDnCrown">
      <path d="M40 28 L43 12 L52 21 L60 9 L68 21 L77 12 L80 28 Z" fill="url(#gpDnGold)" stroke="#78350f" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="40" y="26" width="40" height="6" rx="2.5" fill="url(#gpDnGold)" stroke="#78350f" stroke-width="1.4"/>
      <circle cx="43" cy="11" r="2.2" fill="#fef08a" stroke="#78350f" stroke-width="0.9"/>
      <circle cx="60" cy="8" r="2.6" fill="#fef08a" stroke="#78350f" stroke-width="0.9"/>
      <circle cx="77" cy="11" r="2.2" fill="#fef08a" stroke="#78350f" stroke-width="0.9"/>
      <circle cx="60" cy="29" r="2" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.7"/>
      <circle cx="49" cy="29" r="1.5" fill="#38bdf8" stroke="#0c4a6e" stroke-width="0.6"/>
      <circle cx="71" cy="29" r="1.5" fill="#38bdf8" stroke="#0c4a6e" stroke-width="0.6"/>
    </g>

    <!-- Cool shades with gleaming shine -->
    <g>
      <path d="M41 44 L79 44" stroke="#030712" stroke-width="2.2"/>
      <path d="M42 44 L57 44 L56 51 Q50 54 44 51 Z" fill="url(#gpDnGlass)" stroke="#030712" stroke-width="1.2"/>
      <path d="M63 44 L78 44 L76 51 Q70 54 64 51 Z" fill="url(#gpDnGlass)" stroke="#030712" stroke-width="1.2"/>
      <g class="gpDnGlint">
        <path d="M46 45 L49.5 45 L46.5 50 L44 50 Z" fill="#ffffff" opacity="0.8"/>
      </g>
      <path d="M66 45.5 L69 45.5 L67 48.5" fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.7"/>
    </g>

    <!-- Triumphant toothy smirk -->
    <path d="M51 56 Q60 63 69 55 Z" fill="#ffffff" stroke="#111827" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M72 54 L76 58 M73 57.5 L75 54.5" stroke="#6b7280" stroke-width="1" stroke-linecap="round"/>

    <!-- Confident thumbs-up hand -->
    <g transform="translate(88, 78)">
      <ellipse cx="0" cy="4" rx="6" ry="5" fill="url(#gpDnIvory)" stroke="#374151" stroke-width="1.3"/>
      <path d="M-2 0 L-2 -7 C-2 -9.5, 2 -9.5, 2 -7 L2 0" fill="url(#gpDnIvory)" stroke="#374151" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Floating GG! badge -->
  <g class="gpDnGG">
    <rect x="81" y="13" width="33" height="20" rx="7" fill="#111827" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="97.5" y="27" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="11.5" font-weight="900" fill="#fde047">GG!</text>
  </g>

  <!-- Gold sparkles -->
  <path class="gpDnSpark1" d="M20 22 L21.8 26.2 L26 28 L21.8 29.8 L20 34 L18.2 29.8 L14 28 L18.2 26.2 Z" fill="#fde047" stroke="#b45309" stroke-width="0.8"/>
  <path class="gpDnSpark2" d="M100 58 L101.6 62.4 L106 64 L101.6 65.6 L100 70 L98.4 65.6 L94 64 L98.4 62.4 Z" fill="#fde047" stroke="#b45309" stroke-width="0.8"/>
  <path class="gpDnSpark3" d="M24 62 L25.2 64.8 L28 66 L25.2 67.2 L24 70 L22.8 67.2 L20 66 L22.8 64.8 Z" fill="#fef08a" stroke="#d97706" stroke-width="0.7"/>
</svg>
