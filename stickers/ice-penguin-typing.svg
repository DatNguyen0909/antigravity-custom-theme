<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ipBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="ipBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="ipHat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ipScarf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <style>
      /* Cánh cụt lạch bạch vỗ cánh tung hứng 3 chú cá bạc lấp lánh dưới tuyết rơi! */
      .ip-waddle { transform-origin: 60px 104px; animation: ipWaddle 0.5s ease-in-out infinite alternate; }
      .ip-wingL { transform-origin: 32px 66px; animation: ipFlapL 0.35s ease-in-out infinite alternate; }
      .ip-wingR { transform-origin: 88px 66px; animation: ipFlapR 0.35s ease-in-out infinite alternate; }
      .ip-fish1 { animation: ipJuggle1 1.2s ease-in-out infinite; }
      .ip-fish2 { animation: ipJuggle2 1.2s ease-in-out infinite; }
      .ip-fish3 { animation: ipJuggle3 1.2s ease-in-out infinite; }

      @keyframes ipWaddle { 0% { transform: rotate(-6deg); } 100% { transform: rotate(6deg); } }
      @keyframes ipFlapL { 0% { transform: rotate(-10deg); } 100% { transform: rotate(35deg); } }
      @keyframes ipFlapR { 0% { transform: rotate(10deg); } 100% { transform: rotate(-35deg); } }
      @keyframes ipJuggle1 {
        0%, 100% { transform: translate(16px, 56px) rotate(-25deg); }
        33% { transform: translate(60px, 6px) rotate(120deg); }
        66% { transform: translate(102px, 56px) rotate(240deg); }
      }
      @keyframes ipJuggle2 {
        0%, 100% { transform: translate(60px, 6px) rotate(120deg); }
        33% { transform: translate(102px, 56px) rotate(240deg); }
        66% { transform: translate(16px, 56px) rotate(360deg); }
      }
      @keyframes ipJuggle3 {
        0%, 100% { transform: translate(102px, 56px) rotate(240deg); }
        33% { transform: translate(16px, 56px) rotate(360deg); }
        66% { transform: translate(60px, 6px) rotate(480deg); }
      }
    </style>
  </defs>

  <g class="ip-waddle">
    <!-- Cánh vẫy tung hứng cá -->
    <g class="ip-wingL">
      <path d="M30 62 C14 64, 12 82, 24 88 C30 86, 34 74, 33 66 Z" fill="url(#ipBack)" stroke="#0f172a" stroke-width="2"/>
    </g>
    <g class="ip-wingR">
      <path d="M90 62 C106 64, 108 82, 96 88 C90 86, 86 74, 87 66 Z" fill="url(#ipBack)" stroke="#0f172a" stroke-width="2"/>
    </g>

    <!-- Thân cánh cụt -->
    <path d="M31 60 C29 34, 42 24, 60 24 C78 24, 91 34, 89 60 C91 88, 78 104, 60 104 C42 104, 29 88, 31 60 Z" fill="url(#ipBack)" stroke="#0f172a" stroke-width="2.2"/>
    <path d="M36 52 C36 39, 52 40, 60 47 C68 40, 84 39, 84 52 C86 78, 76 101, 60 101 C44 101, 34 78, 36 52 Z" fill="url(#ipBelly)"/>

    <!-- Mũ len xanh -->
    <circle cx="60" cy="14" r="7" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.6"/>
    <path d="M33 34 C35 18, 46 14, 60 14 C74 14, 85 18, 87 34 Z" fill="url(#ipHat)" stroke="#0f172a" stroke-width="2"/>
    <rect x="30" y="29" width="60" height="9.5" rx="4.5" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>

    <!-- Mắt cười hớn hở nhìn lên theo đàn cá -->
    <ellipse cx="46" cy="52" rx="5.5" ry="6.5" fill="#0f172a"/>
    <circle cx="46" cy="49.5" r="2.5" fill="#ffffff"/>
    <ellipse cx="74" cy="52" rx="5.5" ry="6.5" fill="#0f172a"/>
    <circle cx="74" cy="49.5" r="2.5" fill="#ffffff"/>
    <ellipse cx="36" cy="59" rx="4.5" ry="2.3" fill="#fb7185" opacity="0.8"/>
    <ellipse cx="84" cy="59" rx="4.5" ry="2.3" fill="#fb7185" opacity="0.8"/>
    <!-- Mỏ mở vui vẻ -->
    <ellipse cx="60" cy="58" rx="6" ry="4.2" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
    <path d="M 55 58 Q 60 62 65 58" fill="#dc2626"/>

    <!-- Khăn choàng đỏ -->
    <path d="M33 67 Q60 75 87 67 Q89 75 85 77 Q60 84 35 77 Q31 75 33 67 Z" fill="url(#ipScarf)" stroke="#881337" stroke-width="2"/>
    <path d="M70 74 L77 92 L66 93 L63 75 Z" fill="url(#ipScarf)" stroke="#881337" stroke-width="1.8" stroke-linejoin="round"/>
    <ellipse cx="46" cy="104" rx="7.5" ry="4" fill="#f59e0b" stroke="#78350f" stroke-width="1.8"/>
    <ellipse cx="74" cy="104" rx="7.5" ry="4" fill="#f59e0b" stroke="#78350f" stroke-width="1.8"/>
  </g>

  <!-- 3 chú cá tuyết bạc bay vòng tung hứng -->
  <g class="ip-fish1">
    <ellipse cx="0" cy="0" rx="8" ry="4.2" fill="#bae6fd" stroke="#0369a1" stroke-width="1.3"/>
    <polygon points="7,0 13,-4.5 13,4.5" fill="#38bdf8" stroke="#0369a1" stroke-width="1.1"/>
    <circle cx="-4" cy="-1" r="1.2" fill="#0f172a"/>
  </g>
  <g class="ip-fish2">
    <ellipse cx="0" cy="0" rx="8" ry="4.2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <polygon points="7,0 13,-4.5 13,4.5" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.1"/>
    <circle cx="-4" cy="-1" r="1.2" fill="#0f172a"/>
  </g>
  <g class="ip-fish3">
    <ellipse cx="0" cy="0" rx="8" ry="4.2" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.3"/>
    <polygon points="7,0 13,-4.5 13,4.5" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.1"/>
    <circle cx="-4" cy="-1" r="1.2" fill="#0f172a"/>
  </g>
</svg>
