<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <!-- Clean clip at y=71 so zero chat text is overlapped -->
    <clipPath id="sh-clip">
      <rect x="0" y="0" width="260" height="71"/>
    </clipPath>

    <!-- Ocean atmosphere and sunlit god-rays -->
    <linearGradient id="sh-sky-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.16"/>
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="sh-godray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#7dd3fc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Shark gradients -->
    <linearGradient id="sh-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="sh-belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Layered ocean swell wave gradients -->
    <linearGradient id="sh-wave-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="sh-wave-mid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="sh-wave-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.96"/>
    </linearGradient>

    <style>
      /* Sunlit god-rays gentle shimmer */
      .sh-rays { animation: shRayShimmer 4.2s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }

      /* Tiny background fish: linear X + decoupled sine Y */
      .sh-fish1-x { animation: shFishSwimR 6.4s linear infinite; }
      .sh-fish1-y { animation: shFishBob 1.3s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .sh-fish2-x { animation: shFishSwimL 5.6s linear -2.2s infinite; }
      .sh-fish2-y { animation: shFishBob 1.1s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate-reverse; }

      /* Rising sparkling bubbles */
      .sh-bub1 { animation: shBubbleRise 2.6s linear infinite; }
      .sh-bub2 { animation: shBubbleRise 3.1s linear -1.1s infinite; }
      .sh-bub3 { animation: shBubbleRise 2.4s linear -1.9s infinite; }

      /* Phase 1 (0% - 46%): Dorsal fin stalks smoothly right-to-left (linear X + decoupled sine bob) */
      .sh-fin-x { animation: shFinTravel 3.6s linear infinite; }
      .sh-fin-y { animation: shFinBob 0.72s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }

      /* Phase 2 (44% - 92%): Breaching shark leap (linear X + true parabolic Y + linear pitch rotation) */
      .sh-breach-x { animation: shSharkX 3.6s linear infinite; }
      .sh-breach-y { animation: shSharkY 3.6s linear infinite; }
      .sh-breach-rot {
        animation: shSharkRot 3.6s linear infinite;
        transform-origin: 65px 46px;
      }
      .sh-tail {
        animation: shTailSwim 0.24s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
        transform-origin: 25px 46px;
      }

      /* Foam splashes on breach (x=72) and dive (x=196) */
      .sh-splash-jump {
        animation: shSplashUp 3.6s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
        transform-origin: 72px 68px;
      }
      .sh-splash-dive {
        animation: shSplashDown 3.6s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
        transform-origin: 196px 68px;
      }

      /* 3 layered ocean swell waves */
      .sh-wave-d { animation: shWaveSlideD 2.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .sh-wave-m { animation: shWaveSlideM 1.9s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .sh-wave-f { animation: shWaveSlideF 1.5s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }

      @keyframes shRayShimmer {
        0% { transform: translateX(-6px); opacity: 0.65; }
        100% { transform: translateX(8px); opacity: 1; }
      }
      @keyframes shFishSwimR {
        0% { transform: translateX(-20px); }
        100% { transform: translateX(280px); }
      }
      @keyframes shFishSwimL {
        0% { transform: translateX(280px); }
        100% { transform: translateX(-20px); }
      }
      @keyframes shFishBob {
        0% { transform: translateY(-2.5px); }
        100% { transform: translateY(2.5px); }
      }
      @keyframes shBubbleRise {
        0% { transform: translateY(0px) scale(0.7); opacity: 0; }
        18% { opacity: 0.85; }
        85% { opacity: 0.65; }
        100% { transform: translateY(-34px) scale(1.15); opacity: 0; }
      }

      @keyframes shFinTravel {
        0% { transform: translate(222px, 52px); opacity: 0; }
        5% { transform: translate(205px, 49px); opacity: 1; }
        42% { transform: translate(74px, 49px); opacity: 1; }
        47% { transform: translate(58px, 68px); opacity: 0; }
        100% { transform: translate(58px, 68px); opacity: 0; }
      }
      @keyframes shFinBob {
        0% { transform: translateY(-2px) rotate(-3deg); }
        100% { transform: translateY(2px) rotate(3deg); }
      }

      @keyframes shSharkX {
        0%, 42% { transform: translateX(18px); opacity: 0; }
        45% { transform: translateX(28px); opacity: 1; }
        89% { transform: translateX(168px); opacity: 1; }
        93%, 100% { transform: translateX(180px); opacity: 0; }
      }
      @keyframes shSharkY {
        0%, 42% { transform: translateY(72px); animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1); }
        67% { transform: translateY(-16px); animation-timing-function: cubic-bezier(0.55, 0.06, 0.68, 0.19); }
        93%, 100% { transform: translateY(76px); }
      }
      @keyframes shSharkRot {
        0%, 42% { transform: rotate(-44deg) scale(0.86); }
        67% { transform: rotate(2deg) scale(1.06); }
        93%, 100% { transform: rotate(48deg) scale(0.86); }
      }

      @keyframes shTailSwim {
        0% { transform: rotate(-16deg); }
        100% { transform: rotate(16deg); }
      }
      @keyframes shSplashUp {
        0%, 42% { transform: scale(0.2); opacity: 0; }
        48% { transform: scale(1.15); opacity: 1; }
        62% { transform: translateY(-10px) scale(1.35); opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes shSplashDown {
        0%, 84% { transform: scale(0.2); opacity: 0; }
        90% { transform: scale(1.2); opacity: 1; }
        99% { transform: translateY(-8px) scale(1.4); opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes shWaveSlideD {
        0% { transform: translateX(-8px); }
        100% { transform: translateX(8px); }
      }
      @keyframes shWaveSlideM {
        0% { transform: translateX(7px); }
        100% { transform: translateX(-7px); }
      }
      @keyframes shWaveSlideF {
        0% { transform: translateX(-6px); }
        100% { transform: translateX(6px); }
      }
    </style>
  </defs>

  <g clip-path="url(#sh-clip)">
    <!-- SUNLIT OCEAN ATMOSPHERE -->
    <rect x="0" y="0" width="260" height="71" rx="8" fill="url(#sh-sky-glow)"/>

    <!-- SUNLIT GOD-RAYS -->
    <g class="sh-rays">
      <polygon points="36,0 56,0 32,71 10,71" fill="url(#sh-godray)"/>
      <polygon points="104,0 132,0 102,71 76,71" fill="url(#sh-godray)"/>
      <polygon points="184,0 208,0 182,71 158,71" fill="url(#sh-godray)"/>
      <polygon points="236,0 254,0 232,71 214,71" fill="url(#sh-godray)"/>
    </g>

    <!-- TINY SWIMMING BACKGROUND FISH -->
    <g class="sh-fish1-x" opacity="0.72">
      <g class="sh-fish1-y" transform="translate(0, 46)">
        <path d="M 0 0 L -5 -3 L -5 3 Z" fill="#fb923c"/>
        <ellipse cx="4" cy="0" rx="5" ry="2.6" fill="#fdba74"/>
        <circle cx="6.5" cy="-0.6" r="0.7" fill="#0f172a"/>
        <!-- Second tiny companion fish -->
        <g transform="translate(-14, 7) scale(0.75)">
          <path d="M 0 0 L -5 -3 L -5 3 Z" fill="#38bdf8"/>
          <ellipse cx="4" cy="0" rx="5" ry="2.6" fill="#7dd3fc"/>
        </g>
      </g>
    </g>
    <g class="sh-fish2-x" opacity="0.65">
      <g class="sh-fish2-y" transform="translate(0, 38)">
        <g transform="scale(-1, 1)">
          <path d="M 0 0 L -5 -3 L -5 3 Z" fill="#facc15"/>
          <ellipse cx="4" cy="0" rx="4.6" ry="2.4" fill="#fde047"/>
          <circle cx="6.2" cy="-0.5" r="0.65" fill="#0f172a"/>
        </g>
      </g>
    </g>

    <!-- CORAL REEF SILHOUETTES ALONG Y=58..71 -->
    <g opacity="0.55" fill="#075985">
      <path d="M 10 71 C 10 64, 13 60, 16 58 C 17 61, 16 64, 18 65 C 20 62, 22 57, 25 56 C 26 60, 25 65, 28 71 Z"/>
      <path d="M 118 71 C 118 65, 122 61, 125 60 C 127 63, 128 65, 131 61 C 134 58, 137 60, 138 64 C 141 62, 144 64, 145 71 Z"/>
      <path d="M 218 71 C 219 64, 223 59, 226 57 C 228 61, 228 64, 231 62 C 234 59, 238 61, 239 65 C 242 63, 246 65, 248 71 Z"/>
    </g>

    <!-- RISING SPARKLING BUBBLES -->
    <g fill="none" stroke="#e0f2fe" stroke-width="0.9">
      <g class="sh-bub1">
        <circle cx="42" cy="64" r="2.2" fill="#ffffff" fill-opacity="0.28"/>
        <circle cx="152" cy="66" r="1.6" fill="#ffffff" fill-opacity="0.24"/>
      </g>
      <g class="sh-bub2">
        <circle cx="104" cy="65" r="1.9" fill="#ffffff" fill-opacity="0.26"/>
        <circle cx="222" cy="64" r="2.3" fill="#ffffff" fill-opacity="0.28"/>
      </g>
      <g class="sh-bub3">
        <circle cx="182" cy="66" r="1.5" fill="#ffffff" fill-opacity="0.25"/>
        <circle cx="68" cy="65" r="1.8" fill="#ffffff" fill-opacity="0.25"/>
      </g>
    </g>

    <!-- DEEP OCEAN SWELL WAVE (LAYER 1) -->
    <g class="sh-wave-d">
      <path d="M -20 71 Q 12 58 44 66 T 108 64 T 172 66 T 236 63 T 280 66 L 280 76 L -20 76 Z" fill="url(#sh-wave-deep)"/>
    </g>

    <!-- MID OCEAN SWELL WAVE (LAYER 2) -->
    <g class="sh-wave-m">
      <path d="M -15 72 Q 10 60 35 68 T 85 66 T 135 68 T 185 65 T 235 68 T 275 66 L 275 76 L -15 76 Z" fill="url(#sh-wave-mid)"/>
    </g>

    <!-- PHASE 1: DORSAL FIN STALKING RIGHT-TO-LEFT -->
    <g class="sh-fin-x">
      <g class="sh-fin-y">
        <path d="M 0 22 C 2 8, 12 -2, 22 -4 C 17 5, 16 14, 18 22 Z" fill="url(#sh-body)" stroke="#0c4a6e" stroke-width="1.6"/>
        <path d="M 5 18 C 7 10, 12 4, 17 1" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round"/>
        <!-- White parting wake foam -->
        <path d="M -8 20 Q 4 14 14 20 Q 24 16 32 21" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="-10" cy="15" r="2" fill="#e0f2fe"/>
        <circle cx="26" cy="14" r="2.4" fill="#ffffff"/>
        <circle cx="34" cy="17" r="1.6" fill="#bae6fd"/>
      </g>
    </g>

    <!-- BREACH SPLASH COLUMN (X=72) -->
    <g class="sh-splash-jump">
      <path d="M 72 68 C 60 52, 50 44, 44 48 M 72 68 C 66 46, 62 36, 56 38 M 72 68 C 78 46, 84 36, 90 38 M 72 68 C 84 52, 94 44, 100 48" fill="none" stroke="#e0f2fe" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="48" cy="42" r="3" fill="#ffffff"/>
      <circle cx="62" cy="32" r="2.5" fill="#7dd3fc"/>
      <circle cx="84" cy="32" r="2.8" fill="#ffffff"/>
      <circle cx="96" cy="42" r="2.2" fill="#bae6fd"/>
      <circle cx="72" cy="28" r="1.8" fill="#ffffff"/>
    </g>

    <!-- PHASE 2: BREACHING CHIBI SHARK LEAPING LEFT-TO-RIGHT -->
    <g class="sh-breach-x">
      <g class="sh-breach-y">
        <g class="sh-breach-rot">
          <!-- Thrashing tail -->
          <g class="sh-tail">
            <path d="M 28 46 C 16 36, 6 24, 2 18 C 7 29, 11 38, 14 46 C 11 54, 7 62, 4 70 C 9 64, 18 55, 28 46 Z" fill="url(#sh-body)" stroke="#0c4a6e" stroke-width="1.4"/>
          </g>
          <!-- Iconic dorsal fin -->
          <path d="M 52 31 C 50 15, 42 7, 36 5 C 39 14, 40 23, 38 32 Z" fill="url(#sh-body)" stroke="#0c4a6e" stroke-width="1.4"/>
          <!-- Far pectoral fin -->
          <path d="M 72 52 C 78 60, 84 64, 88 63 C 85 57, 80 52, 76 50 Z" fill="#0369a1" stroke="#0c4a6e" stroke-width="1.2"/>
          <!-- Sleek shark body -->
          <path d="M 22 46 C 34 31, 58 26, 80 31 C 94 34, 104 40, 108 46 C 104 54, 92 60, 76 61 C 56 62, 34 55, 22 46 Z" fill="url(#sh-body)" stroke="#0c4a6e" stroke-width="1.5"/>
          <!-- Bright white belly -->
          <path d="M 32 50 C 46 50, 64 49, 80 46 C 90 44, 98 46, 104 49 C 96 57, 82 61, 66 61 C 50 61, 38 56, 32 50 Z" fill="url(#sh-belly)"/>
          <!-- 3 gill slits -->
          <path d="M 70 39 Q 68 44 70 49 M 74 40 Q 72 44 74 48 M 78 41 Q 76 44 78 47" fill="none" stroke="#0c4a6e" stroke-width="1.4" stroke-linecap="round"/>
          <!-- Big anime eye -->
          <ellipse cx="89" cy="40" rx="4.5" ry="4.8" fill="#082f49"/>
          <ellipse cx="89" cy="40" rx="3.3" ry="3.6" fill="#0284c7"/>
          <circle cx="90.5" cy="38.5" r="1.7" fill="#ffffff"/>
          <circle cx="87.5" cy="41.8" r="0.9" fill="#bae6fd"/>
          <!-- Rosy cheek -->
          <ellipse cx="84" cy="45.5" rx="3" ry="1.6" fill="#f43f5e" opacity="0.55"/>
          <!-- Cool toothy grin -->
          <path d="M 90 48 Q 97 52 103 47" fill="none" stroke="#082f49" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M 92 49 L 93.5 52 L 95 49.5 L 96.5 52 L 98 49.5" fill="#ffffff" stroke="#082f49" stroke-width="0.7"/>
          <!-- Near pectoral fin -->
          <path d="M 62 52 C 56 63, 48 69, 43 68 C 46 60, 50 53, 55 50 Z" fill="url(#sh-body)" stroke="#0c4a6e" stroke-width="1.4"/>
          <!-- Sparkling water droplets trailing the leap -->
          <circle cx="46" cy="20" r="2" fill="#e0f2fe"/>
          <circle cx="98" cy="26" r="2.5" fill="#ffffff"/>
          <circle cx="30" cy="30" r="1.5" fill="#bae6fd"/>
        </g>
      </g>
    </g>

    <!-- DIVE SPLASH COLUMN (X=196) -->
    <g class="sh-splash-dive">
      <path d="M 196 68 C 184 50, 174 42, 168 46 M 196 68 C 190 46, 186 34, 180 36 M 196 68 C 202 46, 208 34, 214 36 M 196 68 C 208 50, 218 42, 224 46" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="176" cy="36" r="2.8" fill="#ffffff"/>
      <circle cx="212" cy="34" r="3" fill="#7dd3fc"/>
      <circle cx="222" cy="42" r="2.2" fill="#e0f2fe"/>
      <circle cx="196" cy="28" r="1.9" fill="#ffffff"/>
    </g>

    <!-- FOREGROUND OCEAN SWELL WAVE WITH FOAM CREST (LAYER 3) -->
    <g class="sh-wave-f">
      <path d="M -15 72 Q 15 62 45 69 T 105 67 T 165 69 T 225 66 T 275 69 L 275 76 L -15 76 Z" fill="url(#sh-wave-front)"/>
      <path d="M -10 70 Q 15 63 45 69 T 105 67 T 165 69 T 225 66 T 270 69" fill="none" stroke="#e0f2fe" stroke-width="1.9" stroke-linecap="round" opacity="0.9"/>
      <circle cx="24" cy="67" r="1.3" fill="#ffffff" opacity="0.8"/>
      <circle cx="118" cy="68" r="1.5" fill="#ffffff" opacity="0.85"/>
      <circle cx="204" cy="67" r="1.2" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>
</svg>
