<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shkThSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shkThBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="shkThFin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="shkThGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.32"/>
    </linearGradient>
    <style>
      .shkThTail { transform-origin: 78px 92px; animation: shkThTailWag 2.2s ease-in-out infinite alternate; }
      .shkThFinL { transform-origin: 34px 72px; animation: shkThFinL 2.2s ease-in-out infinite alternate; }
      .shkThFinR { transform-origin: 84px 72px; animation: shkThFinR 2.6s ease-in-out infinite alternate; }
      .shkThBlink { transform-origin: 60px 49px; animation: shkThBlink 3.5s infinite; }
      .shkThWave1 { transform-origin: 60px 48px; animation: shkThSonar 2.6s ease-out infinite; }
      .shkThWave2 { transform-origin: 60px 48px; animation: shkThSonar 2.6s ease-out -0.86s infinite; }
      .shkThWave3 { transform-origin: 60px 48px; animation: shkThSonar 2.6s ease-out -1.72s infinite; }
      .shkThBub { animation: shkThBubbleUp 2.4s ease-out infinite; }

      @keyframes shkThTailWag { 0% { transform: rotate(-6deg); } 100% { transform: rotate(8deg); } }
      @keyframes shkThFinL { 0% { transform: rotate(-5deg); } 100% { transform: rotate(8deg); } }
      @keyframes shkThFinR { 0% { transform: rotate(0deg); } 100% { transform: rotate(-8deg); } }
      @keyframes shkThBlink { 0%, 45%, 49%, 95%, 100% { transform: scaleY(1); } 47%, 97% { transform: scaleY(0.1); } }
      @keyframes shkThSonar {
        0% { transform: scale(0.55); opacity: 0.9; }
        100% { transform: scale(1.45); opacity: 0; }
      }
      @keyframes shkThBubbleUp {
        0% { transform: translateY(4px) scale(0.6); opacity: 0; }
        30% { opacity: 0.9; }
        100% { transform: translateY(-14px) scale(1.1); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Concentric cyan sonar waves -->
  <g fill="none" stroke="#22d3ee" stroke-linecap="round">
    <circle class="shkThWave1" cx="60" cy="48" r="36" stroke-width="2.2" stroke-dasharray="18 10"/>
    <circle class="shkThWave2" cx="60" cy="48" r="36" stroke-width="1.8" stroke-dasharray="14 12"/>
    <circle class="shkThWave3" cx="60" cy="48" r="36" stroke-width="1.4" stroke-dasharray="10 14"/>
  </g>

  <g>
    <!-- Tail and dorsal fin -->
    <path class="shkThTail" d="M78 88 C94 84, 102 74, 108 60 C108 74, 104 86, 96 92 C104 96, 110 102, 110 110 C100 106, 90 100, 78 96 Z" fill="url(#shkThSkin)" stroke="#082f49" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M50 26 C48 8, 58 3, 68 4 C64 11, 65 15, 70 17 C67 20, 68 24, 70 26 Z" fill="url(#shkThFin)" stroke="#082f49" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Snorkel tube -->
    <path d="M90 50 L96 50 Q101 50 101 44 L101 20 Q101 16 105 16" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M90 50 L96 50 Q101 50 101 44 L101 20 Q101 16 105 16" fill="none" stroke="#fde047" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="shkThBub" cx="106" cy="14" r="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.1"/>

    <!-- Left fin -->
    <path class="shkThFinL" d="M32 68 C14 70, 10 82, 20 88 C28 88, 34 82, 36 76 Z" fill="url(#shkThSkin)" stroke="#082f49" stroke-width="2.2"/>

    <!-- Body and belly -->
    <path d="M30 56 C28 32, 42 22, 60 22 C78 22, 92 32, 90 56 C92 84, 78 104, 60 104 C42 104, 28 84, 30 56 Z" fill="url(#shkThSkin)" stroke="#082f49" stroke-width="2.3"/>
    <path d="M34 58 C42 52, 50 55, 60 55 C70 55, 78 52, 86 58 C87 82, 76 102, 60 102 C44 102, 33 82, 34 58 Z" fill="url(#shkThBelly)"/>

    <!-- Gills -->
    <path d="M37 72 Q35 76 37 80 M41 73 Q39 77 41 81" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M83 72 Q85 76 83 80 M79 73 Q81 77 79 81" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Eyes -->
    <g class="shkThBlink">
      <ellipse cx="45" cy="49" rx="6.2" ry="7.2" fill="#082f49"/>
      <ellipse cx="45.8" cy="49" rx="4.9" ry="5.8" fill="#0284c7"/>
      <ellipse cx="45.8" cy="51" rx="3.5" ry="3" fill="#67e8f9"/>
      <circle cx="43.2" cy="46" r="2.3" fill="#ffffff"/>
      <circle cx="47.8" cy="51.5" r="1.1" fill="#ffffff"/>

      <ellipse cx="75" cy="49" rx="6.2" ry="7.2" fill="#082f49"/>
      <ellipse cx="75.8" cy="49" rx="4.9" ry="5.8" fill="#0284c7"/>
      <ellipse cx="75.8" cy="51" rx="3.5" ry="3" fill="#67e8f9"/>
      <circle cx="73.2" cy="46" r="2.3" fill="#ffffff"/>
      <circle cx="77.8" cy="51.5" r="1.1" fill="#ffffff"/>
    </g>

    <!-- Snorkel goggles -->
    <path d="M29 48 L34 48 M86 48 L91 48" stroke="#082f49" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="33" y="39" width="54" height="19" rx="9" fill="url(#shkThGlass)" stroke="#f59e0b" stroke-width="3"/>
    <rect x="33" y="39" width="54" height="19" rx="9" fill="none" stroke="#082f49" stroke-width="1.2"/>
    <path d="M55 58 Q60 53 65 58" fill="url(#shkThSkin)" stroke="#f59e0b" stroke-width="2.2"/>
    <path d="M39 43 L46 43 M40 46 L44 46" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

    <ellipse cx="35" cy="60" rx="4.2" ry="2.1" fill="#fb7185" opacity="0.72"/>
    <ellipse cx="85" cy="60" rx="4.2" ry="2.1" fill="#fb7185" opacity="0.72"/>

    <!-- Thinking wavy mouth -->
    <path d="M52 63 Q56 61 60 63 Q64 65 68 62" fill="none" stroke="#082f49" stroke-width="2" stroke-linecap="round"/>

    <!-- Right fin raised thoughtfully to chin -->
    <path class="shkThFinR" d="M84 74 C92 66, 86 60, 76 64 C70 67, 74 75, 84 74 Z" fill="url(#shkThSkin)" stroke="#082f49" stroke-width="2.1"/>

    <!-- Feet -->
    <ellipse cx="47" cy="103" rx="6.5" ry="4" fill="url(#shkThSkin)" stroke="#082f49" stroke-width="1.8"/>
    <ellipse cx="73" cy="103" rx="6.5" ry="4" fill="url(#shkThSkin)" stroke="#082f49" stroke-width="1.8"/>
  </g>
</svg>
