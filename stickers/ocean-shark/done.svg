<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shkDnSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shkDnBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="shkDnFin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="shkDnStar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      .shkDnLeap { transform-origin: 60px 96px; animation: shkDnJump 2.1s ease-in-out infinite; }
      .shkDnTail { transform-origin: 78px 92px; animation: shkDnTailWag 1.8s ease-in-out infinite alternate; }
      .shkDnFinL { transform-origin: 34px 70px; animation: shkDnFinL 1.8s ease-in-out infinite alternate; }
      .shkDnFinR { transform-origin: 86px 70px; animation: shkDnFinR 1.8s ease-in-out infinite alternate; }
      .shkDnBub1 { animation: shkDnRise1 2.4s ease-out infinite; }
      .shkDnBub2 { animation: shkDnRise2 2.6s ease-out -1.1s infinite; }
      .shkDnBub3 { animation: shkDnRise3 2.2s ease-out -0.6s infinite; }
      .shkDnSplash { transform-origin: 60px 108px; animation: shkDnWave 2.1s ease-in-out infinite; }

      @keyframes shkDnJump {
        0%, 100% { transform: translateY(2px) rotate(-2deg); }
        50% { transform: translateY(-7px) rotate(2.5deg); }
      }
      @keyframes shkDnTailWag { 0% { transform: rotate(-12deg); } 100% { transform: rotate(12deg); } }
      @keyframes shkDnFinL { 0% { transform: rotate(10deg); } 100% { transform: rotate(28deg); } }
      @keyframes shkDnFinR { 0% { transform: rotate(-10deg); } 100% { transform: rotate(-28deg); } }
      @keyframes shkDnRise1 {
        0% { transform: translateY(10px) scale(0.5); opacity: 0; }
        30% { opacity: 0.9; }
        100% { transform: translateY(-18px) scale(1.1); opacity: 0; }
      }
      @keyframes shkDnRise2 {
        0% { transform: translateY(10px) scale(0.4); opacity: 0; }
        30% { opacity: 0.85; }
        100% { transform: translateY(-20px) scale(1.15); opacity: 0; }
      }
      @keyframes shkDnRise3 {
        0% { transform: translateY(8px) scale(0.5); opacity: 0; }
        35% { opacity: 0.9; }
        100% { transform: translateY(-15px) scale(1.05); opacity: 0; }
      }
      @keyframes shkDnWave {
        0%, 100% { transform: scaleX(1); opacity: 0.75; }
        50% { transform: scaleX(1.12); opacity: 0.45; }
      }
    </style>
  </defs>

  <!-- Water splash ring underneath -->
  <g class="shkDnSplash">
    <ellipse cx="60" cy="110" rx="32" ry="5" fill="#7dd3fc" opacity="0.55"/>
    <path d="M26 106 Q20 100 24 96 M94 106 Q100 100 96 96" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <g class="shkDnLeap">
    <!-- Tail and dorsal fin -->
    <path class="shkDnTail" d="M78 88 C94 84, 102 74, 108 60 C108 74, 104 86, 96 92 C104 96, 110 102, 110 110 C100 106, 90 100, 78 96 Z" fill="url(#shkDnSkin)" stroke="#082f49" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M50 28 C48 12, 58 7, 68 8 C64 14, 65 18, 70 20 C67 23, 68 26, 70 28 Z" fill="url(#shkDnFin)" stroke="#082f49" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Joyfully raised fins -->
    <path class="shkDnFinL" d="M32 66 C14 60, 10 72, 18 80 C26 82, 34 78, 36 72 Z" fill="url(#shkDnSkin)" stroke="#082f49" stroke-width="2.2"/>
    <path class="shkDnFinR" d="M88 66 C106 60, 110 72, 102 80 C94 82, 86 78, 84 72 Z" fill="url(#shkDnSkin)" stroke="#082f49" stroke-width="2.2"/>

    <!-- Body -->
    <path d="M30 58 C28 34, 42 24, 60 24 C78 24, 92 34, 90 58 C92 84, 78 104, 60 104 C42 104, 28 84, 30 58 Z" fill="url(#shkDnSkin)" stroke="#082f49" stroke-width="2.3"/>
    <path d="M34 60 C42 54, 50 57, 60 57 C70 57, 78 54, 86 60 C87 82, 76 102, 60 102 C44 102, 33 82, 34 60 Z" fill="url(#shkDnBelly)"/>

    <!-- Gills -->
    <path d="M37 74 Q35 78 37 82 M41 75 Q39 79 41 83" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M83 74 Q85 78 83 82 M79 75 Q81 79 79 83" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Happy smiling eyes -->
    <path d="M38 51 Q45 43 52 51" fill="none" stroke="#082f49" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M68 51 Q75 43 82 51" fill="none" stroke="#082f49" stroke-width="2.8" stroke-linecap="round"/>

    <ellipse cx="35" cy="57" rx="4.8" ry="2.5" fill="#fb7185" opacity="0.88"/>
    <ellipse cx="85" cy="57" rx="4.8" ry="2.5" fill="#fb7185" opacity="0.88"/>

    <!-- Big joyful toothy grin -->
    <path d="M47 59 Q60 61 73 59 C72 70, 48 70, 47 59 Z" fill="#e11d48" stroke="#082f49" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="50,59.6 53.5,64 56.5,60 60,64.5 63.5,60 66.5,64 70,59.6" fill="#ffffff"/>

    <!-- Feet -->
    <ellipse cx="47" cy="103" rx="6.5" ry="4" fill="url(#shkDnSkin)" stroke="#082f49" stroke-width="1.8"/>
    <ellipse cx="73" cy="103" rx="6.5" ry="4" fill="url(#shkDnSkin)" stroke="#082f49" stroke-width="1.8"/>

    <!-- Cute golden starfish crown perched on head -->
    <g transform="translate(60, 23) rotate(-6)">
      <path d="M0 -13 L3.6 -4.5 L12.8 -3.8 L5.8 2 L8 11 L0 6.2 L-8 11 L-5.8 2 L-12.8 -3.8 L-3.6 -4.5 Z" fill="url(#shkDnStar)" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="-2.8" cy="-1" r="1.1" fill="#78350f"/>
      <circle cx="2.8" cy="-1" r="1.1" fill="#78350f"/>
      <path d="M-2 2 Q0 4 2 2" fill="none" stroke="#78350f" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Splashing bubbles -->
  <g class="shkDnBub1">
    <circle cx="19" cy="36" r="5.5" fill="#e0f2fe" fill-opacity="0.65" stroke="#38bdf8" stroke-width="1.4"/>
    <circle cx="17.2" cy="34.2" r="1.8" fill="#ffffff"/>
  </g>
  <g class="shkDnBub2">
    <circle cx="101" cy="34" r="4.8" fill="#e0f2fe" fill-opacity="0.65" stroke="#38bdf8" stroke-width="1.3"/>
    <circle cx="99.5" cy="32.5" r="1.5" fill="#ffffff"/>
  </g>
  <g class="shkDnBub3">
    <circle cx="26" cy="22" r="3.4" fill="#bae6fd" fill-opacity="0.7" stroke="#0ea5e9" stroke-width="1.1"/>
    <circle cx="95" cy="20" r="3" fill="#bae6fd" fill-opacity="0.7" stroke="#0ea5e9" stroke-width="1.1"/>
  </g>
</svg>
