<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="osSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="osBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="osFin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <style>
      /* Cá mập hăng say lấy thanh giũa mài hàm răng cưa trắng sáng chói lóa! */
      .os-body { transform-origin: 60px 75px; animation: osBob 0.55s ease-in-out infinite alternate; }
      .os-file-arm { transform-origin: 88px 72px; animation: osFileSaw 0.24s ease-in-out infinite alternate; }
      .os-spark1 { transform-origin: 54px 63px; animation: osSpark 0.48s ease-out infinite; opacity: 0; }
      .os-spark2 { transform-origin: 66px 63px; animation: osSpark 0.48s ease-out 0.24s infinite; opacity: 0; }
      .os-gleam { transform-origin: 60px 62px; animation: osGleam 0.9s ease-in-out infinite; }
      .os-bub { animation: osBub 1.3s ease-out infinite; opacity: 0; }

      @keyframes osBob { 0% { transform: translateY(0) rotate(-2deg); } 100% { transform: translateY(-3px) rotate(2deg); } }
      @keyframes osFileSaw { 0% { transform: translate(-8px, -2px) rotate(-6deg); } 100% { transform: translate(8px, 1px) rotate(6deg); } }
      @keyframes osSpark {
        0% { opacity: 0; transform: scale(0.3) rotate(0deg); }
        35% { opacity: 1; transform: translate(-6px, -8px) scale(1.2) rotate(25deg); }
        100% { opacity: 0; transform: translate(-14px, -16px) scale(0.5) rotate(60deg); }
      }
      @keyframes osGleam { 0%, 100% { opacity: 0.2; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1.3); } }
      @keyframes osBub { 0% { opacity: 0; transform: translateY(0); } 25% { opacity: 0.9; } 100% { opacity: 0; transform: translateY(-22px); } }
    </style>
  </defs>

  <g class="os-body">
    <!-- Đuôi va vây lưng -->
    <path d="M78 88 C94 84, 102 74, 108 60 C108 74, 104 86, 96 92 C104 96, 110 102, 110 110 C100 106, 90 100, 78 96 Z" fill="url(#osSkin)" stroke="#082f49" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M50 26 C48 8, 58 3, 68 4 C64 11, 65 15, 70 17 C67 20, 68 24, 70 26 Z" fill="url(#osFin)" stroke="#082f49" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M32 68 C14 70, 10 82, 20 88 C28 88, 34 82, 36 76 Z" fill="url(#osSkin)" stroke="#082f49" stroke-width="2.2"/>

    <!-- Thân cá mập -->
    <path d="M30 56 C28 32, 42 22, 60 22 C78 22, 92 32, 90 56 C92 84, 78 104, 60 104 C42 104, 28 84, 30 56 Z" fill="url(#osSkin)" stroke="#082f49" stroke-width="2.3"/>
    <path d="M34 58 C42 52, 50 55, 60 55 C70 55, 78 52, 86 58 C87 82, 76 102, 60 102 C44 102, 33 82, 34 58 Z" fill="url(#osBelly)"/>
    <path d="M37 74 Q35 78 37 82 M41 75 Q39 79 41 83" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Mắt híp cười khoái chí đang mài răng -->
    <path d="M 38 49 Q 45 42 52 49" fill="none" stroke="#082f49" stroke-width="3" stroke-linecap="round"/>
    <path d="M 68 49 Q 75 42 82 49" fill="none" stroke="#082f49" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="35" cy="55" rx="4.5" ry="2.3" fill="#fb7185" opacity="0.8"/>
    <ellipse cx="85" cy="55" rx="4.5" ry="2.3" fill="#fb7185" opacity="0.8"/>

    <!-- Miệng há to khoe hàm răng cưa sắc bén -->
    <path d="M44 57 Q60 59 76 57 C75 72, 45 72, 44 57 Z" fill="#e11d48" stroke="#082f49" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="47,57.5 50.5,64 54,58 57.5,64.5 61,58 64.5,64.5 68,58 71.5,64 74,57.5" fill="#ffffff"/>
    <polygon points="50,69 53,64.5 56.5,69.5 60,64.5 63.5,69.5 67,64.5 70,69" fill="#ffffff"/>

    <!-- Vây phải cầm thanh giũa sắt mài qua lại trên hàm răng -->
    <g class="os-file-arm">
      <!-- Thanh giũa răng kim loại + tay cầm đỏ -->
      <rect x="38" y="61" width="44" height="5.5" rx="1.5" fill="#cbd5e1" stroke="#334155" stroke-width="1.3"/>
      <path d="M 43 61 L 41 66.5 M 49 61 L 47 66.5 M 55 61 L 53 66.5 M 61 61 L 59 66.5 M 67 61 L 65 66.5 M 73 61 L 71 66.5" stroke="#64748b" stroke-width="1"/>
      <rect x="82" y="59.5" width="14" height="8.5" rx="3" fill="#f97316" stroke="#7c2d12" stroke-width="1.3"/>
      <!-- Vây cá mập nắm lấy tay cầm -->
      <path d="M 88 67 C 102 64, 108 74, 98 81 C 90 82, 85 75, 86 68 Z" fill="url(#osSkin)" stroke="#082f49" stroke-width="2"/>
    </g>

    <!-- Tia sáng va tia lửa lấp lánh bắn ra khi mài răng -->
    <g class="os-spark1">
      <path d="M 52 54 L 54 59 L 59 61 L 54 63 L 52 68 L 50 63 L 45 61 L 50 59 Z" fill="#fef08a"/>
    </g>
    <g class="os-spark2">
      <path d="M 68 54 L 70 59 L 75 61 L 70 63 L 68 68 L 66 63 L 61 61 L 66 59 Z" fill="#ffffff"/>
    </g>
    <path class="os-gleam" d="M 60 54 L 61.5 58 L 65.5 59.5 L 61.5 61 L 60 65 L 58.5 61 L 54.5 59.5 L 58.5 58 Z" fill="#ffffff"/>

    <!-- Chân cá mập -->
    <ellipse cx="47" cy="103" rx="6.5" ry="4" fill="url(#osSkin)" stroke="#082f49" stroke-width="1.8"/>
    <ellipse cx="73" cy="103" rx="6.5" ry="4" fill="url(#osSkin)" stroke="#082f49" stroke-width="1.8"/>
  </g>

  <!-- Bong bóng nước nổi lên -->
  <g class="os-bub">
    <circle cx="22" cy="44" r="4.5" fill="#e0f2fe" fill-opacity="0.65" stroke="#7dd3fc" stroke-width="1.3"/>
    <circle cx="96" cy="36" r="3.5" fill="#e0f2fe" fill-opacity="0.65" stroke="#7dd3fc" stroke-width="1.2"/>
  </g>
</svg>
