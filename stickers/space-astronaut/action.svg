<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95">
  <defs>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="saturnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="planetPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="55%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="jetFlame" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <style>
      .saturn-float { animation: planetBob1 3.2s ease-in-out infinite alternate; }
      .exoplanet-float { animation: planetBob2 2.7s ease-in-out infinite alternate; }
      .moon-orbit { animation: moonMove 4s ease-in-out infinite alternate; }
      .astro-fly { animation: astroFlight 3.8s ease-in-out infinite; }
      .flame-pulse { animation: jetPulse 0.18s ease-in-out infinite alternate; transform-origin: 40px 44px; }
      @keyframes planetBob1 {
        0% { transform: translate(0px, 0px) rotate(-2deg); }
        100% { transform: translate(3px, -5px) rotate(2deg); }
      }
      @keyframes planetBob2 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-4px, 4px); }
      }
      @keyframes moonMove {
        0% { transform: translate(-6px, -3px); }
        100% { transform: translate(6px, 4px); }
      }
      @keyframes astroFlight {
        0% { transform: translate(110px, 4px) rotate(-4deg); }
        25% { transform: translate(48px, -10px) rotate(6deg); }
        50% { transform: translate(6px, 4px) rotate(-3deg); }
        75% { transform: translate(58px, 12px) rotate(-8deg); }
        100% { transform: translate(110px, 4px) rotate(-4deg); }
      }
      @keyframes jetPulse {
        0% { transform: scaleX(0.82) scaleY(0.9); }
        100% { transform: scaleX(1.22) scaleY(1.12); }
      }
    </style>
  </defs>

  <!-- CÁC VÌ SAO va TINH VÂN NỀN -->
  <g opacity="0.85">
    <circle cx="20" cy="22" r="1.4" fill="#ffffff"/>
    <circle cx="95" cy="18" r="1.8" fill="#fef08a"/>
    <circle cx="145" cy="24" r="1.3" fill="#7dd3fc"/>
    <circle cx="190" cy="16" r="1.6" fill="#f472b6"/>
    <path d="M 122 14 L 124 19 L 129 21 L 124 23 L 122 28 L 120 23 L 115 21 L 120 19 Z" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- HÀNH TINH SAO THỔ (SATURN CÓ VÀNH ĐAI) BÊN TRÁI -->
  <g class="saturn-float">
    <ellipse cx="48" cy="46" rx="26" ry="26" fill="#f59e0b" opacity="0.14"/>
    <!-- Nửa sau vành đai -->
    <path d="M 16 53 A 34 10 0 0 1 80 39" fill="none" stroke="url(#ringGrad)" stroke-width="5" opacity="0.7"/>
    <!-- Quả cầu hành tinh -->
    <circle cx="48" cy="46" r="16" fill="url(#saturnGrad)" stroke="#fde68a" stroke-width="1"/>
    <!-- Vân khí quyển Sao Thổ -->
    <path d="M 33 42 Q 48 46 63 40 M 34 49 Q 48 53 62 47" fill="none" stroke="#fef3c7" stroke-width="1.6" opacity="0.55"/>
    <!-- Nửa trước vành đai cắt ngang mặt trước hành tinh -->
    <path d="M 80 39 A 34 10 0 0 1 16 53" fill="none" stroke="url(#ringGrad)" stroke-width="5.5" transform="rotate(-14 48 46)"/>
    <ellipse cx="48" cy="46" rx="34" ry="9" transform="rotate(-14 48 46)" fill="none" stroke="#fef08a" stroke-width="1.4" opacity="0.85"/>
  </g>

  <!-- MẶT TRĂNG NHỎ CÓ HỐ VA CHẠM Ở GIỮA -->
  <g class="moon-orbit">
    <circle cx="136" cy="56" r="8.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="133" cy="54" r="2.2" fill="#94a3b8"/>
    <circle cx="139" cy="58" r="1.6" fill="#94a3b8"/>
    <circle cx="136" cy="51" r="1.2" fill="#94a3b8"/>
  </g>

  <!-- PHI HÀNH GIA CHIBI BẬT JETPACK BAY LƯỢN GIỮA CÁC HÀNH TINH -->
  <g class="astro-fly">
    <!-- Luồng lửa Jetpack -->
    <g class="flame-pulse">
      <path d="M 40 44 C 24 37, 8 39, 2 44 C 8 49, 24 51, 40 44 Z" fill="url(#jetFlame)"/>
      <circle cx="14" cy="44" r="2.2" fill="#38bdf8"/>
      <circle cx="6" cy="41" r="1.5" fill="#c084fc"/>
    </g>
    <!-- Balo phản lực Jetpack -->
    <rect x="40" y="31" width="16" height="20" rx="5" transform="rotate(14 48 41)" fill="#64748b" stroke="#1e293b" stroke-width="1.4"/>
    <circle cx="42" cy="44" r="3.2" fill="#38bdf8" stroke="#0f172a" stroke-width="1"/>
    <!-- Chân phi hành gia bay ngang -->
    <g transform="translate(38, 50) rotate(22)">
      <rect x="-12" y="-3" width="14" height="7" rx="3.5" fill="url(#suitGrad)" stroke="#334155" stroke-width="1.3"/>
      <rect x="-15" y="-3.5" width="5" height="8" rx="2.5" fill="#6366f1" stroke="#1e1b4b" stroke-width="1.1"/>
    </g>
    <!-- Thân phi hành gia -->
    <rect x="44" y="38" width="24" height="17" rx="8" transform="rotate(-10 56 46)" fill="url(#suitGrad)" stroke="#334155" stroke-width="1.4"/>
    <rect x="52" y="42" width="7" height="5" rx="1.5" transform="rotate(-10 56 44)" fill="#38bdf8" stroke="#1e293b" stroke-width="0.9"/>
    <!-- Đầu va Mũ bảo hiểm vũ trụ Chibi -->
    <g transform="translate(74, 38) rotate(-8)">
      <line x1="-2" y1="-15" x2="-4" y2="-22" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-4" cy="-23" r="2.8" fill="#38bdf8"/>
      <circle cx="0" cy="0" r="15" fill="url(#suitGrad)" stroke="#334155" stroke-width="1.5"/>
      <ellipse cx="3" cy="0" rx="11.5" ry="10.5" fill="url(#visorGrad)" stroke="#6366f1" stroke-width="1.3"/>
      <!-- Mắt sáng va phản chiếu hành tinh trong kính -->
      <ellipse cx="6" cy="0" rx="2.6" ry="3.2" fill="#38bdf8"/>
      <circle cx="7" cy="-1.2" r="1.2" fill="#ffffff"/>
      <ellipse cx="3.5" cy="4" rx="2.2" ry="1.1" fill="#f472b6" opacity="0.65"/>
      <path d="M -4 -5 Q 1 -8 7 -5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    </g>
    <!-- Tay vươn tới trước khám phá vũ trụ -->
    <g transform="translate(64, 48) rotate(-24)">
      <rect x="0" y="-3.5" width="15" height="7" rx="3.5" fill="url(#suitGrad)" stroke="#334155" stroke-width="1.3"/>
      <circle cx="15" cy="0" r="4" fill="#6366f1" stroke="#1e1b4b" stroke-width="1.1"/>
    </g>
  </g>

  <!-- HÀNH TINH TÍM HỒNG (EXOPLANET) BÊN PHẢI (Lớp trước tạo chiều sâu) -->
  <g class="exoplanet-float">
    <circle cx="222" cy="42" r="19" fill="#a855f7" opacity="0.18"/>
    <circle cx="222" cy="42" r="13.5" fill="url(#planetPurple)" stroke="#f9a8d4" stroke-width="1.1"/>
    <!-- Hố thiên thạch va vân sáng trên hành tinh phải -->
    <ellipse cx="217" cy="38" rx="3.2" ry="2.2" transform="rotate(-20 217 38)" fill="#be185d" opacity="0.65"/>
    <ellipse cx="226" cy="46" rx="2.5" ry="1.8" fill="#581c87" opacity="0.65"/>
    <path d="M 206 46 Q 222 52 238 38" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
