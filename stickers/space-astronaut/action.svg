<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <clipPath id="sa-stage-clip">
      <rect x="0" y="0" width="260" height="71"/>
    </clipPath>

    <radialGradient id="sa-nebula-l" cx="30%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sa-nebula-r" cx="76%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.26"/>
      <stop offset="52%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sa-suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="68%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="sa-visor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="sa-saturn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="48%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <linearGradient id="sa-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.88"/>
    </linearGradient>

    <radialGradient id="sa-crescent-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sa-crescent-lit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="sa-crescent-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="sa-jet-flame" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.88"/>
      <stop offset="76%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="sa-meteor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <style>
      .sa-star-a { animation: saTwinkle 2.0s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .sa-star-b { animation: saTwinkle 2.6s cubic-bezier(0.37, 0, 0.63, 1) -1.2s infinite alternate; }
      .sa-meteor-a { animation: saShootA 4.2s linear infinite; }
      .sa-meteor-b { animation: saShootB 5.4s linear -2.1s infinite; }
      .sa-saturn { animation: saPlanetBobA 3.2s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; transform-origin: 46px 42px; }
      .sa-crescent { animation: saPlanetBobB 2.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; transform-origin: 222px 39px; }
      .sa-moonlet { animation: saMoonDrift 3.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .sa-astroX { animation: saFlightX 3.8s linear infinite; }
      .sa-astroY { animation: saFlightY 1.0s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; transform-origin: 56px 40px; }
      .sa-flame { animation: saJetPulse 0.18s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; transform-origin: 40px 42px; }

      @keyframes saTwinkle {
        0% { opacity: 0.32; }
        100% { opacity: 1; }
      }
      @keyframes saShootA {
        0% { transform: translate(-24px, -10px); opacity: 0; }
        10% { opacity: 0.95; }
        28% { transform: translate(34px, 14px); opacity: 0; }
        100% { transform: translate(34px, 14px); opacity: 0; }
      }
      @keyframes saShootB {
        0% { transform: translate(-20px, -8px); opacity: 0; }
        10% { opacity: 0.9; }
        26% { transform: translate(30px, 12px); opacity: 0; }
        100% { transform: translate(30px, 12px); opacity: 0; }
      }
      @keyframes saPlanetBobA {
        0% { transform: translate(0px, 1px) rotate(-2deg); }
        100% { transform: translate(2.5px, -4px) rotate(2deg); }
      }
      @keyframes saPlanetBobB {
        0% { transform: translate(0px, -2px); }
        100% { transform: translate(-3px, 3px); }
      }
      @keyframes saMoonDrift {
        0% { transform: translate(-5px, -2px); }
        100% { transform: translate(5px, 3px); }
      }
      @keyframes saFlightX {
        0% { transform: translateX(-46px); opacity: 0; }
        8% { opacity: 1; }
        92% { opacity: 1; }
        100% { transform: translateX(196px); opacity: 0; }
      }
      @keyframes saFlightY {
        0% { transform: translateY(-8px) rotate(-4.5deg); }
        100% { transform: translateY(8px) rotate(4.5deg); }
      }
      @keyframes saJetPulse {
        0% { transform: scaleX(0.84) scaleY(0.9); opacity: 0.85; }
        100% { transform: scaleX(1.2) scaleY(1.1); opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#sa-stage-clip)">
    <!-- Rich cosmic nebula glow clouds -->
    <ellipse cx="86" cy="36" rx="88" ry="34" fill="url(#sa-nebula-l)"/>
    <ellipse cx="182" cy="34" rx="84" ry="34" fill="url(#sa-nebula-r)"/>

    <!-- Multi-layered twinkling starfield -->
    <g class="sa-star-a">
      <circle cx="16" cy="18" r="1.2" fill="#ffffff"/>
      <circle cx="92" cy="14" r="1.6" fill="#fef08a"/>
      <circle cx="148" cy="22" r="1.2" fill="#7dd3fc"/>
      <circle cx="192" cy="14" r="1.5" fill="#f9a8d4"/>
      <circle cx="246" cy="20" r="1.2" fill="#ffffff"/>
      <path d="M 118 11 L 119.5 15 L 123.5 16.5 L 119.5 18 L 118 22 L 116.5 18 L 112.5 16.5 L 116.5 15 Z" fill="#fef08a"/>
    </g>
    <g class="sa-star-b">
      <circle cx="72" cy="58" r="1.1" fill="#7dd3fc"/>
      <circle cx="106" cy="30" r="1.1" fill="#ffffff"/>
      <circle cx="168" cy="56" r="1.3" fill="#f9a8d4"/>
      <circle cx="176" cy="19" r="1.2" fill="#fef08a"/>
      <circle cx="248" cy="54" r="1.1" fill="#7dd3fc"/>
      <path d="M 160 10 L 161 12.6 L 163.6 13.6 L 161 14.6 L 160 17.2 L 159 14.6 L 156.4 13.6 L 159 12.6 Z" fill="#7dd3fc"/>
    </g>

    <!-- Distant shooting stars -->
    <g class="sa-meteor-a">
      <line x1="94" y1="12" x2="114" y2="20" stroke="url(#sa-meteor)" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="114" cy="20" r="1.3" fill="#ffffff"/>
    </g>
    <g class="sa-meteor-b">
      <line x1="168" y1="10" x2="186" y2="17" stroke="url(#sa-meteor)" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="186" cy="17" r="1.2" fill="#fef08a"/>
    </g>

    <!-- Detailed Ringed Saturn on the left -->
    <g class="sa-saturn">
      <circle cx="46" cy="42" r="24" fill="#f59e0b" opacity="0.14"/>
      <!-- Back half of Saturn rings -->
      <path d="M 14 49 A 33 9.5 0 0 1 78 35" fill="none" stroke="url(#sa-ring)" stroke-width="4.8" opacity="0.65"/>
      <!-- Planet sphere -->
      <circle cx="46" cy="42" r="15.5" fill="url(#sa-saturn)" stroke="#fde68a" stroke-width="0.9"/>
      <!-- Atmospheric bands -->
      <path d="M 31.5 38 Q 46 42 60.5 36.5 M 32 45 Q 46 49 60 43.5" fill="none" stroke="#fef3c7" stroke-width="1.5" opacity="0.58"/>
      <path d="M 35 33.5 Q 46 36.5 57 32.5" fill="none" stroke="#b45309" stroke-width="1.2" opacity="0.4"/>
      <!-- Front half of Saturn rings -->
      <path d="M 78 35 A 33 9.5 0 0 1 14 49" fill="none" stroke="url(#sa-ring)" stroke-width="5.2" transform="rotate(-14 46 42)"/>
      <ellipse cx="46" cy="42" rx="33" ry="8.8" transform="rotate(-14 46 42)" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.82"/>
    </g>

    <!-- Small cratered moonlet in midground -->
    <g class="sa-moonlet">
      <circle cx="134" cy="56" r="7.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.9"/>
      <circle cx="131.5" cy="54" r="1.9" fill="#94a3b8"/>
      <circle cx="136.8" cy="57.8" r="1.4" fill="#94a3b8"/>
      <circle cx="134.5" cy="51.5" r="1" fill="#94a3b8"/>
    </g>

    <!-- Chibi Astronaut flying with glowing jetpack exhaust and stardust trail -->
    <g class="sa-astroX">
      <g class="sa-astroY">
        <!-- Glowing jetpack exhaust plume and stardust particles -->
        <g class="sa-flame">
          <path d="M 40 42 C 24 35, 8 37, 0 42 C 8 47, 24 49, 40 42 Z" fill="url(#sa-jet-flame)"/>
          <path d="M 40 42 C 30 39, 20 40, 14 42 C 20 44, 30 45, 40 42 Z" fill="#ffffff" opacity="0.88"/>
          <circle cx="12" cy="42" r="2" fill="#38bdf8"/>
          <circle cx="5" cy="39" r="1.4" fill="#c084fc"/>
          <circle cx="7" cy="45.5" r="1.2" fill="#fef08a"/>
          <path d="M -2 41 L -0.8 43.2 L 1.4 44.4 L -0.8 45.6 L -2 47.8 L -3.2 45.6 L -5.4 44.4 L -3.2 43.2 Z" fill="#bae6fd" opacity="0.85"/>
        </g>

        <!-- Jetpack -->
        <rect x="40" y="29" width="15.5" height="19.5" rx="5" transform="rotate(14 48 39)" fill="#64748b" stroke="#1e293b" stroke-width="1.3"/>
        <circle cx="42" cy="42" r="3" fill="#38bdf8" stroke="#0f172a" stroke-width="0.9"/>

        <!-- Trailing space boot leg -->
        <g transform="translate(38, 48) rotate(22)">
          <rect x="-12" y="-3" width="14" height="6.8" rx="3.4" fill="url(#sa-suit)" stroke="#334155" stroke-width="1.2"/>
          <rect x="-15" y="-3.5" width="5" height="7.8" rx="2.4" fill="#6366f1" stroke="#1e1b4b" stroke-width="1"/>
        </g>

        <!-- Spacesuit Torso -->
        <rect x="44" y="36" width="23.5" height="16.5" rx="7.8" transform="rotate(-10 56 44)" fill="url(#sa-suit)" stroke="#334155" stroke-width="1.3"/>
        <!-- Chest control panel with RGB status LEDs -->
        <g transform="rotate(-10 56 43)">
          <rect x="51" y="39.5" width="9" height="5.5" rx="1.5" fill="#1e293b" stroke="#38bdf8" stroke-width="0.9"/>
          <circle cx="53.3" cy="42.2" r="0.9" fill="#ef4444"/>
          <circle cx="55.5" cy="42.2" r="0.9" fill="#fde047"/>
          <circle cx="57.7" cy="42.2" r="0.9" fill="#22c55e"/>
        </g>

        <!-- Chibi Helmet and Visor -->
        <g transform="translate(73, 36) rotate(-8)">
          <line x1="-2" y1="-14.5" x2="-4" y2="-21" stroke="#94a3b8" stroke-width="1.9" stroke-linecap="round"/>
          <circle cx="-4" cy="-22" r="2.7" fill="#38bdf8" stroke="#0f172a" stroke-width="0.8"/>
          <circle cx="-4.7" cy="-22.7" r="0.9" fill="#ffffff"/>
          <circle cx="0" cy="0" r="14.5" fill="url(#sa-suit)" stroke="#334155" stroke-width="1.4"/>
          <ellipse cx="3" cy="0" rx="11.2" ry="10.2" fill="url(#sa-visor)" stroke="#38bdf8" stroke-width="1.3"/>
          <!-- Bright chibi eye, blush, and visor highlight -->
          <ellipse cx="6" cy="0" rx="2.5" ry="3.1" fill="#38bdf8"/>
          <circle cx="6.9" cy="-1.2" r="1.1" fill="#ffffff"/>
          <ellipse cx="3.5" cy="3.9" rx="2.1" ry="1" fill="#f472b6" opacity="0.7"/>
          <path d="M -4 -4.8 Q 1 -7.8 7 -4.8" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" opacity="0.65"/>
        </g>

        <!-- Forward reaching arm -->
        <g transform="translate(64, 46) rotate(-24)">
          <rect x="0" y="-3.2" width="14.5" height="6.6" rx="3.3" fill="url(#sa-suit)" stroke="#334155" stroke-width="1.2"/>
          <circle cx="14.5" cy="0" r="3.8" fill="#6366f1" stroke="#1e1b4b" stroke-width="1"/>
        </g>
      </g>
    </g>

    <!-- Glowing Crescent Planet on the right -->
    <g class="sa-crescent">
      <circle cx="222" cy="39" r="22" fill="url(#sa-crescent-glow)"/>
      <!-- Dark planet body -->
      <circle cx="222" cy="39" r="13.5" fill="url(#sa-crescent-dark)" stroke="#c084fc" stroke-opacity="0.45" stroke-width="0.9"/>
      <!-- Luminous crescent limb -->
      <path d="M 222 25.5 A 13.5 13.5 0 1 0 222 52.5 A 10.5 13.5 0 1 1 222 25.5 Z" fill="url(#sa-crescent-lit)"/>
      <!-- Subtle craters on dark side -->
      <ellipse cx="226.5" cy="36" rx="2.4" ry="1.8" transform="rotate(-18 226.5 36)" fill="#581c87" opacity="0.65"/>
      <circle cx="223.5" cy="44.5" r="1.6" fill="#4c1d95" opacity="0.65"/>
      <!-- Orbital energy arc -->
      <path d="M 205 44 Q 222 50 239 35" fill="none" stroke="#38bdf8" stroke-width="1.7" stroke-linecap="round" opacity="0.78"/>
    </g>
  </g>
</svg>
