<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="saDnSuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="saDnVisor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="saDnTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="saDnFlag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <style>
      .saDnHop { animation: saDnHopAnim 2.2s ease-in-out infinite; }
      .saDnJet { transform-origin: 54px 98px; animation: saDnJetAnim 0.45s ease-in-out infinite alternate; }
      .saDnOkGlow { transform-origin: 54px 10px; animation: saDnOkAnim 2s ease-in-out infinite alternate; }
      .saDnFlagWave { transform-origin: 84px 46px; animation: saDnWaveAnim 2.2s ease-in-out infinite alternate; }
      .saDnArmL { transform-origin: 34px 82px; animation: saDnArmAnim 2s ease-in-out infinite alternate; }
      .saDnStar1 { transform-origin: 18px 24px; animation: saDnStarAnim 2.2s ease-in-out infinite; }
      .saDnStar2 { transform-origin: 102px 24px; animation: saDnStarAnim 2.2s ease-in-out 0.6s infinite; }
      .saDnStar3 { transform-origin: 20px 66px; animation: saDnStarAnim 2.2s ease-in-out 1.1s infinite; }

      @keyframes saDnHopAnim { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes saDnJetAnim { 0% { transform: scaleY(0.84); opacity: 0.75; } 100% { transform: scaleY(1.18); opacity: 1; } }
      @keyframes saDnOkAnim { 0% { transform: scale(0.95); opacity: 0.85; } 100% { transform: scale(1.08); opacity: 1; } }
      @keyframes saDnWaveAnim { 0% { transform: skewY(-3deg) scaleX(0.96); } 100% { transform: skewY(4deg) scaleX(1.03); } }
      @keyframes saDnArmAnim { 0% { transform: rotate(-10deg); } 100% { transform: rotate(14deg); } }
      @keyframes saDnStarAnim { 0%, 100% { transform: scale(0.65); opacity: 0.4; } 50% { transform: scale(1.25); opacity: 1; } }
    </style>
  </defs>

  <!-- Starry Burst Background -->
  <g class="saDnStar1">
    <polygon points="18,17 20,22 25,24 20,26 18,31 16,26 11,24 16,22" fill="#fde047"/>
  </g>
  <g class="saDnStar2">
    <polygon points="102,17 104,22 109,24 104,26 102,31 100,26 95,24 100,22" fill="#4ade80"/>
  </g>
  <g class="saDnStar3">
    <polygon points="18,62 19.5,65.5 23,67 19.5,68.5 18,72 16.5,68.5 13,67 16.5,65.5" fill="#38bdf8"/>
    <circle cx="96" cy="92" r="2.2" fill="#fde047"/>
  </g>

  <g class="saDnHop">
    <!-- Jetpack -->
    <rect x="28" y="64" width="52" height="33" rx="10" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
    <g class="saDnJet">
      <path d="M33 97 Q37 110 40 113 Q43 110 45 97 Z" fill="#38bdf8" opacity="0.85"/>
      <path d="M63 97 Q66 110 68 113 Q71 110 75 97 Z" fill="#38bdf8" opacity="0.85"/>
      <path d="M36 97 Q40 105 42 107 Q43 105 43 97 Z" fill="#fde047"/>
      <path d="M65 97 Q68 105 69 107 Q71 105 72 97 Z" fill="#fde047"/>
    </g>

    <!-- Green OK Beacon Light on Helmet -->
    <line x1="54" y1="20" x2="54" y2="12" stroke="#cbd5e1" stroke-width="3.2" stroke-linecap="round"/>
    <g class="saDnOkGlow">
      <rect x="41" y="2" width="26" height="13" rx="6.5" fill="#22c55e" stroke="#0f172a" stroke-width="1.5"/>
      <text x="54" y="11.5" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff">OK</text>
    </g>

    <!-- Suit Body -->
    <path d="M34 74 C31 90, 36 103, 54 103 C72 103, 77 90, 74 74 Z" fill="url(#saDnSuit)" stroke="#1e293b" stroke-width="2.2"/>
    <path d="M33 73 Q54 80 75 73" fill="none" stroke="url(#saDnTrim)" stroke-width="4.2" stroke-linecap="round"/>
    <rect x="45" y="81" width="18" height="11" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="1.3"/>
    <circle cx="49.5" cy="86.5" r="2" fill="#22c55e"/>
    <circle cx="54" cy="86.5" r="2" fill="#4ade80"/>
    <circle cx="58.5" cy="86.5" r="2" fill="#22c55e"/>

    <!-- Boots -->
    <ellipse cx="43" cy="104" rx="7.5" ry="5.2" fill="url(#saDnSuit)" stroke="#1e293b" stroke-width="2"/>
    <path d="M37 104 Q43 107 49 104" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="65" cy="104" rx="7.5" ry="5.2" fill="url(#saDnSuit)" stroke="#1e293b" stroke-width="2"/>
    <path d="M59 104 Q65 107 71 104" fill="none" stroke="#38bdf8" stroke-width="2"/>

    <!-- Helmet -->
    <circle cx="54" cy="46" r="29" fill="url(#saDnSuit)" stroke="#1e293b" stroke-width="2.4"/>
    <rect x="21" y="40" width="6" height="13" rx="3" fill="url(#saDnTrim)" stroke="#1e293b" stroke-width="1.8"/>
    <rect x="81" y="40" width="6" height="13" rx="3" fill="url(#saDnTrim)" stroke="#1e293b" stroke-width="1.8"/>

    <!-- Visor -->
    <rect x="30" y="27" width="48" height="37" rx="18" fill="url(#saDnVisor)" stroke="#38bdf8" stroke-width="2.2"/>
    <path d="M36 32 Q48 28 63 32" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
    <circle cx="36" cy="37" r="2" fill="#ffffff" opacity="0.6"/>

    <!-- Happy Curved Glowing Eyes -->
    <path d="M37 48 Q42 40 47 48" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M61 48 Q66 40 71 48" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="36" cy="53" rx="3.8" ry="2.2" fill="#f472b6" opacity="0.8"/>
    <ellipse cx="72" cy="53" rx="3.8" ry="2.2" fill="#f472b6" opacity="0.8"/>
    <path d="M49 52 Q54 58 59 52" fill="none" stroke="#bae6fd" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Victory Flag Held in Right Hand -->
    <line x1="84" y1="42" x2="84" y2="108" stroke="#cbd5e1" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="84" cy="40" r="3" fill="#fde047" stroke="#0f172a" stroke-width="1"/>
    <g class="saDnFlagWave">
      <path d="M85 43 Q99 39 113 45 L110 61 Q98 56 85 60 Z" fill="url(#saDnFlag)" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round"/>
      <polygon points="98,46 99.6,50 104,50.5 100.5,53 101.5,57 98,54.8 94.5,57 95.5,53 92,50.5 96.4,50" fill="#fef08a"/>
    </g>

    <!-- Left Arm Raised Cheerfully va Right Arm Holding Flag -->
    <g class="saDnArmL">
      <ellipse cx="29" cy="76" rx="6.5" ry="5" transform="rotate(-35 29 76)" fill="url(#saDnSuit)" stroke="#1e293b" stroke-width="2"/>
    </g>
    <ellipse cx="78" cy="82" rx="6.5" ry="5" transform="rotate(-15 78 82)" fill="url(#saDnSuit)" stroke="#1e293b" stroke-width="2"/>
  </g>
</svg>
