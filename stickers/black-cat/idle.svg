<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="coalFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="55%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="amberEye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="goldBell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <style>
      /* Mỗi 15s: Chấm đèn Laser đỏ chạy qua lại, Mèo Đen đảo mắt đuổi theo vồ chụp nhưng hụt, hiện dấu ?! */
      .laser-dot { animation: catLaser 15s ease-in-out infinite; }
      .pupils-track { animation: catPupils 15s ease-in-out infinite; }
      .paw-swat { animation: catSwat 15s ease-in-out infinite; transform-origin: 41px 91px; }
      .cat-confuse { animation: catHuh 15s ease-out infinite; transform-origin: 60px 14px; }
      .cat-blink { transform-origin: 60px 55px; animation: catBlink 4.0s infinite; }
      .cat-tail { transform-origin: 86px 88px; animation: catTailWag 2.4s ease-in-out infinite alternate; }
      .cat-ear-l { transform-origin: 38px 36px; animation: catEarL 3.2s ease-in-out infinite; }
      .cat-ear-r { transform-origin: 82px 36px; animation: catEarR 3.2s ease-in-out -1.5s infinite; }

      @keyframes catBlink { 0%, 45%, 49%, 95%, 100% { transform: scaleY(1); } 47%, 97% { transform: scaleY(0.08); } }
      @keyframes catTailWag { 0% { transform: rotate(-6deg); } 100% { transform: rotate(10deg); } }
      @keyframes catEarL { 0%, 86%, 100% { transform: rotate(0deg); } 92% { transform: rotate(-9deg); } }
      @keyframes catEarR { 0%, 86%, 100% { transform: rotate(0deg); } 92% { transform: rotate(9deg); } }

      @keyframes catLaser {
        0%, 72% { opacity: 0; transform: translate(0, 0); }
        75% { opacity: 1; transform: translate(-24px, 0); }
        79% { opacity: 1; transform: translate(24px, -6px); }
        83% { opacity: 1; transform: translate(-18px, 4px); }
        86% { opacity: 1; transform: translate(0px, 0px); }
        88%, 100% { opacity: 0; }
      }
      @keyframes catPupils {
        0%, 72% { transform: translate(0, 0); }
        75% { transform: translate(-3.5px, 2px); }
        79% { transform: translate(3.5px, 1px); }
        83% { transform: translate(-3px, 2px); }
        86% { transform: translate(0, 3px) scale(1.25); }
        92%, 100% { transform: translate(0, 0); }
      }
      @keyframes catSwat {
        0%, 82% { transform: translate(0, 0) rotate(0deg); }
        85% { transform: translate(16px, -6px) rotate(25deg); }
        87% { transform: translate(18px, 4px) rotate(35deg); }
        92%, 100% { transform: translate(0, 0) rotate(0deg); }
      }
      @keyframes catHuh {
        0%, 88% { opacity: 0; transform: scale(0.2); }
        91%, 96% { opacity: 1; transform: scale(1.15); }
        99%, 100% { opacity: 0; transform: scale(0.2); }
      }
    </style>
  <ellipse cx="60" cy="110" rx="28" ry="4.5" fill="#020617" opacity="0.34"/>
  </defs>

  <g class="cat-tail">
    <path d="M 86 88 C 108 84, 110 56, 96 50 C 88 48, 86 58, 94 64" fill="none" stroke="url(#coalFur)" stroke-width="8.5" stroke-linecap="round"/>
    <polygon points="97,53 105,48 104,57" fill="#ef4444"/>
    <polygon points="97,53 89,48 90,57" fill="#ef4444"/>
    <circle cx="97" cy="53" r="2.5" fill="url(#goldBell)"/>
  </g>

  <g class="cat-ear-l">
    <path d="M 27 48 L 17 15 L 48 30 Z" fill="url(#coalFur)" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 28 43 L 21 21 L 43 32 Z" fill="#fda4af"/>
  </g>
  <g class="cat-ear-r">
    <path d="M 93 48 L 103 15 L 72 30 Z" fill="url(#coalFur)" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 92 43 L 99 21 L 77 32 Z" fill="#fda4af"/>
  </g>

  <ellipse cx="60" cy="86" rx="24" ry="15" fill="url(#coalFur)" stroke="#3f3f46" stroke-width="1.5"/>
  <path d="M 48 80 Q 60 98 72 80 Z" fill="#fafafa"/>

  <path d="M 36 78 Q 60 86 84 78" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <circle cx="60" cy="85" r="6.5" fill="url(#goldBell)" stroke="#92400e" stroke-width="1.2"/>
  <line x1="55" y1="84" x2="65" y2="84" stroke="#92400e" stroke-width="1"/>
  <circle cx="60" cy="87" r="1.8" fill="#451a03"/>

  <path d="M 25 56 C 25 34, 40 25, 60 25 C 80 25, 95 34, 95 56 C 100 62, 100 70, 91 73 C 84 80, 74 83, 60 83 C 46 83, 36 80, 29 73 C 20 70, 20 62, 25 56 Z" fill="url(#coalFur)" stroke="#52525b" stroke-width="1.6"/>
  <path d="M 55 26 Q 58 18 61 25 Q 65 19 66 26" fill="none" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>

  <g class="cat-blink">
    <ellipse cx="43" cy="55" rx="8.5" ry="9.5" fill="url(#amberEye)" stroke="#09090b" stroke-width="1.2"/>
    <ellipse cx="77" cy="55" rx="8.5" ry="9.5" fill="url(#amberEye)" stroke="#09090b" stroke-width="1.2"/>

    <!-- Đồng tử mắt đảo theo tia laser -->
    <g class="pupils-track">
      <ellipse cx="43" cy="55" rx="4.2" ry="6.2" fill="#09090b"/>
      <circle cx="40" cy="51" r="3" fill="#ffffff"/>
      <circle cx="46" cy="58.5" r="1.5" fill="#ffffff"/>
      <ellipse cx="77" cy="55" rx="4.2" ry="6.2" fill="#09090b"/>
      <circle cx="74" cy="51" r="3" fill="#ffffff"/>
      <circle cx="80" cy="58.5" r="1.5" fill="#ffffff"/>
    </g>
  </g>

  <ellipse cx="31" cy="64" rx="5" ry="2.8" fill="#fb7185" opacity="0.65"/>
  <ellipse cx="89" cy="64" rx="5" ry="2.8" fill="#fb7185" opacity="0.65"/>
  <polygon points="57.5,60 62.5,60 60,63" fill="#fda4af"/>
  <path d="M 56 66 Q 60 73 64 66 Z" fill="#fb7185"/>
  <path d="M 53 65 Q 56.5 69 60 65 Q 63.5 69 67 65" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round"/>

  <line x1="25" y1="60" x2="11" y2="57" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="25" y1="65" x2="11" y2="66" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="95" y1="60" x2="109" y2="57" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="95" y1="65" x2="109" y2="66" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Tay trái vồ tia laser -->
  <g class="paw-swat">
    <ellipse cx="41" cy="91" rx="8.5" ry="6.5" fill="#fafafa" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="41" cy="92.5" r="2.4" fill="#fda4af"/>
    <circle cx="37.5" cy="89" r="1.3" fill="#fda4af"/>
    <circle cx="41" cy="88" r="1.3" fill="#fda4af"/>
    <circle cx="44.5" cy="89" r="1.3" fill="#fda4af"/>
  </g>

  <ellipse cx="79" cy="91" rx="8.5" ry="6.5" fill="#fafafa" stroke="#3f3f46" stroke-width="1.5"/>
  <circle cx="79" cy="92.5" r="2.4" fill="#fda4af"/>
  <circle cx="75.5" cy="89" r="1.3" fill="#fda4af"/>
  <circle cx="79" cy="88" r="1.3" fill="#fda4af"/>
  <circle cx="82.5" cy="89" r="1.3" fill="#fda4af"/>

  <!-- Chấm đèn Laser đỏ chạy qua lại -->
  <g class="laser-dot">
    <circle cx="60" cy="94" r="5" fill="#ef4444" opacity="0.45"/>
    <circle cx="60" cy="94" r="2.6" fill="#ff0000" stroke="#ffffff" stroke-width="0.8"/>
  </g>

  <!-- Dấu ?! khi tia laser biến mất -->
  <g class="cat-confuse">
    <text x="60" y="18" font-family="Arial Black, sans-serif" font-size="14" font-weight="900" fill="#fbbf24" stroke="#09090b" stroke-width="0.8" text-anchor="middle">?!</text>
  </g>
</svg>
