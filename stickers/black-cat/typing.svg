<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bcFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="55%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="bcEye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="bcYarn" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="55%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <style>
      /* Mèo than chơi vờn cuộn len đỏ tung tóe sợi len cực cute! */
      .bc-tail { transform-origin: 88px 84px; animation: bcTail 0.45s ease-in-out infinite alternate; }
      .bc-head { transform-origin: 60px 68px; animation: bcHead 0.6s ease-in-out infinite alternate; }
      .bc-pawL { transform-origin: 41px 88px; animation: bcPawL 0.35s ease-in-out infinite alternate; }
      .bc-pawR { transform-origin: 79px 88px; animation: bcPawR 0.35s ease-in-out 0.17s infinite alternate; }
      .bc-yarn { transform-origin: 60px 96px; animation: bcYarnSpin 0.9s linear infinite; }
      .bc-yarn-hop { animation: bcYarnHop 0.45s ease-in-out infinite alternate; }
      .bc-thread { animation: bcThread 0.7s ease-in-out infinite alternate; }

      @keyframes bcTail { 0% { transform: rotate(-16deg); } 100% { transform: rotate(18deg); } }
      @keyframes bcHead { 0% { transform: rotate(-5deg) translateY(2px); } 100% { transform: rotate(5deg) translateY(0px); } }
      @keyframes bcPawL { 0% { transform: translate(0, 0) rotate(0deg); } 100% { transform: translate(8px, -6px) rotate(22deg); } }
      @keyframes bcPawR { 0% { transform: translate(0, 0) rotate(0deg); } 100% { transform: translate(-8px, -6px) rotate(-22deg); } }
      @keyframes bcYarnSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes bcYarnHop { 0% { transform: translate(-4px, 0); } 100% { transform: translate(4px, -4px); } }
      @keyframes bcThread { 0% { transform: translateY(0); } 100% { transform: translateY(-3px); } }
    </style>
  <ellipse cx="60" cy="110" rx="28" ry="4.5" fill="#020617" opacity="0.34"/>
  </defs>

  <!-- Sợi len đỏ bung dài uốn lượn quanh người mèo -->
  <g class="bc-thread">
    <path d="M 12 104 Q 24 88 38 98 T 60 96 T 94 102 Q 108 100 108 88" fill="none" stroke="#ef4444" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 18 76 Q 28 70 36 82" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Đuôi mèo vẫy tít -->
  <g class="bc-tail">
    <path d="M 86 88 C 108 84, 110 56, 96 50 C 88 48, 86 58, 94 64" fill="none" stroke="url(#bcFur)" stroke-width="8.5" stroke-linecap="round"/>
    <polygon points="97,53 105,48 104,57" fill="#ef4444"/>
    <polygon points="97,53 89,48 90,57" fill="#ef4444"/>
    <circle cx="97" cy="53" r="2.5" fill="#fbbf24"/>
  </g>

  <!-- Thân mèo va chuông vàng -->
  <ellipse cx="60" cy="84" rx="24" ry="15" fill="url(#bcFur)" stroke="#3f3f46" stroke-width="1.5"/>
  <path d="M 48 78 Q 60 94 72 78 Z" fill="#fafafa"/>
  <path d="M 36 76 Q 60 84 84 76" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <circle cx="60" cy="83" r="6" fill="#fbbf24" stroke="#92400e" stroke-width="1.2"/>

  <!-- Đầu mèo cúi xuống nhìn cuộn len thích thú -->
  <g class="bc-head">
    <path d="M 27 46 L 17 14 L 48 28 Z" fill="url(#bcFur)" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 28 41 L 21 20 L 43 30 Z" fill="#fda4af"/>
    <path d="M 93 46 L 103 14 L 72 28 Z" fill="url(#bcFur)" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 92 41 L 99 20 L 77 30 Z" fill="#fda4af"/>
    <path d="M 25 54 C 25 32, 40 23, 60 23 C 80 23, 95 32, 95 54 C 100 60, 100 68, 91 71 C 84 78, 74 81, 60 81 C 46 81, 36 78, 29 71 C 20 68, 20 60, 25 54 Z" fill="url(#bcFur)" stroke="#52525b" stroke-width="1.6"/>
    <!-- Mắt tròn xoe nhìn xuống cuộn len -->
    <ellipse cx="43" cy="54" rx="8.5" ry="9.5" fill="url(#bcEye)" stroke="#09090b" stroke-width="1.2"/>
    <ellipse cx="77" cy="54" rx="8.5" ry="9.5" fill="url(#bcEye)" stroke="#09090b" stroke-width="1.2"/>
    <circle cx="44" cy="58" r="5" fill="#09090b"/>
    <circle cx="41.5" cy="55" r="2.6" fill="#ffffff"/>
    <circle cx="76" cy="58" r="5" fill="#09090b"/>
    <circle cx="73.5" cy="55" r="2.6" fill="#ffffff"/>
    <ellipse cx="31" cy="63" rx="5" ry="2.8" fill="#fb7185" opacity="0.65"/>
    <ellipse cx="89" cy="63" rx="5" ry="2.8" fill="#fb7185" opacity="0.65"/>
    <polygon points="57.5,58 62.5,58 60,61" fill="#fda4af"/>
    <path d="M 53 63 Q 56.5 67 60 63 Q 63.5 67 67 63" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Cuộn len đỏ lăn tròn xoay tít giữa 2 chân trước -->
  <g class="bc-yarn-hop">
    <g class="bc-yarn">
      <circle cx="60" cy="96" r="14" fill="url(#bcYarn)" stroke="#7f1d1d" stroke-width="1.6"/>
      <path d="M 48 92 Q 60 84 72 92 M 46 98 Q 60 92 74 98 M 50 104 Q 60 99 70 104" fill="none" stroke="#fecaca" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 54 83 Q 58 96 52 108 M 66 84 Q 62 96 68 107" fill="none" stroke="#991b1b" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Hai chân trước vồ vờn cuộn len luân phiên -->
  <g class="bc-pawL">
    <ellipse cx="40" cy="90" rx="8.5" ry="6.5" fill="#fafafa" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="40" cy="91.5" r="2.4" fill="#fda4af"/>
    <circle cx="37" cy="88" r="1.2" fill="#fda4af"/>
    <circle cx="43" cy="88" r="1.2" fill="#fda4af"/>
  </g>
  <g class="bc-pawR">
    <ellipse cx="80" cy="90" rx="8.5" ry="6.5" fill="#fafafa" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="80" cy="91.5" r="2.4" fill="#fda4af"/>
    <circle cx="77" cy="88" r="1.2" fill="#fda4af"/>
    <circle cx="83" cy="88" r="1.2" fill="#fda4af"/>
  </g>
</svg>
