<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <clipPath id="bc-stage-clip">
      <rect x="0" y="0" width="260" height="71"/>
    </clipPath>

    <radialGradient id="bc-night-glow" cx="22%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#312e81" stop-opacity="0.24"/>
      <stop offset="82%" stop-color="#0f172a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bc-moon-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#fde047" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bc-moon-body" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="65%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>

    <linearGradient id="bc-roof-far" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="bc-roof-near" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="bc-window-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="bc-cat-fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="55%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="bc-amber-eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <linearGradient id="bc-gold-bell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <radialGradient id="bc-yarn-ball" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <linearGradient id="bc-yarn-thread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ef4444" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#f87171" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <style>
      .bc-star-a { animation: bcTwinkle 2.1s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .bc-star-b { animation: bcTwinkle 2.6s cubic-bezier(0.37, 0, 0.63, 1) -1.1s infinite alternate; }
      .bc-moon-glow { animation: bcMoonPulse 3.2s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; transform-origin: 44px 25px; }
      .bc-smoke { animation: bcSmokeDrift 2.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .bc-catX { animation: bcCatLeapX 3.4s linear infinite; }
      .bc-catY { animation: bcCatLeapY 0.85s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; transform-origin: 54px 40px; }
      .bc-yarn-roll { animation: bcRollYarn 1.7s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; transform-origin: 222px 54px; }

      @keyframes bcTwinkle {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
      @keyframes bcMoonPulse {
        0% { transform: scale(0.95); opacity: 0.78; }
        100% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes bcSmokeDrift {
        0% { transform: translate(0px, 2px); opacity: 0.25; }
        100% { transform: translate(4px, -4px); opacity: 0.6; }
      }
      @keyframes bcCatLeapX {
        0% { transform: translateX(-34px); opacity: 0; }
        8% { opacity: 1; }
        92% { opacity: 1; }
        100% { transform: translateX(176px); opacity: 0; }
      }
      @keyframes bcCatLeapY {
        0% { transform: translateY(-9px) rotate(-6deg); }
        100% { transform: translateY(6px) rotate(5deg); }
      }
      @keyframes bcRollYarn {
        0% { transform: translateX(-7px) rotate(-38deg); }
        100% { transform: translateX(7px) rotate(38deg); }
      }
    </style>
  </defs>

  <g clip-path="url(#bc-stage-clip)">
    <!-- Soft midnight moonlit backdrop glow -->
    <ellipse cx="130" cy="48" rx="128" ry="48" fill="url(#bc-night-glow)"/>

    <!-- Warm glowing full moon with layered halo -->
    <g>
      <circle class="bc-moon-glow" cx="44" cy="25" r="24" fill="url(#bc-moon-halo)"/>
      <circle cx="44" cy="25" r="13.5" fill="url(#bc-moon-body)" stroke="#fef9c3" stroke-width="0.9"/>
      <circle cx="39.5" cy="21.5" r="2.6" fill="#f59e0b" opacity="0.22"/>
      <circle cx="48.5" cy="28" r="2" fill="#f59e0b" opacity="0.2"/>
      <circle cx="45" cy="19.5" r="1.2" fill="#f59e0b" opacity="0.18"/>
      <!-- Soft night cloud wisp passing moon -->
      <path d="M 18 33 Q 27 28 36 32 Q 44 29 52 34 Q 36 37 18 33 Z" fill="#cbd5e1" opacity="0.16"/>
    </g>

    <!-- Twinkling starfield -->
    <g class="bc-star-a">
      <circle cx="88" cy="15" r="1.3" fill="#fef08a"/>
      <circle cx="152" cy="12" r="1.5" fill="#ffffff"/>
      <circle cx="204" cy="18" r="1.4" fill="#fef08a"/>
      <circle cx="240" cy="25" r="1.2" fill="#bae6fd"/>
      <path d="M 124 14 L 125.4 17.6 L 129 19 L 125.4 20.4 L 124 24 L 122.6 20.4 L 119 19 L 122.6 17.6 Z" fill="#fef08a"/>
    </g>
    <g class="bc-star-b">
      <circle cx="106" cy="26" r="1.1" fill="#bae6fd"/>
      <circle cx="176" cy="22" r="1.2" fill="#fef08a"/>
      <circle cx="222" cy="12" r="1.5" fill="#ffffff"/>
      <path d="M 188 10 L 189 12.6 L 191.6 13.6 L 189 14.6 L 188 17.2 L 187 14.6 L 184.4 13.6 L 187 12.6 Z" fill="#ffffff"/>
    </g>

    <!-- Gentle chimney smoke wisps -->
    <g class="bc-smoke" fill="none" stroke="#cbd5e1" stroke-width="1.3" stroke-linecap="round">
      <path d="M 27 42 C 25 36, 31 33, 29 27"/>
      <path d="M 161 45 C 159 39, 165 36, 163 31" opacity="0.7"/>
    </g>

    <!-- Far gabled rooftops silhouette -->
    <path d="M 4 71 L 4 56 L 26 46 L 48 56 L 68 48 L 90 58 L 112 45 L 136 57 L 158 47 L 184 56 L 210 46 L 236 55 L 256 49 L 256 71 Z" fill="url(#bc-roof-far)"/>

    <!-- Foreground gabled rooftops and brick chimneys along y=71 -->
    <g>
      <!-- Left brick chimney -->
      <rect x="21" y="44" width="12" height="19" fill="#27272a" stroke="#52525b" stroke-width="0.9"/>
      <rect x="19" y="42" width="16" height="3.2" rx="0.8" fill="#3f3f46" stroke="#71717a" stroke-width="0.7"/>
      <!-- Mid brick chimney -->
      <rect x="156" y="47" width="10" height="16" fill="#27272a" stroke="#52525b" stroke-width="0.9"/>
      <rect x="154" y="45" width="14" height="2.8" rx="0.8" fill="#3f3f46" stroke="#71717a" stroke-width="0.7"/>

      <!-- Main foreground gabled roof silhouette -->
      <path d="M 6 71 L 6 60 L 38 49 L 66 60 L 96 47 L 128 60 L 148 51 L 176 61 L 204 52 L 232 60 L 254 54 L 254 71 Z" fill="url(#bc-roof-near)"/>
      <!-- Moonlight rim highlights along roof ridges -->
      <path d="M 6 60 L 38 49 L 66 60 L 96 47 L 128 60 L 148 51 L 176 61 L 204 52 L 232 60 L 254 54" fill="none" stroke="#fde047" stroke-width="0.9" stroke-opacity="0.38" stroke-linejoin="round"/>

      <!-- Warm lit attic windows -->
      <g>
        <!-- Left gable window -->
        <rect x="33.5" y="56.5" width="9" height="9" rx="1.2" fill="#fbbf24" opacity="0.25"/>
        <rect x="35" y="58" width="6" height="6.5" rx="0.8" fill="url(#bc-window-glow)"/>
        <line x1="38" y1="58" x2="38" y2="64.5" stroke="#18181b" stroke-width="0.8"/>
        <line x1="35" y1="61.2" x2="41" y2="61.2" stroke="#18181b" stroke-width="0.8"/>

        <!-- Center tall gable window -->
        <rect x="91.5" y="54.5" width="9" height="10" rx="1.2" fill="#fbbf24" opacity="0.28"/>
        <rect x="93" y="56" width="6" height="7.5" rx="0.8" fill="url(#bc-window-glow)"/>
        <line x1="96" y1="56" x2="96" y2="63.5" stroke="#18181b" stroke-width="0.8"/>
        <line x1="93" y1="59.8" x2="99" y2="59.8" stroke="#18181b" stroke-width="0.8"/>

        <!-- Right attic dormer window -->
        <rect x="199.5" y="58.5" width="8.5" height="8.5" rx="1.2" fill="#fbbf24" opacity="0.25"/>
        <rect x="201" y="60" width="5.5" height="6" rx="0.8" fill="url(#bc-window-glow)"/>
        <line x1="203.75" y1="60" x2="203.75" y2="66" stroke="#18181b" stroke-width="0.8"/>
      </g>
    </g>

    <!-- Unwinding glowing red yarn trail across rooftops -->
    <g>
      <path d="M 30 62 C 62 56, 86 67, 118 59 C 148 52, 178 66, 218 59" fill="none" stroke="#ef4444" stroke-width="3.6" stroke-linecap="round" opacity="0.26"/>
      <path d="M 30 62 C 62 56, 86 67, 118 59 C 148 52, 178 66, 218 59" fill="none" stroke="url(#bc-yarn-thread)" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Cute Midnight Black Cat gracefully leaping across rooftops -->
    <g class="bc-catX">
      <g class="bc-catY">
        <!-- Curved black tail with red ribbon bow -->
        <path d="M 38 45 C 24 41, 18 28, 26 23 C 30 21, 32 25, 29 28" fill="none" stroke="url(#bc-cat-fur)" stroke-width="4.4" stroke-linecap="round"/>
        <polygon points="27,25 32,22 31,27.5" fill="#ef4444"/>
        <polygon points="27,25 22,22 23,27.5" fill="#ef4444"/>
        <circle cx="27" cy="25" r="1.4" fill="url(#bc-gold-bell)"/>

        <!-- Back leaping paw -->
        <ellipse cx="38" cy="52" rx="5.5" ry="3" transform="rotate(-24 38 52)" fill="url(#bc-cat-fur)" stroke="#52525b" stroke-width="0.9"/>
        <ellipse cx="34.5" cy="53.5" rx="2.6" ry="2" fill="#fafafa"/>

        <!-- Cat Body -->
        <ellipse cx="53" cy="46" rx="15" ry="9.2" transform="rotate(-6 53 46)" fill="url(#bc-cat-fur)" stroke="#52525b" stroke-width="1.1"/>
        <!-- White chest tuft -->
        <path d="M 60 44 Q 65 51 67 44 Z" fill="#fafafa"/>

        <!-- Front outstretched leaping paws -->
        <ellipse cx="69" cy="49.5" rx="5.2" ry="2.8" transform="rotate(18 69 49.5)" fill="url(#bc-cat-fur)" stroke="#52525b" stroke-width="0.9"/>
        <ellipse cx="73" cy="50.8" rx="2.6" ry="2" fill="#fafafa"/>

        <!-- Red collar and golden bell -->
        <path d="M 59 42 Q 64 47 68 44" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="64.5" cy="47.5" r="3.2" fill="url(#bc-gold-bell)" stroke="#92400e" stroke-width="0.8"/>
        <circle cx="64.5" cy="48.5" r="0.9" fill="#451a03"/>

        <!-- Pointed Ears with pink inner triangles -->
        <polygon points="60,29 57,17 67,25" fill="url(#bc-cat-fur)" stroke="#52525b" stroke-width="1" stroke-linejoin="round"/>
        <polygon points="60.5,27 59,20 65,25" fill="#fda4af"/>
        <polygon points="70,25 78,17 76,29" fill="url(#bc-cat-fur)" stroke="#52525b" stroke-width="1" stroke-linejoin="round"/>
        <polygon points="71.5,25 76,20 75,27" fill="#fda4af"/>

        <!-- Cat Head -->
        <circle cx="68.5" cy="35.5" r="11.2" fill="url(#bc-cat-fur)" stroke="#52525b" stroke-width="1.1"/>
        <!-- Glowing Amber Eye -->
        <ellipse cx="73.2" cy="35" rx="3.4" ry="3.8" fill="url(#bc-amber-eye)" stroke="#09090b" stroke-width="0.8"/>
        <ellipse cx="73.6" cy="35" rx="1.4" ry="2.7" fill="#09090b"/>
        <circle cx="72.4" cy="33.4" r="1.1" fill="#ffffff"/>
        <!-- Blush, pink nose, whiskers -->
        <ellipse cx="70.5" cy="39.5" rx="2" ry="1.1" fill="#fb7185" opacity="0.7"/>
        <polygon points="77.2,37.8 79.4,37.8 78.3,39.2" fill="#fda4af"/>
        <line x1="77" y1="39.8" x2="83.5" y2="38.8" stroke="#a1a1aa" stroke-width="0.9" stroke-linecap="round"/>
        <line x1="77" y1="41.2" x2="83" y2="42.2" stroke="#a1a1aa" stroke-width="0.9" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Rolling Glowing Red Yarn Ball on the right -->
    <g class="bc-yarn-roll">
      <circle cx="222" cy="54" r="12" fill="#ef4444" opacity="0.22"/>
      <circle cx="222" cy="54" r="8.8" fill="url(#bc-yarn-ball)" stroke="#fca5a5" stroke-width="1"/>
      <path d="M 215.5 50.5 Q 222 56 228.5 50.5" fill="none" stroke="#fecaca" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M 215.5 57.5 Q 222 52 228.5 57.5" fill="none" stroke="#fecaca" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M 219 46.5 Q 224 54 219 61.5" fill="none" stroke="#fca5a5" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>
</svg>
