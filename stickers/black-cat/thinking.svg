<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="catThFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="55%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="catThEye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="catThBell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="catThBulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <style>
      .catTh-head { transform-origin: 60px 68px; animation: catThTilt 3.2s ease-in-out infinite; }
      .catTh-tail { transform-origin: 86px 92px; animation: catThTail 2.6s ease-in-out infinite alternate; }
      .catTh-bulb { transform-origin: 94px 20px; animation: catThFlicker 2.4s ease-in-out infinite; }
      .catTh-rays { transform-origin: 94px 18px; animation: catThRays 2.4s ease-in-out infinite; }
      .catTh-paw { transform-origin: 48px 82px; animation: catThChin 3.2s ease-in-out infinite; }
      .catTh-eyes { transform-origin: 60px 58px; animation: catThLook 3.2s ease-in-out infinite; }

      @keyframes catThTilt { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(2deg); } }
      @keyframes catThTail { 0% { transform: rotate(-5deg); } 100% { transform: rotate(9deg); } }
      @keyframes catThFlicker { 0%, 100% { opacity: 0.72; transform: translateY(0) scale(0.95); } 40% { opacity: 1; transform: translateY(-2px) scale(1.08); } 55% { opacity: 0.8; transform: translateY(-1px) scale(0.98); } 70% { opacity: 1; transform: translateY(-3px) scale(1.1); } }
      @keyframes catThRays { 0%, 100% { opacity: 0.35; transform: scale(0.88); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes catThChin { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(1px, -2px) rotate(5deg); } }
      @keyframes catThLook { 0%, 100% { transform: translate(2px, -1.5px); } 50% { transform: translate(3px, -2.5px); } }
    </style>
  </defs>

  <!-- Tail with red bow -->
  <g class="catTh-tail">
    <path d="M 86 92 C 107 88, 109 62, 96 56 C 88 54, 86 64, 94 70" fill="none" stroke="url(#catThFur)" stroke-width="8.5" stroke-linecap="round"/>
    <polygon points="97,59 105,54 104,63" fill="#ef4444"/>
    <polygon points="97,59 89,54 90,63" fill="#ef4444"/>
    <circle cx="97" cy="59" r="2.4" fill="url(#catThBell)"/>
  </g>

  <!-- Body -->
  <ellipse cx="60" cy="90" rx="24" ry="15" fill="url(#catThFur)" stroke="#3f3f46" stroke-width="1.5"/>
  <path d="M 48 84 Q 60 101 72 84 Z" fill="#fafafa"/>

  <!-- Red Collar + Gold Bell -->
  <path d="M 36 82 Q 60 90 84 82" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <circle cx="60" cy="89" r="6" fill="url(#catThBell)" stroke="#92400e" stroke-width="1.2"/>
  <line x1="55.5" y1="88" x2="64.5" y2="88" stroke="#92400e" stroke-width="1"/>
  <circle cx="60" cy="91" r="1.6" fill="#451a03"/>

  <!-- Tilted Head Group -->
  <g class="catTh-head">
    <!-- Ears -->
    <path d="M 27 52 L 17 20 L 48 35 Z" fill="url(#catThFur)" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 28 47 L 21 26 L 43 37 Z" fill="#fda4af"/>
    <path d="M 93 52 L 103 20 L 72 35 Z" fill="url(#catThFur)" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 92 47 L 99 26 L 77 37 Z" fill="#fda4af"/>

    <!-- Head Shape -->
    <path d="M 25 60 C 25 38, 40 30, 60 30 C 80 30, 95 38, 95 60 C 100 66, 100 74, 91 77 C 84 84, 74 87, 60 87 C 46 87, 36 84, 29 77 C 20 74, 20 66, 25 60 Z" fill="url(#catThFur)" stroke="#52525b" stroke-width="1.6"/>
    <path d="M 55 31 Q 58 23 61 30 Q 65 24 66 31" fill="none" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes looking up toward lightbulb -->
    <ellipse cx="43" cy="59" rx="8.5" ry="9" fill="url(#catThEye)" stroke="#09090b" stroke-width="1.2"/>
    <ellipse cx="77" cy="59" rx="8.5" ry="9" fill="url(#catThEye)" stroke="#09090b" stroke-width="1.2"/>
    <g class="catTh-eyes">
      <ellipse cx="43" cy="59" rx="4" ry="5.8" fill="#09090b"/>
      <circle cx="40.5" cy="55.5" r="2.8" fill="#ffffff"/>
      <ellipse cx="77" cy="59" rx="4" ry="5.8" fill="#09090b"/>
      <circle cx="74.5" cy="55.5" r="2.8" fill="#ffffff"/>
    </g>

    <!-- Cheeks, Nose, Curious Thinking Mouth -->
    <ellipse cx="31" cy="68" rx="5" ry="2.6" fill="#fb7185" opacity="0.6"/>
    <ellipse cx="89" cy="68" rx="5" ry="2.6" fill="#fb7185" opacity="0.6"/>
    <polygon points="57.5,64 62.5,64 60,67" fill="#fda4af"/>
    <path d="M 55 71 Q 60 69 65 71" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="25" y1="64" x2="11" y2="61" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="25" y1="69" x2="11" y2="70" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="95" y1="64" x2="109" y2="61" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="95" y1="69" x2="109" y2="70" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Right Paw resting -->
  <ellipse cx="79" cy="95" rx="8.5" ry="6.2" fill="#fafafa" stroke="#3f3f46" stroke-width="1.5"/>
  <circle cx="79" cy="96.5" r="2.2" fill="#fda4af"/>
  <circle cx="75.5" cy="93" r="1.2" fill="#fda4af"/>
  <circle cx="79" cy="92" r="1.2" fill="#fda4af"/>
  <circle cx="82.5" cy="93" r="1.2" fill="#fda4af"/>

  <!-- Left Paw raised to chin -->
  <g class="catTh-paw">
    <ellipse cx="47" cy="83" rx="8" ry="6.2" transform="rotate(-24 47 83)" fill="#fafafa" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="47" cy="84" r="2.2" fill="#fda4af"/>
    <circle cx="44" cy="81" r="1.2" fill="#fda4af"/>
    <circle cx="47.5" cy="80" r="1.2" fill="#fda4af"/>
    <circle cx="50.5" cy="81.5" r="1.2" fill="#fda4af"/>
  </g>

  <!-- Flickering Golden Lightbulb Idea above head -->
  <g class="catTh-bulb">
    <circle cx="94" cy="18" r="16" fill="url(#catThBulbGlow)"/>
    <g class="catTh-rays" stroke="#facc15" stroke-width="1.8" stroke-linecap="round">
      <line x1="94" y1="3" x2="94" y2="6"/>
      <line x1="106" y1="8" x2="103.5" y2="10.5"/>
      <line x1="82" y1="8" x2="84.5" y2="10.5"/>
      <line x1="109" y1="18" x2="106" y2="18"/>
      <line x1="79" y1="18" x2="82" y2="18"/>
    </g>
    <path d="M 88 21 C 86 15, 89 9, 94 9 C 99 9, 102 15, 100 21 C 99 23, 98 24, 98 26 L 90 26 C 90 24, 89 23, 88 21 Z" fill="#fef08a" stroke="#b45309" stroke-width="1.3"/>
    <path d="M 92 22 L 94 17 L 96 22" fill="none" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>
    <rect x="90.5" y="26" width="7" height="4" rx="1.5" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  </g>
</svg>
