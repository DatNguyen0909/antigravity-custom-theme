<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="catDnFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="55%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="catDnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="catDnFish" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <style>
      .catDn-hop { transform-origin: 60px 104px; animation: catDnHop 2.2s ease-in-out infinite; }
      .catDn-tail { transform-origin: 86px 88px; animation: catDnTail 1.4s ease-in-out infinite alternate; }
      .catDn-fish { transform-origin: 60px 88px; animation: catDnHug 2.2s ease-in-out infinite; }
      .catDn-star1 { transform-origin: 18px 24px; animation: catDnStar 2.1s ease-in-out infinite; }
      .catDn-star2 { transform-origin: 103px 22px; animation: catDnStar 2.1s 0.7s ease-in-out infinite; }
      .catDn-star3 { transform-origin: 105px 62px; animation: catDnStar 2.1s 1.3s ease-in-out infinite; }

      @keyframes catDnHop { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-5px) scale(1.02, 0.98); } }
      @keyframes catDnTail { 0% { transform: rotate(-10deg); } 100% { transform: rotate(16deg); } }
      @keyframes catDnHug { 0%, 100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(3deg) scale(1.05); } }
      @keyframes catDnStar { 0%, 100% { transform: scale(0.55) rotate(0deg); opacity: 0.45; } 50% { transform: scale(1.2) rotate(20deg); opacity: 1; } }
    </style>
  </defs>

  <g class="catDn-hop">
    <!-- Bouncing Tail with Red Bow -->
    <g class="catDn-tail">
      <path d="M 86 88 C 108 82, 110 52, 96 46 C 88 44, 86 54, 94 60" fill="none" stroke="url(#catDnFur)" stroke-width="8.5" stroke-linecap="round"/>
      <polygon points="97,49 105,44 104,53" fill="#ef4444"/>
      <polygon points="97,49 89,44 90,53" fill="#ef4444"/>
      <circle cx="97" cy="49" r="2.5" fill="url(#catDnGold)"/>
    </g>

    <!-- Ears -->
    <path d="M 27 48 L 17 15 L 48 30 Z" fill="url(#catDnFur)" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 28 43 L 21 21 L 43 32 Z" fill="#fda4af"/>
    <path d="M 93 48 L 103 15 L 72 30 Z" fill="url(#catDnFur)" stroke="#52525b" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 92 43 L 99 21 L 77 32 Z" fill="#fda4af"/>

    <!-- Body -->
    <ellipse cx="60" cy="87" rx="24" ry="16" fill="url(#catDnFur)" stroke="#3f3f46" stroke-width="1.5"/>
    <path d="M 48 80 Q 60 98 72 80 Z" fill="#fafafa"/>

    <!-- Collar -->
    <path d="M 36 78 Q 60 85 84 78" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>

    <!-- Head -->
    <path d="M 25 56 C 25 34, 40 25, 60 25 C 80 25, 95 34, 95 56 C 100 62, 100 70, 91 73 C 84 80, 74 83, 60 83 C 46 83, 36 80, 29 73 C 20 70, 20 62, 25 56 Z" fill="url(#catDnFur)" stroke="#52525b" stroke-width="1.6"/>
    <path d="M 55 26 Q 58 18 61 25 Q 65 19 66 26" fill="none" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>

    <!-- Happy Joyful Smiling Eyes ^ ^ -->
    <path d="M 35 55 Q 43 45 51 55" fill="none" stroke="#fbbf24" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 69 55 Q 77 45 85 55" fill="none" stroke="#fbbf24" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Rosy Cheeks va Big Happy Mouth -->
    <ellipse cx="31" cy="64" rx="5.5" ry="3" fill="#fb7185" opacity="0.8"/>
    <ellipse cx="89" cy="64" rx="5.5" ry="3" fill="#fb7185" opacity="0.8"/>
    <polygon points="57.5,59 62.5,59 60,62" fill="#fda4af"/>
    <path d="M 54 65 Q 60 75 66 65 Z" fill="#fb7185"/>
    <path d="M 52 64 Q 56 68 60 64 Q 64 68 68 64" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="25" y1="60" x2="11" y2="57" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="25" y1="65" x2="11" y2="66" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="95" y1="60" x2="109" y2="57" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="95" y1="65" x2="109" y2="66" stroke="#a1a1aa" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Golden Dried Fish hugged by paws -->
    <g class="catDn-fish">
      <!-- Fish Tail -->
      <polygon points="78,90 91,82 89,98" fill="url(#catDnFish)" stroke="#92400e" stroke-width="1.4" stroke-linejoin="round"/>
      <!-- Fish Body -->
      <path d="M 34 90 C 42 79, 68 79, 80 90 C 68 101, 42 101, 34 90 Z" fill="url(#catDnFish)" stroke="#92400e" stroke-width="1.5"/>
      <!-- Fish Gill va Stripes -->
      <path d="M 46 84 Q 49 90 46 96" fill="none" stroke="#92400e" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 55 83 L 57 90 L 55 96 M 64 84 L 66 90 L 64 95" fill="none" stroke="#fef08a" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="41" cy="88.5" r="1.8" fill="#451a03"/>
      <circle cx="40.5" cy="88" r="0.7" fill="#ffffff"/>

      <!-- Left va Right White Paws hugging the fish -->
      <ellipse cx="47" cy="94" rx="7.5" ry="5.5" transform="rotate(-15 47 94)" fill="#fafafa" stroke="#3f3f46" stroke-width="1.5"/>
      <circle cx="47" cy="95" r="2" fill="#fda4af"/>
      <ellipse cx="73" cy="94" rx="7.5" ry="5.5" transform="rotate(15 73 94)" fill="#fafafa" stroke="#3f3f46" stroke-width="1.5"/>
      <circle cx="73" cy="95" r="2" fill="#fda4af"/>
    </g>
  </g>

  <!-- Sparkling Golden Stars -->
  <g class="catDn-star1">
    <path d="M18 16 L20 22 L26 24 L20 26 L18 32 L16 26 L10 24 L16 22 Z" fill="#facc15"/>
  </g>
  <g class="catDn-star2">
    <path d="M103 15 L104.8 20.2 L110 22 L104.8 23.8 L103 29 L101.2 23.8 L96 22 L101.2 20.2 Z" fill="#fef08a"/>
  </g>
  <g class="catDn-star3">
    <path d="M105 57 L106.2 60.8 L110 62 L106.2 63.2 L105 67 L103.8 63.2 L100 62 L103.8 60.8 Z" fill="#fbbf24"/>
  </g>
</svg>
