<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95">
  <defs>
    <linearGradient id="phBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="fireCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fb7185" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.88"/>
    </linearGradient>
    <style>
      .cloud-l { animation: fireCloudL 2.8s ease-in-out infinite alternate; }
      .cloud-r { animation: fireCloudR 2.3s ease-in-out infinite alternate; }
      .phoenix-fly { animation: phFlight 3.6s ease-in-out infinite; }
      .wing-flap { animation: phWing 0.35s ease-in-out infinite alternate; transform-origin: 64px 44px; }
      @keyframes fireCloudL { 0% { transform: translate(0, 0); } 100% { transform: translate(5px, -3px); } }
      @keyframes fireCloudR { 0% { transform: translate(0, 0); } 100% { transform: translate(-5px, 3px); } }
      @keyframes phFlight {
        0% { transform: translate(115px, 6px) rotate(-4deg); }
        25% { transform: translate(55px, -8px) rotate(6deg); }
        50% { transform: translate(6px, 4px) rotate(-3deg); }
        75% { transform: translate(60px, 10px) rotate(-7deg); }
        100% { transform: translate(115px, 6px) rotate(-4deg); }
      }
      @keyframes phWing {
        0% { transform: rotate(-22deg) scaleY(0.9); }
        100% { transform: rotate(18deg) scaleY(1.1); }
      }
    </style>
  </defs>

  <!-- MẶT TRỜI ĐỎ va MÂY LỬA BÊN TRÁI -->
  <g class="cloud-l">
    <circle cx="52" cy="40" r="20" fill="#fbbf24" opacity="0.28"/>
    <circle cx="52" cy="40" r="13" fill="#fde047" opacity="0.65"/>
    <path d="M 16 60 C 8 60, 6 48, 16 42 C 16 30, 30 24, 42 30 C 50 20, 70 20, 78 30 C 90 26, 102 36, 98 46 C 106 52, 98 62, 86 62 Z" fill="url(#fireCloud)" stroke="#fef08a" stroke-width="1.4"/>
    <path d="M 28 50 C 34 44, 44 44, 48 50" fill="none" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- PHƯỢNG HOÀNG LỬA SẢI CÁNH BAY QUA MÂY -->
  <g class="phoenix-fly">
    <!-- 3 Dải đuôi lửa thướt tha -->
    <path d="M 42 46 C 24 36, 10 28, 2 34 C 12 40, 24 46, 40 48" fill="none" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 42 48 C 22 46, 8 44, 0 50 C 12 52, 26 52, 42 50" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <path d="M 42 50 C 26 56, 12 60, 4 64 C 16 62, 30 56, 42 52" fill="none" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
    <!-- Thân va Đầu Phượng Hoàng Chibi -->
    <path d="M 38 46 C 46 34, 68 32, 82 38 C 90 42, 92 50, 84 56 C 72 60, 50 58, 38 46 Z" fill="url(#phBody)" stroke="#881337" stroke-width="1.4"/>
    <!-- Mào lửa vàng kim trên đỉnh đầu -->
    <path d="M 74 34 C 70 22, 62 18, 56 20 C 62 24, 66 28, 68 35" fill="#fef08a" stroke="#b45309" stroke-width="1"/>
    <!-- Mắt hồng ngọc va mỏ vàng -->
    <ellipse cx="78" cy="43" rx="3.5" ry="3.8" fill="#4c0519"/>
    <circle cx="79" cy="41.8" r="1.4" fill="#ffffff"/>
    <path d="M 88 43 L 96 46 L 88 49 Z" fill="#fef08a" stroke="#92400e" stroke-width="1"/>
    <!-- Cánh lửa vỗ nhịp nhàng -->
    <g class="wing-flap">
      <path d="M 66 44 C 54 22, 34 16, 22 22 C 30 30, 42 38, 58 48 Z" fill="url(#phBody)" stroke="#fef08a" stroke-width="1.3"/>
    </g>
  </g>

  <!-- MÂY LỬA NHỎ BÊN PHẢI (Lớp trước) -->
  <g class="cloud-r">
    <path d="M 184 62 C 176 62, 174 52, 182 48 C 182 38, 194 34, 202 38 C 208 30, 224 30, 230 39 C 240 37, 248 44, 244 53 C 250 58, 244 64, 234 64 Z" fill="url(#fireCloud)" stroke="#fef08a" stroke-width="1.4"/>
  </g>
</svg>
