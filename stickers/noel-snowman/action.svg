<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <!-- Existing Sleigh, Pine, and Snow Gradients -->
    <linearGradient id="sleighRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="65%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="pineGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="snowWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <clipPath id="noelClip">
      <rect x="0" y="0" width="260" height="71"/>
    </clipPath>

    <!-- Cozy Christmas Night Backdrop Gradients -->
    <linearGradient id="nlBgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091026" stop-opacity="0.44"/>
      <stop offset="55%" stop-color="#1e1b4b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="nlBgAurora1" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="30%" stop-color="#34d399" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="85%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nlBgAurora2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="40%" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nlBgMoonAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.58"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nlBgMoon" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </radialGradient>
    <linearGradient id="nlBgHillFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="nlBgHillMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="nlBgWinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sleigh-teamX {
        animation: sleighFlyX 3.2s linear infinite;
      }
      .sleigh-teamY {
        transform-origin: 75px 40px;
        animation: sleighFlyY 1.0s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .reindeer-legs {
        transform-origin: 42px 52px;
        animation: deerGallop 0.45s ease-in-out infinite alternate;
      }
      .gift-drop-1 {
        animation: dropGift1 3.2s ease-in infinite;
      }
      .gift-drop-2 {
        animation: dropGift2 3.2s ease-in infinite;
      }
      .tree-lights {
        animation: twinkleTree 1.1s ease-in-out infinite alternate;
      }

      /* Christmas Night Backdrop Animations */
      .nlBg-aurora1 { animation: nlBgAuroraWave1 6.2s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .nlBg-aurora2 { animation: nlBgAuroraWave2 7.4s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .nlBg-moon-pulse { transform-origin: 76px 17px; animation: nlBgMoonGlow 3.2s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .nlBg-star1 { animation: nlBgTwinkle 1.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .nlBg-star2 { animation: nlBgTwinkle 2.3s cubic-bezier(0.37, 0, 0.63, 1) -0.9s infinite alternate; }
      .nlBg-star3 { animation: nlBgTwinkle 2.0s cubic-bezier(0.37, 0, 0.63, 1) -1.4s infinite alternate; }
      .nlBg-win-glow { animation: nlBgCabinGlow 2.4s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .nlBg-smoke1 { animation: nlBgChimneyRise 3.2s linear infinite; }
      .nlBg-smoke2 { animation: nlBgChimneyRise 3.2s linear -1.1s infinite; }
      .nlBg-smoke3 { animation: nlBgChimneyRise 3.2s linear -2.2s infinite; }
      .nlBg-snow1 { animation: nlBgSnowFallA 4.4s linear infinite; }
      .nlBg-snow2 { animation: nlBgSnowFallB 5.2s linear -1.7s infinite; }
      .nlBg-snow3 { animation: nlBgSnowFallA 3.9s linear -2.6s infinite; }
      .nlBg-snow4 { animation: nlBgSnowFallB 4.8s linear -0.8s infinite; }

      @keyframes nlBgAuroraWave1 {
        0% { transform: translateX(-8px) skewX(-4deg); opacity: 0.65; }
        100% { transform: translateX(10px) skewX(5deg); opacity: 1; }
      }
      @keyframes nlBgAuroraWave2 {
        0% { transform: translateX(9px) skewX(3deg); opacity: 0.55; }
        100% { transform: translateX(-9px) skewX(-4deg); opacity: 0.92; }
      }
      @keyframes nlBgMoonGlow {
        0% { transform: scale(0.95); opacity: 0.88; }
        100% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes nlBgTwinkle {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
      @keyframes nlBgCabinGlow {
        0% { opacity: 0.78; }
        100% { opacity: 1; }
      }
      @keyframes nlBgChimneyRise {
        0% { transform: translate(0px, 0px) scale(0.6); opacity: 0; }
        18% { opacity: 0.72; }
        80% { opacity: 0.45; }
        100% { transform: translate(6px, -16px) scale(1.45); opacity: 0; }
      }
      @keyframes nlBgSnowFallA {
        0% { transform: translate(0px, -8px); opacity: 0; }
        12% { opacity: 0.92; }
        88% { opacity: 0.85; }
        100% { transform: translate(-10px, 74px); opacity: 0; }
      }
      @keyframes nlBgSnowFallB {
        0% { transform: translate(0px, -8px); opacity: 0; }
        12% { opacity: 0.85; }
        88% { opacity: 0.8; }
        100% { transform: translate(8px, 74px); opacity: 0; }
      }

      @keyframes sleighFlyX {
        0% { transform: translateX(165px); opacity: 0; }
        7% { opacity: 1; }
        93% { opacity: 1; }
        100% { transform: translateX(-105px); opacity: 0; }
      }
      @keyframes sleighFlyY {
        0% { transform: translateY(-7px) rotate(-3.5deg); }
        100% { transform: translateY(6px) rotate(3.5deg); }
      }
      @keyframes deerGallop {
        0% { transform: rotate(-14deg); }
        100% { transform: rotate(16deg); }
      }
      @keyframes dropGift1 {
        0%, 20% { opacity: 0; transform: translate(145px, 32px) scale(0.4); }
        28% { opacity: 1; transform: translate(145px, 38px) scale(1); }
        65% { opacity: 1; transform: translate(145px, 60px) rotate(18deg) scale(1); }
        80%, 100% { opacity: 0; transform: translate(145px, 64px) scale(0.6); }
      }
      @keyframes dropGift2 {
        0%, 50% { opacity: 0; transform: translate(75px, 30px) scale(0.4); }
        58% { opacity: 1; transform: translate(75px, 36px) scale(1); }
        88% { opacity: 1; transform: translate(75px, 60px) rotate(-15deg) scale(1); }
        98%, 100% { opacity: 0; transform: translate(75px, 64px) scale(0.6); }
      }
      @keyframes twinkleTree {
        0% { opacity: 0.45; filter: drop-shadow(0 0 2px #facc15); }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #fef08a); }
      }
    </style>
  </defs>

  <g clip-path="url(#noelClip)">
    <!-- DEEP STARRY WINTER TWILIGHT SKY GLOW -->
    <rect x="0" y="0" width="260" height="71" fill="url(#nlBgSky)"/>

    <!-- SOFT NORTHERN-LIGHTS SHIMMER -->
    <g class="nlBg-aurora1">
      <path d="M -10 24 Q 42 8 98 19 T 204 12 T 270 22 L 270 36 Q 204 24 146 31 T 40 28 L -10 36 Z" fill="url(#nlBgAurora1)"/>
    </g>
    <g class="nlBg-aurora2">
      <path d="M -10 15 Q 64 26 132 14 T 270 18 L 270 28 Q 196 22 130 27 T -10 26 Z" fill="url(#nlBgAurora2)"/>
    </g>

    <!-- TWINKLING WINTER STARS -->
    <g fill="#fef08a">
      <circle class="nlBg-star1" cx="14" cy="10" r="1.2"/>
      <circle class="nlBg-star2" cx="48" cy="7" r="1.0" fill="#e0f2fe"/>
      <path class="nlBg-star1" d="M 118 6 L 119 8.5 L 121.5 9.5 L 119 10.5 L 118 13 L 117 10.5 L 114.5 9.5 L 117 8.5 Z"/>
      <circle class="nlBg-star3" cx="152" cy="11" r="1.3" fill="#e0f2fe"/>
      <circle class="nlBg-star2" cx="184" cy="7" r="1.1"/>
      <path class="nlBg-star3" d="M 206 10 L 207 12 L 209 13 L 207 14 L 206 16 L 205 14 L 203 13 L 205 12 Z" fill="#bae6fd"/>
      <circle class="nlBg-star1" cx="246" cy="10" r="1.2"/>
    </g>

    <!-- GLOWING WINTER FULL MOON -->
    <g class="nlBg-moon-pulse">
      <circle cx="76" cy="17" r="22" fill="url(#nlBgMoonAura)"/>
      <circle cx="76" cy="17" r="10.5" fill="url(#nlBgMoon)"/>
      <circle cx="73" cy="14.5" r="2.2" fill="#93c5fd" opacity="0.28"/>
      <circle cx="80" cy="19.5" r="1.6" fill="#93c5fd" opacity="0.22"/>
    </g>

    <!-- DISTANT SNOW-COVERED PINE HILL SILHOUETTES -->
    <path d="M 0 58 Q 48 44 108 55 T 212 49 Q 238 46 260 54 L 260 71 L 0 71 Z" fill="url(#nlBgHillFar)"/>
    <!-- Distant Miniature Pine Silhouettes along Ridge -->
    <g fill="#0f2942" opacity="0.72">
      <polygon points="62,48 57,57 67,57"/>
      <polygon points="72,46 66,57 78,57"/>
      <polygon points="88,49 83,58 93,58"/>
      <polygon points="148,50 143,59 153,59"/>
      <polygon points="198,47 193,57 203,57"/>
      <polygon points="248,49 243,58 253,58"/>
    </g>
    <!-- Midground Frosted Snow Ridge -->
    <path d="M 0 64 Q 56 52 126 60 T 260 59 L 260 71 L 0 71 Z" fill="url(#nlBgHillMid)"/>

    <!-- COZY LIT WOODEN CABIN ON THE SNOW RIDGE -->
    <g transform="translate(160, 44)">
      <!-- Chimney Smoke Puffs -->
      <circle class="nlBg-smoke1" cx="23.5" cy="1" r="2.2" fill="#e2e8f0"/>
      <circle class="nlBg-smoke2" cx="24" cy="0" r="2.6" fill="#cbd5e1"/>
      <circle class="nlBg-smoke3" cx="23" cy="1" r="1.9" fill="#f1f5f9"/>
      <!-- Chimney -->
      <rect x="21.5" y="1" width="4" height="7" fill="#573222"/>
      <!-- Warm Spill Glow from Windows -->
      <g class="nlBg-win-glow">
        <circle cx="11" cy="15" r="7.5" fill="url(#nlBgWinGlow)"/>
        <circle cx="21" cy="15" r="7.5" fill="url(#nlBgWinGlow)"/>
      </g>
      <!-- Timber Cabin Body -->
      <rect x="4" y="9" width="24" height="13" rx="0.8" fill="#451a03" stroke="#291206" stroke-width="0.7"/>
      <!-- Pitched Roof + Snow Blanket -->
      <polygon points="1,10 16,1 31,10" fill="#7c2d12"/>
      <path d="M 0.5 10 L 16 0.5 L 31.5 10 Q 25 12 20 9.5 Q 16 11.5 11 9.5 Q 6 11.5 0.5 10 Z" fill="#f8fafc"/>
      <!-- Glowing Warm Windows and Cozy Door -->
      <rect x="7" y="12.5" width="5.5" height="5" rx="0.5" fill="#fef08a"/>
      <line x1="9.75" y1="12.5" x2="9.75" y2="17.5" stroke="#92400e" stroke-width="0.6"/>
      <line x1="7" y1="15" x2="12.5" y2="15" stroke="#92400e" stroke-width="0.6"/>
      <rect x="14.2" y="14.5" width="3.8" height="7.5" rx="0.5" fill="#78350f"/>
      <rect x="19.5" y="12.5" width="5.5" height="5" rx="0.5" fill="#fde047"/>
      <line x1="22.25" y1="12.5" x2="22.25" y2="17.5" stroke="#92400e" stroke-width="0.6"/>
      <line x1="19.5" y1="15" x2="25" y2="15" stroke="#92400e" stroke-width="0.6"/>
    </g>

    <!-- BACKGROUND: Snowy Hills va Decorated Christmas Pine Trees flush on y=70 -->
    <path d="M 8 66 Q 65 56 130 64 T 252 65 L 252 71 L 8 71 Z" fill="#e0f2fe" opacity="0.38"/>

    <!-- Left Big Christmas Tree -->
    <g transform="translate(22, 10)">
      <rect x="15" y="48" width="6" height="12" rx="1" fill="#78350f"/>
      <polygon points="18,4 4,24 32,24" fill="url(#pineGreen)"/>
      <polygon points="18,15 1,38 35,38" fill="url(#pineGreen)"/>
      <polygon points="18,27 -2,52 38,52" fill="url(#pineGreen)"/>
      <!-- Snow caps on branches -->
      <path d="M 18 4 L 10 15 Q 18 18 26 15 Z" fill="#ffffff" opacity="0.85"/>
      <!-- Tree Topper Star va Ornaments -->
      <g class="tree-lights">
        <circle cx="18" cy="4" r="4" fill="#facc15"/>
        <circle cx="12" cy="22" r="2.2" fill="#ef4444"/>
        <circle cx="24" cy="33" r="2.2" fill="#38bdf8"/>
        <circle cx="10" cy="44" r="2.4" fill="#facc15"/>
        <circle cx="26" cy="46" r="2.2" fill="#ec4899"/>
      </g>
    </g>

    <!-- Center-Right Medium Christmas Tree -->
    <g transform="translate(112, 22) scale(0.78)">
      <rect x="15" y="48" width="6" height="12" rx="1" fill="#78350f"/>
      <polygon points="18,4 4,24 32,24" fill="url(#pineGreen)"/>
      <polygon points="18,15 1,38 35,38" fill="url(#pineGreen)"/>
      <polygon points="18,27 -2,52 38,52" fill="url(#pineGreen)"/>
      <g class="tree-lights">
        <circle cx="18" cy="4" r="3.8" fill="#facc15"/>
        <circle cx="13" cy="28" r="2.2" fill="#facc15"/>
        <circle cx="23" cy="42" r="2.4" fill="#ef4444"/>
      </g>
    </g>

    <!-- Right Christmas Tree -->
    <g transform="translate(208, 14) scale(0.9)">
      <rect x="15" y="48" width="6" height="12" rx="1" fill="#78350f"/>
      <polygon points="18,4 4,24 32,24" fill="url(#pineGreen)"/>
      <polygon points="18,15 1,38 35,38" fill="url(#pineGreen)"/>
      <polygon points="18,27 -2,52 38,52" fill="url(#pineGreen)"/>
      <g class="tree-lights">
        <circle cx="18" cy="4" r="4" fill="#facc15"/>
        <circle cx="11" cy="32" r="2.2" fill="#38bdf8"/>
        <circle cx="25" cy="44" r="2.4" fill="#ef4444"/>
      </g>
    </g>

    <!-- Dropping Christmas Gifts along the flight path -->
    <g class="gift-drop-1">
      <rect x="-7" y="-7" width="14" height="12" rx="1.5" fill="#ef4444" stroke="#fef08a" stroke-width="1"/>
      <line x1="0" y1="-7" x2="0" y2="5" stroke="#facc15" stroke-width="2.5"/>
      <line x1="-7" y1="-1" x2="7" y2="-1" stroke="#facc15" stroke-width="2.5"/>
    </g>
    <g class="gift-drop-2">
      <rect x="-7" y="-7" width="14" height="12" rx="1.5" fill="#10b981" stroke="#fef08a" stroke-width="1"/>
      <line x1="0" y1="-7" x2="0" y2="5" stroke="#facc15" stroke-width="2.5"/>
      <line x1="-7" y1="-1" x2="7" y2="-1" stroke="#facc15" stroke-width="2.5"/>
    </g>

    <!-- FOREGROUND: Flying Rudolph Reindeer + Snowman in Santa Sleigh -->
    <g class="sleigh-teamX">
    <g class="sleigh-teamY">
      <!-- Golden Magic Stardust Trail behind sleigh -->
      <path d="M 110 52 Q 140 56 168 48" fill="none" stroke="url(#goldTrim)" stroke-width="2.5" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.85"/>
      <circle cx="128" cy="50" r="2" fill="#fef08a"/>
      <circle cx="146" cy="53" r="1.6" fill="#facc15"/>

      <!-- Cute Flying Rudolph Reindeer (Leading on the left) -->
      <g transform="translate(15, 22)">
        <!-- Galloping Legs -->
        <g class="reindeer-legs" stroke="#78350f" stroke-width="2.8" stroke-linecap="round">
          <line x1="16" y1="28" x2="8" y2="37"/>
          <line x1="21" y1="28" x2="15" y2="38"/>
          <line x1="32" y1="28" x2="39" y2="37"/>
          <line x1="36" y1="28" x2="43" y2="35"/>
        </g>
        <!-- Reindeer Body va Tail -->
        <ellipse cx="26" cy="24" rx="13" ry="7.5" fill="#b45309" stroke="#78350f" stroke-width="1"/>
        <path d="M 38 20 Q 43 16 41 24 Z" fill="#fef3c7"/>
        <!-- Neck va Head -->
        <path d="M 14 22 L 10 12 L 19 14 Z" fill="#b45309"/>
        <ellipse cx="11" cy="12" rx="7.5" ry="6" fill="#b45309" stroke="#78350f" stroke-width="1"/>
        <!-- Antlers -->
        <path d="M 12 6 L 15 -2 M 13 2 L 18 1 M 9 6 L 7 -1" stroke="#fde68a" stroke-width="2" stroke-linecap="round"/>
        <!-- Eye -->
        <circle cx="9" cy="11" r="1.6" fill="#0f172a"/>
        <circle cx="8.5" cy="10.5" r="0.6" fill="#ffffff"/>
        <!-- Glowing Red Rudolph Nose! -->
        <circle cx="3" cy="12" r="3" fill="#ef4444"/>
        <circle cx="3" cy="12" r="5.5" fill="#ef4444" opacity="0.4"/>
        <!-- Golden Jingle Collar -->
        <path d="M 12 17 Q 15 21 19 18" fill="none" stroke="#facc15" stroke-width="2.2"/>
      </g>

      <!-- Golden Reins connecting Reindeer to Sleigh -->
      <path d="M 32 39 Q 50 45 66 38" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="2 2"/>

      <!-- Santa Sleigh -->
      <g transform="translate(60, 16)">
        <!-- Golden Sleigh Runners (Skis) -->
        <path d="M -4 44 Q 4 44 10 38 L 52 38 Q 58 38 60 33" fill="none" stroke="url(#goldTrim)" stroke-width="2.8" stroke-linecap="round"/>
        <line x1="16" y1="32" x2="16" y2="38" stroke="#facc15" stroke-width="2.2"/>
        <line x1="42" y1="32" x2="42" y2="38" stroke="#facc15" stroke-width="2.2"/>

        <!-- Gift Sack in the back of the sleigh -->
        <circle cx="45" cy="18" r="11" fill="#16a34a" stroke="#065f46" stroke-width="1.2"/>
        <rect x="36" y="8" width="9" height="8" rx="1" fill="#facc15" stroke="#b45309" stroke-width="1"/>

        <!-- Chibi Snowman sitting in the Sleigh! -->
        <circle cx="27" cy="22" r="11" fill="url(#snowWhite)" stroke="#7dd3fc" stroke-width="1"/>
        <circle cx="25" cy="10" r="9.5" fill="url(#snowWhite)" stroke="#7dd3fc" stroke-width="1"/>
        <!-- Snowman Scarf fluttering back -->
        <path d="M 18 16 Q 26 20 34 16 Q 45 14 52 19" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Snowman Eyes va Carrot Nose (Facing Left) -->
        <circle cx="21" cy="9" r="1.8" fill="#0f172a"/>
        <circle cx="20.5" cy="8.4" r="0.7" fill="#ffffff"/>
        <polygon points="19,11 10,12.5 19,13.5" fill="#fb923c"/>
        <!-- Snowman Santa Hat -->
        <path d="M 17 4 Q 26 -8 37 1 Q 32 4 33 6 Z" fill="#ef4444"/>
        <rect x="16" y="2" width="18" height="4" rx="2" fill="#ffffff"/>
        <circle cx="38" cy="2" r="3" fill="#ffffff"/>

        <!-- Sleigh Body -->
        <path d="M 4 20 Q 4 34 16 34 L 46 34 Q 56 34 56 18 L 46 18 Q 42 25 22 25 L 12 16 Q 4 14 4 20 Z" fill="url(#sleighRed)" stroke="#fef08a" stroke-width="1.3"/>
        <!-- Gold Sleigh Scrollwork -->
        <path d="M 12 27 Q 28 31 46 26" fill="none" stroke="url(#goldTrim)" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    </g>

    <!-- GENTLY FALLING SPARKLING SNOWFLAKES -->
    <g fill="#ffffff">
      <circle class="nlBg-snow1" cx="26" cy="0" r="1.3"/>
      <circle class="nlBg-snow2" cx="62" cy="0" r="1.6" fill="#e0f2fe"/>
      <circle class="nlBg-snow3" cx="98" cy="0" r="1.2"/>
      <circle class="nlBg-snow4" cx="136" cy="0" r="1.5" fill="#bae6fd"/>
      <circle class="nlBg-snow1" cx="174" cy="0" r="1.3"/>
      <circle class="nlBg-snow2" cx="210" cy="0" r="1.4" fill="#e0f2fe"/>
      <circle class="nlBg-snow3" cx="244" cy="0" r="1.5"/>
      <path class="nlBg-snow4" d="M 82 0 L 82 4 M 80 2 L 84 2 M 80.6 0.6 L 83.4 3.4 M 83.4 0.6 L 80.6 3.4" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round"/>
      <path class="nlBg-snow1" d="M 192 0 L 192 4 M 190 2 L 194 2 M 190.6 0.6 L 193.4 3.4 M 193.4 0.6 L 190.6 3.4" stroke="#e0f2fe" stroke-width="0.7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
