<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="smThSnow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="smThRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="smThCarrot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="smThLanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <style>
      .smTh-body { transform-origin: 58px 104px; animation: smThSway 3.2s ease-in-out infinite; }
      .smTh-glass { transform-origin: 86px 72px; animation: smThInspect 2.6s ease-in-out infinite; }
      .smTh-lantern { transform-origin: 20px 16px; animation: smThSwing 3s ease-in-out infinite alternate; }
      .smTh-glow { animation: smThPulse 2.2s ease-in-out infinite; }

      @keyframes smThSway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(2deg); } }
      @keyframes smThInspect { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(-4px, -3px) rotate(-10deg); } }
      @keyframes smThSwing { 0% { transform: rotate(-6deg); } 100% { transform: rotate(6deg); } }
      @keyframes smThPulse { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- Snowy ground shadow -->
  <ellipse cx="58" cy="109" rx="34" ry="6.5" fill="#052e16" opacity="0.4"/>
  <ellipse cx="58" cy="108" rx="28" ry="4" fill="#e0f2fe" opacity="0.75"/>

  <!-- Glowing Warm Lantern hanging top-left -->
  <g class="smTh-lantern">
    <line x1="20" y1="0" x2="20" y2="18" stroke="#78350f" stroke-width="2"/>
    <circle class="smTh-glow" cx="20" cy="30" r="18" fill="url(#smThLanternGlow)"/>
    <rect x="14" y="18" width="12" height="3.5" rx="1.5" fill="#92400e"/>
    <rect x="15" y="21.5" width="10" height="14" rx="2" fill="#fef08a" stroke="#b45309" stroke-width="1.5"/>
    <line x1="20" y1="21.5" x2="20" y2="35.5" stroke="#b45309" stroke-width="1"/>
    <rect x="13.5" y="35.5" width="13" height="3.5" rx="1.5" fill="#92400e"/>
  </g>

  <g class="smTh-body">
    <!-- Left Twig Arm holding Gift Scroll -->
    <g stroke="#78350f" stroke-width="2.8" stroke-linecap="round" fill="none">
      <path d="M 38 74 L 22 68"/>
      <path d="M 27 70 L 23 63"/>
    </g>

    <!-- Lower Snowball Body -->
    <circle cx="58" cy="83" r="24" fill="url(#smThSnow)" stroke="#7dd3fc" stroke-width="1.2"/>
    <circle cx="58" cy="76" r="2.5" fill="#1e293b"/>
    <circle cx="58" cy="85" r="2.5" fill="#1e293b"/>
    <circle cx="58" cy="94" r="2.5" fill="#1e293b"/>
    <!-- Holly badge -->
    <path d="M 68 75 Q 74 71 76 76 Q 71 79 68 75 Z" fill="#16a34a"/>
    <circle cx="68" cy="76" r="1.9" fill="#ef4444"/>

    <!-- Upper Snowball Head -->
    <circle cx="58" cy="51" r="19.5" fill="url(#smThSnow)" stroke="#7dd3fc" stroke-width="1.2"/>

    <!-- Red va Gold Striped Christmas Scarf -->
    <path d="M 40 63 Q 58 71 76 63 Q 78 69 73 71 Q 58 77 43 71 Q 38 69 40 63 Z" fill="url(#smThRed)"/>
    <path d="M 45 65 L 45 72 M 54 67 L 54 74 M 63 67 L 63 74 M 72 65 L 72 72" stroke="#facc15" stroke-width="2"/>
    <path d="M 46 68 L 42 86 L 50 87 L 52 70 Z" fill="url(#smThRed)"/>
    <path d="M 43 81 L 50 82" stroke="#facc15" stroke-width="2"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="44" cy="56" rx="4" ry="2.4" fill="#fb7185" opacity="0.65"/>
    <ellipse cx="72" cy="56" rx="4" ry="2.4" fill="#fb7185" opacity="0.65"/>

    <!-- Focused Eyes looking slightly down-left at scroll -->
    <circle cx="50" cy="49" r="3.2" fill="#0f172a"/>
    <circle cx="49" cy="48" r="1.2" fill="#ffffff"/>
    <circle cx="66" cy="49" r="3.2" fill="#0f172a"/>
    <circle cx="65" cy="48" r="1.2" fill="#ffffff"/>
    <path d="M 46 44 Q 50 42 54 44" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 62 44 Q 66 42 70 44" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Thoughtful little smile -->
    <path d="M 54 59 Q 58 61 63 59" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Carrot Nose -->
    <path d="M 57 52 L 70 55 L 57 57 Z" fill="url(#smThCarrot)" stroke="#c2410c" stroke-width="0.8" stroke-linejoin="round"/>

    <!-- Santa Hat -->
    <path d="M 38 39 Q 54 14 82 27 Q 90 32 88 43 Q 75 33 74 39 Z" fill="url(#smThRed)"/>
    <rect x="36" y="34" width="44" height="8.5" rx="4.2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="88" cy="43" r="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Long Gift Scroll (Naughty/Nice List) -->
    <g>
      <rect x="14" y="61" width="24" height="4" rx="2" fill="#d97706" stroke="#78350f" stroke-width="1"/>
      <path d="M 16 65 L 36 65 L 34 97 L 14 97 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
      <line x1="19" y1="71" x2="31" y2="71" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="18.5" y1="76" x2="29" y2="76" stroke="#dc2626" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="18" y1="81" x2="30" y2="81" stroke="#16a34a" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="17.5" y1="86" x2="28" y2="86" stroke="#b45309" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="17" y1="91" x2="29" y2="91" stroke="#dc2626" stroke-width="1.4" stroke-linecap="round"/>
      <rect x="12" y="96" width="24" height="4" rx="2" fill="#d97706" stroke="#78350f" stroke-width="1"/>
    </g>

    <!-- Right Twig Arm holding Magnifying Glass inspecting scroll -->
    <g class="smTh-glass">
      <path d="M 80 74 L 96 68 L 76 74" fill="none" stroke="#78350f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Magnifying Glass Handle -->
      <line x1="94" y1="69" x2="104" y2="79" stroke="#92400e" stroke-width="3.6" stroke-linecap="round"/>
      <!-- Magnifying Glass Lens -->
      <circle cx="88" cy="63" r="9.5" fill="#bae6fd" fill-opacity="0.55" stroke="#facc15" stroke-width="2.6"/>
      <path d="M 83 59 Q 86 56 91 58" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>
</svg>
