<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="nlSnow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="nlHat" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
    <linearGradient id="nlBell" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="nlPaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fffbeb"/><stop offset="100%" stop-color="#fde68a"/></linearGradient>
  </defs>
  <style>
    .nl-body { transform-origin: 60px 108px; animation: nlSway 0.8s ease-in-out infinite alternate; }
    .nl-bell { transform-origin: 86px 22px; animation: nlJingle 0.3s ease-in-out infinite alternate; }
    .nl-arm { transform-origin: 80px 82px; animation: nlWrite 0.35s ease-in-out infinite alternate; }
    .nl-line { stroke-dasharray: 14; animation: nlInk 1.6s linear infinite; }
    .nl-gift1 { transform-origin: 20px 100px; animation: nlPop 1s ease-in-out infinite; }
    .nl-gift2 { transform-origin: 104px 102px; animation: nlPop 1s ease-in-out 0.5s infinite; }
    .nl-f1 { animation: nlFlake 1.6s linear infinite; }
    .nl-f2 { animation: nlFlake 1.6s linear 0.55s infinite; }
    .nl-f3 { animation: nlFlake 1.6s linear 1.1s infinite; }
    @keyframes nlSway { 0% { transform: rotate(-3deg); } 100% { transform: rotate(3deg); } }
    @keyframes nlJingle { 0% { transform: rotate(-18deg); } 100% { transform: rotate(18deg); } }
    @keyframes nlWrite { 0% { transform: rotate(-6deg) translateX(-2px); } 100% { transform: rotate(6deg) translateX(2px); } }
    @keyframes nlInk { 0% { stroke-dashoffset: 14; } 60%,100% { stroke-dashoffset: 0; } }
    @keyframes nlPop { 0%,100% { transform: scale(1) translateY(0); } 40% { transform: scale(1.18) translateY(-5px); } 60% { transform: scale(0.95) translateY(0); } }
    @keyframes nlFlake { 0% { opacity: 0; transform: translateY(-6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(18px); } }
  </style>
  <ellipse cx="60" cy="110" rx="36" ry="5" fill="#1e3a8a" opacity="0.35"/>
  <!-- Gifts -->
  <g class="nl-gift1"><rect x="12" y="94" width="16" height="12" rx="1.5" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/><path d="M20 94 V106 M12 100 H28" stroke="#fde047" stroke-width="2"/></g>
  <g class="nl-gift2"><rect x="96" y="96" width="16" height="12" rx="1.5" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/><path d="M104 96 V108 M96 102 H112" stroke="#fde047" stroke-width="2"/></g>
  <!-- Snowflakes -->
  <g stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round">
    <path class="nl-f1" d="M14 30 V38 M10 34 H18 M11.5 31.5 L16.5 36.5 M16.5 31.5 L11.5 36.5"/>
    <path class="nl-f2" d="M104 40 V48 M100 44 H108 M101.5 41.5 L106.5 46.5 M106.5 41.5 L101.5 46.5"/>
    <path class="nl-f3" d="M26 12 V18 M23 15 H29"/>
  </g>
  <g class="nl-body">
    <!-- Body -->
    <circle cx="60" cy="86" r="23" fill="url(#nlSnow)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="60" cy="80" r="2.2" fill="#1e293b"/><circle cx="60" cy="90" r="2.2" fill="#1e293b"/><circle cx="60" cy="99" r="2.2" fill="#1e293b"/>
    <!-- Letter -->
    <g transform="rotate(-6 60 92)">
      <rect x="40" y="86" width="34" height="20" rx="2" fill="url(#nlPaper)" stroke="#b45309" stroke-width="1.5"/>
      <path class="nl-line" d="M44 92 H60" stroke="#be123c" stroke-width="1.6" stroke-linecap="round"/>
      <path class="nl-line" d="M44 97 H68" stroke="#be123c" stroke-width="1.6" stroke-linecap="round" style="animation-delay:0.4s"/>
      <path d="M44 102 H56" stroke="#d6d3d1" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <!-- Head -->
    <circle cx="60" cy="52" r="18" fill="url(#nlSnow)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="53" cy="49" r="2.4" fill="#0f172a"/><circle cx="67" cy="49" r="2.4" fill="#0f172a"/>
    <circle cx="52.4" cy="48.3" r="0.8" fill="#fff"/><circle cx="66.4" cy="48.3" r="0.8" fill="#fff"/>
    <path d="M60 52 L72 56 L60 58 Z" fill="#f97316" stroke="#9a3412" stroke-width="1"/>
    <path d="M54 61 Q60 65 66 61" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="48" cy="56" r="3" fill="#fda4af" opacity="0.6"/><circle cx="72" cy="58" r="0.01" fill="none"/>
    <!-- Santa hat -->
    <path d="M42 41 Q44 18 66 16 Q62 28 78 41 Z" fill="url(#nlHat)" stroke="#7f1d1d" stroke-width="2"/>
    <rect x="39" y="38" width="42" height="9" rx="4.5" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
    <g class="nl-bell"><circle cx="68" cy="16" r="5" fill="#fff" stroke="#bfdbfe" stroke-width="1"/><circle cx="86" cy="24" r="0.01"/></g>
    <g class="nl-bell" style="transform-origin:50px 48px"><circle cx="50" cy="52" r="3.4" fill="url(#nlBell)" stroke="#92400e" stroke-width="1"/></g>
    <g class="nl-bell" style="transform-origin:72px 48px"><circle cx="72" cy="52" r="0.01"/></g>
    <!-- Scarf -->
    <path d="M42 68 Q60 78 78 68 L78 74 Q60 84 42 74 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
    <!-- Left twig arm -->
    <path d="M40 82 L24 90 M30 87 L26 82" stroke="#78350f" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- Right arm with candy cane pen -->
    <g class="nl-arm">
      <path d="M78 82 L90 92" stroke="#78350f" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M92 96 L98 74 Q99 68 94 68 Q90 68 90 72" stroke="#fff" stroke-width="3.6" stroke-linecap="round" fill="none"/>
      <path d="M92 96 L98 74 Q99 68 94 68 Q90 68 90 72" stroke="#ef4444" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/>
    </g>
  </g>
</svg>
