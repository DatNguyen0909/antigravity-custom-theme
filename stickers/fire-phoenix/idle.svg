<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="phxBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="phxGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="phxBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <radialGradient id="fireOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </radialGradient>
    <style>
      /* Mỗi 15s: Phượng Hoàng ấp viên ngọc lửa nổ BỤP thành chú gà con vàng đội vỏ trứng nhảy trên đầu */
      .wings-poof { animation: phxWings 15s ease-in-out infinite; transform-origin: 60px 72px; }
      .orb-pop { animation: phxOrbPop 15s ease-out infinite; transform-origin: 60px 88px; }
      .chick-pop { animation: phxChick 15s ease-out infinite; transform-origin: 60px 18px; }
      .blush-shy { animation: phxBlush 15s ease-in-out infinite; }
      .phx-blink { transform-origin: 60px 51.5px; animation: phxBlink 3.5s infinite; }
      .phx-flap-l { transform-origin: 34px 72px; animation: phxFlapL 1.8s ease-in-out infinite alternate; }
      .phx-flap-r { transform-origin: 86px 72px; animation: phxFlapR 1.8s ease-in-out infinite alternate; }
      .phx-crest { transform-origin: 60px 26px; animation: phxCrest 2.2s ease-in-out infinite alternate; }

      @keyframes phxBlink { 0%, 44%, 48%, 94%, 100% { transform: scaleY(1); } 46%, 96% { transform: scaleY(0.08); } }
      @keyframes phxFlapL { 0% { transform: rotate(-6deg); } 100% { transform: rotate(8deg); } }
      @keyframes phxFlapR { 0% { transform: rotate(6deg); } 100% { transform: rotate(-8deg); } }
      @keyframes phxCrest { 0% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }

      @keyframes phxWings {
        0%, 73% { transform: scale(1); }
        76% { transform: scale(1.15, 0.92); }
        79% { transform: scale(0.92, 1.12); }
        84%, 100% { transform: scale(1); }
      }
      @keyframes phxOrbPop {
        0%, 75% { transform: scale(1); opacity: 1; }
        78% { transform: scale(1.65); opacity: 1; }
        81% { transform: scale(0.2); opacity: 0; }
        95% { transform: scale(0.2); opacity: 0; }
        98%, 100% { transform: scale(1); opacity: 1; }
      }
      @keyframes phxChick {
        0%, 78% { transform: translateY(65px) scale(0.2); opacity: 0; }
        82% { transform: translateY(-4px) scale(1.15); opacity: 1; }
        86% { transform: translateY(2px) scale(1); opacity: 1; }
        90% { transform: translateY(-5px) scale(1.05); opacity: 1; }
        94% { transform: translateY(0px) scale(1); opacity: 1; }
        97%, 100% { transform: translateY(-20px) scale(0.3); opacity: 0; }
      }
      @keyframes phxBlush {
        0%, 80% { opacity: 0.75; transform: scale(1); }
        83%, 94% { opacity: 1; transform: scale(1.45); }
        98%, 100% { opacity: 0.75; transform: scale(1); }
      }
    </style>
  <ellipse cx="60" cy="110" rx="28" ry="4.5" fill="#020617" opacity="0.34"/>
  </defs>

  <g>
    <path d="M40 94 C18 98, 8 80, 14 64 C18 76, 28 84, 42 86 Z" fill="url(#phxGold)" stroke="#881337" stroke-width="1.8"/>
    <path d="M80 94 C102 98, 112 80, 106 64 C102 76, 92 84, 78 86 Z" fill="url(#phxGold)" stroke="#881337" stroke-width="1.8"/>

    <g class="wings-poof">
      <g class="phx-flap-l">
        <path d="M34 62 C12 52, 6 70, 18 82 C12 86, 20 94, 36 86 Z" fill="url(#phxBody)" stroke="#4c0519" stroke-width="2"/>
        <path d="M22 68 Q16 74 26 78" fill="none" stroke="url(#phxGold)" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g class="phx-flap-r">
        <path d="M86 62 C108 52, 114 70, 102 82 C108 86, 100 94, 84 86 Z" fill="url(#phxBody)" stroke="#4c0519" stroke-width="2"/>
        <path d="M98 68 Q104 74 94 78" fill="none" stroke="url(#phxGold)" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

    <ellipse cx="60" cy="82" rx="22" ry="20" fill="url(#phxBody)" stroke="#4c0519" stroke-width="2.2"/>
    <ellipse cx="60" cy="85" rx="14" ry="14" fill="url(#phxBelly)"/>

    <g class="phx-crest">
      <path d="M60 26 C53 12, 57 4, 60 3 C63 4, 67 12, 60 26 Z" fill="url(#phxGold)" stroke="#881337" stroke-width="1.8"/>
      <path d="M54 27 C42 16, 42 8, 46 8 C50 9, 53 17, 56 26 Z" fill="url(#phxBody)" stroke="#881337" stroke-width="1.6"/>
      <path d="M66 27 C78 16, 78 8, 74 8 C70 9, 67 17, 64 26 Z" fill="url(#phxBody)" stroke="#881337" stroke-width="1.6"/>
      <circle cx="60" cy="9" r="2.5" fill="#fef08a"/>
    </g>

    <ellipse cx="60" cy="50" rx="28" ry="25" fill="url(#phxBody)" stroke="#4c0519" stroke-width="2.2"/>
    <path d="M36 48 C36 36, 84 36, 84 48 C84 65, 68 72, 60 72 C52 72, 36 65, 36 48 Z" fill="url(#phxBelly)"/>

    <path d="M32 48 Q22 44 25 54 Q20 58 33 60" fill="url(#phxGold)" stroke="#881337" stroke-width="1.6"/>
    <path d="M88 48 Q98 44 95 54 Q100 58 87 60" fill="url(#phxGold)" stroke="#881337" stroke-width="1.6"/>
    <path d="M60 31 C64 36, 63 41, 60 43 C57 41, 56 36, 60 31 Z" fill="url(#phxGold)" stroke="#be185d" stroke-width="1"/>

    <g class="phx-blink">
      <ellipse cx="47" cy="51" rx="6.5" ry="7.5" fill="#4c0519"/>
      <ellipse cx="47" cy="51.5" rx="5.2" ry="6" fill="url(#phxBody)"/>
      <ellipse cx="47" cy="53" rx="3.8" ry="3.5" fill="#fde047"/>
      <circle cx="44.5" cy="48" r="2.5" fill="#ffffff"/>
      <circle cx="49.5" cy="54" r="1.2" fill="#ffffff"/>

      <ellipse cx="73" cy="51" rx="6.5" ry="7.5" fill="#4c0519"/>
      <ellipse cx="73" cy="51.5" rx="5.2" ry="6" fill="url(#phxBody)"/>
      <ellipse cx="73" cy="53" rx="3.8" ry="3.5" fill="#fde047"/>
      <circle cx="70.5" cy="48" r="2.5" fill="#ffffff"/>
      <circle cx="75.5" cy="54" r="1.2" fill="#ffffff"/>
    </g>

    <polygon points="56,55 64,55 60,61" fill="url(#phxGold)" stroke="#9a3412" stroke-width="1.4" stroke-linejoin="round"/>
    <ellipse class="blush-shy" cx="38" cy="57" rx="4.2" ry="2.2" fill="#fb7185" style="transform-origin:38px 57px"/>
    <ellipse class="blush-shy" cx="82" cy="57" rx="4.2" ry="2.2" fill="#fb7185" style="transform-origin:82px 57px"/>

    <ellipse cx="49" cy="101" rx="5.5" ry="3.5" fill="url(#phxGold)" stroke="#4c0519" stroke-width="1.6"/>
    <ellipse cx="71" cy="101" rx="5.5" ry="3.5" fill="url(#phxGold)" stroke="#4c0519" stroke-width="1.6"/>

    <g class="orb-pop">
      <circle cx="60" cy="88" r="9.5" fill="url(#fireOrb)" stroke="#f59e0b" stroke-width="1.6"/>
      <circle cx="57" cy="85" r="2.8" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Chú chim non / gà con lửa đội vỏ trứng bất ngờ nở ra bay lên đỉnh đầu mỗi 15s -->
    <g class="chick-pop">
      <circle cx="60" cy="18" r="10" fill="#fde047" stroke="#b45309" stroke-width="1.4"/>
      <polygon points="50,15 54,9 58,14 62,8 66,14 70,10 70,16" fill="#ffffff" stroke="#b45309" stroke-width="1"/>
      <circle cx="56" cy="19" r="1.5" fill="#451a03"/>
      <circle cx="64" cy="19" r="1.5" fill="#451a03"/>
      <polygon points="58,21 62,21 60,24" fill="#f97316"/>
    </g>
  </g>
</svg>
