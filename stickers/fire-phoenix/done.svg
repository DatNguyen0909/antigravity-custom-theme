<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="fpDnBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="fpDnGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="fpDnBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <radialGradient id="fpDnOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </radialGradient>
    <style>
      .fpDnJump { animation: fpDnJumpAnim 2.2s ease-in-out infinite; }
      .fpDnWingL { transform-origin: 36px 70px; animation: fpDnWingLAnim 2s ease-in-out infinite; }
      .fpDnWingR { transform-origin: 84px 70px; animation: fpDnWingRAnim 2s ease-in-out infinite; }
      .fpDnCrest { transform-origin: 60px 26px; animation: fpDnCrestAnim 2s ease-in-out infinite alternate; }
      .fpDnBurstL { transform-origin: 20px 22px; animation: fpDnBurstAnim 2.4s ease-out infinite; }
      .fpDnBurstR { transform-origin: 100px 22px; animation: fpDnBurstAnim 2.4s ease-out 0.8s infinite; }
      .fpDnSparkTop { transform-origin: 60px 10px; animation: fpDnTwinkle 2s ease-in-out infinite alternate; }

      @keyframes fpDnJumpAnim { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
      @keyframes fpDnWingLAnim { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(12deg); } }
      @keyframes fpDnWingRAnim { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(-12deg); } }
      @keyframes fpDnCrestAnim { 0% { transform: rotate(-5deg); } 100% { transform: rotate(5deg); } }
      @keyframes fpDnBurstAnim {
        0% { transform: scale(0.35); opacity: 0; }
        35% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1.35); opacity: 0; }
      }
      @keyframes fpDnTwinkle { 0% { transform: scale(0.8); opacity: 0.6; } 100% { transform: scale(1.2); opacity: 1; } }
    </style>
  <ellipse cx="60" cy="110" rx="28" ry="4.5" fill="#020617" opacity="0.34"/>
  </defs>

  <!-- Golden-Pink Firework Sparks -->
  <g class="fpDnBurstL">
    <line x1="20" y1="10" x2="20" y2="16" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="28" x2="20" y2="34" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="14" y2="22" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="22" x2="32" y2="22" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="14" x2="16" y2="18" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="24" y1="26" x2="28" y2="30" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="28" y1="14" x2="24" y2="18" stroke="#ec4899" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="16" y1="26" x2="12" y2="30" stroke="#ec4899" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g class="fpDnBurstR">
    <line x1="100" y1="10" x2="100" y2="16" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="28" x2="100" y2="34" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
    <line x1="88" y1="22" x2="94" y2="22" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
    <line x1="106" y1="22" x2="112" y2="22" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="14" x2="96" y2="18" stroke="#ec4899" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="104" y1="26" x2="108" y2="30" stroke="#ec4899" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="108" y1="14" x2="104" y2="18" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="96" y1="26" x2="92" y2="30" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g class="fpDnSparkTop">
    <polygon points="36,12 37.5,15.5 41,17 37.5,18.5 36,22 34.5,18.5 31,17 34.5,15.5" fill="#fef08a"/>
    <polygon points="84,12 85.5,15.5 89,17 85.5,18.5 84,22 82.5,18.5 79,17 82.5,15.5" fill="#f472b6"/>
  </g>

  <g class="fpDnJump">
    <!-- Tail Plumes -->
    <path d="M40 94 C18 98, 8 80, 14 64 C18 76, 28 84, 42 86 Z" fill="url(#fpDnGold)" stroke="#881337" stroke-width="1.8"/>
    <path d="M80 94 C102 98, 112 80, 106 64 C102 76, 92 84, 78 86 Z" fill="url(#fpDnGold)" stroke="#881337" stroke-width="1.8"/>

    <!-- Triumphant Fiery Wings Raised High in V-Pose -->
    <g class="fpDnWingL">
      <path d="M38 74 C14 60, 4 38, 12 28 C20 34, 24 44, 30 48 C22 44, 16 48, 22 58 C26 64, 32 68, 42 80 Z" fill="url(#fpDnBody)" stroke="#4c0519" stroke-width="2"/>
      <path d="M16 36 Q24 48 34 64" fill="none" stroke="url(#fpDnGold)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M22 52 Q28 58 36 68" fill="none" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g class="fpDnWingR">
      <path d="M82 74 C106 60, 116 38, 108 28 C100 34, 96 44, 90 48 C98 44, 104 48, 98 58 C94 64, 88 68, 78 80 Z" fill="url(#fpDnBody)" stroke="#4c0519" stroke-width="2"/>
      <path d="M104 36 Q96 48 86 64" fill="none" stroke="url(#fpDnGold)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M98 52 Q92 58 84 68" fill="none" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Body -->
    <ellipse cx="60" cy="82" rx="22" ry="20" fill="url(#fpDnBody)" stroke="#4c0519" stroke-width="2.2"/>
    <ellipse cx="60" cy="85" rx="14" ry="14" fill="url(#fpDnBelly)"/>

    <!-- Crest -->
    <g class="fpDnCrest">
      <path d="M60 26 C53 12, 57 4, 60 3 C63 4, 67 12, 60 26 Z" fill="url(#fpDnGold)" stroke="#881337" stroke-width="1.8"/>
      <path d="M54 27 C42 16, 42 8, 46 8 C50 9, 53 17, 56 26 Z" fill="url(#fpDnBody)" stroke="#881337" stroke-width="1.6"/>
      <path d="M66 27 C78 16, 78 8, 74 8 C70 9, 67 17, 64 26 Z" fill="url(#fpDnBody)" stroke="#881337" stroke-width="1.6"/>
      <circle cx="60" cy="9" r="2.5" fill="#fef08a"/>
    </g>

    <!-- Head -->
    <ellipse cx="60" cy="50" rx="28" ry="25" fill="url(#fpDnBody)" stroke="#4c0519" stroke-width="2.2"/>
    <path d="M36 48 C36 36, 84 36, 84 48 C84 65, 68 72, 60 72 C52 72, 36 65, 36 48 Z" fill="url(#fpDnBelly)"/>

    <!-- Cheek Feathers va Gem -->
    <path d="M32 48 Q22 44 25 54 Q20 58 33 60" fill="url(#fpDnGold)" stroke="#881337" stroke-width="1.6"/>
    <path d="M88 48 Q98 44 95 54 Q100 58 87 60" fill="url(#fpDnGold)" stroke="#881337" stroke-width="1.6"/>
    <path d="M60 31 C64 36, 63 41, 60 43 C57 41, 56 36, 60 31 Z" fill="url(#fpDnGold)" stroke="#be185d" stroke-width="1"/>

    <!-- Joyful Happy Curved Eyes -->
    <path d="M40 52 Q47 43 54 52" fill="none" stroke="#4c0519" stroke-width="3" stroke-linecap="round"/>
    <path d="M66 52 Q73 43 80 52" fill="none" stroke="#4c0519" stroke-width="3" stroke-linecap="round"/>

    <!-- Happy Open Beak va Rosy Blush -->
    <polygon points="55,55 65,55 60,60" fill="url(#fpDnGold)" stroke="#9a3412" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M56.5 59 Q60 65 63.5 59 Z" fill="#e11d48" stroke="#9a3412" stroke-width="1"/>
    <ellipse cx="38" cy="57" rx="4.8" ry="2.6" fill="#fb7185" opacity="0.85"/>
    <ellipse cx="82" cy="57" rx="4.8" ry="2.6" fill="#fb7185" opacity="0.85"/>

    <!-- Feet -->
    <ellipse cx="49" cy="101" rx="5.5" ry="3.5" fill="url(#fpDnGold)" stroke="#4c0519" stroke-width="1.6"/>
    <ellipse cx="71" cy="101" rx="5.5" ry="3.5" fill="url(#fpDnGold)" stroke="#4c0519" stroke-width="1.6"/>

    <!-- Glowing Victory Ember Orb -->
    <circle cx="60" cy="88" r="9.5" fill="url(#fpDnOrb)" stroke="#f59e0b" stroke-width="1.6"/>
    <circle cx="57" cy="85" r="2.8" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
