<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <clipPath id="fpActClip">
      <rect x="0" y="0" width="260" height="95"/>
    </clipPath>
    <radialGradient id="fpActSunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#fb923c" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#e11d48" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fpActSunCore" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="fpActBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="fpActWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="85%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="fpActGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="fpActCloudBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.92"/>
      <stop offset="48%" stop-color="#fb923c" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="fpActCloudFg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.96"/>
      <stop offset="52%" stop-color="#fb7185" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="fpActMist" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0"/>
      <stop offset="30%" stop-color="#fb923c" stop-opacity="0.3"/>
      <stop offset="65%" stop-color="#fef08a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>
    <style>
      .fp-sun-pulse {
        transform-origin: 54px 36px;
        animation: fpSunPulse 2.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .fp-sun-rays {
        transform-origin: 54px 36px;
        animation: fpSunSpin 16s linear infinite;
      }
      .fp-cloud-bg-l { animation: fpCloudBgL 4.2s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .fp-cloud-bg-c { animation: fpCloudBgC 4.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .fp-cloud-fg-r { animation: fpCloudFgR 3.2s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .fp-fly-x { animation: fpFlyX 3.7s linear infinite; }
      .fp-wave-y {
        transform-origin: 0px 42px;
        animation: fpWaveY 1.1s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .fp-wing-front {
        transform-origin: 6px 40px;
        animation: fpWingFront 0.36s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .fp-wing-back {
        transform-origin: 10px 38px;
        animation: fpWingBack 0.36s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .fp-tail-flow {
        transform-origin: -14px 44px;
        animation: fpTailFlow 0.52s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .fp-ember-1 { animation: fpEmberDrift 2.4s linear infinite; }
      .fp-ember-2 { animation: fpEmberDrift 2.8s linear 0.9s infinite; }
      .fp-ember-3 { animation: fpEmberDrift 2.2s linear 1.5s infinite; }
      .fp-feather-1 { animation: fpFeatherDrift 3.4s ease-in-out infinite; }
      .fp-feather-2 { animation: fpFeatherDrift 3.9s ease-in-out 1.6s infinite; }

      @keyframes fpFlyX {
        0% { transform: translateX(-45px); opacity: 0; }
        8% { opacity: 1; }
        92% { opacity: 1; }
        100% { transform: translateX(305px); opacity: 0; }
      }
      @keyframes fpWaveY {
        0% { transform: translateY(-7px) rotate(-4deg); }
        100% { transform: translateY(7px) rotate(4deg); }
      }
      @keyframes fpWingFront {
        0% { transform: rotate(-24deg) scaleY(0.88); }
        100% { transform: rotate(22deg) scaleY(1.08); }
      }
      @keyframes fpWingBack {
        0% { transform: rotate(-16deg) scaleY(0.9); }
        100% { transform: rotate(16deg) scaleY(1.05); }
      }
      @keyframes fpTailFlow {
        0% { transform: rotate(-5deg) scaleX(0.97); }
        100% { transform: rotate(6deg) scaleX(1.04); }
      }
      @keyframes fpSunPulse {
        0% { transform: scale(0.94); opacity: 0.85; }
        100% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes fpSunSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes fpCloudBgL {
        0% { transform: translate(-4px, 0px); }
        100% { transform: translate(6px, -3px); }
      }
      @keyframes fpCloudBgC {
        0% { transform: translate(5px, -2px); }
        100% { transform: translate(-5px, 2px); }
      }
      @keyframes fpCloudFgR {
        0% { transform: translate(6px, 2px); }
        100% { transform: translate(-6px, -2px); }
      }
      @keyframes fpEmberDrift {
        0% { transform: translate(0px, 8px) scale(0.6); opacity: 0; }
        25% { opacity: 1; }
        80% { opacity: 0.9; }
        100% { transform: translate(-18px, -18px) scale(1.1); opacity: 0; }
      }
      @keyframes fpFeatherDrift {
        0% { transform: translate(0px, 0px) rotate(-10deg); opacity: 0; }
        20% { opacity: 0.95; }
        80% { opacity: 0.85; }
        100% { transform: translate(-22px, 12px) rotate(18deg); opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#fpActClip)">
    <!-- Blazing Golden Sun Halo va Rays -->
    <g class="fp-sun-pulse">
      <circle cx="54" cy="36" r="34" fill="url(#fpActSunHalo)"/>
      <circle cx="54" cy="36" r="19" fill="#fbbf24" opacity="0.28"/>
    </g>
    <g class="fp-sun-rays" stroke="#fef08a" stroke-width="1.3" stroke-linecap="round" opacity="0.52">
      <line x1="54" y1="10" x2="54" y2="16"/>
      <line x1="54" y1="56" x2="54" y2="62"/>
      <line x1="28" y1="36" x2="34" y2="36"/>
      <line x1="74" y1="36" x2="80" y2="36"/>
      <line x1="36" y1="18" x2="40" y2="22"/>
      <line x1="68" y1="50" x2="72" y2="54"/>
      <line x1="72" y1="18" x2="68" y2="22"/>
      <line x1="40" y1="50" x2="36" y2="54"/>
    </g>
    <circle cx="54" cy="36" r="12.5" fill="url(#fpActSunCore)"/>

    <!-- Warm Horizon Fire Mist -->
    <path d="M 0 70 Q 70 58 140 66 T 260 64 L 260 80 L 0 80 Z" fill="url(#fpActMist)"/>

    <!-- BACKGROUND: Layered Crimson-Amber Fire Clouds -->
    <g class="fp-cloud-bg-l">
      <ellipse cx="56" cy="60" rx="44" ry="13" fill="#be185d" opacity="0.22"/>
      <path d="M 12 64 C 4 64, 2 52, 12 46 C 12 34, 26 27, 39 33 C 47 22, 69 22, 77 33 C 90 29, 102 39, 98 50 C 106 55, 99 65, 86 65 Z" fill="url(#fpActCloudBg)" stroke="#fef08a" stroke-width="1.4"/>
      <path d="M 24 54 C 30 47, 41 47, 45 53 C 47 57, 41 59, 37 56" fill="none" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 62 44 C 70 38, 81 40, 83 47" fill="none" stroke="#fff7ed" stroke-width="1.5" stroke-linecap="round" opacity="0.88"/>
    </g>

    <g class="fp-cloud-bg-c" opacity="0.74">
      <path d="M 134 38 C 128 38, 127 30, 134 27 C 136 20, 148 18, 156 23 C 164 17, 178 19, 182 27 C 190 26, 196 32, 192 38 Z" fill="url(#fpActCloudBg)" stroke="#fef08a" stroke-width="1.1"/>
      <path d="M 146 32 Q 156 28 166 32" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Drifting Golden Feathers va Glowing Ember Sparkles -->
    <g class="fp-feather-1">
      <path d="M 126 24 C 120 20, 114 22, 110 28 C 116 28, 122 27, 126 24 Z" fill="url(#fpActGold)" stroke="#ea580c" stroke-width="0.7"/>
    </g>
    <g class="fp-feather-2">
      <path d="M 204 26 C 198 22, 192 24, 188 30 C 194 30, 200 29, 204 26 Z" fill="url(#fpActGold)" stroke="#e11d48" stroke-width="0.7"/>
    </g>
    <g class="fp-ember-1">
      <path d="M 102 48 L 103.2 51.2 L 106.5 52.5 L 103.2 53.8 L 102 57 L 100.8 53.8 L 97.5 52.5 L 100.8 51.2 Z" fill="#fef08a"/>
    </g>
    <g class="fp-ember-2">
      <circle cx="166" cy="54" r="2.2" fill="#fb923c"/>
      <circle cx="166" cy="54" r="1" fill="#ffffff"/>
    </g>
    <g class="fp-ember-3">
      <path d="M 226 36 L 227 38.5 L 229.5 39.5 L 227 40.5 L 226 43 L 225 40.5 L 222.5 39.5 L 225 38.5 Z" fill="#fef08a"/>
    </g>

    <!-- FIRE PHOENIX: Decoupled Linear Horizontal Travel + Smooth Sine Wave -->
    <g class="fp-fly-x">
      <g class="fp-wave-y">
        <!-- Trailing Ember Sparks behind Phoenix -->
        <circle cx="-60" cy="40" r="2" fill="#fef08a" opacity="0.85"/>
        <circle cx="-52" cy="50" r="1.6" fill="#fb923c" opacity="0.8"/>
        <path d="M -68 45 Q -54 41 -44 45" fill="none" stroke="url(#fpActGold)" stroke-width="1.8" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.75"/>

        <!-- Back Wing (3D depth) -->
        <g class="fp-wing-back">
          <path d="M 10 38 C 2 20, -14 14, -24 20 C -16 28, -6 34, 6 42 Z" fill="#be185d" stroke="#fbbf24" stroke-width="1.1"/>
        </g>

        <!-- Flowing 3-Ribbon Flame Tail with Golden Eye-Spots -->
        <g class="fp-tail-flow">
          <path d="M -12 42 C -28 32, -42 26, -50 32 C -40 38, -28 43, -14 44" fill="none" stroke="#fef08a" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M -12 44 C -30 42, -44 40, -52 46 C -40 48, -26 48, -12 46" fill="none" stroke="#f97316" stroke-width="3.8" stroke-linecap="round"/>
          <path d="M -12 46 C -26 52, -40 56, -48 60 C -36 58, -22 52, -12 48" fill="none" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
          <!-- Glowing Phoenix Tail Eye-Spots -->
          <circle cx="-49" cy="32" r="2.6" fill="#fef08a" stroke="#e11d48" stroke-width="0.9"/>
          <circle cx="-51" cy="46" r="2.8" fill="#fbbf24" stroke="#9f1239" stroke-width="0.9"/>
          <circle cx="-47" cy="60" r="2.4" fill="#fef08a" stroke="#e11d48" stroke-width="0.9"/>
        </g>

        <!-- Phoenix Body va Chibi Head (Facing Right) -->
        <path d="M -16 44 C -8 32, 12 30, 26 36 C 34 40, 35 48, 27 54 C 15 58, -5 56, -16 44 Z" fill="url(#fpActBody)" stroke="#881337" stroke-width="1.3"/>
        <!-- Warm Rose-Cream Chest Accent -->
        <path d="M 4 46 C 12 44, 22 45, 26 50 C 20 55, 8 54, 2 50 Z" fill="#fff1f2" opacity="0.82"/>
        <!-- Tucked Golden Talons -->
        <path d="M 4 54 L 1 58 M 7 54 L 6 58 M 10 54 L 11 58" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

        <!-- Layered 3-Plume Golden Fire Crest -->
        <path d="M 19 32 C 15 19, 6 15, 0 17 C 6 21, 11 26, 13 33 Z" fill="url(#fpActGold)" stroke="#b45309" stroke-width="0.9"/>
        <path d="M 14 33 C 7 24, 0 22, -4 25 C 2 27, 7 30, 10 35 Z" fill="#e11d48" stroke="#fef08a" stroke-width="0.8"/>
        <circle cx="1" cy="17" r="1.8" fill="#fef08a"/>

        <!-- Ruby-Gold Eye va Cheek Blush -->
        <ellipse cx="22" cy="41" rx="3.5" ry="3.8" fill="#4c0519"/>
        <ellipse cx="22.4" cy="41.5" rx="2.3" ry="2.6" fill="#fde047"/>
        <ellipse cx="22.8" cy="41.5" rx="1.2" ry="1.8" fill="#4c0519"/>
        <circle cx="21.2" cy="39.8" r="1.2" fill="#ffffff"/>
        <ellipse cx="18" cy="46.5" rx="2.8" ry="1.4" fill="#fb7185" opacity="0.72"/>

        <!-- Sharp Golden Beak -->
        <path d="M 31 41 L 40 44 L 31 47 Z" fill="url(#fpActGold)" stroke="#92400e" stroke-width="1" stroke-linejoin="round"/>

        <!-- Front Flame Wing (Layered Feathers) -->
        <g class="fp-wing-front">
          <path d="M 10 42 C -2 19, -22 13, -34 19 C -26 27, -14 36, 2 46 Z" fill="url(#fpActWing)" stroke="#fef08a" stroke-width="1.2"/>
          <path d="M 4 41 C -6 25, -18 20, -27 24" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M 0 43 C -9 31, -18 28, -24 31" fill="none" stroke="#fde047" stroke-width="1.2" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- FOREGROUND: Right Crimson-Amber Fire Cloud -->
    <g class="fp-cloud-fg-r">
      <ellipse cx="214" cy="65" rx="36" ry="11" fill="#881337" opacity="0.22"/>
      <path d="M 180 68 C 171 68, 169 57, 178 52 C 178 41, 191 36, 200 41 C 207 31, 224 31, 231 41 C 242 39, 251 47, 247 57 C 254 62, 247 70, 235 70 Z" fill="url(#fpActCloudFg)" stroke="#fef08a" stroke-width="1.4"/>
      <path d="M 190 59 C 196 53, 206 53, 209 59 C 211 62, 205 64, 202 61" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 218 51 C 224 46, 233 47, 235 53" fill="none" stroke="#fff7ed" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="242" cy="36" r="1.8" fill="#fef08a"/>
    </g>
  </g>
</svg>
