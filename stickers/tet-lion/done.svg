<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="lionDnRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="lionDnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="lionDnFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="lionDnMirror" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <style>
      .lionDn-dance { transform-origin: 60px 104px; animation: lionDnBounce 2.1s ease-in-out infinite; }
      .lionDn-lixi-l { transform-origin: 30px 76px; animation: lionDnWaveL 2.1s ease-in-out infinite; }
      .lionDn-lixi-r { transform-origin: 90px 76px; animation: lionDnWaveR 2.1s ease-in-out infinite; }
      .lionDn-fw1 { transform-origin: 18px 20px; animation: lionDnBurst 2.2s ease-out infinite; }
      .lionDn-fw2 { transform-origin: 102px 20px; animation: lionDnBurst 2.2s 1.1s ease-out infinite; }

      @keyframes lionDnBounce { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-6px) scale(1.03, 0.97); } }
      @keyframes lionDnWaveL { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg) translateY(-3px); } }
      @keyframes lionDnWaveR { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-10deg) translateY(-3px); } }
      @keyframes lionDnBurst { 0% { opacity: 0.2; transform: scale(0.35); } 55% { opacity: 1; transform: scale(1.15); } 100% { opacity: 0; transform: scale(1.35); } }
    </style>
  </defs>

  <!-- Stage Shadow -->
  <ellipse cx="60" cy="109" rx="34" ry="6" fill="#450a0a" opacity="0.5"/>
  <ellipse cx="60" cy="108" rx="26" ry="3.8" fill="#facc15" opacity="0.4"/>

  <!-- Popping Golden Fireworks Top Left va Right -->
  <g class="lionDn-fw1" stroke="#facc15" stroke-width="2" stroke-linecap="round">
    <line x1="18" y1="8" x2="18" y2="14"/>
    <line x1="18" y1="26" x2="18" y2="32"/>
    <line x1="6" y1="20" x2="12" y2="20"/>
    <line x1="24" y1="20" x2="30" y2="20"/>
    <line x1="10" y1="12" x2="14" y2="16"/>
    <line x1="22" y1="24" x2="26" y2="28"/>
    <line x1="26" y1="12" x2="22" y2="16"/>
    <line x1="14" y1="24" x2="10" y2="28"/>
    <circle cx="18" cy="20" r="2.5" fill="#fef08a" stroke="none"/>
  </g>
  <g class="lionDn-fw2" stroke="#facc15" stroke-width="2" stroke-linecap="round">
    <line x1="102" y1="8" x2="102" y2="14"/>
    <line x1="102" y1="26" x2="102" y2="32"/>
    <line x1="90" y1="20" x2="96" y2="20"/>
    <line x1="108" y1="20" x2="114" y2="20"/>
    <line x1="94" y1="12" x2="98" y2="16"/>
    <line x1="106" y1="24" x2="110" y2="28"/>
    <line x1="110" y1="12" x2="106" y2="16"/>
    <line x1="98" y1="24" x2="94" y2="28"/>
    <circle cx="102" cy="20" r="2.5" fill="#ef4444" stroke="none"/>
  </g>

  <g class="lionDn-dance">
    <!-- Body / Silk Costume -->
    <path d="M 36 74 Q 32 94 38 104 L 82 104 Q 88 94 84 74 Z" fill="url(#lionDnRed)" stroke="url(#lionDnGold)" stroke-width="2"/>
    <path d="M 46 84 Q 60 90 74 84 M 44 92 Q 60 98 76 92" fill="none" stroke="url(#lionDnGold)" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="46" cy="104" rx="9" ry="5" fill="url(#lionDnFur)" stroke="#ca8a04" stroke-width="1.2"/>
    <ellipse cx="74" cy="104" rx="9" ry="5" fill="url(#lionDnFur)" stroke="#ca8a04" stroke-width="1.2"/>

    <!-- Left Paw holding Golden-Red Lucky Envelope (LỘC) -->
    <g class="lionDn-lixi-l">
      <circle cx="29" cy="76" r="5.8" fill="url(#lionDnFur)" stroke="#ca8a04" stroke-width="1.2"/>
      <g transform="translate(18, 60) rotate(-18)">
        <rect x="-9" y="-12" width="18" height="24" rx="2.5" fill="url(#lionDnRed)" stroke="url(#lionDnGold)" stroke-width="1.6"/>
        <path d="M -9 -4 Q 0 2 9 -4" fill="none" stroke="url(#lionDnGold)" stroke-width="1.2"/>
        <polygon points="0,-1 7,6 0,13 -7,6" fill="url(#lionDnGold)"/>
        <text x="0" y="8.2" font-size="5.5" font-weight="900" fill="#991b1b" text-anchor="middle" font-family="sans-serif">LỘC</text>
      </g>
    </g>

    <!-- Right Paw holding Golden-Red Lucky Envelope (LỘC) -->
    <g class="lionDn-lixi-r">
      <circle cx="91" cy="76" r="5.8" fill="url(#lionDnFur)" stroke="#ca8a04" stroke-width="1.2"/>
      <g transform="translate(102, 60) rotate(18)">
        <rect x="-9" y="-12" width="18" height="24" rx="2.5" fill="url(#lionDnRed)" stroke="url(#lionDnGold)" stroke-width="1.6"/>
        <path d="M -9 -4 Q 0 2 9 -4" fill="none" stroke="url(#lionDnGold)" stroke-width="1.2"/>
        <polygon points="0,-1 7,6 0,13 -7,6" fill="url(#lionDnGold)"/>
        <text x="0" y="8.2" font-size="5.5" font-weight="900" fill="#991b1b" text-anchor="middle" font-family="sans-serif">LỘC</text>
      </g>
    </g>

    <!-- Ornate Lion Head -->
    <circle cx="28" cy="40" r="10" fill="url(#lionDnFur)" stroke="#eab308" stroke-width="1.3"/>
    <circle cx="28" cy="40" r="5" fill="#ef4444"/>
    <circle cx="92" cy="40" r="10" fill="url(#lionDnFur)" stroke="#eab308" stroke-width="1.3"/>
    <circle cx="92" cy="40" r="5" fill="#ef4444"/>
    <circle cx="24" cy="56" r="7.5" fill="url(#lionDnFur)" stroke="#facc15" stroke-width="1.2"/>
    <circle cx="96" cy="56" r="7.5" fill="url(#lionDnFur)" stroke="#facc15" stroke-width="1.2"/>

    <path d="M 28 56 C 26 26, 94 26, 92 56 C 94 70, 82 76, 60 76 C 38 76, 26 70, 28 56 Z" fill="url(#lionDnRed)" stroke="url(#lionDnGold)" stroke-width="2.2"/>

    <!-- Forehead Mirror va Golden Swirls -->
    <circle cx="60" cy="36" r="7.2" fill="url(#lionDnGold)" stroke="#991b1b" stroke-width="1.2"/>
    <circle cx="60" cy="36" r="4.4" fill="url(#lionDnMirror)"/>
    <path d="M 46 36 Q 38 30 34 38 M 74 36 Q 82 30 86 38" fill="none" stroke="url(#lionDnGold)" stroke-width="2" stroke-linecap="round"/>

    <!-- Sacred Golden Horn -->
    <circle cx="60" cy="14" r="5.2" fill="#ef4444" stroke="url(#lionDnGold)" stroke-width="1.2"/>
    <path d="M 53 29 Q 60 12 67 29 Z" fill="url(#lionDnGold)" stroke="#b45309" stroke-width="1.2"/>

    <!-- Fluffy Eyebrows -->
    <path d="M 33 43 Q 44 34 55 43 Q 45 40 33 43 Z" fill="url(#lionDnFur)" stroke="#ca8a04" stroke-width="1"/>
    <path d="M 87 43 Q 76 34 65 43 Q 75 40 87 43 Z" fill="url(#lionDnFur)" stroke="#ca8a04" stroke-width="1"/>

    <!-- Joyful Celebratory Smiling Eyes ^ ^ -->
    <path d="M 37 53 Q 44 45 51 53" fill="none" stroke="#fef08a" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 69 53 Q 76 45 83 53" fill="none" stroke="#fef08a" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Big Round Gold Nose va Rosy Cheeks -->
    <ellipse cx="60" cy="57" rx="8" ry="5.5" fill="url(#lionDnGold)" stroke="#991b1b" stroke-width="1.2"/>
    <circle cx="57.5" cy="55.5" r="2" fill="#fef9c3"/>
    <circle cx="35" cy="61" r="4.4" fill="#fb7185" opacity="0.8"/>
    <circle cx="85" cy="61" r="4.4" fill="#fb7185" opacity="0.8"/>

    <!-- Mustache, Happy Open Mouth va Beard -->
    <path d="M 30 64 Q 45 60 60 65 Q 75 60 90 64 Q 84 70 60 69 Q 36 70 30 64 Z" fill="url(#lionDnFur)" stroke="#eab308" stroke-width="1"/>
    <path d="M 40 66 Q 60 77 80 66 Z" fill="#7f1d1d" stroke="url(#lionDnGold)" stroke-width="1.4"/>
    <ellipse cx="60" cy="70" rx="9" ry="3.2" fill="#fb7185"/>
    <circle cx="42" cy="74" r="5.2" fill="url(#lionDnFur)" stroke="#eab308" stroke-width="1"/>
    <circle cx="51" cy="76" r="5.6" fill="url(#lionDnFur)" stroke="#eab308" stroke-width="1"/>
    <circle cx="60" cy="77" r="6" fill="url(#lionDnFur)" stroke="#eab308" stroke-width="1"/>
    <circle cx="69" cy="76" r="5.6" fill="url(#lionDnFur)" stroke="#eab308" stroke-width="1"/>
    <circle cx="78" cy="74" r="5.2" fill="url(#lionDnFur)" stroke="#eab308" stroke-width="1"/>
  </g>
</svg>
