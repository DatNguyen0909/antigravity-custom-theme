<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="lionThRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="lionThGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="lionThFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="lionThMirror" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <style>
      .lionTh-head { transform-origin: 60px 60px; animation: lionThTilt 3s ease-in-out infinite; }
      .lionTh-clap { transform-origin: 88px 80px; animation: lionThTap 2s ease-in-out infinite; }
      .lionTh-coin1 { transform-origin: 18px 26px; animation: lionThFloat 2.6s ease-in-out infinite; }
      .lionTh-coin2 { transform-origin: 102px 24px; animation: lionThFloat 2.6s 0.9s ease-in-out infinite; }
      .lionTh-wave { transform-origin: 96px 68px; animation: lionThSound 2s ease-out infinite; }

      @keyframes lionThTilt { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(3deg); } }
      @keyframes lionThTap { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-18deg); } 40% { transform: rotate(4deg); } 55% { transform: rotate(-14deg); } 70% { transform: rotate(2deg); } }
      @keyframes lionThFloat { 0%, 100% { transform: translateY(0) scale(0.92); opacity: 0.7; } 50% { transform: translateY(-5px) scale(1.08); opacity: 1; } }
      @keyframes lionThSound { 0%, 35% { opacity: 0; transform: scale(0.6); } 45%, 65% { opacity: 1; transform: scale(1.1); } 80%, 100% { opacity: 0; transform: scale(1.3); } }
    </style>
  </defs>

  <!-- Stage Shadow -->
  <ellipse cx="60" cy="109" rx="34" ry="6" fill="#450a0a" opacity="0.5"/>
  <ellipse cx="60" cy="108" rx="25" ry="3.5" fill="#facc15" opacity="0.3"/>

  <!-- Body / Silk Costume -->
  <path d="M 36 75 Q 32 94 38 104 L 82 104 Q 88 94 84 75 Z" fill="url(#lionThRed)" stroke="url(#lionThGold)" stroke-width="2"/>
  <path d="M 46 84 Q 60 90 74 84 M 44 92 Q 60 98 76 92" fill="none" stroke="url(#lionThGold)" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="46" cy="104" rx="9" ry="5" fill="url(#lionThFur)" stroke="#ca8a04" stroke-width="1.2"/>
  <ellipse cx="74" cy="104" rx="9" ry="5" fill="url(#lionThFur)" stroke="#ca8a04" stroke-width="1.2"/>

  <!-- Left Paw on chin thinking -->
  <circle cx="38" cy="78" r="6" fill="url(#lionThFur)" stroke="#ca8a04" stroke-width="1.2"/>

  <!-- Ornate Tilted Lion Head -->
  <g class="lionTh-head">
    <!-- Ears va Side Pom-Poms -->
    <circle cx="28" cy="40" r="10" fill="url(#lionThFur)" stroke="#eab308" stroke-width="1.3"/>
    <circle cx="28" cy="40" r="5" fill="#ef4444"/>
    <circle cx="92" cy="40" r="10" fill="url(#lionThFur)" stroke="#eab308" stroke-width="1.3"/>
    <circle cx="92" cy="40" r="5" fill="#ef4444"/>
    <circle cx="24" cy="56" r="7.5" fill="url(#lionThFur)" stroke="#facc15" stroke-width="1.2"/>
    <circle cx="96" cy="56" r="7.5" fill="url(#lionThFur)" stroke="#facc15" stroke-width="1.2"/>

    <!-- Head Dome -->
    <path d="M 28 56 C 26 26, 94 26, 92 56 C 94 70, 82 76, 60 76 C 38 76, 26 70, 28 56 Z" fill="url(#lionThRed)" stroke="url(#lionThGold)" stroke-width="2.2"/>

    <!-- Forehead Mirror va Golden Swirls -->
    <circle cx="60" cy="36" r="7.2" fill="url(#lionThGold)" stroke="#991b1b" stroke-width="1.2"/>
    <circle cx="60" cy="36" r="4.4" fill="url(#lionThMirror)"/>
    <path d="M 46 36 Q 38 30 34 38 M 74 36 Q 82 30 86 38" fill="none" stroke="url(#lionThGold)" stroke-width="2" stroke-linecap="round"/>

    <!-- Sacred Golden Horn -->
    <circle cx="60" cy="14" r="5.2" fill="#ef4444" stroke="url(#lionThGold)" stroke-width="1.2"/>
    <path d="M 53 29 Q 60 12 67 29 Z" fill="url(#lionThGold)" stroke="#b45309" stroke-width="1.2"/>

    <!-- Asymmetric Thinking Eyebrows -->
    <path d="M 33 43 Q 44 37 55 45 Q 45 42 33 43 Z" fill="url(#lionThFur)" stroke="#ca8a04" stroke-width="1"/>
    <path d="M 87 41 Q 76 33 65 42 Q 75 39 87 41 Z" fill="url(#lionThFur)" stroke="#ca8a04" stroke-width="1"/>

    <!-- Playfully Squinting Eyes -->
    <ellipse cx="44" cy="52" rx="8.2" ry="5.2" fill="#ffffff" stroke="url(#lionThGold)" stroke-width="2"/>
    <circle cx="46" cy="51.5" r="3.6" fill="#0f172a"/>
    <circle cx="44.8" cy="50.3" r="1.4" fill="#ffffff"/>
    <ellipse cx="76" cy="52" rx="8.2" ry="6.8" fill="#ffffff" stroke="url(#lionThGold)" stroke-width="2"/>
    <circle cx="77.5" cy="51" r="4.2" fill="#0f172a"/>
    <circle cx="76" cy="49.5" r="1.6" fill="#ffffff"/>

    <!-- Big Round Gold Nose va Cheeks -->
    <ellipse cx="60" cy="57" rx="8" ry="5.5" fill="url(#lionThGold)" stroke="#991b1b" stroke-width="1.2"/>
    <circle cx="57.5" cy="55.5" r="2" fill="#fef9c3"/>
    <circle cx="35" cy="61" r="4" fill="#fb7185" opacity="0.7"/>
    <circle cx="85" cy="61" r="4" fill="#fb7185" opacity="0.7"/>

    <!-- Upper Mustache va Fluffy Beard -->
    <path d="M 30 64 Q 45 60 60 65 Q 75 60 90 64 Q 84 70 60 69 Q 36 70 30 64 Z" fill="url(#lionThFur)" stroke="#eab308" stroke-width="1"/>
    <path d="M 46 68 Q 60 72 74 68" fill="none" stroke="#7f1d1d" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="43" cy="74" r="5.2" fill="url(#lionThFur)" stroke="#eab308" stroke-width="1"/>
    <circle cx="52" cy="76" r="5.6" fill="url(#lionThFur)" stroke="#eab308" stroke-width="1"/>
    <circle cx="60" cy="77" r="6" fill="url(#lionThFur)" stroke="#eab308" stroke-width="1"/>
    <circle cx="68" cy="76" r="5.6" fill="url(#lionThFur)" stroke="#eab308" stroke-width="1"/>
    <circle cx="77" cy="74" r="5.2" fill="url(#lionThFur)" stroke="#eab308" stroke-width="1"/>
  </g>

  <!-- Right Paw Tapping Wooden Clapper (Phách / Mõ) -->
  <g class="lionTh-clap">
    <circle cx="88" cy="81" r="6" fill="url(#lionThFur)" stroke="#ca8a04" stroke-width="1.2"/>
    <!-- Wooden Clapper Blades -->
    <rect x="88" y="62" width="6.5" height="20" rx="2.5" transform="rotate(-12 91 72)" fill="#92400e" stroke="#451a03" stroke-width="1.2"/>
    <rect x="94" y="62" width="6.5" height="20" rx="2.5" transform="rotate(14 97 72)" fill="#b45309" stroke="#451a03" stroke-width="1.2"/>
    <!-- Red tassel on clapper -->
    <line x1="93" y1="81" x2="96" y2="91" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Clapper Sound Lines -->
  <g class="lionTh-wave" stroke="#facc15" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M 103 63 Q 108 66 105 71"/>
    <path d="M 107 60 Q 113 65 109 73"/>
  </g>

  <!-- Floating Lucky Fortune Coins (Calculating Fortune) -->
  <g class="lionTh-coin1">
    <circle cx="18" cy="26" r="7" fill="url(#lionThGold)" stroke="#b45309" stroke-width="1.2"/>
    <rect x="15.5" y="23.5" width="5" height="5" fill="#991b1b"/>
  </g>
  <g class="lionTh-coin2">
    <circle cx="102" cy="24" r="6" fill="url(#lionThGold)" stroke="#b45309" stroke-width="1.2"/>
    <text x="102" y="27" font-size="7" font-weight="900" fill="#991b1b" text-anchor="middle" font-family="serif">?</text>
  </g>
</svg>
