<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="botDnBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="botDnScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="botDnGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="botDnGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#4ade80" flood-opacity="0.75"/>
    </filter>
    <style>
      .botDn-bounce { transform-origin: 60px 105px; animation: botDnBounce 2.2s ease-in-out infinite; }
      .botDn-halo { transform-origin: 60px 15px; animation: botDnHalo 2.2s ease-in-out infinite alternate; }
      .botDn-hand-l { transform-origin: 32px 78px; animation: botDnCheerL 2.2s ease-in-out infinite; }
      .botDn-hand-r { transform-origin: 88px 78px; animation: botDnCheerR 2.2s ease-in-out infinite; }
      .botDn-check { transform-origin: 96px 24px; animation: botDnCheck 2.4s ease-in-out infinite; }
      .botDn-spark1 { transform-origin: 20px 26px; animation: botDnSpark 2.1s ease-in-out infinite; }
      .botDn-spark2 { transform-origin: 102px 58px; animation: botDnSpark 2.1s 0.7s ease-in-out infinite; }
      .botDn-spark3 { transform-origin: 18px 60px; animation: botDnSpark 2.1s 1.3s ease-in-out infinite; }

      @keyframes botDnBounce { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-6px) scale(1.02, 0.98); } }
      @keyframes botDnHalo { 0% { transform: translateY(0) scaleX(0.95); } 100% { transform: translateY(-3px) scaleX(1.08); } }
      @keyframes botDnCheerL { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(16deg) translateY(-4px); } }
      @keyframes botDnCheerR { 0%, 100% { transform: rotate(18deg); } 50% { transform: rotate(-16deg) translateY(-4px); } }
      @keyframes botDnCheck { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.1); } }
      @keyframes botDnSpark { 0%, 100% { transform: scale(0.5) rotate(0deg); opacity: 0.4; } 50% { transform: scale(1.2) rotate(25deg); opacity: 1; } }
    </style>
  </defs>

  <ellipse cx="60" cy="110" rx="18" ry="4" fill="#4ade80" opacity="0.5"/>
  <ellipse cx="60" cy="110" rx="9" ry="2" fill="#ffffff" opacity="0.9"/>

  <g class="botDn-bounce">
    <!-- Glowing Green Halo -->
    <ellipse class="botDn-halo" cx="60" cy="15" rx="18" ry="4.5" fill="none" stroke="url(#botDnGreen)" stroke-width="2.8"/>

    <!-- Body -->
    <path d="M40 73 C38 93, 46 104, 60 104 C74 104, 82 93, 80 73 Z" fill="url(#botDnBody)" stroke="#334155" stroke-width="2.2"/>
    <polygon points="60,79 68,87 60,95 52,87" fill="url(#botDnGreen)" stroke="#1e293b" stroke-width="1.5"/>
    <polygon points="60,82 65,87 60,92 55,87" fill="#ffffff" opacity="0.9"/>

    <!-- Cheering Hands -->
    <g class="botDn-hand-l">
      <ellipse cx="28" cy="76" rx="6" ry="8" transform="rotate(35 28 76)" fill="url(#botDnBody)" stroke="#334155" stroke-width="2"/>
    </g>
    <g class="botDn-hand-r">
      <ellipse cx="92" cy="76" rx="6" ry="8" transform="rotate(-35 92 76)" fill="url(#botDnBody)" stroke="#334155" stroke-width="2"/>
    </g>

    <!-- Head -->
    <rect x="27" y="23" width="66" height="48" rx="24" fill="url(#botDnBody)" stroke="#334155" stroke-width="2.3"/>
    <rect x="20" y="37" width="7" height="20" rx="3.5" fill="#1e293b" stroke="url(#botDnGreen)" stroke-width="1.8"/>
    <rect x="93" y="37" width="7" height="20" rx="3.5" fill="#1e293b" stroke="url(#botDnGreen)" stroke-width="1.8"/>

    <!-- Visor Screen -->
    <rect x="33" y="30" width="54" height="34" rx="17" fill="url(#botDnScreen)" stroke="#475569" stroke-width="1.8"/>
    <path d="M40 34 Q55 31 72 34" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>

    <!-- Glowing Green Smiling Eyes ^ ‿ ^ -->
    <g filter="url(#botDnGlow)">
      <path d="M41 47 Q47 39 53 47" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
      <path d="M67 47 Q73 39 79 47" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
      <path d="M54 52 Q60 58 66 52" fill="none" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <!-- Cute Rosy Cheeks -->
    <ellipse cx="39" cy="53" rx="3.8" ry="2" fill="#f472b6" opacity="0.85"/>
    <ellipse cx="81" cy="53" rx="3.8" ry="2" fill="#f472b6" opacity="0.85"/>
  </g>

  <!-- Floating Green Checkmark Badge -->
  <g class="botDn-check" filter="url(#botDnGlow)">
    <circle cx="96" cy="24" r="12" fill="url(#botDnGreen)" stroke="#14532d" stroke-width="1.6"/>
    <path d="M90.5 24 L94.5 28 L102 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Celebration Sparks -->
  <g class="botDn-spark1">
    <path d="M20 18 L22 24 L28 26 L22 28 L20 34 L18 28 L12 26 L18 24 Z" fill="#facc15"/>
  </g>
  <g class="botDn-spark2">
    <path d="M102 52 L103.5 56.5 L108 58 L103.5 59.5 L102 64 L100.5 59.5 L96 58 L100.5 56.5 Z" fill="#4ade80"/>
  </g>
  <g class="botDn-spark3">
    <path d="M18 55 L19.2 58.8 L23 60 L19.2 61.2 L18 65 L16.8 61.2 L13 60 L16.8 58.8 Z" fill="#38bdf8"/>
  </g>
</svg>
