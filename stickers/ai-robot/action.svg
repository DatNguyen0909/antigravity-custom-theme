<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95">
  <defs>
    <linearGradient id="botMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <style>
      .portal-spin { animation: holoPulse 2s ease-in-out infinite alternate; }
      .bot-hover { animation: cyberDash 3.4s ease-in-out infinite; }
      @keyframes holoPulse { 0% { opacity: 0.55; transform: scaleY(0.92); } 100% { opacity: 0.95; transform: scaleY(1.06); } }
      @keyframes cyberDash {
        0% { transform: translate(118px, 6px) rotate(-3deg); }
        25% { transform: translate(58px, -6px) rotate(4deg); }
        50% { transform: translate(10px, 6px) rotate(-3deg); }
        75% { transform: translate(64px, 8px) rotate(-5deg); }
        100% { transform: translate(118px, 6px) rotate(-3deg); }
      }
    </style>
  </defs>

  <!-- CỔNG HOLOGRAM CYBER BÊN TRÁI va BÊN PHẢI -->
  <g class="portal-spin">
    <ellipse cx="38" cy="46" rx="10" ry="22" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 3"/>
    <ellipse cx="38" cy="46" rx="5" ry="14" fill="#38bdf8" opacity="0.22"/>
    <ellipse cx="224" cy="46" rx="10" ry="22" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 3"/>
    <ellipse cx="224" cy="46" rx="5" ry="14" fill="#818cf8" opacity="0.22"/>
  </g>

  <!-- ROBOT AI CHIBI LƯỚT VÁN ĐỆM TỪ TRƯỜNG GIỮA 2 CỔNG HOLOGRAM -->
  <g class="bot-hover">
    <!-- Ván trượt đệm từ trường (Hoverboard) -->
    <ellipse cx="58" cy="58" rx="22" ry="4.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="58" cy="62" rx="16" ry="2.5" fill="#38bdf8" opacity="0.6"/>
    <!-- Thân va Đầu Robot AI -->
    <rect x="46" y="42" width="22" height="14" rx="6" fill="url(#botMetal)" stroke="#334155" stroke-width="1.3"/>
    <rect x="48" y="22" width="24" height="19" rx="8" fill="url(#botMetal)" stroke="#334155" stroke-width="1.4"/>
    <rect x="52" y="26" width="17" height="11" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.1"/>
    <!-- Mắt LED Cyan biểu cảm vui vẻ -->
    <path d="M 56 32 Q 58 29 60 32 M 63 32 Q 65 29 67 32" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="60" y1="22" x2="60" y2="15" stroke="#64748b" stroke-width="2"/>
    <circle cx="60" cy="14" r="2.8" fill="#38bdf8"/>
  </g>
</svg>
