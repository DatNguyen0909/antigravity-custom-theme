<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <clipPath id="ar-stage-clip">
      <rect x="0" y="0" width="260" height="71"/>
    </clipPath>

    <radialGradient id="ar-sky-glow" cx="50%" cy="100%" r="72%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="48%" stop-color="#4f46e5" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#0f172a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ar-horizon-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="18%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.95"/>
      <stop offset="82%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ar-grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="ar-tower-far" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.72"/>
    </linearGradient>

    <linearGradient id="ar-tower-near" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.94"/>
    </linearGradient>

    <radialGradient id="ar-portal-l-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ar-portal-r-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5d0fe" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ar-bot-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="ar-bot-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="ar-neon-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="ar-thruster-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.72"/>
      <stop offset="85%" stop-color="#bae6fd" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <style>
      .ar-portal-l { animation: arPortalPulse 1.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; transform-origin: 34px 41px; }
      .ar-portal-r { animation: arPortalPulse 1.8s cubic-bezier(0.37, 0, 0.63, 1) -0.9s infinite alternate; transform-origin: 226px 41px; }
      .ar-ring-l { animation: arRingBreath 1.4s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; transform-origin: 34px 41px; }
      .ar-ring-r { animation: arRingBreath 1.4s cubic-bezier(0.37, 0, 0.63, 1) -0.7s infinite alternate; transform-origin: 226px 41px; }
      .ar-mote-a { animation: arMoteFloat 2.4s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .ar-mote-b { animation: arMoteFloat 2.9s cubic-bezier(0.37, 0, 0.63, 1) -1.2s infinite alternate; }
      .ar-beacon { animation: arBeaconGlow 1.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .ar-botX { animation: arCyberDashX 3.5s linear infinite; }
      .ar-botY { animation: arCyberDashY 0.9s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; transform-origin: 58px 42px; }
      .ar-thruster { animation: arThrusterPulse 0.22s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; transform-origin: 40px 56px; }
      .ar-halo { animation: arHaloBob 1.2s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; transform-origin: 58px 13px; }

      @keyframes arPortalPulse {
        0% { opacity: 0.68; transform: scale(0.94, 0.96); }
        100% { opacity: 1; transform: scale(1.06, 1.04); }
      }
      @keyframes arRingBreath {
        0% { opacity: 0.45; transform: scale(0.88); }
        100% { opacity: 0.95; transform: scale(1.08); }
      }
      @keyframes arMoteFloat {
        0% { transform: translateY(3px); opacity: 0.35; }
        100% { transform: translateY(-4px); opacity: 0.95; }
      }
      @keyframes arBeaconGlow {
        0% { opacity: 0.35; }
        100% { opacity: 1; }
      }
      @keyframes arCyberDashX {
        0% { transform: translateX(-24px); opacity: 0; }
        8% { opacity: 1; }
        92% { opacity: 1; }
        100% { transform: translateX(168px); opacity: 0; }
      }
      @keyframes arCyberDashY {
        0% { transform: translateY(-5.5px) rotate(-3.5deg); }
        100% { transform: translateY(5.5px) rotate(3.5deg); }
      }
      @keyframes arThrusterPulse {
        0% { transform: scaleX(0.84) scaleY(0.92); opacity: 0.8; }
        100% { transform: scaleX(1.18) scaleY(1.08); opacity: 1; }
      }
      @keyframes arHaloBob {
        0% { transform: translateY(0px) scaleX(0.95); }
        100% { transform: translateY(-2px) scaleX(1.06); }
      }
    </style>
  </defs>

  <g clip-path="url(#ar-stage-clip)">
    <!-- Ambient cyber horizon aura -->
    <ellipse cx="130" cy="68" rx="126" ry="52" fill="url(#ar-sky-glow)"/>

    <!-- Far futuristic cyber-city skyline silhouette -->
    <g fill="url(#ar-tower-far)">
      <path d="M 10 71 L 10 46 L 22 42 L 22 71 Z"/>
      <path d="M 52 71 L 52 30 L 66 26 L 66 71 Z"/>
      <rect x="70" y="36" width="12" height="35"/>
      <path d="M 88 71 L 88 22 L 95 16 L 102 22 L 102 71 Z"/>
      <rect x="114" y="32" width="15" height="39"/>
      <path d="M 136 71 L 136 20 L 148 25 L 148 71 Z"/>
      <rect x="156" y="34" width="14" height="37"/>
      <path d="M 176 71 L 176 26 L 185 18 L 194 26 L 194 71 Z"/>
      <rect x="200" y="38" width="13" height="33"/>
      <path d="M 238 71 L 238 42 L 250 46 L 250 71 Z"/>
    </g>

    <!-- Skyline spires and blinking beacons -->
    <g stroke="#818cf8" stroke-width="0.9" opacity="0.65">
      <line x1="95" y1="16" x2="95" y2="9"/>
      <line x1="142" y1="22" x2="142" y2="14"/>
      <line x1="185" y1="18" x2="185" y2="11"/>
    </g>
    <g class="ar-beacon">
      <circle cx="95" cy="9" r="1.4" fill="#38bdf8"/>
      <circle cx="142" cy="14" r="1.3" fill="#f472b6"/>
      <circle cx="185" cy="11" r="1.4" fill="#38bdf8"/>
    </g>

    <!-- Midground cyber-skyscrapers with neon trim and lit micro-windows -->
    <g>
      <rect x="58" y="42" width="16" height="29" fill="url(#ar-tower-near)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="0.8"/>
      <rect x="100" y="35" width="18" height="36" fill="url(#ar-tower-near)" stroke="#818cf8" stroke-opacity="0.38" stroke-width="0.8"/>
      <path d="M 124 71 L 124 44 L 138 39 L 138 71 Z" fill="url(#ar-tower-near)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="0.8"/>
      <rect x="148" y="40" width="17" height="31" fill="url(#ar-tower-near)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="0.8"/>
      <rect x="182" y="44" width="16" height="27" fill="url(#ar-tower-near)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="0.8"/>

      <!-- Glowing cyber windows -->
      <g fill="#38bdf8" opacity="0.72">
        <rect x="61" y="46" width="3" height="1.6"/>
        <rect x="67" y="46" width="4" height="1.6"/>
        <rect x="61" y="51" width="6" height="1.6"/>
        <rect x="104" y="40" width="4" height="1.6"/>
        <rect x="111" y="40" width="3" height="1.6"/>
        <rect x="104" y="45" width="10" height="1.6"/>
        <rect x="104" y="50" width="5" height="1.6"/>
        <rect x="128" y="48" width="6" height="1.6"/>
        <rect x="152" y="45" width="4" height="1.6"/>
        <rect x="158" y="45" width="4" height="1.6"/>
        <rect x="186" y="48" width="3.5" height="1.6"/>
        <rect x="191" y="48" width="3.5" height="1.6"/>
      </g>
      <g fill="#c084fc" opacity="0.7">
        <rect x="67" y="55" width="4" height="1.6"/>
        <rect x="110" y="50" width="4" height="1.6"/>
        <rect x="128" y="53" width="4" height="1.6"/>
        <rect x="152" y="50" width="8" height="1.6"/>
        <rect x="186" y="53" width="7" height="1.6"/>
      </g>
    </g>

    <!-- Glowing perspective cyber-grid floor along y=58..71 -->
    <g>
      <rect x="8" y="58" width="244" height="13" fill="url(#ar-grid-fade)" opacity="0.28"/>
      <!-- Perspective radiating lines -->
      <g stroke="#38bdf8" stroke-width="0.75" opacity="0.45">
        <line x1="130" y1="58" x2="130" y2="71"/>
        <line x1="112" y1="58" x2="96" y2="71"/>
        <line x1="148" y1="58" x2="164" y2="71"/>
        <line x1="92" y1="58" x2="62" y2="71"/>
        <line x1="168" y1="58" x2="198" y2="71"/>
        <line x1="72" y1="58" x2="28" y2="71"/>
        <line x1="188" y1="58" x2="232" y2="71"/>
      </g>
      <!-- Horizontal receding grid lines -->
      <line x1="22" y1="61" x2="238" y2="61" stroke="url(#ar-horizon-line)" stroke-width="0.7" opacity="0.45"/>
      <line x1="14" y1="65.5" x2="246" y2="65.5" stroke="url(#ar-horizon-line)" stroke-width="0.9" opacity="0.65"/>
      <line x1="4" y1="70.2" x2="256" y2="70.2" stroke="url(#ar-horizon-line)" stroke-width="1.6"/>
    </g>

    <!-- Floating binary and sparkle data motes -->
    <g class="ar-mote-a" font-family="Consolas, monospace" font-size="6.5" font-weight="700">
      <text x="78" y="20" fill="#7dd3fc" opacity="0.85">01</text>
      <text x="162" y="18" fill="#c4b5fd" opacity="0.85">10</text>
      <path d="M 118 14 L 119.5 17.5 L 123 19 L 119.5 20.5 L 118 24 L 116.5 20.5 L 113 19 L 116.5 17.5 Z" fill="#38bdf8"/>
      <circle cx="204" cy="24" r="1.4" fill="#e0f2fe"/>
    </g>
    <g class="ar-mote-b" font-family="Consolas, monospace" font-size="6" font-weight="700">
      <text x="128" y="29" fill="#38bdf8" opacity="0.75">1</text>
      <text x="196" y="15" fill="#f472b6" opacity="0.8">0</text>
      <path d="M 66 24 L 67 26.5 L 69.5 27.5 L 67 28.5 L 66 31 L 65 28.5 L 62.5 27.5 L 65 26.5 Z" fill="#c084fc"/>
      <circle cx="152" cy="28" r="1.3" fill="#7dd3fc"/>
    </g>

    <!-- Left Cyan Hologram Warp Portal -->
    <g>
      <ellipse cx="34" cy="67.5" rx="16" ry="2.6" fill="#38bdf8" opacity="0.32"/>
      <g class="ar-portal-l">
        <ellipse cx="34" cy="41" rx="14" ry="25" fill="url(#ar-portal-l-core)"/>
        <ellipse cx="34" cy="41" rx="11.5" ry="22" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 3"/>
        <ellipse cx="34" cy="41" rx="7.5" ry="15.5" fill="none" stroke="#e0f2fe" stroke-width="1.1" opacity="0.85"/>
      </g>
      <g class="ar-ring-l">
        <ellipse cx="34" cy="41" rx="15" ry="25.5" fill="none" stroke="#7dd3fc" stroke-width="0.9" stroke-dasharray="2 4"/>
      </g>
    </g>

    <!-- Right Violet Hologram Warp Portal -->
    <g>
      <ellipse cx="226" cy="67.5" rx="16" ry="2.6" fill="#818cf8" opacity="0.35"/>
      <g class="ar-portal-r">
        <ellipse cx="226" cy="41" rx="14" ry="25" fill="url(#ar-portal-r-core)"/>
        <ellipse cx="226" cy="41" rx="11.5" ry="22" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 3"/>
        <ellipse cx="226" cy="41" rx="7.5" ry="15.5" fill="none" stroke="#f5d0fe" stroke-width="1.1" opacity="0.85"/>
      </g>
      <g class="ar-ring-r">
        <ellipse cx="226" cy="41" rx="15" ry="25.5" fill="none" stroke="#c084fc" stroke-width="0.9" stroke-dasharray="2 4"/>
      </g>
    </g>

    <!-- Minimalist AI Robot surfing magnetic hoverboard between portals -->
    <g class="ar-botX">
      <g class="ar-botY">
        <!-- Cyan-violet thruster trail behind hoverboard -->
        <g class="ar-thruster">
          <path d="M 38 56 C 24 52, 12 53.5, 4 56 C 12 58.5, 24 60, 38 56 Z" fill="url(#ar-thruster-grad)"/>
          <line x1="36" y1="53.5" x2="16" y2="53.5" stroke="#bae6fd" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
          <circle cx="15" cy="56" r="1.6" fill="#38bdf8"/>
          <circle cx="8" cy="54" r="1.1" fill="#c084fc"/>
        </g>

        <!-- Magnetic Hoverboard -->
        <ellipse cx="58" cy="60.5" rx="17" ry="2.6" fill="#38bdf8" opacity="0.45"/>
        <ellipse cx="58" cy="60.5" rx="9" ry="1.3" fill="#e0f2fe" opacity="0.85"/>
        <ellipse cx="58" cy="56" rx="22" ry="4.6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
        <path d="M 41 56 Q 58 59 75 56" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.85"/>

        <!-- Floating Neon Halo above head -->
        <ellipse class="ar-halo" cx="59" cy="13" rx="9.5" ry="2.2" fill="none" stroke="url(#ar-neon-accent)" stroke-width="1.7"/>

        <!-- Left balancing arm -->
        <ellipse cx="44" cy="46" rx="3.4" ry="5" transform="rotate(34 44 46)" fill="url(#ar-bot-metal)" stroke="#334155" stroke-width="1.2"/>

        <!-- Robot Torso with glowing diamond core -->
        <path d="M 48 40 C 47 50, 51 55, 58 55 C 65 55, 69 50, 68 40 Z" fill="url(#ar-bot-metal)" stroke="#334155" stroke-width="1.3"/>
        <polygon points="58,43 62,47 58,51 54,47" fill="url(#ar-neon-accent)" stroke="#1e293b" stroke-width="0.9"/>
        <polygon points="58,44.8 60.2,47 58,49.2 55.8,47" fill="#ffffff" opacity="0.85"/>

        <!-- Robot Head -->
        <rect x="46" y="19" width="26" height="20" rx="9.5" fill="url(#ar-bot-metal)" stroke="#334155" stroke-width="1.4"/>
        <!-- Side ear pods -->
        <rect x="43.5" y="25" width="3" height="8" rx="1.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <rect x="71.5" y="25" width="3" height="8" rx="1.5" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
        <!-- Visor Screen -->
        <rect x="50" y="23" width="19" height="12.5" rx="6" fill="url(#ar-bot-screen)" stroke="#38bdf8" stroke-width="1.1"/>
        <path d="M 53.5 25 Q 59.5 23.8 65.5 25" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.35"/>

        <!-- Happy Cyan LED Eyes and Pink Blush -->
        <path d="M 54.5 29.8 Q 56.5 26.8 58.5 29.8 M 61.5 29.8 Q 63.5 26.8 65.5 29.8" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
        <ellipse cx="53.2" cy="32.2" rx="1.6" ry="0.8" fill="#f472b6" opacity="0.8"/>
        <ellipse cx="66.2" cy="32.2" rx="1.6" ry="0.8" fill="#f472b6" opacity="0.8"/>

        <!-- Forward balancing arm -->
        <ellipse cx="72" cy="44" rx="3.4" ry="5" transform="rotate(-38 72 44)" fill="url(#ar-bot-metal)" stroke="#334155" stroke-width="1.2"/>
      </g>
    </g>
  </g>
</svg>
