<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="botBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <style>
      /* Mỗi 15s: Robot AI quá tải hiện lỗi 404 đỏ rực + xẹt điện, rồi tự vỗ đầu khởi động lại hiện OK! */
      .face-normal { animation: botNorm 15s linear infinite; }
      .face-error { animation: botErr 15s linear infinite; }
      .face-ok { animation: botOk 15s linear infinite; }
      .hand-bonk { animation: botBonk 15s ease-in-out infinite; transform-origin: 90px 82px; }
      .head-shake { animation: botShake 15s linear infinite; transform-origin: 60px 46px; }

      @keyframes botNorm { 0%, 73% { opacity: 1; } 74%, 95% { opacity: 0; } 96%, 100% { opacity: 1; } }
      @keyframes botErr { 0%, 73% { opacity: 0; } 74%, 87% { opacity: 1; } 88%, 100% { opacity: 0; } }
      @keyframes botOk { 0%, 87% { opacity: 0; } 88%, 95% { opacity: 1; } 96%, 100% { opacity: 0; } }
      @keyframes botShake {
        0%, 73% { transform: translate(0, 0); }
        76% { transform: translate(-3px, 1px); }
        79% { transform: translate(3px, -1px); }
        82% { transform: translate(-3px, 0px); }
        85% { transform: translate(2px, 1px); }
        87% { transform: translate(0, 4px); }
        90%, 100% { transform: translate(0, 0); }
      }
      @keyframes botBonk {
        0%, 82% { transform: translate(0, 0) rotate(-18deg); }
        85% { transform: translate(-12px, -62px) rotate(-45deg); }
        87% { transform: translate(-22px, -54px) rotate(-65deg); }
        92%, 100% { transform: translate(0, 0) rotate(-18deg); }
      }
    </style>
  </defs>

  <g>
    <ellipse cx="60" cy="12" rx="18" ry="4.5" fill="none" stroke="url(#neon)" stroke-width="2.8"/>

    <ellipse cx="60" cy="109" rx="16" ry="4" fill="#38bdf8" opacity="0.55"/>
    <ellipse cx="60" cy="109" rx="9" ry="2" fill="#ffffff" opacity="0.9"/>

    <path d="M40 72 C38 92, 46 104, 60 104 C74 104, 82 92, 80 72 Z" fill="url(#botBody)" stroke="#334155" stroke-width="2.2"/>
    <polygon points="60,78 68,86 60,94 52,86" fill="url(#neon)" stroke="#1e293b" stroke-width="1.5"/>
    <polygon points="60,81 65,86 60,91 55,86" fill="#ffffff" opacity="0.8"/>

    <ellipse cx="30" cy="82" rx="6" ry="8" transform="rotate(18 30 82)" fill="url(#botBody)" stroke="#334155" stroke-width="2"/>

    <g class="head-shake">
      <rect x="27" y="22" width="66" height="48" rx="24" fill="url(#botBody)" stroke="#334155" stroke-width="2.3"/>
      <rect x="20" y="36" width="7" height="20" rx="3.5" fill="#1e293b" stroke="url(#neon)" stroke-width="1.8"/>
      <rect x="93" y="36" width="7" height="20" rx="3.5" fill="#1e293b" stroke="url(#neon)" stroke-width="1.8"/>

      <rect x="33" y="29" width="54" height="34" rx="17" fill="url(#screen)" stroke="#475569" stroke-width="1.8"/>
      <path d="M40 33 Q55 30 72 33" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>

      <!-- Mặt bình thường -->
      <g class="face-normal">
        <ellipse cx="47" cy="46" rx="5.5" ry="6.5" fill="#38bdf8"/>
        <ellipse cx="47" cy="46" rx="3.2" ry="4" fill="#e0f2fe"/>
        <circle cx="45" cy="43.5" r="1.8" fill="#ffffff"/>

        <ellipse cx="73" cy="46" rx="5.5" ry="6.5" fill="#38bdf8"/>
        <ellipse cx="73" cy="46" rx="3.2" ry="4" fill="#e0f2fe"/>
        <circle cx="71" cy="43.5" r="1.8" fill="#ffffff"/>

        <ellipse cx="39" cy="52" rx="3.5" ry="1.8" fill="#f472b6" opacity="0.8"/>
        <ellipse cx="81" cy="52" rx="3.5" ry="1.8" fill="#f472b6" opacity="0.8"/>
        <path d="M55 51 Q60 56 65 51" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
      </g>

      <!-- Mặt lỗi 404 ERROR + tia điện -->
      <g class="face-error">
        <path d="M 41 40 L 49 48 M 49 40 L 41 48 M 71 40 L 79 48 M 79 40 L 71 48" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
        <text x="60" y="58" font-family="Consolas, monospace" font-size="11" font-weight="900" fill="#ef4444" text-anchor="middle">404!</text>
        <polyline points="82,16 76,24 84,25 77,32" fill="none" stroke="#fde047" stroke-width="2"/>
      </g>

      <!-- Mặt khởi động lại OK! -->
      <g class="face-ok">
        <path d="M 41 46 Q 45 40 49 46 M 71 46 Q 75 40 79 46" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
        <text x="60" y="58" font-family="Consolas, monospace" font-size="11" font-weight="900" fill="#4ade80" text-anchor="middle">OK!</text>
      </g>
    </g>

    <!-- Tay phải đưa lên gõ đầu sửa lỗi -->
    <g class="hand-bonk">
      <ellipse cx="90" cy="82" rx="6" ry="8" fill="url(#botBody)" stroke="#334155" stroke-width="2"/>
    </g>
  </g>
</svg>
