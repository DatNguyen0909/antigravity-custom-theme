<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95">
  <defs>
    <linearGradient id="bunnyBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="sakuraCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f472b6" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.88"/>
    </linearGradient>
    <style>
      .bunny-hop { animation: sakuraHop 3.2s ease-in-out infinite; }
      .ear-flop { animation: earBounce 0.4s ease-in-out infinite alternate; transform-origin: 68px 26px; }
      .petal-fall { animation: petalDrift 2.4s ease-in-out infinite alternate; }
      @keyframes sakuraHop {
        0% { transform: translate(118px, 8px) rotate(0deg); }
        16% { transform: translate(88px, -12px) rotate(-10deg); }
        32% { transform: translate(56px, 8px) rotate(4deg); }
        48% { transform: translate(26px, -10px) rotate(-8deg); }
        64% { transform: translate(12px, 8px) rotate(0deg); }
        82% { transform: translate(66px, -12px) rotate(10deg); }
        100% { transform: translate(118px, 8px) rotate(0deg); }
      }
      @keyframes earBounce { 0% { transform: rotate(-10deg); } 100% { transform: rotate(12deg); } }
      @keyframes petalDrift { 0% { transform: translate(-4px, -2px); } 100% { transform: translate(5px, 4px); } }
    </style>
  </defs>

  <!-- TÁN HOA ANH ĐÀO NỞ RỘ BÊN TRÁI -->
  <g class="petal-fall">
    <path d="M 16 58 C 10 58, 8 48, 16 42 C 16 30, 30 24, 42 30 C 50 20, 68 20, 76 30 C 86 28, 94 36, 90 46 C 96 52, 88 60, 78 60 Z" fill="url(#sakuraCrown)" stroke="#fce7f3" stroke-width="1.3"/>
    <circle cx="34" cy="40" r="3" fill="#ffffff" opacity="0.85"/>
    <circle cx="62" cy="36" r="2.5" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- THỎ NGỌC CHIBI NHẢY QUA THẢM HOA ANH ĐÀO -->
  <g class="bunny-hop">
    <!-- Đuôi bông tròn -->
    <circle cx="34" cy="48" r="6" fill="#ffffff" stroke="#f472b6" stroke-width="1.2"/>
    <!-- Thân Thỏ Ngọc -->
    <ellipse cx="52" cy="48" rx="16" ry="11" fill="url(#bunnyBody)" stroke="#db2777" stroke-width="1.3"/>
    <!-- Đầu Thỏ va Đôi tai dài -->
    <circle cx="68" cy="38" r="11" fill="url(#bunnyBody)" stroke="#db2777" stroke-width="1.3"/>
    <g class="ear-flop">
      <ellipse cx="62" cy="18" rx="4" ry="11" transform="rotate(-18 62 18)" fill="url(#bunnyBody)" stroke="#db2777" stroke-width="1.2"/>
      <ellipse cx="62" cy="18" rx="2" ry="7" transform="rotate(-18 62 18)" fill="#f472b6"/>
    </g>
    <!-- Hoa anh đào cài tai va Mắt hồng ngọc -->
    <circle cx="68" cy="27" r="4" fill="#f472b6" stroke="#ffffff" stroke-width="0.9"/>
    <circle cx="68" cy="27" r="1.4" fill="#fef08a"/>
    <ellipse cx="73" cy="38" rx="2.8" ry="3.2" fill="#831843"/>
    <circle cx="74" cy="36.8" r="1.2" fill="#ffffff"/>
    <ellipse cx="70" cy="42" rx="2.5" ry="1.3" fill="#fb7185" opacity="0.65"/>
  </g>

  <!-- BỤI HOA ANH ĐÀO NHỎ va CÁNH HOA BAY BÊN PHẢI -->
  <g class="petal-fall">
    <path d="M 188 62 C 180 62, 178 52, 186 48 C 186 38, 198 34, 206 38 C 212 30, 228 30, 234 39 C 244 37, 250 44, 246 53 C 252 58, 244 64, 234 64 Z" fill="url(#sakuraCrown)" stroke="#fce7f3" stroke-width="1.3"/>
    <ellipse cx="152" cy="28" rx="4" ry="2.2" transform="rotate(-25 152 28)" fill="#fbcfe8"/>
    <ellipse cx="172" cy="36" rx="3.5" ry="2" transform="rotate(15 172 36)" fill="#f472b6"/>
  </g>
</svg>
