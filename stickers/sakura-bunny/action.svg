<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <radialGradient id="sbSpringGlow" cx="50%" cy="62%" r="68%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#f472b6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#fdf2f8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sbFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="sbEarIn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="sbHillBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="sbHillFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="sbBushLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="55%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sbBushDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="60%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="sbTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0"/>
      <stop offset="60%" stop-color="#f472b6" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="sbStageClip">
      <rect x="0" y="0" width="260" height="71"/>
    </clipPath>
    <style>
      .sbFlyX {
        animation: sbTravelX 3.6s linear infinite;
      }
      .sbHopY {
        animation: sbBounceHop 0.62s cubic-bezier(0.33, 1, 0.68, 1) infinite;
      }
      .sbEarFlop {
        transform-origin: 12px 28px;
        animation: sbEarSwing 0.31s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .sbTailBob {
        transform-origin: -14px 48px;
        animation: sbTailPop 0.31s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .sbPetal1 {
        animation: sbPetalDrift1 3.4s linear infinite;
      }
      .sbPetal2 {
        animation: sbPetalDrift2 3.9s linear -1.4s infinite;
      }
      .sbPetal3 {
        animation: sbPetalDrift3 3.0s linear -0.7s infinite;
      }
      .sbHeartFloat {
        animation: sbHeartRise 1.7s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .sbBushSway {
        animation: sbGentleSway 3.1s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }

      @keyframes sbTravelX {
        0% { transform: translateX(-45px); opacity: 0; }
        8% { opacity: 1; }
        92% { opacity: 1; }
        100% { transform: translateX(305px); opacity: 0; }
      }
      @keyframes sbBounceHop {
        0%, 100% { transform: translateY(4px) scale(1.05, 0.95); }
        50% { transform: translateY(-13px) rotate(-5deg) scale(0.96, 1.05); }
      }
      @keyframes sbEarSwing {
        0% { transform: rotate(-12deg); }
        100% { transform: rotate(10deg); }
      }
      @keyframes sbTailPop {
        0% { transform: scale(0.94); }
        100% { transform: scale(1.1); }
      }
      @keyframes sbPetalDrift1 {
        0% { transform: translate(0px, -6px) rotate(0deg); opacity: 0; }
        15% { opacity: 0.95; }
        85% { opacity: 0.95; }
        100% { transform: translate(-26px, 34px) rotate(130deg); opacity: 0; }
      }
      @keyframes sbPetalDrift2 {
        0% { transform: translate(0px, -5px) rotate(15deg); opacity: 0; }
        15% { opacity: 0.92; }
        85% { opacity: 0.92; }
        100% { transform: translate(-34px, 38px) rotate(-140deg); opacity: 0; }
      }
      @keyframes sbPetalDrift3 {
        0% { transform: translate(0px, -4px) rotate(-20deg); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translate(-22px, 30px) rotate(115deg); opacity: 0; }
      }
      @keyframes sbHeartRise {
        0% { transform: translateY(2px) scale(0.9); opacity: 0.7; }
        100% { transform: translateY(-4px) scale(1.12); opacity: 1; }
      }
      @keyframes sbGentleSway {
        0% { transform: translateX(-2px); }
        100% { transform: translateX(2px); }
      }
    </style>
  </defs>

  <g clip-path="url(#sbStageClip)">
    <!-- Soft Pastel Spring Meadow Glow -->
    <ellipse cx="130" cy="52" rx="135" ry="42" fill="url(#sbSpringGlow)"/>

    <!-- Layered Pastel Pink Sakura Hills -->
    <path d="M 0 62 Q 62 46 132 58 T 260 54 L 260 71 L 0 71 Z" fill="url(#sbHillBack)"/>
    <path d="M 0 67 Q 78 56 154 64 T 260 63 L 260 71 L 0 71 Z" fill="url(#sbHillFront)"/>

    <!-- Blooming Sakura Branch Accents (Top-Left va Top-Right Corners) -->
    <g>
      <path d="M -2 10 Q 24 14 48 6" fill="none" stroke="#881337" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 18 11 Q 28 19 37 22" fill="none" stroke="#881337" stroke-width="1.4" stroke-linecap="round"/>
      <!-- 5-petal blossom cluster top-left -->
      <g transform="translate(22, 11)">
        <circle cx="0" cy="-3.5" r="2.8" fill="#fbcfe8"/>
        <circle cx="3.3" cy="-1.1" r="2.8" fill="#fbcfe8"/>
        <circle cx="2" cy="2.8" r="2.8" fill="#fbcfe8"/>
        <circle cx="-2" cy="2.8" r="2.8" fill="#fbcfe8"/>
        <circle cx="-3.3" cy="-1.1" r="2.8" fill="#fbcfe8"/>
        <circle cx="0" cy="0" r="1.7" fill="#fef08a"/>
      </g>
      <g transform="translate(38, 19) scale(0.8)">
        <circle cx="0" cy="-3.5" r="2.8" fill="#f9a8d4"/>
        <circle cx="3.3" cy="-1.1" r="2.8" fill="#f9a8d4"/>
        <circle cx="2" cy="2.8" r="2.8" fill="#f9a8d4"/>
        <circle cx="-2" cy="2.8" r="2.8" fill="#f9a8d4"/>
        <circle cx="-3.3" cy="-1.1" r="2.8" fill="#f9a8d4"/>
        <circle cx="0" cy="0" r="1.7" fill="#fef08a"/>
      </g>

      <path d="M 262 12 Q 234 17 208 8" fill="none" stroke="#881337" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 238 14 Q 228 21 220 24" fill="none" stroke="#881337" stroke-width="1.4" stroke-linecap="round"/>
      <g transform="translate(236, 13)">
        <circle cx="0" cy="-3.5" r="2.8" fill="#fbcfe8"/>
        <circle cx="3.3" cy="-1.1" r="2.8" fill="#fbcfe8"/>
        <circle cx="2" cy="2.8" r="2.8" fill="#fbcfe8"/>
        <circle cx="-2" cy="2.8" r="2.8" fill="#fbcfe8"/>
        <circle cx="-3.3" cy="-1.1" r="2.8" fill="#fbcfe8"/>
        <circle cx="0" cy="0" r="1.7" fill="#fef08a"/>
      </g>
      <g transform="translate(218, 22) scale(0.82)">
        <circle cx="0" cy="-3.5" r="2.8" fill="#f472b6"/>
        <circle cx="3.3" cy="-1.1" r="2.8" fill="#f472b6"/>
        <circle cx="2" cy="2.8" r="2.8" fill="#f472b6"/>
        <circle cx="-2" cy="2.8" r="2.8" fill="#f472b6"/>
        <circle cx="-3.3" cy="-1.1" r="2.8" fill="#f472b6"/>
        <circle cx="0" cy="0" r="1.7" fill="#fef08a"/>
      </g>
    </g>

    <!-- Lush Sakura Bushes (Left, Mid-Back, Right) -->
    <g class="sbBushSway">
      <!-- Mid-Back Sakura Bush -->
      <path d="M 118 71 C 115 62, 122 54, 131 55 C 136 47, 150 47, 156 54 C 165 53, 172 60, 169 71 Z" fill="url(#sbBushLight)" opacity="0.72"/>

      <!-- Left Big Blooming Sakura Tree/Bush -->
      <rect x="34" y="54" width="6.5" height="17" rx="1.5" fill="#881337" opacity="0.8"/>
      <path d="M 6 70 C 2 62, 6 52, 15 49 C 16 38, 29 33, 39 38 C 46 29, 62 30, 68 40 C 77 40, 83 48, 79 58 C 82 64, 77 70, 68 70 Z" fill="url(#sbBushDeep)" stroke="#fce7f3" stroke-width="1.1"/>
      <circle cx="28" cy="48" r="2.6" fill="#ffffff" opacity="0.9"/>
      <circle cx="48" cy="42" r="2.4" fill="#fef08a" opacity="0.95"/>
      <circle cx="62" cy="52" r="2.5" fill="#ffffff" opacity="0.88"/>

      <!-- Right Blooming Sakura Bush -->
      <rect x="218" y="56" width="6" height="15" rx="1.5" fill="#881337" opacity="0.8"/>
      <path d="M 186 70 C 182 63, 185 54, 194 52 C 196 42, 208 38, 217 42 C 224 34, 239 35, 245 44 C 253 44, 258 52, 254 60 C 257 65, 252 70, 244 70 Z" fill="url(#sbBushDeep)" stroke="#fce7f3" stroke-width="1.1"/>
      <circle cx="206" cy="53" r="2.4" fill="#ffffff" opacity="0.9"/>
      <circle cx="228" cy="46" r="2.4" fill="#fef08a" opacity="0.95"/>
      <circle cx="242" cy="56" r="2.2" fill="#ffffff" opacity="0.88"/>
    </g>

    <!-- Ambient Tiny Pink Hearts -->
    <g class="sbHeartFloat">
      <path d="M 96 22 C 94 19, 90.5 20, 92.5 23.5 L 96 27 L 99.5 23.5 C 101.5 20, 98 19, 96 22 Z" fill="#f43f5e" stroke="#ffffff" stroke-width="0.6"/>
      <path d="M 176 26 C 174.4 23.5, 171.6 24.4, 173.2 27.2 L 176 30 L 178.8 27.2 C 180.4 24.4, 177.6 23.5, 176 26 Z" fill="#fb7185" stroke="#ffffff" stroke-width="0.55"/>
    </g>

    <!-- Floating Cherry Blossom Petals -->
    <g class="sbPetal1">
      <path d="M 110 12 C 114 9, 118 12, 115 16 C 112 18, 108 15, 110 12 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="0.5"/>
    </g>
    <g class="sbPetal2">
      <path d="M 168 10 C 172 7, 176 10, 173 14 C 170 16, 166 13, 168 10 Z" fill="#f9a8d4" stroke="#ec4899" stroke-width="0.5"/>
    </g>
    <g class="sbPetal3">
      <path d="M 212 18 C 215.5 15.5, 219 18, 216.5 21.5 C 214 23, 210.5 20.5, 212 18 Z" fill="#fce7f3" stroke="#f472b6" stroke-width="0.5"/>
    </g>

    <!-- FOREGROUND MASCOT: Chibi Sakura Bunny hopping cheerfully -->
    <g class="sbFlyX">
      <g class="sbHopY">
        <!-- Trailing Pink Hearts va Sakura Petals -->
        <path d="M -48 51 Q -32 54 -18 49" fill="none" stroke="url(#sbTrail)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M -34 42 C -36 39.2, -39.2 40.2, -37.2 43.4 L -34 46.5 L -30.8 43.4 C -28.8 40.2, -32 39.2, -34 42 Z" fill="#f43f5e" stroke="#ffffff" stroke-width="0.55"/>
        <ellipse cx="-24" cy="49" rx="3" ry="1.7" transform="rotate(-24 -24 49)" fill="#fbcfe8" stroke="#f472b6" stroke-width="0.45"/>
        <ellipse cx="-44" cy="48" rx="2.6" ry="1.5" transform="rotate(18 -44 48)" fill="#f9a8d4"/>

        <!-- Fluffy Cotton Tail -->
        <circle class="sbTailBob" cx="-14" cy="48" r="5.5" fill="url(#sbFur)" stroke="#881337" stroke-width="1.2"/>

        <!-- Hopping Little Paws -->
        <ellipse cx="-6" cy="56" rx="4.5" ry="2.6" transform="rotate(-14 -6 56)" fill="url(#sbFur)" stroke="#881337" stroke-width="1.1"/>
        <ellipse cx="11" cy="56" rx="4.2" ry="2.5" transform="rotate(16 11 56)" fill="url(#sbFur)" stroke="#881337" stroke-width="1.1"/>

        <!-- Bunny Body -->
        <ellipse cx="2" cy="49" rx="14.5" ry="10.2" fill="url(#sbFur)" stroke="#881337" stroke-width="1.25"/>
        <!-- Rose Ribbon Collar -->
        <path d="M 7 43 Q 13 46.5 16.5 43.5" fill="none" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>

        <!-- Long Flopping Bunny Ears -->
        <g class="sbEarFlop">
          <!-- Back Ear -->
          <path d="M 12 28 C 6 14, 0 11, 0 17 C 0 22, 6 29, 10 31 Z" fill="url(#sbFur)" stroke="#881337" stroke-width="1.2"/>
          <path d="M 10 27 C 6 17, 2.5 15, 2.5 19 C 2.5 22, 6 26.5, 9 29 Z" fill="url(#sbEarIn)"/>
          <!-- Front Ear -->
          <path d="M 15 29 C 11 14, 6 9, 5 15 C 4 21, 9 29, 13 31 Z" fill="url(#sbFur)" stroke="#881337" stroke-width="1.2"/>
          <path d="M 13.5 28 C 10.5 17, 7.5 14, 7 18 C 6.5 22, 9.5 27, 12.2 29 Z" fill="url(#sbEarIn)"/>
        </g>

        <!-- Chibi Bunny Head -->
        <circle cx="16" cy="38" r="10.5" fill="url(#sbFur)" stroke="#881337" stroke-width="1.25"/>

        <!-- Iconic 5-Petal Sakura Flower tucked by Ear -->
        <g transform="translate(12, 29.5)">
          <circle cx="0" cy="-3.2" r="2.4" fill="#f472b6" stroke="#be123c" stroke-width="0.5"/>
          <circle cx="3" cy="-1" r="2.4" fill="#f472b6" stroke="#be123c" stroke-width="0.5"/>
          <circle cx="1.9" cy="2.6" r="2.4" fill="#f472b6" stroke="#be123c" stroke-width="0.5"/>
          <circle cx="-1.9" cy="2.6" r="2.4" fill="#f472b6" stroke="#be123c" stroke-width="0.5"/>
          <circle cx="-3" cy="-1" r="2.4" fill="#f472b6" stroke="#be123c" stroke-width="0.5"/>
          <circle cx="0" cy="0" r="1.5" fill="#fef08a"/>
        </g>

        <!-- Big Sparkling Ruby-Rose Eye (Facing Right) -->
        <ellipse cx="20.8" cy="37.5" rx="2.5" ry="3" fill="#4c0519"/>
        <ellipse cx="21" cy="37.8" rx="1.8" ry="2.2" fill="#e11d48"/>
        <ellipse cx="21" cy="38.8" rx="1.2" ry="1.1" fill="#fda4af"/>
        <circle cx="21.7" cy="36.5" r="0.95" fill="#ffffff"/>
        <circle cx="20.3" cy="39.1" r="0.45" fill="#ffffff"/>

        <!-- Rosy Cheek Blush, Pink Nose va Happy Smile -->
        <ellipse cx="16.8" cy="41.2" rx="2.3" ry="1.2" fill="#fb7185" opacity="0.72"/>
        <polygon points="24.5,39.5 26.3,39.5 25.4,40.8" fill="#fb7185"/>
        <path d="M 22.8 41.8 Q 24.4 43.2 25.6 41.6" fill="none" stroke="#881337" stroke-width="0.95" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
