<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="saSuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="saVisor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="saSaturn" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <style>
      /* Phi hành gia bật Jetpack lơ lửng không trọng lực, tung hứng các hành tinh quay quanh! */
      .sa-float { transform-origin: 60px 60px; animation: saFloat 1.5s ease-in-out infinite; }
      .sa-flame { transform-origin: 60px 98px; animation: saFlame 0.25s ease-in-out infinite alternate; }
      .sa-orbit { transform-origin: 60px 60px; animation: saOrbit 1.8s linear infinite; }
      .sa-armL { transform-origin: 42px 84px; animation: saArm 0.45s ease-in-out infinite alternate; }
      .sa-armR { transform-origin: 78px 84px; animation: saArm 0.45s ease-in-out 0.22s infinite alternate; }

      @keyframes saFloat {
        0%, 100% { transform: translateY(0) rotate(-6deg); }
        50% { transform: translateY(-7px) rotate(6deg); }
      }
      @keyframes saFlame { 0% { transform: scaleY(0.8); } 100% { transform: scaleY(1.25); } }
      @keyframes saOrbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes saArm { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }
    </style>
  </defs>

  <g class="sa-float">
    <!-- Balo Jetpack + lửa phản lực cháy bùng -->
    <rect x="33" y="64" width="54" height="34" rx="10" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
    <g class="sa-flame">
      <path d="M38 98 Q42 114 45 117 Q48 114 50 98 Z" fill="#38bdf8"/>
      <path d="M70 98 Q73 114 75 117 Q78 114 82 98 Z" fill="#38bdf8"/>
      <path d="M41 98 Q45 108 47 110 Q48 108 48 98 Z" fill="#fde047"/>
      <path d="M72 98 Q75 108 76 110 Q78 108 79 98 Z" fill="#fde047"/>
    </g>

    <!-- Ăng-ten phát sáng -->
    <line x1="60" y1="18" x2="60" y2="8" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="60" cy="7" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Bộ đồ phi hành gia -->
    <path d="M39 74 C36 90, 41 104, 60 104 C79 104, 84 90, 81 74 Z" fill="url(#saSuit)" stroke="#1e293b" stroke-width="2.2"/>
    <path d="M38 73 Q60 81 82 73" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="49" cy="105" rx="8" ry="5.5" fill="url(#saSuit)" stroke="#1e293b" stroke-width="2"/>
    <ellipse cx="71" cy="105" rx="8" ry="5.5" fill="url(#saSuit)" stroke="#1e293b" stroke-width="2"/>

    <!-- Mũ bảo hộ va gương mắt lấp lánh sao -->
    <circle cx="60" cy="46" r="30" fill="url(#saSuit)" stroke="#1e293b" stroke-width="2.4"/>
    <rect x="35" y="27" width="50" height="38" rx="18" fill="url(#saVisor)" stroke="#38bdf8" stroke-width="2.2"/>
    <path d="M41 32 Q52 28 67 32" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
    <!-- Mắt cười ngôi sao háo hức -->
    <path d="M 42 47 Q 47 41 52 47" fill="none" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 68 47 Q 73 41 78 47" fill="none" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M55 52 Q60 57 65 52" fill="none" stroke="#bae6fd" stroke-width="2.2" stroke-linecap="round"/>

    <g class="sa-armL"><ellipse cx="38" cy="82" rx="6.5" ry="5" transform="rotate(-24 38 82)" fill="url(#saSuit)" stroke="#1e293b" stroke-width="2"/></g>
    <g class="sa-armR"><ellipse cx="82" cy="82" rx="6.5" ry="5" transform="rotate(24 82 82)" fill="url(#saSuit)" stroke="#1e293b" stroke-width="2"/></g>
  </g>

  <!-- Quỹ đạo các hành tinh tí hon quay quanh phi hành gia -->
  <g class="sa-orbit">
    <!-- Sao Thổ -->
    <g transform="translate(18, 28)">
      <circle cx="0" cy="0" r="7.5" fill="url(#saSaturn)" stroke="#78350f" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="13" ry="3.2" transform="rotate(-18)" fill="none" stroke="#fef08a" stroke-width="2"/>
    </g>
    <!-- Hành tinh xanh -->
    <circle cx="104" cy="76" r="6" fill="#38bdf8" stroke="#0369a1" stroke-width="1.2"/>
    <circle cx="102" cy="74" r="2" fill="#bbf7d0"/>
    <!-- Ngôi sao nhỏ -->
    <path d="M 100 22 L 102 26 L 106 27 L 102 28 L 100 32 L 98 28 L 94 27 L 98 26 Z" fill="#fde047"/>
  </g>
</svg>
