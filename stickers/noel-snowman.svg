<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="santaRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="scarfGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="rudolphGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ff2a2a"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="noelGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.55"/>
    </filter>
  </defs>

  <style>
    .sm-body {
      transform-origin: 60px 104px;
      animation: smBounce 2.8s ease-in-out infinite;
    }
    .sm-arm-r {
      transform-origin: 84px 72px;
      animation: smWave 2.2s ease-in-out infinite;
    }
    .sm-eyes {
      transform-origin: 60px 50px;
      animation: smBlink 4.2s infinite;
    }
    /* 15s Non-Interactive Animation: Opens Christmas Gift Box -> Reindeer Antlers + Glowing Rudolph Nose + Jingle Notes! */
    .sm-gift-15s {
      transform-origin: 36px 82px;
      animation: smGiftBox15s 15s ease-in-out infinite;
      opacity: 0;
    }
    .sm-gift-lid-15s {
      transform-origin: 36px 74px;
      animation: smGiftLid15s 15s ease-in-out infinite;
    }
    .sm-surprise-15s {
      transform-origin: 60px 42px;
      animation: smAntlers15s 15s ease-in-out infinite;
      opacity: 0;
    }
    .sm-rudolph-15s {
      transform-origin: 65px 54px;
      animation: smRudolph15s 15s ease-in-out infinite;
      opacity: 0;
    }
    .sm-notes-15s {
      animation: smNotes15s 15s ease-out infinite;
      opacity: 0;
    }

    @keyframes smBounce {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-4px) rotate(1.5deg); }
    }
    @keyframes smWave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-16deg); }
    }
    @keyframes smBlink {
      0%, 46%, 50%, 96%, 100% { transform: scaleY(1); }
      48%, 98% { transform: scaleY(0.1); }
    }

    /* 15s Timeline: active between 68% (10.2s) and 95% (14.25s) */
    @keyframes smGiftBox15s {
      0%, 67% { opacity: 0; transform: translateY(10px) scale(0.3); }
      71% { opacity: 1; transform: translateY(0) scale(1.08); }
      74%, 90% { opacity: 1; transform: translateY(0) scale(1); }
      95%, 100% { opacity: 0; transform: translateY(8px) scale(0.3); }
    }
    @keyframes smGiftLid15s {
      0%, 73% { transform: translate(0, 0) rotate(0deg); }
      76%, 90% { transform: translate(-10px, -16px) rotate(-38deg); }
      95%, 100% { transform: translate(0, 0) rotate(0deg); }
    }
    @keyframes smAntlers15s {
      0%, 74% { opacity: 0; transform: translateY(12px) scale(0.2); }
      78% { opacity: 1; transform: translateY(-2px) scale(1.12); }
      81%, 91% { opacity: 1; transform: translateY(0) scale(1); }
      95%, 100% { opacity: 0; transform: translateY(-8px) scale(0.2); }
    }
    @keyframes smRudolph15s {
      0%, 75% { opacity: 0; transform: scale(0.3); }
      78%, 82%, 86%, 90% { opacity: 1; transform: scale(1.25); }
      80%, 84%, 88% { opacity: 0.85; transform: scale(0.95); }
      95%, 100% { opacity: 0; transform: scale(0.2); }
    }
    @keyframes smNotes15s {
      0%, 76% { opacity: 0; transform: translateY(6px) scale(0.5); }
      80%, 89% { opacity: 1; transform: translateY(-6px) scale(1.05); }
      94%, 100% { opacity: 0; transform: translateY(-14px) scale(0.7); }
    }
  </style>

  <!-- Festive snowy ground shadow -->
  <ellipse cx="60" cy="108" rx="34" ry="7" fill="#052e16" opacity="0.45"/>
  <ellipse cx="60" cy="107" rx="28" ry="4.5" fill="#e0f2fe" opacity="0.75"/>

  <g class="sm-body" filter="url(#noelGlow)">
    <!-- Twig Left Arm -->
    <g stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M 38 72 L 18 60"/>
      <path d="M 24 64 L 20 55"/>
      <path d="M 27 66 L 17 67"/>
    </g>

    <!-- Twig Right Arm holding Candy Cane -->
    <g class="sm-arm-r">
      <g stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M 82 72 L 102 58"/>
        <path d="M 95 63 L 99 53"/>
      </g>
      <!-- Candy Cane -->
      <path d="M 101 76 L 101 47 A 7 7 0 0 1 115 47 L 115 52" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <path d="M 101 76 L 101 47 A 7 7 0 0 1 115 47 L 115 52" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="4 4" stroke-linecap="round"/>
    </g>

    <!-- Lower Snowball Body -->
    <circle cx="60" cy="82" r="25" fill="url(#snowGrad)" stroke="#7dd3fc" stroke-width="1.2"/>
    <!-- Coal Buttons va Holly Badge -->
    <circle cx="60" cy="75" r="2.6" fill="#1e293b"/>
    <circle cx="60" cy="84" r="2.6" fill="#1e293b"/>
    <circle cx="60" cy="93" r="2.6" fill="#1e293b"/>
    <!-- Cute Holly leaves on chest -->
    <path d="M 70 74 Q 76 70 78 75 Q 73 78 70 74 Z" fill="#16a34a"/>
    <path d="M 70 74 Q 74 80 79 78 Q 76 73 70 74 Z" fill="#15803d"/>
    <circle cx="70" cy="75" r="2" fill="#ef4444"/>
    <circle cx="72" cy="73.5" r="1.8" fill="#dc2626"/>

    <!-- Upper Snowball Head -->
    <circle cx="60" cy="50" r="20" fill="url(#snowGrad)" stroke="#7dd3fc" stroke-width="1.2"/>

    <!-- Cozy Red va Green Striped Christmas Scarf -->
    <path d="M 41 62 Q 60 70 79 62 Q 81 68 76 70 Q 60 76 44 70 Q 39 68 41 62 Z" fill="url(#santaRed)"/>
    <path d="M 46 64 L 46 71 M 55 66 L 55 73 M 65 66 L 65 73 M 74 64 L 74 71" stroke="#facc15" stroke-width="2"/>
    <!-- Scarf hanging tail -->
    <path d="M 47 67 L 42 87 L 51 88 L 53 69 Z" fill="url(#santaRed)"/>
    <path d="M 43 82 L 51 83" stroke="#facc15" stroke-width="2.2"/>
    <path d="M 42 87 L 41 91 M 45 87.5 L 45 91.5 M 49 88 L 49 92" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="45" cy="55" rx="4.2" ry="2.5" fill="#fb7185" opacity="0.65"/>
    <ellipse cx="75" cy="55" rx="4.2" ry="2.5" fill="#fb7185" opacity="0.65"/>

    <!-- Cute Happy Eyes -->
    <g class="sm-eyes">
      <circle cx="51" cy="48" r="3.4" fill="#0f172a"/>
      <circle cx="50" cy="46.8" r="1.3" fill="#ffffff"/>
      <circle cx="69" cy="48" r="3.4" fill="#0f172a"/>
      <circle cx="68" cy="46.8" r="1.3" fill="#ffffff"/>
    </g>

    <!-- Happy Coal Smile -->
    <path d="M 52 58 Q 60 64 68 58" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Carrot Nose -->
    <path d="M 59 51 L 73 54 L 59 56 Z" fill="url(#carrotGrad)" stroke="#c2410c" stroke-width="0.8" stroke-linejoin="round"/>

    <!-- 15s Rudolph Red Glowing Nose Overlay -->
    <g class="sm-rudolph-15s">
      <circle cx="72" cy="54" r="11" fill="url(#rudolphGlow)"/>
      <circle cx="72" cy="54" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
      <circle cx="70.5" cy="52.5" r="1.5" fill="#ffffff"/>
    </g>

    <!-- 15s Pop-out Reindeer Antlers va Golden Bell Crown -->
    <g class="sm-surprise-15s">
      <!-- Left Antler -->
      <path d="M 42 33 L 28 16 M 34 24 L 25 22 M 38 28 L 35 17" stroke="#92400e" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Right Antler -->
      <path d="M 78 33 L 92 16 M 86 24 L 95 22 M 82 28 L 85 17" stroke="#92400e" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Golden Jingle Bells on antlers -->
      <circle cx="28" cy="16" r="3.2" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
      <circle cx="92" cy="16" r="3.2" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
    </g>

    <!-- Santa Hat -->
    <path d="M 39 38 Q 56 12 84 26 Q 92 31 90 42 Q 77 32 76 38 Z" fill="url(#santaRed)"/>
    <!-- Fluffy White Hat Brim -->
    <rect x="37" y="33" width="46" height="9" rx="4.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Fluffy White Pom-Pom -->
    <circle cx="90" cy="42" r="6.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- 15s Christmas Gift Box (Bottom Left) -->
    <g class="sm-gift-15s">
      <rect x="24" y="76" width="22" height="18" rx="2" fill="#ef4444" stroke="#991b1b" stroke-width="1.2"/>
      <rect x="33" y="76" width="4" height="18" fill="#facc15"/>
      <rect x="24" y="83" width="22" height="4" fill="#facc15"/>
      <g class="sm-gift-lid-15s">
        <rect x="22" y="71" width="26" height="6" rx="1.5" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
        <path d="M 35 71 C 29 65, 26 71, 35 71 C 44 71, 41 65, 35 71 Z" fill="none" stroke="#facc15" stroke-width="2.5"/>
      </g>
    </g>

    <!-- 15s Jingle Music Notes va Christmas Star -->
    <g class="sm-notes-15s">
      <text x="14" y="34" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#facc15">♪</text>
      <text x="96" y="28" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#4ade80">🎄</text>
      <text x="54" y="14" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#fef08a">★</text>
    </g>
  </g>
</svg>
