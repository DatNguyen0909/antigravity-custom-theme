<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" shape-rendering="crispEdges">
  <defs>
    <style>
      /* Pixel Hiệp Sĩ rèn thanh kiếm đỏ rực trên đe sắt, búa đập nảy lửa 8-bit! */
      .pk-smith { transform-origin: 44px 102px; animation: pkBodyBob 0.36s steps(2) infinite; }
      .pk-hammer { transform-origin: 58px 66px; animation: pkHammerStrike 0.36s ease-in infinite alternate; }
      .pk-blade { animation: pkBladeGlow 0.36s steps(2) infinite; }
      .pk-sp1 { animation: pkSp1 0.36s ease-out infinite; }
      .pk-sp2 { animation: pkSp2 0.36s ease-out infinite; }

      @keyframes pkBodyBob { 0% { transform: translateY(0); } 100% { transform: translateY(2px); } }
      @keyframes pkHammerStrike { 0% { transform: rotate(-55deg); } 100% { transform: rotate(22deg); } }
      @keyframes pkBladeGlow { 0% { fill: #fb923c; } 100% { fill: #fef08a; } }
      @keyframes pkSp1 {
        0% { opacity: 0; transform: translate(0, 0); }
        45% { opacity: 1; }
        100% { opacity: 0; transform: translate(-14px, -18px); }
      }
      @keyframes pkSp2 {
        0% { opacity: 0; transform: translate(0, 0); }
        45% { opacity: 1; }
        100% { opacity: 0; transform: translate(16px, -16px); }
      }
    </style>
  <ellipse cx="60" cy="110" rx="28" ry="4.5" fill="#020617" opacity="0.34"/>
  </defs>

  <rect x="18" y="106" width="88" height="6" fill="#0f172a" opacity="0.45"/>

  <!-- Knight standing on the left, hammering -->
  <g class="pk-smith">
    <rect x="22" y="66" width="32" height="32" fill="#b91c1c"/>
    <rect x="28" y="98" width="10" height="8" fill="#1e293b"/>
    <rect x="44" y="98" width="10" height="8" fill="#1e293b"/>
    <rect x="26" y="66" width="32" height="32" fill="#cbd5e1"/>
    <rect x="26" y="86" width="32" height="5" fill="#ca8a04"/>

    <!-- Plume va Helmet facing right toward anvil -->
    <rect x="30" y="14" width="18" height="8" fill="#ef4444"/>
    <rect x="24" y="24" width="38" height="40" fill="#94a3b8"/>
    <rect x="28" y="28" width="30" height="32" fill="#e2e8f0"/>
    <rect x="36" y="40" width="24" height="14" fill="#0f172a"/>
    <rect x="42" y="44" width="5" height="5" fill="#38bdf8"/>
    <rect x="52" y="44" width="5" height="5" fill="#38bdf8"/>

    <!-- Blacksmith Hammer swinging down onto the anvil -->
    <g class="pk-hammer">
      <rect x="56" y="54" width="24" height="5" fill="#92400e"/>
      <rect x="74" y="46" width="12" height="18" fill="#475569"/>
      <rect x="76" y="48" width="8" height="14" fill="#94a3b8"/>
    </g>
  </g>

  <!-- Iron Anvil + Glowing Red-Hot Pixel Sword on the right -->
  <g>
    <!-- Wooden stump va iron anvil -->
    <rect x="74" y="94" width="26" height="12" fill="#78350f"/>
    <rect x="70" y="82" width="34" height="6" fill="#334155"/>
    <rect x="76" y="88" width="22" height="6" fill="#1e293b"/>
    <rect x="64" y="82" width="8" height="4" fill="#475569"/>
    <!-- Red-hot blade lying on anvil -->
    <rect x="64" y="77" width="6" height="5" fill="#facc15"/>
    <rect class="pk-blade" x="70" y="78" width="32" height="4" fill="#fb923c"/>
  </g>

  <!-- Pixel sparks flying off the anvil -->
  <g class="pk-sp1">
    <rect x="82" y="74" width="4" height="4" fill="#fef08a"/>
    <rect x="76" y="68" width="3" height="3" fill="#f97316"/>
  </g>
  <g class="pk-sp2">
    <rect x="88" y="72" width="4" height="4" fill="#facc15"/>
    <rect x="94" y="68" width="3" height="3" fill="#ef4444"/>
  </g>
</svg>
