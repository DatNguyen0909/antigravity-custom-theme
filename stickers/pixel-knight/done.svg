<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" shape-rendering="crispEdges">
  <defs>
    <style>
      .pkDn-body { transform-origin: 54px 104px; animation: pkDnJump 2.0s ease-in-out infinite; }
      .pkDn-sword { transform-origin: 24px 66px; animation: pkDnSword 2.0s ease-in-out infinite; }
      .pkDn-glow { animation: pkDnGlow 2.0s steps(2) infinite; }
      .pkDn-clear { transform-origin: 66px 18px; animation: pkDnClear 2.2s ease-in-out infinite; }
      .pkDn-coin1 { transform-origin: 96px 52px; animation: pkDnCoinSpin 2.0s steps(4) infinite; }
      .pkDn-coin2 { transform-origin: 102px 76px; animation: pkDnCoinSpin 2.4s steps(4) 0.6s infinite; }
      .pkDn-coin3 { transform-origin: 16px 86px; animation: pkDnCoinSpin 2.2s steps(4) 0.3s infinite; }

      @keyframes pkDnJump {
        0%, 100% { transform: translateY(0); }
        45% { transform: translateY(-7px); }
        60% { transform: translateY(-4px); }
      }
      @keyframes pkDnSword {
        0%, 100% { transform: rotate(-6deg); }
        50% { transform: rotate(8deg); }
      }
      @keyframes pkDnGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes pkDnClear {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.06); }
      }
      @keyframes pkDnCoinSpin {
        0%, 100% { transform: scaleX(1) translateY(0); }
        25% { transform: scaleX(0.4) translateY(-4px); }
        50% { transform: scaleX(1) translateY(-7px); }
        75% { transform: scaleX(0.4) translateY(-3px); }
      }
    </style>
  </defs>

  <!-- Floating CLEAR! banner -->
  <g class="pkDn-clear">
    <rect x="44" y="6" width="66" height="16" fill="#0f172a" opacity="0.85"/>
    <rect x="46" y="8" width="62" height="12" fill="#1e293b"/>
    <text x="77" y="17" font-family="Consolas, monospace" font-size="9" font-weight="900" fill="#fde047" text-anchor="middle">CLEAR! ★</text>
  </g>

  <!-- Spinning Pixel Gold Coins -->
  <g class="pkDn-coin1">
    <rect x="92" y="46" width="10" height="12" fill="#ca8a04"/>
    <rect x="94" y="48" width="6" height="8" fill="#facc15"/>
    <rect x="96" y="49" width="2" height="6" fill="#fef08a"/>
  </g>
  <g class="pkDn-coin2">
    <rect x="98" y="70" width="8" height="10" fill="#ca8a04"/>
    <rect x="100" y="72" width="4" height="6" fill="#facc15"/>
    <rect x="101" y="73" width="2" height="4" fill="#fef08a"/>
  </g>
  <g class="pkDn-coin3">
    <rect x="12" y="80" width="8" height="10" fill="#ca8a04"/>
    <rect x="14" y="82" width="4" height="6" fill="#facc15"/>
    <rect x="15" y="83" width="2" height="4" fill="#fef08a"/>
  </g>

  <!-- 8-bit ground shadow -->
  <rect x="26" y="106" width="56" height="6" fill="#0f172a" opacity="0.4"/>

  <g class="pkDn-body">
    <!-- Red pixel cape fluttering -->
    <rect x="30" y="64" width="48" height="34" fill="#b91c1c"/>
    <rect x="24" y="70" width="6" height="24" fill="#991b1b"/>
    <rect x="78" y="70" width="6" height="20" fill="#dc2626"/>

    <!-- Pixel Boots -->
    <rect x="38" y="98" width="12" height="8" fill="#334155"/>
    <rect x="58" y="98" width="12" height="8" fill="#334155"/>
    <rect x="38" y="102" width="14" height="4" fill="#1e293b"/>
    <rect x="58" y="102" width="14" height="4" fill="#1e293b"/>

    <!-- Armor Torso -->
    <rect x="36" y="64" width="36" height="34" fill="#94a3b8"/>
    <rect x="40" y="68" width="28" height="26" fill="#cbd5e1"/>
    <rect x="36" y="86" width="36" height="6" fill="#ca8a04"/>
    <rect x="50" y="86" width="8" height="6" fill="#facc15"/>
    <rect x="52" y="72" width="4" height="12" fill="#f59e0b"/>
    <rect x="48" y="76" width="12" height="4" fill="#f59e0b"/>

    <!-- Glowing Pixel Broadsword Raised High -->
    <g class="pkDn-sword">
      <!-- Aura pixels -->
      <g class="pkDn-glow">
        <rect x="18" y="10" width="12" height="44" fill="#38bdf8" opacity="0.35"/>
        <rect x="14" y="20" width="4" height="4" fill="#fef08a"/>
        <rect x="30" y="14" width="4" height="4" fill="#fef08a"/>
        <rect x="22" y="4" width="4" height="4" fill="#ffffff"/>
      </g>
      <!-- Blade -->
      <rect x="21" y="12" width="6" height="42" fill="#e2e8f0"/>
      <rect x="23" y="8" width="2" height="4" fill="#ffffff"/>
      <rect x="23" y="14" width="2" height="36" fill="#38bdf8"/>
      <!-- Guard and Hilt -->
      <rect x="15" y="54" width="18" height="4" fill="#facc15"/>
      <rect x="21" y="58" width="6" height="10" fill="#78350f"/>
      <!-- Raised Armored Arm -->
      <rect x="20" y="60" width="8" height="8" fill="#cbd5e1"/>
      <rect x="28" y="64" width="8" height="8" fill="#94a3b8"/>
    </g>

    <!-- Golden Shield (right side) -->
    <rect x="66" y="66" width="22" height="26" fill="#1d4ed8"/>
    <rect x="64" y="68" width="2" height="20" fill="#facc15"/>
    <rect x="88" y="68" width="2" height="20" fill="#facc15"/>
    <rect x="66" y="64" width="22" height="2" fill="#facc15"/>
    <rect x="68" y="92" width="18" height="4" fill="#facc15"/>
    <rect x="75" y="72" width="4" height="14" fill="#fef08a"/>
    <rect x="71" y="77" width="12" height="4" fill="#fef08a"/>

    <!-- Red Helmet Plume -->
    <rect x="46" y="18" width="16" height="7" fill="#ef4444"/>
    <rect x="42" y="22" width="24" height="5" fill="#dc2626"/>
    <rect x="62" y="25" width="8" height="5" fill="#b91c1c"/>

    <!-- Chibi Pixel Helmet -->
    <rect x="32" y="28" width="44" height="38" fill="#64748b"/>
    <rect x="36" y="32" width="36" height="30" fill="#cbd5e1"/>
    <rect x="36" y="32" width="36" height="6" fill="#f8fafc"/>
    <rect x="38" y="42" width="32" height="15" fill="#0f172a"/>
    <rect x="52" y="38" width="4" height="10" fill="#94a3b8"/>

    <!-- Happy Victorious '^ ^' Pixel Eyes -->
    <rect x="41" y="48" width="3" height="3" fill="#38bdf8"/>
    <rect x="44" y="45" width="3" height="3" fill="#bae6fd"/>
    <rect x="47" y="48" width="3" height="3" fill="#38bdf8"/>
    <rect x="58" y="48" width="3" height="3" fill="#38bdf8"/>
    <rect x="61" y="45" width="3" height="3" fill="#bae6fd"/>
    <rect x="64" y="48" width="3" height="3" fill="#38bdf8"/>
  </g>
</svg>
