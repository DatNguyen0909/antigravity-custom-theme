<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" shape-rendering="crispEdges">
  <defs>
    <style>
      .pk-body { transform-origin: 52px 104px; animation: pkIdle 0.8s steps(2) infinite; }
      .pk-plume { transform-origin: 52px 18px; animation: pkPlume 0.8s steps(2) infinite; }
      /* 15s gag: treasure chest pops in -> lid opens with big golden ray -> tiny '+1 EXP' floats up -> disappointed eyes + sweat drop */
      .pk-chest { transform-origin: 92px 98px; animation: pkChest15s 15s steps(1) infinite; opacity: 0; }
      .pk-lid-closed { animation: pkLidClosed15s 15s steps(1) infinite; }
      .pk-lid-open { animation: pkLidOpen15s 15s steps(1) infinite; opacity: 0; }
      .pk-ray { transform-origin: 92px 84px; animation: pkRay15s 15s ease-out infinite; opacity: 0; }
      .pk-exp { animation: pkExp15s 15s linear infinite; opacity: 0; }
      .pk-eyes-norm { animation: pkEyeNorm15s 15s steps(1) infinite; }
      .pk-blink { transform-origin: 52px 46px; animation: pkBlink 3.8s steps(1) infinite; }
      @keyframes pkBlink { 0%, 45%, 49%, 95%, 100% { transform: scaleY(1); } 47%, 97% { transform: scaleY(0.2); } }
      .pk-eyes-sad { animation: pkEyeSad15s 15s steps(1) infinite; opacity: 0; }
      .pk-sweat { animation: pkSweat15s 15s linear infinite; opacity: 0; }

      @keyframes pkIdle { 0% { transform: translateY(0); } 100% { transform: translateY(-2px); } }
      @keyframes pkPlume { 0% { transform: translateX(0); } 100% { transform: translateX(-2px); } }

      @keyframes pkChest15s { 0%, 67% { opacity: 0; } 68%, 94% { opacity: 1; } 95%, 100% { opacity: 0; } }
      @keyframes pkLidClosed15s { 0%, 73% { opacity: 1; } 74%, 100% { opacity: 0; } }
      @keyframes pkLidOpen15s { 0%, 73% { opacity: 0; } 74%, 94% { opacity: 1; } 95%, 100% { opacity: 0; } }
      @keyframes pkRay15s {
        0%, 73% { opacity: 0; transform: scaleY(0.1); }
        75%, 79% { opacity: 0.9; transform: scaleY(1); }
        81%, 100% { opacity: 0; transform: scaleY(0.2); }
      }
      @keyframes pkExp15s {
        0%, 76% { opacity: 0; transform: translateY(4px); }
        79%, 89% { opacity: 1; transform: translateY(-10px); }
        93%, 100% { opacity: 0; transform: translateY(-18px); }
      }
      @keyframes pkEyeNorm15s { 0%, 78% { opacity: 1; } 79%, 93% { opacity: 0; } 94%, 100% { opacity: 1; } }
      @keyframes pkEyeSad15s { 0%, 78% { opacity: 0; } 79%, 93% { opacity: 1; } 94%, 100% { opacity: 0; } }
      @keyframes pkSweat15s {
        0%, 79% { opacity: 0; transform: translateY(0); }
        82%, 91% { opacity: 1; transform: translateY(6px); }
        94%, 100% { opacity: 0; transform: translateY(10px); }
      }
    </style>
  </defs>

  <!-- 8-bit ground shadow -->
  <rect x="24" y="106" width="56" height="6" fill="#0f172a" opacity="0.45"/>

  <g class="pk-body">
    <!-- Red pixel cape behind -->
    <rect x="30" y="64" width="44" height="34" fill="#b91c1c"/>
    <rect x="26" y="72" width="4" height="24" fill="#991b1b"/>

    <!-- Pixel Boots -->
    <rect x="36" y="98" width="12" height="8" fill="#334155"/>
    <rect x="56" y="98" width="12" height="8" fill="#334155"/>
    <rect x="36" y="102" width="14" height="4" fill="#1e293b"/>
    <rect x="56" y="102" width="14" height="4" fill="#1e293b"/>

    <!-- Armor Torso -->
    <rect x="34" y="64" width="36" height="34" fill="#94a3b8"/>
    <rect x="38" y="68" width="28" height="26" fill="#cbd5e1"/>
    <!-- Gold belt va chest cross -->
    <rect x="34" y="86" width="36" height="6" fill="#ca8a04"/>
    <rect x="48" y="86" width="8" height="6" fill="#facc15"/>
    <rect x="50" y="72" width="4" height="12" fill="#f59e0b"/>
    <rect x="46" y="76" width="12" height="4" fill="#f59e0b"/>

    <!-- Pixel Broadsword (left hand, pointing up) -->
    <rect x="16" y="28" width="6" height="38" fill="#e2e8f0"/>
    <rect x="18" y="24" width="2" height="4" fill="#ffffff"/>
    <rect x="18" y="30" width="2" height="32" fill="#38bdf8"/>
    <rect x="10" y="66" width="18" height="4" fill="#facc15"/>
    <rect x="16" y="70" width="6" height="10" fill="#78350f"/>
    <rect x="15" y="72" width="8" height="6" fill="#cbd5e1"/>

    <!-- Golden Shield (right side) -->
    <rect x="64" y="66" width="22" height="26" fill="#1d4ed8"/>
    <rect x="62" y="68" width="2" height="20" fill="#facc15"/>
    <rect x="86" y="68" width="2" height="20" fill="#facc15"/>
    <rect x="64" y="64" width="22" height="2" fill="#facc15"/>
    <rect x="66" y="92" width="18" height="4" fill="#facc15"/>
    <rect x="73" y="72" width="4" height="14" fill="#fef08a"/>
    <rect x="69" y="77" width="12" height="4" fill="#fef08a"/>

    <!-- Red Helmet Plume -->
    <g class="pk-plume">
      <rect x="44" y="10" width="16" height="8" fill="#ef4444"/>
      <rect x="40" y="14" width="24" height="6" fill="#dc2626"/>
      <rect x="60" y="18" width="8" height="6" fill="#b91c1c"/>
    </g>

    <!-- Chibi Pixel Helmet va Visor -->
    <rect x="30" y="22" width="44" height="42" fill="#64748b"/>
    <rect x="34" y="26" width="36" height="34" fill="#cbd5e1"/>
    <rect x="34" y="26" width="36" height="6" fill="#f8fafc"/>
    <!-- Dark visor opening -->
    <rect x="36" y="38" width="32" height="16" fill="#0f172a"/>
    <!-- Helmet nose guard -->
    <rect x="50" y="34" width="4" height="10" fill="#94a3b8"/>

    <!-- Normal Determined Pixel Eyes -->
    <g class="pk-eyes-norm">
      <g class="pk-blink">
        <rect x="40" y="43" width="6" height="6" fill="#ffffff"/>
        <rect x="42" y="43" width="4" height="4" fill="#38bdf8"/>
        <rect x="58" y="43" width="6" height="6" fill="#ffffff"/>
        <rect x="60" y="43" width="4" height="4" fill="#38bdf8"/>
      </g>
    </g>

    <!-- Disappointed '= =' Eyes when getting +1 EXP -->
    <g class="pk-eyes-sad">
      <rect x="39" y="46" width="9" height="3" fill="#94a3b8"/>
      <rect x="56" y="46" width="9" height="3" fill="#94a3b8"/>
    </g>

    <!-- Sweat drop on helmet -->
    <g class="pk-sweat">
      <rect x="70" y="30" width="4" height="8" fill="#38bdf8"/>
      <rect x="71" y="28" width="2" height="2" fill="#bae6fd"/>
    </g>
  </g>

  <!-- 15s Pixel Treasure Chest + Tiny "+1 EXP" Gag -->
  <g class="pk-chest">
    <!-- Brief golden ray before disappointment -->
    <polygon class="pk-ray" points="86,86 106,86 114,54 78,54" fill="#fde047" opacity="0.45"/>
    <!-- Chest Base -->
    <rect x="80" y="88" width="28" height="18" fill="#92400e"/>
    <rect x="82" y="90" width="24" height="14" fill="#b45309"/>
    <rect x="80" y="88" width="28" height="3" fill="#facc15"/>
    <rect x="92" y="90" width="4" height="6" fill="#fef08a"/>
    <!-- Closed Lid -->
    <g class="pk-lid-closed">
      <rect x="80" y="80" width="28" height="8" fill="#b45309"/>
      <rect x="80" y="80" width="28" height="2" fill="#facc15"/>
    </g>
    <!-- Open Lid -->
    <g class="pk-lid-open">
      <rect x="80" y="84" width="28" height="5" fill="#1e1b4b"/>
      <rect x="80" y="74" width="28" height="8" fill="#78350f"/>
      <rect x="80" y="74" width="28" height="2" fill="#facc15"/>
    </g>
  </g>

  <!-- Tiny anticlimactic "+1 EXP" -->
  <g class="pk-exp">
    <text x="94" y="74" font-family="Consolas, monospace" font-size="7.5" font-weight="900" fill="#a3e635" text-anchor="middle">+1 EXP</text>
  </g>
</svg>
