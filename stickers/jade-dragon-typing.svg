<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="jdBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="jdBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="jdGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="jdPearl" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <style>
      /* Rồng ngọc uốn lượn bay trong mây, vờn viên ngọc minh châu tỏa sáng */
      .jd-soar { transform-origin: 60px 62px; animation: jdSoar 1.1s ease-in-out infinite; }
      .jd-tail { transform-origin: 84px 86px; animation: jdTail 0.55s ease-in-out infinite alternate; }
      .jd-wingL { transform-origin: 30px 72px; animation: jdWingL 0.45s ease-in-out infinite alternate; }
      .jd-wingR { transform-origin: 90px 72px; animation: jdWingR 0.45s ease-in-out infinite alternate; }
      .jd-whisker { transform-origin: 60px 62px; animation: jdWhisker 0.6s ease-in-out infinite alternate; }
      .jd-orb { transform-origin: 60px 92px; animation: jdOrb 0.9s ease-in-out infinite; }
      .jd-cloud1 { animation: jdCloud 1.5s linear infinite; opacity: 0; }
      .jd-cloud2 { animation: jdCloud 1.5s linear 0.75s infinite; opacity: 0; }

      @keyframes jdSoar {
        0%, 100% { transform: translate(0, 0) rotate(-6deg); }
        25% { transform: translate(-5px, -6px) rotate(4deg); }
        50% { transform: translate(0, -2px) rotate(7deg); }
        75% { transform: translate(5px, -7px) rotate(-3deg); }
      }
      @keyframes jdTail { 0% { transform: rotate(-16deg); } 100% { transform: rotate(18deg); } }
      @keyframes jdWingL { 0% { transform: rotate(-18deg); } 100% { transform: rotate(14deg); } }
      @keyframes jdWingR { 0% { transform: rotate(18deg); } 100% { transform: rotate(-14deg); } }
      @keyframes jdWhisker { 0% { transform: translateY(-2px); } 100% { transform: translateY(2px); } }
      @keyframes jdOrb {
        0%, 100% { transform: translate(0, 0) scale(1); filter: drop-shadow(0 0 4px #6ee7b7); }
        50% { transform: translate(0, -6px) scale(1.16); filter: drop-shadow(0 0 12px #fef08a); }
      }
      @keyframes jdCloud {
        0% { opacity: 0; transform: translate(12px, 4px) scale(0.7); }
        25% { opacity: 0.85; }
        100% { opacity: 0; transform: translate(-24px, -10px) scale(1.2); }
      }
    </style>
  </defs>

  <!-- Mây nhỏ lướt quanh khi rồng uốn lượn -->
  <g class="jd-cloud1">
    <path d="M 12 96 Q 12 88 20 88 Q 24 82 32 86 Q 38 86 38 94 Z" fill="#ecfdf5" opacity="0.85"/>
  </g>
  <g class="jd-cloud2">
    <path d="M 86 34 Q 86 27 93 27 Q 97 22 104 26 Q 110 26 110 33 Z" fill="#a7f3d0" opacity="0.85"/>
  </g>

  <g class="jd-soar">
    <!-- Đuôi rồng uốn lượn -->
    <g class="jd-tail">
      <path d="M 84 88 Q 108 84 106 64 Q 104 52 94 56 Q 99 66 90 74" fill="none" stroke="url(#jdBody)" stroke-width="8" stroke-linecap="round"/>
      <path d="M 94 54 C 98 44, 112 46, 108 58 C 114 56, 112 66, 102 62 Z" fill="url(#jdGold)"/>
    </g>

    <!-- Cánh rồng vỗ nhịp -->
    <g class="jd-wingL">
      <path d="M 28 68 C 8 54, 6 74, 16 82 C 12 86, 20 90, 30 84 Z" fill="#059669" stroke="#6ee7b7" stroke-width="1.5"/>
      <path d="M 26 71 C 14 62, 13 75, 20 80" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g class="jd-wingR">
      <path d="M 92 68 C 112 54, 114 74, 104 82 C 108 86, 100 90, 90 84 Z" fill="#059669" stroke="#6ee7b7" stroke-width="1.5"/>
      <path d="M 94 71 C 106 62, 107 75, 100 80" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Thân rồng -->
    <ellipse cx="60" cy="86" rx="24" ry="18" fill="url(#jdBody)" stroke="#065f46" stroke-width="1.5"/>
    <ellipse cx="60" cy="88" rx="16" ry="14" fill="url(#jdBelly)"/>
    <path d="M 48 84 Q 60 88 72 84 M 50 91 Q 60 95 70 91" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>

    <!-- Sừng va tai -->
    <path d="M 43 34 C 38 18, 26 12, 20 16 C 24 22, 32 24, 36 36 Z" fill="url(#jdGold)" stroke="#b45309" stroke-width="1"/>
    <path d="M 77 34 C 82 18, 94 12, 100 16 C 96 22, 88 24, 84 36 Z" fill="url(#jdGold)" stroke="#b45309" stroke-width="1"/>
    <path d="M 28 46 C 12 38, 10 54, 26 60 Z" fill="url(#jdBody)" stroke="#065f46" stroke-width="1.5"/>
    <path d="M 92 46 C 108 38, 110 54, 94 60 Z" fill="url(#jdBody)" stroke="#065f46" stroke-width="1.5"/>

    <!-- Đầu rồng -->
    <path d="M 28 56 C 28 34, 42 26, 60 26 C 78 26, 92 34, 92 56 C 95 72, 82 82, 60 82 C 38 82, 25 72, 28 56 Z" fill="url(#jdBody)" stroke="#064e3b" stroke-width="1.8"/>
    <polygon points="60,21 55,29 65,29" fill="url(#jdGold)" stroke="#b45309" stroke-width="0.8"/>
    <polygon points="60,35 64,41 60,47 56,41" fill="#fef08a" stroke="#d97706" stroke-width="1"/>

    <!-- Mắt long lanh vui vẻ -->
    <ellipse cx="44" cy="55" rx="7.5" ry="8.5" fill="#064e3b"/>
    <ellipse cx="44" cy="56" rx="6" ry="7" fill="#fbbf24"/>
    <ellipse cx="44" cy="56" rx="3.5" ry="5" fill="#022c22"/>
    <circle cx="41.5" cy="52.5" r="2.6" fill="#ffffff"/>
    <ellipse cx="76" cy="55" rx="7.5" ry="8.5" fill="#064e3b"/>
    <ellipse cx="76" cy="56" rx="6" ry="7" fill="#fbbf24"/>
    <ellipse cx="76" cy="56" rx="3.5" ry="5" fill="#022c22"/>
    <circle cx="73.5" cy="52.5" r="2.6" fill="#ffffff"/>

    <ellipse cx="34" cy="63" rx="5.5" ry="3.2" fill="#fb7185" opacity="0.65"/>
    <ellipse cx="86" cy="63" rx="5.5" ry="3.2" fill="#fb7185" opacity="0.65"/>
    <ellipse cx="60" cy="62" rx="11" ry="7.5" fill="#6ee7b7" stroke="#047857" stroke-width="1.2"/>
    <circle cx="56" cy="60" r="1.6" fill="#064e3b"/>
    <circle cx="64" cy="60" r="1.6" fill="#064e3b"/>
    <path d="M 54 65 Q 57 68 60 65 Q 63 68 66 65" fill="none" stroke="#064e3b" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Râu rồng bay phất phới -->
    <g class="jd-whisker">
      <path d="M 49 62 C 34 56, 22 68, 12 58" fill="none" stroke="url(#jdGold)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M 71 62 C 86 56, 98 68, 108 58" fill="none" stroke="url(#jdGold)" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- Ngọc minh châu phát sáng xoay vòng trong tay rồng -->
    <g class="jd-orb">
      <circle cx="60" cy="92" r="10.5" fill="url(#jdPearl)" stroke="#fef08a" stroke-width="1.5"/>
      <circle cx="56" cy="88" r="3" fill="#ffffff" opacity="0.9"/>
      <circle cx="60" cy="92" r="15" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.8"/>
    </g>
    <ellipse cx="44" cy="91" rx="7" ry="5.5" fill="url(#jdBody)" stroke="#064e3b" stroke-width="1.5"/>
    <ellipse cx="76" cy="91" rx="7" ry="5.5" fill="url(#jdBody)" stroke="#064e3b" stroke-width="1.5"/>
  </g>
</svg>
