<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="mwtHat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="55%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="mwtHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="55%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="mwtSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fde6d8"/>
    </linearGradient>
    <linearGradient id="mwtGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="mwtEye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="mwtPot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <clipPath id="mwtClip"><rect x="0" y="0" width="120" height="120"/></clipPath>
    <style>
      .mwt-hat { transform-origin: 60px 44px; animation: mwtHatW 0.8s ease-in-out infinite alternate; }
      .mwt-pupil { animation: mwtLook 1.2s ease-in-out infinite; }
      .mwt-wand { transform-origin: 60px 100px; animation: mwtStir 0.6s ease-in-out infinite alternate; }
      .mwt-liq { animation: mwtLiq 0.6s ease-in-out infinite alternate; transform-origin: 60px 96px; }
      .mwt-b1 { animation: mwtRise 1.2s ease-out infinite; }
      .mwt-b2 { animation: mwtRise 1.2s ease-out 0.4s infinite; }
      .mwt-b3 { animation: mwtRise 1.2s ease-out 0.8s infinite; }
      .mwt-s1 { transform-origin: 96px 70px; animation: mwtStar 1.4s ease-out infinite; }
      .mwt-s2 { transform-origin: 24px 74px; animation: mwtStar 1.4s ease-out 0.7s infinite; }
      .mwt-glow { animation: mwtGlow 0.5s ease-in-out infinite alternate; }
      @keyframes mwtHatW { 0% { transform: rotate(-2.5deg); } 100% { transform: rotate(2.5deg); } }
      @keyframes mwtLook { 0%,100% { transform: translate(-1.2px, 2.5px); } 50% { transform: translate(1.2px, 3px); } }
      @keyframes mwtStir { 0% { transform: rotate(-16deg); } 100% { transform: rotate(16deg); } }
      @keyframes mwtLiq { 0% { transform: scaleX(0.96); } 100% { transform: scaleX(1.03); } }
      @keyframes mwtRise { 0% { opacity: 0; transform: translateY(0) scale(0.4); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px) scale(1.2); } }
      @keyframes mwtStar { 0% { opacity: 0; transform: translateY(6px) scale(0.3) rotate(0deg); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-16px) scale(1.1) rotate(120deg); } }
      @keyframes mwtGlow { 0% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
  <ellipse cx="60" cy="110" rx="28" ry="4.5" fill="#020617" opacity="0.34"/>
  </defs>

  <g clip-path="url(#mwtClip)">
    <path d="M 24 54 C 14 68, 12 88, 22 96 C 26 90, 28 82, 32 78 Z" fill="url(#mwtHair)" stroke="#581c87" stroke-width="1.5"/>
    <path d="M 96 54 C 106 68, 108 88, 98 96 C 94 90, 92 82, 88 78 Z" fill="url(#mwtHair)" stroke="#581c87" stroke-width="1.5"/>
    <path d="M 32 80 C 30 92, 36 100, 60 100 C 84 100, 90 92, 88 80 Z" fill="url(#mwtHat)" stroke="#a855f7" stroke-width="1.5"/>
    <path d="M 46 82 L 60 96 L 74 82 Z" fill="#f3e8ff"/>

    <path d="M 32 58 C 32 42, 44 36, 60 36 C 76 36, 88 42, 88 58 C 90 74, 78 84, 60 84 C 42 84, 30 74, 32 58 Z" fill="url(#mwtSkin)" stroke="#701a75" stroke-width="1.5"/>

    <ellipse cx="45" cy="63" rx="7.5" ry="8.5" fill="url(#mwtEye)"/>
    <path d="M 36 57 Q 45 52 53 57" fill="none" stroke="#3b0764" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="75" cy="63" rx="7.5" ry="8.5" fill="url(#mwtEye)"/>
    <path d="M 67 57 Q 75 52 84 57" fill="none" stroke="#3b0764" stroke-width="2.5" stroke-linecap="round"/>
    <g class="mwt-pupil">
      <ellipse cx="45" cy="63" rx="3.5" ry="4.5" fill="#2e1065"/>
      <circle cx="42.5" cy="60" r="2.4" fill="#ffffff"/>
      <ellipse cx="75" cy="63" rx="3.5" ry="4.5" fill="#2e1065"/>
      <circle cx="72.5" cy="60" r="2.4" fill="#ffffff"/>
    </g>
    <ellipse cx="35" cy="70" rx="5" ry="2.8" fill="#f472b6" opacity="0.65"/>
    <ellipse cx="85" cy="70" rx="5" ry="2.8" fill="#f472b6" opacity="0.65"/>
    <path d="M 55 72 Q 60 77 65 72" fill="none" stroke="#9d174d" stroke-width="1.6" stroke-linecap="round"/>

    <path d="M 28 54 C 24 66, 26 82, 33 88 C 34 78, 34 66, 36 58 Z" fill="url(#mwtHair)" stroke="#581c87" stroke-width="1.3"/>
    <path d="M 92 54 C 96 66, 94 82, 87 88 C 86 78, 86 66, 84 58 Z" fill="url(#mwtHair)" stroke="#581c87" stroke-width="1.3"/>
    <path d="M 32 48 C 36 58, 44 52, 48 60 C 52 50, 58 58, 62 60 C 66 50, 74 58, 76 52 C 82 56, 86 58, 88 48 Z" fill="url(#mwtHair)" stroke="#581c87" stroke-width="1.3"/>

    <!-- Hat wobbling -->
    <g class="mwt-hat">
      <ellipse cx="60" cy="44" rx="46" ry="11" fill="#1e1b4b"/>
      <path d="M 26 42 C 34 22, 52 8, 78 6 C 88 6, 96 14, 92 22 C 84 18, 76 18, 72 24 C 76 30, 82 36, 92 42 Z" fill="url(#mwtHat)" stroke="#c084fc" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M 103 28 A 7 7 0 1 1 94 37 A 5.5 5.5 0 1 0 103 28 Z" fill="url(#mwtGold)" stroke="#fef08a" stroke-width="0.8"/>
      <path d="M 29 40 Q 60 47 90 40" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>
      <rect x="53" y="36" width="14" height="11" rx="2.5" fill="url(#mwtGold)" stroke="#92400e" stroke-width="1.2"/>
      <rect x="56" y="39" width="8" height="5" rx="1" fill="#581c87"/>
      <path d="M 12 44 C 28 34, 92 34, 108 44 C 94 52, 26 52, 12 44 Z" fill="url(#mwtHat)" stroke="#c084fc" stroke-width="1.6"/>
      <polygon points="48,22 49.5,25 53,26 49.5,27.5 48,31 46.5,27.5 43,26 46.5,25" fill="#fef08a"/>
    </g>

    <!-- Cauldron -->
    <path d="M 30 92 C 28 112, 92 112, 90 92 Z" fill="url(#mwtPot)" stroke="#1f2937" stroke-width="2"/>
    <ellipse class="mwt-liq" cx="60" cy="92" rx="30" ry="6" fill="#a3e635" stroke="#4d7c0f" stroke-width="1.6"/>
    <ellipse class="mwt-glow" cx="60" cy="92" rx="20" ry="3.5" fill="#d9f99d"/>
    <rect x="28" y="89" width="64" height="4" rx="2" fill="#374151" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M 40 100 Q 44 106 50 106" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>

    <!-- Bubbles -->
    <circle class="mwt-b1" cx="50" cy="90" r="3" fill="#bef264" stroke="#ffffff" stroke-width="0.8"/>
    <circle class="mwt-b2" cx="66" cy="90" r="2.4" fill="#f0abfc" stroke="#ffffff" stroke-width="0.8"/>
    <circle class="mwt-b3" cx="76" cy="91" r="3.2" fill="#d8b4fe" stroke="#ffffff" stroke-width="0.8"/>

    <!-- Wand stirring -->
    <g class="mwt-wand">
      <line x1="60" y1="100" x2="86" y2="66" stroke="url(#mwtGold)" stroke-width="3" stroke-linecap="round"/>
      <polygon points="88,64 90,58 93,63 99,64 94,68 95,74 90,70 85,74 86,68 82,64" fill="url(#mwtGold)" stroke="#ffffff" stroke-width="1"/>
    </g>
    <ellipse cx="84" cy="76" rx="6" ry="5" fill="url(#mwtSkin)" stroke="#701a75" stroke-width="1.3"/>

    <!-- Rising magic stars -->
    <polygon class="mwt-s1" points="96,70 97.5,73 101,74 97.5,75.5 96,79 94.5,75.5 91,74 94.5,73" fill="#fef08a"/>
    <polygon class="mwt-s2" points="24,74 25.5,77 29,78 25.5,79.5 24,83 22.5,79.5 19,78 22.5,77" fill="#f0abfc"/>
  </g>
</svg>
