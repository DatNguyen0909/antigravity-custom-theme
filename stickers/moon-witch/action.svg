<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95">
  <defs>
    <linearGradient id="moonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="witchHat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="60%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="nightCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.92"/>
    </linearGradient>
    <style>
      .moon-glow { animation: moonPulse 3s ease-in-out infinite alternate; }
      .witch-ride { animation: broomFlight 3.6s ease-in-out infinite; }
      .cloud-drift { animation: cloudMove 2.5s ease-in-out infinite alternate; }
      @keyframes moonPulse { 0% { transform: scale(0.97); } 100% { transform: scale(1.04); } }
      @keyframes cloudMove { 0% { transform: translateX(-4px); } 100% { transform: translateX(4px); } }
      @keyframes broomFlight {
        0% { transform: translate(118px, 6px) rotate(-3deg); }
        25% { transform: translate(56px, -8px) rotate(5deg); }
        50% { transform: translate(6px, 4px) rotate(-4deg); }
        75% { transform: translate(62px, 10px) rotate(-6deg); }
        100% { transform: translate(118px, 6px) rotate(-3deg); }
      }
    </style>
  </defs>

  <!-- TRĂNG LƯỠI LIỀM KHỔNG LỒ va MÂY ĐÊM BÊN TRÁI -->
  <g class="moon-glow" style="transform-origin: 52px 38px;">
    <circle cx="52" cy="38" r="26" fill="#fde047" opacity="0.18"/>
    <path d="M 60 14 A 24 24 0 1 0 76 54 A 19 19 0 1 1 60 14 Z" fill="url(#moonGold)" stroke="#fef08a" stroke-width="1"/>
  </g>
  <g class="cloud-drift">
    <path d="M 18 62 C 12 62, 10 54, 18 50 C 18 42, 30 38, 38 42 C 44 36, 58 36, 64 44 C 72 44, 76 52, 72 58 C 76 62, 70 66, 62 66 Z" fill="url(#nightCloud)" stroke="#d8b4fe" stroke-width="1.2"/>
  </g>

  <!-- PHÙ THỦY CHIBI CƯỠI CHỔI BAY QUA TRĂNG -->
  <g class="witch-ride">
    <!-- Cán chổi va Đuôi chổi sao phép -->
    <path d="M 18 50 L 92 46" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 20 50 C 10 42, 2 40, 0 46 C 2 50, 0 56, 6 58 C 12 56, 16 53, 20 50 Z" fill="#fbbf24" stroke="#78350f" stroke-width="1.2"/>
    <!-- Áo choàng tím va Thân phù thủy -->
    <path d="M 46 38 C 36 40, 28 48, 32 54 C 42 56, 56 54, 64 48 Z" fill="url(#witchHat)" stroke="#d8b4fe" stroke-width="1.2"/>
    <!-- Đầu Chibi va Tóc bạch kim -->
    <circle cx="64" cy="34" r="11" fill="#fde68a" stroke="#581c87" stroke-width="1.2"/>
    <path d="M 54 30 C 46 34, 42 42, 46 46 C 52 44, 56 38, 58 34" fill="#f3e8ff"/>
    <ellipse cx="68" cy="35" rx="2.6" ry="3" fill="#581c87"/>
    <circle cx="68.8" cy="33.8" r="1.1" fill="#ffffff"/>
    <!-- Nón phù thủy chóp nhọn -->
    <path d="M 46 28 Q 64 32 82 28 L 68 22 L 58 8 L 54 22 Z" fill="url(#witchHat)" stroke="#fde047" stroke-width="1.2"/>
  </g>

  <!-- THÁP LÂU ĐÀI va MÂY TÍM BÊN PHẢI -->
  <g class="cloud-drift">
    <polygon points="212,62 216,32 222,18 228,32 232,62" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
    <rect x="219" y="36" width="6" height="8" rx="3" fill="#fde047"/>
    <path d="M 188 64 C 180 64, 178 56, 186 52 C 186 44, 198 40, 206 44 C 212 38, 226 38, 232 46 C 242 46, 246 54, 242 60 C 246 64, 240 66, 232 66 Z" fill="url(#nightCloud)" stroke="#d8b4fe" stroke-width="1.2"/>
  </g>
</svg>
