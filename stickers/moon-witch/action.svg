<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <radialGradient id="mwSkyGlow" cx="22%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#1e1b4b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mwMoonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#fde047" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mwMoonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="55%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="mwHat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="55%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="mwHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="55%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="mwSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fde6d8"/>
    </linearGradient>
    <linearGradient id="mwCloudBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="mwCloudFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.88"/>
      <stop offset="65%" stop-color="#6b21a8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="mwSpire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="mwBroomStraw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="mwTrailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="55%" stop-color="#e879f9" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="mwStageClip">
      <rect x="0" y="0" width="260" height="71"/>
    </clipPath>
    <style>
      .mwFlyX {
        animation: mwTravelX 3.6s linear infinite;
      }
      .mwWaveY {
        animation: mwGlideY 1.05s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .mwMoonPulse {
        transform-origin: 42px 28px;
        animation: mwMoonBeat 2.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .mwCloudSlow {
        animation: mwDriftA 3.4s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .mwCloudFast {
        animation: mwDriftB 2.7s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .mwStarA {
        animation: mwTwinkle 1.4s ease-in-out infinite alternate;
      }
      .mwStarB {
        animation: mwTwinkle 1.9s ease-in-out -0.8s infinite alternate;
      }
      .mwBat1 {
        animation: mwBatFloat1 2.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .mwBat2 {
        animation: mwBatFloat2 2.2s cubic-bezier(0.37, 0, 0.63, 1) -0.9s infinite alternate;
      }
      .mwHairFlow {
        transform-origin: 4px 33px;
        animation: mwHairWave 0.65s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .mwHatCharm {
        transform-origin: -12px 15px;
        animation: mwCharmSwing 0.9s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      }
      .mwSparkleTrail {
        animation: mwSparkleFade 0.7s ease-in-out infinite alternate;
      }

      @keyframes mwTravelX {
        0% { transform: translateX(-45px); opacity: 0; }
        8% { opacity: 1; }
        92% { opacity: 1; }
        100% { transform: translateX(305px); opacity: 0; }
      }
      @keyframes mwGlideY {
        0% { transform: translateY(-7px) rotate(-3.5deg); }
        100% { transform: translateY(6px) rotate(3.5deg); }
      }
      @keyframes mwMoonBeat {
        0% { transform: scale(0.96); opacity: 0.9; }
        100% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes mwDriftA {
        0% { transform: translateX(-5px); }
        100% { transform: translateX(5px); }
      }
      @keyframes mwDriftB {
        0% { transform: translateX(4px); }
        100% { transform: translateX(-5px); }
      }
      @keyframes mwTwinkle {
        0% { opacity: 0.35; }
        100% { opacity: 1; }
      }
      @keyframes mwBatFloat1 {
        0% { transform: translate(0px, 0px) rotate(-6deg); }
        100% { transform: translate(8px, -5px) rotate(8deg); }
      }
      @keyframes mwBatFloat2 {
        0% { transform: translate(0px, 0px) rotate(7deg); }
        100% { transform: translate(-7px, -4px) rotate(-7deg); }
      }
      @keyframes mwHairWave {
        0% { transform: rotate(-5deg); }
        100% { transform: rotate(6deg); }
      }
      @keyframes mwCharmSwing {
        0% { transform: rotate(-10deg); }
        100% { transform: rotate(10deg); }
      }
      @keyframes mwSparkleFade {
        0% { opacity: 0.55; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#mwStageClip)">
    <!-- Midnight atmospheric wash -->
    <ellipse cx="130" cy="48" rx="135" ry="44" fill="url(#mwSkyGlow)"/>

    <!-- Starry Midnight Sky -->
    <g class="mwStarA" fill="#fef08a">
      <polygon points="18,12 19.2,14.8 22,16 19.2,17.2 18,20 16.8,17.2 14,16 16.8,14.8"/>
      <polygon points="94,10 95,12.2 97.2,13.2 95,14.2 94,16.4 93,14.2 90.8,13.2 93,12.2"/>
      <polygon points="164,14 165.4,17 168.4,18.4 165.4,19.8 164,22.8 162.6,19.8 159.6,18.4 162.6,17"/>
      <circle cx="122" cy="18" r="1.1"/>
      <circle cx="246" cy="16" r="1.2"/>
    </g>
    <g class="mwStarB" fill="#e9d5ff">
      <polygon points="78,24 79,26 81,27 79,28 78,30 77,28 75,27 77,26"/>
      <polygon points="190,8 191,10.2 193.2,11.2 191,12.2 190,14.4 189,12.2 186.8,11.2 189,10.2"/>
      <circle cx="142" cy="11" r="1.2"/>
      <circle cx="110" cy="28" r="0.9"/>
      <circle cx="178" cy="27" r="1.1"/>
      <circle cx="238" cy="28" r="1"/>
    </g>

    <!-- Glowing Crescent Moon with Soft Halo -->
    <g class="mwMoonPulse">
      <circle cx="42" cy="28" r="26" fill="url(#mwMoonHalo)"/>
      <circle cx="42" cy="28" r="18" fill="#fef08a" opacity="0.16"/>
      <path d="M 48 10 A 19 19 0 1 0 60 42 A 15 15 0 1 1 48 10 Z" fill="url(#mwMoonGold)" stroke="#fef9c3" stroke-width="0.9"/>
    </g>

    <!-- Tiny Fluttering Bats -->
    <g class="mwBat1" fill="#2e1065" stroke="#a855f7" stroke-width="0.5">
      <path d="M 102 22 Q 106 16 110 21 Q 112 19 114 21 Q 118 16 122 22 Q 116 22 112 25 Q 108 22 102 22 Z"/>
    </g>
    <g class="mwBat2" fill="#3b0764" stroke="#c084fc" stroke-width="0.45">
      <path d="M 150 26 Q 153 21.5 156 25 Q 157.5 23.5 159 25 Q 162 21.5 165 26 Q 160.5 26 157.5 28.2 Q 154.5 26 150 26 Z"/>
    </g>

    <!-- Distant Midnight Ridge va Gothic Clocktower Spire Silhouette -->
    <path d="M 0 65 Q 55 56 120 63 T 260 61 L 260 71 L 0 71 Z" fill="#1e1b4b" opacity="0.62"/>

    <g>
      <!-- Side Turret Left -->
      <polygon points="196,68 199,42 203,31 207,42 210,68" fill="url(#mwSpire)" stroke="#7e22ce" stroke-width="0.7"/>
      <!-- Main Gothic Clocktower -->
      <polygon points="210,70 213,34 222,10 231,34 234,70" fill="url(#mwSpire)" stroke="#a855f7" stroke-width="0.9"/>
      <!-- Spire Finial -->
      <line x1="222" y1="5" x2="222" y2="11" stroke="#fde047" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="222" cy="7.5" r="1.4" fill="#fef08a"/>
      <!-- Glowing Clock Face -->
      <circle cx="222" cy="39" r="5.5" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
      <line x1="222" y1="39" x2="222" y2="35.5" stroke="#3b0764" stroke-width="1" stroke-linecap="round"/>
      <line x1="222" y1="39" x2="225" y2="39.8" stroke="#3b0764" stroke-width="1" stroke-linecap="round"/>
      <!-- Gothic Arched Windows -->
      <path d="M 218.5 55 L 218.5 50 A 3.5 3.5 0 0 1 225.5 50 L 225.5 55 Z" fill="#fde047" opacity="0.9"/>
      <path d="M 201 52 L 201 48.5 A 2 2 0 0 1 205 48.5 L 205 52 Z" fill="#fde047" opacity="0.8"/>
      <!-- Side Turret Right -->
      <polygon points="234,68 237,45 241,35 245,45 248,68" fill="url(#mwSpire)" stroke="#7e22ce" stroke-width="0.7"/>
    </g>

    <!-- Back Layer Purple Mist Clouds -->
    <g class="mwCloudSlow">
      <path d="M 76 71 C 72 64, 82 56, 94 59 C 102 52, 118 52, 126 59 C 136 56, 148 61, 146 71 Z" fill="url(#mwCloudBack)"/>
      <path d="M 156 71 C 154 63, 164 57, 174 60 C 182 54, 196 55, 202 62 C 210 60, 218 65, 216 71 Z" fill="url(#mwCloudBack)"/>
    </g>

    <!-- FOREGROUND MASCOT: Moon Witch gliding smoothly on broomstick -->
    <g class="mwFlyX">
      <g class="mwWaveY">
        <!-- Purple-Gold Magic Stardust Trail behind broom -->
        <g class="mwSparkleTrail">
          <path d="M -56 44 Q -36 48 -18 43" fill="none" stroke="url(#mwTrailGrad)" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M -48 39 Q -32 42 -16 40" fill="none" stroke="url(#mwTrailGrad)" stroke-width="1.6" stroke-dasharray="3 4" stroke-linecap="round"/>
          <polygon points="-44,37 -43,39 -41,40 -43,41 -44,43 -45,41 -47,40 -45,39" fill="#fef08a"/>
          <polygon points="-28,46 -27,47.8 -25.2,48.6 -27,49.4 -28,51.2 -29,49.4 -30.8,48.6 -29,47.8" fill="#f0abfc"/>
          <circle cx="-36" cy="43" r="1.5" fill="#fde047"/>
          <circle cx="-50" cy="46" r="1.2" fill="#e879f9"/>
          <circle cx="-22" cy="37" r="1.2" fill="#fef08a"/>
        </g>

        <!-- Broomstick Shaft va Straw Bristles -->
        <path d="M -18 44 L 30 40" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
        <path d="M -18 44 L 30 40" stroke="#d97706" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M -15 44 C -24 38, -32 37, -34 42 C -31 45, -33 49, -28 51 C -22 50, -18 47, -15 44 Z" fill="url(#mwBroomStraw)" stroke="#78350f" stroke-width="1"/>
        <line x1="-29" y1="42" x2="-19" y2="44" stroke="#b45309" stroke-width="0.8"/>
        <line x1="-28" y1="47" x2="-19" y2="45" stroke="#b45309" stroke-width="0.8"/>
        <rect x="-17" y="41.5" width="3.2" height="5.2" rx="1" fill="#ec4899" stroke="#831843" stroke-width="0.6"/>

        <!-- Flowing Lilac Hair (Back) -->
        <g class="mwHairFlow">
          <path d="M 4 31 C -6 32, -13 38, -10 44 C -4 43, 1 39, 5 35 Z" fill="url(#mwHair)" stroke="#581c87" stroke-width="1"/>
          <path d="M 2 34 C -5 36, -9 42, -5 46 C 0 44, 3 40, 6 36 Z" fill="#f5d0fe" opacity="0.8"/>
        </g>

        <!-- Witch Cloak va Dress -->
        <path d="M 2 34 C -6 37, -12 43, -8 48 C 0 50, 12 48, 17 42 Z" fill="url(#mwHat)" stroke="#c084fc" stroke-width="1.1"/>
        <path d="M 4 40 L 14 43" stroke="#fef08a" stroke-width="1" stroke-dasharray="1.5 2" stroke-linecap="round"/>
        <!-- Little Boot -->
        <ellipse cx="12" cy="46" rx="3.4" ry="2.2" fill="#1e1b4b" stroke="#c084fc" stroke-width="0.8"/>

        <!-- Chibi Head -->
        <circle cx="11" cy="31" r="9.5" fill="url(#mwSkin)" stroke="#701a75" stroke-width="1.1"/>
        <!-- Bangs -->
        <path d="M 3 27 C 7 31, 13 31, 19 27 C 16 23, 6 23, 3 27 Z" fill="url(#mwHair)" stroke="#581c87" stroke-width="0.9"/>
        <!-- Sparkling Violet Eye (Facing Right) -->
        <ellipse cx="15" cy="31.5" rx="2.3" ry="2.8" fill="#4c1d95"/>
        <ellipse cx="15.2" cy="32" rx="1.6" ry="1.9" fill="#a855f7"/>
        <circle cx="15.8" cy="30.5" r="0.95" fill="#ffffff"/>
        <circle cx="14.5" cy="33" r="0.45" fill="#fef08a"/>
        <!-- Rosy Blush va Smile -->
        <ellipse cx="12.5" cy="34.8" rx="2.1" ry="1.1" fill="#f472b6" opacity="0.7"/>
        <path d="M 16.5 35.2 Q 18 36.2 19 35" fill="none" stroke="#9d174d" stroke-width="0.9" stroke-linecap="round"/>

        <!-- Little Hand gripping Broom -->
        <circle cx="16" cy="41" r="2.6" fill="url(#mwSkin)" stroke="#701a75" stroke-width="0.9"/>

        <!-- Iconic Crooked Witch Hat with Pink Band, Gold Buckle va Moon Charm -->
        <ellipse cx="10" cy="24" rx="15" ry="3.8" fill="#1e1b4b" stroke="#c084fc" stroke-width="1"/>
        <path d="M -1 23 C 2 14, 9 9, -8 10 C -13 10.5, -14 14, -10 16 C -6 15, -3 16, -2 19 C 3 18, 12 19, 19 23 Z" fill="url(#mwHat)" stroke="#c084fc" stroke-width="1.1" stroke-linejoin="round"/>
        <path d="M 0 22.5 Q 9 25 18 22.5" fill="none" stroke="#ec4899" stroke-width="2.4" stroke-linecap="round"/>
        <rect x="8.5" y="21" width="4.8" height="3.8" rx="0.8" fill="#fbbf24" stroke="#92400e" stroke-width="0.7"/>
        <rect x="9.7" y="22" width="2.4" height="1.8" rx="0.4" fill="#581c87"/>
        <!-- Dangling Crescent Moon Charm -->
        <g class="mwHatCharm">
          <line x1="-11.5" y1="15" x2="-13" y2="20" stroke="#fbbf24" stroke-width="0.8"/>
          <path d="M -11 19 A 2.8 2.8 0 1 1 -14.8 22.2 A 2.1 2.1 0 1 0 -11 19 Z" fill="#fef08a"/>
        </g>
      </g>
    </g>

    <!-- Front Layered Purple Mist Clouds -->
    <g class="mwCloudFast">
      <path d="M 4 71 C -2 66, 2 56, 12 56 C 14 48, 26 45, 34 50 C 40 44, 54 45, 59 53 C 68 53, 73 61, 69 68 C 71 70, 68 71, 64 71 Z" fill="url(#mwCloudFront)" stroke="#d8b4fe" stroke-width="1"/>
      <path d="M 184 71 C 180 65, 184 57, 193 56 C 196 49, 208 46, 216 51 C 223 45, 236 46, 241 54 C 250 54, 256 61, 252 68 C 254 70, 251 71, 246 71 Z" fill="url(#mwCloudFront)" stroke="#d8b4fe" stroke-width="1"/>
    </g>
  </g>
</svg>
