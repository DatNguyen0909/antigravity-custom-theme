<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="mctBody" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <style>
      /* Cá Chép múa rước Đèn Ông Sao 5 cánh xoay tròn tỏa hào quang vàng rực! */
      .mct-carp { transform-origin: 44px 78px; animation: mctDance 0.5s ease-in-out infinite alternate; }
      .mct-star { transform-origin: 86px 52px; animation: mctSpinStar 1.8s linear infinite; }
      .mct-spark1 { animation: mctSparkA 0.8s ease-out infinite; }
      .mct-spark2 { animation: mctSparkB 0.8s ease-out -0.4s infinite; }

      @keyframes mctDance {
        0% { transform: translateY(0) rotate(-5deg); }
        100% { transform: translateY(-5px) rotate(5deg); }
      }
      @keyframes mctSpinStar {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.08); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes mctSparkA {
        0% { opacity: 0; transform: translate(86px, 52px) scale(0.4); }
        45% { opacity: 1; }
        100% { opacity: 0; transform: translate(68px, 22px) scale(1.1); }
      }
      @keyframes mctSparkB {
        0% { opacity: 0; transform: translate(86px, 52px) scale(0.4); }
        45% { opacity: 1; }
        100% { opacity: 0; transform: translate(106px, 24px) scale(1.1); }
      }
    </style>
  </defs>

  <ellipse cx="58" cy="108" rx="38" ry="5" fill="#451a03" opacity="0.38"/>

  <!-- Dancing Chibi Carp on left -->
  <g class="mct-carp">
    <path d="M44 94 C30 104, 26 112, 36 112 C41 112, 43 106, 44 103 C45 106, 47 112, 52 112 C62 112, 58 104, 44 94 Z" fill="#f97316" stroke="#9a3412" stroke-width="1.6"/>
    <ellipse cx="44" cy="68" rx="23" ry="27" fill="url(#mctBody)" stroke="#7c2d12" stroke-width="2.1"/>
    <ellipse cx="46" cy="75" rx="14" ry="16" fill="#fef3c7" opacity="0.88"/>
    <path d="M36 38 Q44 26 52 38 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.6"/>
    <!-- Joyful eyes looking at spinning star lantern -->
    <circle cx="38" cy="56" r="4.2" fill="#1e1b4b"/>
    <circle cx="55" cy="56" r="4.2" fill="#1e1b4b"/>
    <circle cx="37" cy="54.5" r="1.5" fill="#ffffff"/>
    <circle cx="54" cy="54.5" r="1.5" fill="#ffffff"/>
    <ellipse cx="47" cy="62" rx="3.8" ry="3" fill="#ef4444"/>
    <!-- Fin holding bamboo lantern stick -->
    <path d="M60 68 C72 64, 74 75, 60 77 Z" fill="#fb923c" stroke="#9a3412" stroke-width="1.6"/>
    <line x1="66" y1="72" x2="86" y2="54" stroke="#92400e" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- Big Glowing Spinning Star Lantern (Đèn Ông Sao) -->
  <circle cx="86" cy="52" r="22" fill="#facc15" opacity="0.22"/>
  <g class="mct-star">
    <circle cx="86" cy="52" r="15" fill="none" stroke="#fde047" stroke-width="2"/>
    <polygon points="86,32 91,45 105,45 94,54 98,67 86,59 74,67 78,54 67,45 81,45" fill="#ef4444" stroke="#fef08a" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="86,38 89,47 98,47 91,52 94,61 86,56 78,61 81,52 74,47 83,47" fill="#fef08a"/>
  </g>
  <!-- Red silk tassels -->
  <path d="M84 72 Q81 84 78 92 M88 72 Q91 84 94 92" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Floating Star Sparks -->
  <g class="mct-spark1">
    <circle cx="0" cy="0" r="3" fill="#fef08a"/>
  </g>
  <g class="mct-spark2">
    <circle cx="0" cy="0" r="2.8" fill="#fb7185"/>
  </g>
</svg>
