<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="mcDnBody" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="48%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <radialGradient id="mcDnMoon" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="70%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <style>
      .mcDn-fish { transform-origin: 60px 76px; animation: mcDnHop 2.2s ease-in-out infinite; }
      .mcDn-tail { transform-origin: 60px 100px; animation: mcDnTail 1.4s ease-in-out infinite alternate; }
      .mcDn-moon { transform-origin: 60px 24px; animation: mcDnMoonGlow 3.0s ease-in-out infinite; }
      .mcDn-fw1 { transform-origin: 20px 24px; animation: mcDnFw 2.2s ease-out infinite; }
      .mcDn-fw2 { transform-origin: 100px 26px; animation: mcDnFw 2.2s ease-out 0.9s infinite; }

      @keyframes mcDnHop {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-6px) rotate(2.5deg); }
      }
      @keyframes mcDnTail {
        0% { transform: rotate(-12deg); }
        100% { transform: rotate(12deg); }
      }
      @keyframes mcDnMoonGlow {
        0%, 100% { transform: scale(0.97); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes mcDnFw {
        0% { transform: scale(0.35); opacity: 0; }
        40% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1.35); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Glowing Full Moon behind Carp -->
  <g class="mcDn-moon">
    <circle cx="60" cy="26" r="22" fill="#fde047" opacity="0.22"/>
    <circle cx="60" cy="26" r="16" fill="url(#mcDnMoon)" stroke="#f59e0b" stroke-width="1.2"/>
  </g>

  <!-- Celebratory Golden Fireworks -->
  <g class="mcDn-fw1" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="14" x2="20" y2="19" stroke="#fde047"/>
    <line x1="20" y1="29" x2="20" y2="34" stroke="#fb923c"/>
    <line x1="10" y1="24" x2="15" y2="24" stroke="#fef08a"/>
    <line x1="25" y1="24" x2="30" y2="24" stroke="#fde047"/>
    <line x1="13" y1="17" x2="16.5" y2="20.5" stroke="#fb7185"/>
    <line x1="23.5" y1="27.5" x2="27" y2="31" stroke="#fde047"/>
    <line x1="27" y1="17" x2="23.5" y2="20.5" stroke="#fb923c"/>
    <line x1="13" y1="31" x2="16.5" y2="27.5" stroke="#fef08a"/>
  </g>
  <g class="mcDn-fw2" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="16" x2="100" y2="21" stroke="#fde047"/>
    <line x1="100" y1="31" x2="100" y2="36" stroke="#fb7185"/>
    <line x1="90" y1="26" x2="95" y2="26" stroke="#fb923c"/>
    <line x1="105" y1="26" x2="110" y2="26" stroke="#fef08a"/>
    <line x1="93" y1="19" x2="96.5" y2="22.5" stroke="#fde047"/>
    <line x1="103.5" y1="29.5" x2="107" y2="33" stroke="#fb923c"/>
    <line x1="107" y1="19" x2="103.5" y2="22.5" stroke="#fb7185"/>
    <line x1="93" y1="33" x2="96.5" y2="29.5" stroke="#fde047"/>
  </g>

  <!-- Water ripple shadow -->
  <ellipse cx="60" cy="110" rx="30" ry="5" fill="#451a03" opacity="0.35"/>

  <g class="mcDn-fish">
    <!-- Flowing Fan Tail -->
    <g class="mcDn-tail">
      <path d="M60 96 C44 106, 38 115, 50 115 C56 115, 59 108, 60 105 C61 108, 64 115, 70 115 C82 115, 76 106, 60 96 Z" fill="#f97316" stroke="#9a3412" stroke-width="1.8"/>
      <path d="M60 98 L52 111 M60 98 L68 111" stroke="#fde047" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Dorsal Crown Fin on head -->
    <path d="M50 32 Q60 18 70 32 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.8"/>
    <circle cx="60" cy="26" r="3.5" fill="#fef08a"/>

    <!-- Chubby Chibi Carp Body -->
    <ellipse cx="60" cy="66" rx="28" ry="33" fill="url(#mcDnBody)" stroke="#7c2d12" stroke-width="2.3"/>
    <ellipse cx="60" cy="75" rx="18" ry="20" fill="#fef3c7" opacity="0.88"/>

    <!-- Golden Whiskers -->
    <path d="M38 60 Q26 56 24 49" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M82 60 Q94 56 96 49" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Joyful '^ ^' Happy Eyes -->
    <path d="M43 52 Q48 45 53 52" fill="none" stroke="#451a03" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M67 52 Q72 45 77 52" fill="none" stroke="#451a03" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Rosy Cheeks and Big Happy Mouth -->
    <ellipse cx="40" cy="58" rx="4.5" ry="2.5" fill="#f43f5e" opacity="0.7"/>
    <ellipse cx="80" cy="58" rx="4.5" ry="2.5" fill="#f43f5e" opacity="0.7"/>
    <path d="M54 57 Q60 64 66 57 Z" fill="#ef4444" stroke="#7c2d12" stroke-width="1.5"/>

    <!-- Golden Baked Mooncake hugged tightly in front -->
    <g>
      <circle cx="60" cy="79" r="14" fill="#d97706" stroke="#78350f" stroke-width="2"/>
      <circle cx="60" cy="79" r="10.2" fill="#f59e0b" stroke="#92400e" stroke-width="1.3"/>
      <rect x="55.5" y="74.5" width="9" height="9" rx="1.6" fill="none" stroke="#78350f" stroke-width="1.4"/>
      <circle cx="60" cy="79" r="2.2" fill="#fde047"/>
    </g>

    <!-- Both Pectoral Fins hugging the Golden Mooncake -->
    <path d="M34 68 C38 82, 46 84, 50 78 C46 72, 40 68, 34 68 Z" fill="#fb923c" stroke="#9a3412" stroke-width="1.8"/>
    <path d="M86 68 C82 82, 74 84, 70 78 C74 72, 80 68, 86 68 Z" fill="#fb923c" stroke="#9a3412" stroke-width="1.8"/>
  </g>
</svg>
