<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95">
  <defs>
    <radialGradient id="mcaMoon" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="mcaCarp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <clipPath id="mcaClip">
      <rect x="0" y="0" width="260" height="71"/>
    </clipPath>
    <style>
      .mca-leaper { animation: mcaDragonGateLeap 3.0s ease-in-out infinite; }
      .mca-splash { transform-origin: 175px 62px; animation: mcaSplashPop 3.0s ease-out infinite; opacity: 0; }
      .mca-lotus1 { animation: mcaDriftLotus 4.5s ease-in-out infinite alternate; }
      .mca-moon { transform-origin: 218px 22px; animation: mcaMoonHalo 2.6s ease-in-out infinite alternate; }

      @keyframes mcaDragonGateLeap {
        0%   { transform: translate(226px, 68px) rotate(-35deg) scale(0.9); opacity: 0; }
        12%  { opacity: 1; }
        38%  { transform: translate(156px, 18px) rotate(-18deg) scale(1.05); opacity: 1; }
        55%  { transform: translate(118px, 12px) rotate(8deg) scale(1.08); opacity: 1; }
        82%  { transform: translate(58px, 52px) rotate(32deg) scale(0.96); opacity: 1; }
        95%, 100% { transform: translate(34px, 70px) rotate(40deg) scale(0.85); opacity: 0; }
      }
      @keyframes mcaSplashPop {
        0%, 6%, 32%, 100% { opacity: 0; transform: scale(0.4); }
        14%, 24% { opacity: 0.95; transform: scale(1.1); }
      }
      @keyframes mcaDriftLotus {
        0% { transform: translateX(0); }
        100% { transform: translateX(-14px); }
      }
      @keyframes mcaMoonHalo {
        0% { transform: scale(0.96); }
        100% { transform: scale(1.05); }
      }
    </style>
  </defs>

  <g clip-path="url(#mcaClip)">
    <!-- Full Harvest Moon -->
    <g class="mca-moon">
      <circle cx="218" cy="22" r="21" fill="#fde047" opacity="0.22"/>
      <circle cx="218" cy="22" r="15" fill="url(#mcaMoon)"/>
    </g>

    <!-- Floating Sky Lanterns -->
    <g fill="#fb923c" stroke="#fef08a" stroke-width="1">
      <rect x="42" y="12" width="8" height="11" rx="2"/>
      <rect x="182" y="10" width="7" height="9" rx="2"/>
    </g>

    <!-- Golden Vu Mon Gate sitting on river at y=65 -->
    <g>
      <line x1="108" y1="22" x2="108" y2="66" stroke="#dc2626" stroke-width="5"/>
      <line x1="148" y1="22" x2="148" y2="66" stroke="#dc2626" stroke-width="5"/>
      <path d="M96 24 Q128 10 160 24 L154 30 Q128 19 102 30 Z" fill="#facc15" stroke="#92400e" stroke-width="1.5"/>
      <rect x="118" y="22" width="20" height="8" rx="2" fill="#991b1b" stroke="#fef08a" stroke-width="1"/>
      <circle cx="102" cy="34" r="3.8" fill="#ef4444" stroke="#fde047" stroke-width="1"/>
      <circle cx="154" cy="34" r="3.8" fill="#ef4444" stroke="#fde08a" stroke-width="1"/>
    </g>

    <!-- Shimmering River Waves flush on y=70 -->
    <path d="M6 63 Q45 57 85 63 T165 63 T254 63 L254 71 L6 71 Z" fill="#1e3a8a" opacity="0.82"/>
    <path d="M14 67 Q55 61 95 67 T185 67 T248 67" fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.6"/>

    <g class="mca-lotus1">
      <polygon points="68,64 74,58 80,64" fill="#f472b6"/>
      <ellipse cx="74" cy="65" rx="8" ry="2.5" fill="#fbcfe8"/>
      <circle cx="74" cy="62" r="2" fill="#fef08a"/>
      <polygon points="196,65 202,59 208,65" fill="#f472b6"/>
      <ellipse cx="202" cy="66" rx="8" ry="2.5" fill="#fbcfe8"/>
      <circle cx="202" cy="63" r="2" fill="#fef08a"/>
    </g>

    <g class="mca-splash" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M168 62 Q162 50 156 54"/>
      <path d="M182 62 Q188 50 194 54"/>
    </g>

    <!-- Leaping Golden Carp -->
    <g class="mca-leaper">
      <path d="M18 0 L32 -9 L29 0 L32 9 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.2"/>
      <ellipse cx="4" cy="0" rx="16" ry="10.5" fill="url(#mcaCarp)" stroke="#7c2d12" stroke-width="1.5"/>
      <path d="M0 -10 Q6 -17 12 -9 Z" fill="#ef4444"/>
      <circle cx="-5" cy="-2" r="2.2" fill="#1e1b4b"/>
      <circle cx="-5.6" cy="-2.6" r="0.8" fill="#ffffff"/>
      <path d="M-9 2 Q-16 0 -18 -5" fill="none" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="-18" cy="1" r="4.5" fill="#fef9c3" stroke="#f59e0b" stroke-width="1.2"/>
    </g>
  </g>
</svg>
