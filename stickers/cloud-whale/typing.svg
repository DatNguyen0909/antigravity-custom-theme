<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cwtBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cwtBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <style>
      /* Cá Voi Mây đung đưa hát vang nốt nhạc hoàng hôn va thổi bong bóng mây ngũ sắc! */
      .cwt-sing { transform-origin: 60px 72px; animation: cwtRock 0.9s ease-in-out infinite alternate; }
      .cwt-tail { transform-origin: 94px 68px; animation: cwtTail 0.55s ease-in-out infinite alternate; }
      .cwt-bub1 { animation: cwtRise1 1.3s ease-out infinite; opacity: 0; }
      .cwt-bub2 { animation: cwtRise2 1.3s ease-out 0.45s infinite; opacity: 0; }
      .cwt-note { animation: cwtNote 1.3s ease-out 0.85s infinite; opacity: 0; }

      @keyframes cwtRock { 0% { transform: rotate(-6deg) translateY(0); } 100% { transform: rotate(6deg) translateY(-5px); } }
      @keyframes cwtTail { 0% { transform: rotate(-16deg); } 100% { transform: rotate(18deg); } }
      @keyframes cwtRise1 {
        0% { opacity: 0; transform: translate(46px, 42px) scale(0.4); }
        25% { opacity: 0.95; }
        100% { opacity: 0; transform: translate(30px, 12px) scale(1.15); }
      }
      @keyframes cwtRise2 {
        0% { opacity: 0; transform: translate(48px, 42px) scale(0.4); }
        25% { opacity: 0.95; }
        100% { opacity: 0; transform: translate(62px, 10px) scale(1.2); }
      }
      @keyframes cwtNote {
        0% { opacity: 0; transform: translate(26px, 52px) scale(0.6); }
        30% { opacity: 1; }
        100% { opacity: 0; transform: translate(12px, 24px) scale(1.15); }
      }
    </style>
  </defs>

  <path d="M 18 100 Q 20 88 34 88 Q 46 80 62 86 Q 78 80 90 88 Q 102 88 102 100 Z" fill="#fce7f3" opacity="0.8"/>

  <!-- Shimmering Sunset Cloud Bubbles va Whale Song Notes -->
  <g class="cwt-bub1">
    <circle cx="0" cy="0" r="6.5" fill="#fbcfe8" fill-opacity="0.65" stroke="#fef08a" stroke-width="1.3"/>
    <circle cx="-2" cy="-2" r="2" fill="#ffffff"/>
  </g>
  <g class="cwt-bub2">
    <circle cx="0" cy="0" r="5.5" fill="#bae6fd" fill-opacity="0.65" stroke="#f472b6" stroke-width="1.3"/>
    <circle cx="-1.8" cy="-1.8" r="1.8" fill="#ffffff"/>
  </g>
  <g class="cwt-note">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#fde047" stroke="#ec4899" stroke-width="0.6">♪</text>
  </g>

  <g class="cwt-sing">
    <g class="cwt-tail">
      <path d="M 88 70 Q 102 64 106 50 Q 112 56 104 68 Q 114 74 108 82 Q 98 78 88 74 Z" fill="url(#cwtBody)" stroke="#4338ca" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <path d="M 20 68 C 18 44, 42 38, 66 44 C 84 48, 92 60, 94 70 C 90 84, 70 90, 44 88 C 26 86, 20 78, 20 68 Z" fill="url(#cwtBody)" stroke="#4338ca" stroke-width="1.8"/>
    <path d="M 22 71 C 34 70, 56 72, 82 76 C 72 87, 48 89, 30 85 C 23 82, 21 76, 22 71 Z" fill="url(#cwtBelly)"/>

    <!-- Happy Singing Curved Eye va 'O' Singing Mouth -->
    <path d="M 30 60 Q 35 54 40 60" fill="none" stroke="#1e1b4b" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="43" cy="65" rx="4.5" ry="2.4" fill="#fb7185" opacity="0.8"/>
    <ellipse cx="26" cy="68" rx="3.2" ry="3.8" fill="#f43f5e" stroke="#312e81" stroke-width="1.3"/>

    <path d="M 54 74 C 50 86, 62 92, 66 82 C 66 77, 60 74, 54 74 Z" fill="#818cf8" stroke="#4338ca" stroke-width="1.5"/>
    <circle cx="66" cy="52" r="1.8" fill="#fef08a"/>
    <circle cx="74" cy="57" r="1.4" fill="#ffffff"/>
  </g>
</svg>
