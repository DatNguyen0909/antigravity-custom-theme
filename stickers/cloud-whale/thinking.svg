<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cwThBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cwThBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="cwThCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <style>
      .cwTh-float { transform-origin: 60px 76px; animation: cwThFloat 3.4s ease-in-out infinite; }
      .cwTh-tail { transform-origin: 94px 72px; animation: cwThTail 2.6s ease-in-out infinite alternate; }
      .cwTh-fin { transform-origin: 58px 82px; animation: cwThFin 2.6s ease-in-out infinite alternate; }
      .cwTh-puff1 { transform-origin: 48px 46px; animation: cwThDrift 3.0s ease-in-out infinite; }
      .cwTh-puff2 { transform-origin: 54px 36px; animation: cwThDrift 3.0s ease-in-out 0.35s infinite; }
      .cwTh-bubble { transform-origin: 68px 22px; animation: cwThBubble 3.0s ease-in-out infinite; }
      .cwTh-d1 { animation: cwThDot 2.1s ease-in-out infinite; }
      .cwTh-d2 { animation: cwThDot 2.1s ease-in-out 0.35s infinite; }
      .cwTh-d3 { animation: cwThDot 2.1s ease-in-out 0.7s infinite; }

      @keyframes cwThFloat {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50% { transform: translateY(-4px) rotate(1.5deg); }
      }
      @keyframes cwThTail {
        0% { transform: rotate(-6deg); }
        100% { transform: rotate(8deg); }
      }
      @keyframes cwThFin {
        0% { transform: rotate(-5deg); }
        100% { transform: rotate(7deg); }
      }
      @keyframes cwThDrift {
        0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.7; }
        50% { transform: translateY(-4px) scale(1.08); opacity: 1; }
      }
      @keyframes cwThBubble {
        0%, 100% { transform: translateY(0) scale(0.97); }
        50% { transform: translateY(-5px) scale(1.03); }
      }
      @keyframes cwThDot {
        0%, 100% { opacity: 0.3; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-2px); }
      }
    </style>
  </defs>

  <!-- Back Sunset Cloud Cushion -->
  <path d="M 16 102 Q 16 90 28 90 Q 34 80 48 84 Q 60 76 74 84 Q 88 80 94 90 Q 106 90 106 102 Z" fill="url(#cwThCloud)" opacity="0.75"/>

  <!-- Floating Cloud Thought Bubbles drifting upward -->
  <circle class="cwTh-puff1" cx="48" cy="45" r="3.2" fill="url(#cwThCloud)" stroke="#818cf8" stroke-width="1.2"/>
  <circle class="cwTh-puff2" cx="54" cy="36" r="4.8" fill="url(#cwThCloud)" stroke="#818cf8" stroke-width="1.3"/>
  <g class="cwTh-bubble">
    <path d="M 46 28 Q 42 20 52 17 Q 56 8 68 11 Q 80 8 85 16 Q 94 18 92 27 Q 90 33 80 32 L 54 32 Q 46 33 46 28 Z" fill="url(#cwThCloud)" stroke="#6366f1" stroke-width="1.6"/>
    <circle class="cwTh-d1" cx="60" cy="22" r="2.3" fill="#6366f1"/>
    <circle class="cwTh-d2" cx="69" cy="22" r="2.3" fill="#6366f1"/>
    <circle class="cwTh-d3" cx="78" cy="22" r="2.3" fill="#6366f1"/>
  </g>

  <g class="cwTh-float">
    <!-- Whale Tail Fluke -->
    <g class="cwTh-tail">
      <path d="M 88 74 Q 102 68 106 54 Q 112 60 104 72 Q 114 78 108 86 Q 98 82 88 78 Z" fill="url(#cwThBody)" stroke="#4338ca" stroke-width="1.6" stroke-linejoin="round"/>
    </g>

    <!-- Chibi Whale Body -->
    <path d="M 20 72 C 18 48, 42 42, 66 48 C 84 52, 92 64, 94 74 C 90 88, 70 94, 44 92 C 26 90, 20 82, 20 72 Z" fill="url(#cwThBody)" stroke="#4338ca" stroke-width="1.8"/>

    <!-- Warm Sunset Belly with pleats -->
    <path d="M 22 75 C 34 74, 56 76, 82 80 C 72 91, 48 93, 30 89 C 23 86, 21 80, 22 75 Z" fill="url(#cwThBelly)"/>
    <path d="M 28 80 Q 48 83 68 84 M 32 85 Q 48 88 62 88" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>

    <!-- Starry Constellation Spots on Back -->
    <circle cx="64" cy="56" r="1.8" fill="#fef08a"/>
    <circle cx="72" cy="60" r="1.3" fill="#ffffff"/>
    <circle cx="78" cy="66" r="1.6" fill="#fef08a"/>

    <!-- Thoughtful Upward-Looking Eye and Contemplative Mouth -->
    <circle cx="35" cy="64" r="4.3" fill="#1e1b4b"/>
    <circle cx="36.2" cy="62.2" r="1.7" fill="#ffffff"/>
    <ellipse cx="42" cy="69" rx="4.5" ry="2.4" fill="#fb7185" opacity="0.7"/>
    <path d="M 25 73 Q 30 72 35 73" fill="none" stroke="#312e81" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Side Pectoral Fin -->
    <g class="cwTh-fin">
      <path d="M 54 78 C 50 90, 62 96, 66 86 C 66 81, 60 78, 54 78 Z" fill="#818cf8" stroke="#4338ca" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Foreground Fluffy Sunset Cloud Wisps -->
  <path d="M 26 102 Q 26 94 36 94 Q 42 88 54 92 Q 66 87 76 94 Q 86 94 86 102 Z" fill="url(#cwThCloud)"/>
</svg>
