<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95">
  <defs>
    <linearGradient id="cwaSkyWhale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cwaBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <style>
      /* Sunset Sky Stage: Cloud Whale glides gracefully across floating islands, tail puffing golden-pink clouds! */
      .cwa-swimX { animation: cwaGlideX 3.4s linear infinite; }
      .cwa-swimY { transform-origin: 35px 20px; animation: cwaGlideY 1.15s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .cwa-tail { transform-origin: 58px 20px; animation: cwaFluke 0.65s ease-in-out infinite alternate; }
      .cwa-puff1 { animation: cwaPuff 1.1s ease-out infinite; opacity: 0; }
      .cwa-puff2 { animation: cwaPuff 1.1s ease-out 0.55s infinite; opacity: 0; }
      .cwa-isle1 { animation: cwaIsleBob 2.6s ease-in-out infinite alternate; }
      .cwa-isle2 { animation: cwaIsleBob 2.6s ease-in-out 1.3s infinite alternate; }

      @keyframes cwaGlideX {
        0%   { transform: translateX(210px); opacity: 0; }
        7%   { opacity: 1; }
        93%  { opacity: 1; }
        100% { transform: translateX(-75px); opacity: 0; }
      }
      @keyframes cwaGlideY {
        0%   { transform: translateY(15px) rotate(-4.5deg); }
        100% { transform: translateY(29px) rotate(4.5deg); }
      }
      @keyframes cwaFluke { 0% { transform: rotate(-16deg); } 100% { transform: rotate(18deg); } }
      @keyframes cwaPuff {
        0% { opacity: 0.9; transform: translate(0, 0) scale(0.5); }
        100% { opacity: 0; transform: translate(26px, -6px) scale(1.4); }
      }
      @keyframes cwaIsleBob { 0% { transform: translateY(-2px); } 100% { transform: translateY(3px); } }
    </style>
  </defs>

  <!-- Sunset Sun Disc -->
  <circle cx="130" cy="24" r="16" fill="#fde047" opacity="0.35"/>
  <circle cx="130" cy="24" r="11" fill="#fb923c" opacity="0.45"/>

  <!-- Left Floating Sky Island (with tiny tree va waterfall) -->
  <g class="cwa-isle1">
    <g transform="translate(28, 28)">
      <polygon points="4,14 36,14 26,32 14,32" fill="#92400e"/>
      <polygon points="10,14 30,14 23,28" fill="#78350f"/>
      <ellipse cx="20" cy="13" rx="18" ry="4.5" fill="#4ade80"/>
      <!-- Tiny sunset tree -->
      <rect x="18" y="4" width="3" height="8" fill="#78350f"/>
      <circle cx="19.5" cy="3" r="6" fill="#f472b6"/>
      <!-- Sky waterfall -->
      <path d="M 25 15 Q 27 28 25 40" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>

  <!-- Right Floating Sky Island -->
  <g class="cwa-isle2">
    <g transform="translate(192, 26)">
      <polygon points="4,12 32,12 22,28 14,28" fill="#92400e"/>
      <ellipse cx="18" cy="11" rx="16" ry="4" fill="#34d399"/>
      <rect x="16.5" y="3" width="2.5" height="7" fill="#78350f"/>
      <circle cx="17.8" cy="2" r="5" fill="#fb923c"/>
    </g>
  </g>

  <!-- Foreground Gliding Cloud Whale -->
  <g class="cwa-swimX">
  <g class="cwa-swimY">
    <!-- Cloud puffs created by tail flicks -->
    <g class="cwa-puff1" transform="translate(64, 18)">
      <circle cx="0" cy="0" r="5" fill="#fce7f3"/>
      <circle cx="5" cy="2" r="4" fill="#fed7aa"/>
    </g>
    <g class="cwa-puff2" transform="translate(64, 22)">
      <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
      <circle cx="4" cy="-2" r="3.5" fill="#fbcfe8"/>
    </g>

    <!-- Tail Fluke -->
    <g class="cwa-tail">
      <path d="M 54 20 Q 66 14 70 4 Q 74 10 66 19 Q 74 24 68 31 Q 60 27 54 23 Z" fill="url(#cwaSkyWhale)" stroke="#4338ca" stroke-width="1.3"/>
    </g>

    <!-- Whale Body -->
    <path d="M 4 20 C 2 4, 22 0, 40 5 C 52 8, 58 15, 58 21 C 55 30, 40 34, 20 33 C 8 32, 4 26, 4 20 Z" fill="url(#cwaSkyWhale)" stroke="#4338ca" stroke-width="1.4"/>
    <path d="M 6 22 C 16 21, 34 23, 50 26 C 42 33, 24 34, 12 31 C 7 29, 5 25, 6 22 Z" fill="url(#cwaBelly)"/>

    <!-- Eye, Cheek va Fin -->
    <circle cx="15" cy="15" r="2.6" fill="#1e1b4b"/>
    <circle cx="14.2" cy="14" r="1" fill="#ffffff"/>
    <ellipse cx="20" cy="18.5" rx="3" ry="1.6" fill="#fb7185" opacity="0.8"/>
    <path d="M 7 20 Q 12 24 17 21" fill="none" stroke="#312e81" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 28 24 C 26 32, 34 36, 37 29 Z" fill="#818cf8" stroke="#4338ca" stroke-width="1.2"/>
    <circle cx="38" cy="11" r="1.4" fill="#fef08a"/>
    <circle cx="44" cy="14" r="1.1" fill="#ffffff"/>
  </g>
  </g>

  <!-- Soft Sunset Cloud Wisps flush on y=70 -->
  <path d="M 88 70 Q 94 62 106 65 Q 116 58 128 64 Q 140 60 148 70 Z" fill="#fce7f3" opacity="0.65"/>
</svg>
