<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cwDnBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cwDnBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="cwDnCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <style>
      .cwDn-leap { transform-origin: 58px 70px; animation: cwDnLeap 2.4s ease-in-out infinite; }
      .cwDn-tail { transform-origin: 90px 68px; animation: cwDnTail 1.4s ease-in-out infinite alternate; }
      .cwDn-fin { transform-origin: 54px 74px; animation: cwDnFin 1.4s ease-in-out infinite alternate; }
      .cwDn-rainbow { transform-origin: 60px 46px; animation: cwDnRainbow 2.4s ease-in-out infinite; }
      .cwDn-star1 { transform-origin: 20px 26px; animation: cwDnTwinkle 2.0s ease-in-out infinite; }
      .cwDn-star2 { transform-origin: 102px 24px; animation: cwDnTwinkle 2.2s ease-in-out 0.6s infinite; }
      .cwDn-star3 { transform-origin: 16px 56px; animation: cwDnTwinkle 2.4s ease-in-out 1.1s infinite; }
      .cwDn-star4 { transform-origin: 106px 54px; animation: cwDnTwinkle 2.1s ease-in-out 0.3s infinite; }

      @keyframes cwDnLeap {
        0%, 100% { transform: translateY(2px) rotate(-4deg); }
        50% { transform: translateY(-9px) rotate(6deg); }
      }
      @keyframes cwDnTail {
        0% { transform: rotate(-14deg); }
        100% { transform: rotate(16deg); }
      }
      @keyframes cwDnFin {
        0% { transform: rotate(-12deg); }
        100% { transform: rotate(14deg); }
      }
      @keyframes cwDnRainbow {
        0%, 100% { transform: scale(0.95); opacity: 0.88; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes cwDnTwinkle {
        0%, 100% { transform: scale(0.75) rotate(0deg); opacity: 0.6; }
        50% { transform: scale(1.2) rotate(22deg); opacity: 1; }
      }
    </style>
  <ellipse cx="60" cy="110" rx="28" ry="4.5" fill="#020617" opacity="0.34"/>
  </defs>

  <!-- Vibrant Glowing Rainbow Arc -->
  <g class="cwDn-rainbow" fill="none" stroke-width="3.2" stroke-linecap="round">
    <path d="M 22 46 A 38 34 0 0 1 98 46" stroke="#ef4444"/>
    <path d="M 25.5 46 A 34.5 30.5 0 0 1 94.5 46" stroke="#fb923c"/>
    <path d="M 29 46 A 31 27 0 0 1 91 46" stroke="#fde047"/>
    <path d="M 32.5 46 A 27.5 23.5 0 0 1 87.5 46" stroke="#4ade80"/>
    <path d="M 36 46 A 24 20 0 0 1 84 46" stroke="#38bdf8"/>
    <path d="M 39.5 46 A 20.5 16.5 0 0 1 80.5 46" stroke="#a855f7"/>
  </g>

  <!-- Sparkling Golden Stars -->
  <polygon class="cwDn-star1" points="20,19 22,24 27,26 22,28 20,33 18,28 13,26 18,24" fill="#fde047" stroke="#f59e0b" stroke-width="0.8"/>
  <polygon class="cwDn-star2" points="102,17 104,22 109,24 104,26 102,31 100,26 95,24 100,22" fill="#fef08a" stroke="#f59e0b" stroke-width="0.8"/>
  <polygon class="cwDn-star3" points="16,51 17.5,54.5 21,56 17.5,57.5 16,61 14.5,57.5 11,56 14.5,54.5" fill="#fde047"/>
  <polygon class="cwDn-star4" points="106,49 107.5,52.5 111,54 107.5,55.5 106,59 104.5,55.5 101,54 104.5,52.5" fill="#fef08a"/>

  <!-- Back Sunset Cloud Cushion -->
  <path d="M 14 102 Q 14 90 26 90 Q 32 80 46 84 Q 60 76 74 84 Q 88 80 94 90 Q 108 90 108 102 Z" fill="url(#cwDnCloud)" opacity="0.75"/>

  <g class="cwDn-leap">
    <!-- Joyful Water Spout -->
    <g fill="none" stroke="#bae6fd" stroke-width="2.4" stroke-linecap="round">
      <path d="M 48 44 Q 48 26 38 23"/>
      <path d="M 48 44 Q 48 24 58 21"/>
      <circle cx="36" cy="22" r="2.2" fill="#e0f2fe" stroke="none"/>
      <circle cx="60" cy="20" r="2.2" fill="#e0f2fe" stroke="none"/>
      <circle cx="48" cy="18" r="2.5" fill="#ffffff" stroke="none"/>
    </g>

    <!-- Whale Tail Fluke -->
    <g class="cwDn-tail">
      <path d="M 86 68 Q 100 62 104 48 Q 110 54 102 66 Q 112 72 106 80 Q 96 76 86 72 Z" fill="url(#cwDnBody)" stroke="#4338ca" stroke-width="1.6" stroke-linejoin="round"/>
    </g>

    <!-- Chibi Whale Body -->
    <path d="M 18 66 C 16 42, 40 36, 64 42 C 82 46, 90 58, 92 68 C 88 82, 68 88, 42 86 C 24 84, 18 76, 18 66 Z" fill="url(#cwDnBody)" stroke="#4338ca" stroke-width="1.8"/>

    <!-- Warm Sunset Belly -->
    <path d="M 20 69 C 32 68, 54 70, 80 74 C 70 85, 46 87, 28 83 C 21 80, 19 74, 20 69 Z" fill="url(#cwDnBelly)"/>
    <path d="M 26 74 Q 46 77 66 78 M 30 79 Q 46 82 60 82" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>

    <!-- Starry Spots on Back -->
    <circle cx="62" cy="50" r="2" fill="#fef08a"/>
    <circle cx="70" cy="54" r="1.5" fill="#ffffff"/>
    <circle cx="76" cy="60" r="1.8" fill="#fef08a"/>

    <!-- Joyful '^' Happy Eye and Big Smile -->
    <path d="M 29 59 Q 34 52 39 59" fill="none" stroke="#1e1b4b" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="41" cy="64" rx="4.8" ry="2.5" fill="#fb7185" opacity="0.85"/>
    <path d="M 21 66 Q 29 74 38 67" fill="none" stroke="#312e81" stroke-width="2" stroke-linecap="round"/>

    <!-- Side Pectoral Fin -->
    <g class="cwDn-fin">
      <path d="M 52 72 C 48 84, 60 90, 64 80 C 64 75, 58 72, 52 72 Z" fill="#818cf8" stroke="#4338ca" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Foreground Fluffy Sunset Cloud Wisps -->
  <path d="M 24 102 Q 24 94 34 94 Q 42 88 54 92 Q 66 87 76 94 Q 88 94 88 102 Z" fill="url(#cwDnCloud)"/>
</svg>
