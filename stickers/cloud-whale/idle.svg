<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cwBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cwBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="cwCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <style>
      .cw-float { transform-origin: 60px 72px; animation: cwFloat 3.4s ease-in-out infinite; }
      .cw-tail { transform-origin: 94px 68px; animation: cwTail 2.2s ease-in-out infinite alternate; }
      .cw-fin { transform-origin: 58px 78px; animation: cwFin 2.2s ease-in-out infinite alternate; }
      /* 15s gag: Whale spouts water fountain -> arcs into a glowing 7-color rainbow -> cute swallow bird swoops in and perches on its back! */
      .cw-spout-15s { transform-origin: 48px 44px; animation: cwSpout15s 15s ease-out infinite; opacity: 0; }
      .cw-rainbow-15s { transform-origin: 62px 44px; animation: cwRainbow15s 15s ease-in-out infinite; opacity: 0; }
      .cw-bird-15s { animation: cwBird15s 15s ease-in-out infinite; opacity: 0; }

      @keyframes cwFloat {
        0%, 100% { transform: translateY(0) rotate(-1.5deg); }
        50% { transform: translateY(-5px) rotate(2deg); }
      }
      @keyframes cwTail { 0% { transform: rotate(-10deg); } 100% { transform: rotate(12deg); } }
      @keyframes cwFin { 0% { transform: rotate(-8deg); } 100% { transform: rotate(10deg); } }

      @keyframes cwSpout15s {
        0%, 67% { opacity: 0; transform: scaleY(0.1); }
        71%, 88% { opacity: 1; transform: scaleY(1); }
        93%, 100% { opacity: 0; transform: scaleY(0.2); }
      }
      @keyframes cwRainbow15s {
        0%, 71% { opacity: 0; transform: scale(0.4); }
        75%, 90% { opacity: 0.95; transform: scale(1); }
        95%, 100% { opacity: 0; transform: scale(1.1); }
      }
      @keyframes cwBird15s {
        0%, 73% { opacity: 0; transform: translate(34px, -24px) rotate(-15deg); }
        79%, 90% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
        96%, 100% { opacity: 0; transform: translate(-28px, -20px) rotate(12deg); }
      }
    </style>
  </defs>

  <!-- Back Sunset Cloud Cushion -->
  <path d="M 16 98 Q 16 86 28 86 Q 34 76 48 80 Q 60 72 74 80 Q 88 76 94 86 Q 106 86 106 98 Z" fill="url(#cwCloud)" opacity="0.75"/>

  <g class="cw-float">
    <!-- 15s Rainbow Arc above Whale -->
    <g class="cw-rainbow-15s" fill="none" stroke-width="2.6" stroke-linecap="round">
      <path d="M 48 38 A 24 22 0 0 1 96 38" stroke="#ef4444"/>
      <path d="M 50.5 38 A 21.5 19.5 0 0 1 93.5 38" stroke="#fb923c"/>
      <path d="M 53 38 A 19 17 0 0 1 91 38" stroke="#fde047"/>
      <path d="M 55.5 38 A 16.5 14.5 0 0 1 88.5 38" stroke="#4ade80"/>
      <path d="M 58 38 A 14 12 0 0 1 86 38" stroke="#38bdf8"/>
      <path d="M 60.5 38 A 11.5 9.5 0 0 1 83.5 38" stroke="#a855f7"/>
    </g>

    <!-- 15s Water Spout Fountain -->
    <g class="cw-spout-15s" fill="none" stroke="#bae6fd" stroke-width="2.4" stroke-linecap="round">
      <path d="M 48 44 Q 48 24 36 20"/>
      <path d="M 48 44 Q 48 22 60 18"/>
      <circle cx="34" cy="19" r="2" fill="#e0f2fe" stroke="none"/>
      <circle cx="62" cy="17" r="2" fill="#e0f2fe" stroke="none"/>
      <circle cx="48" cy="15" r="2.2" fill="#ffffff" stroke="none"/>
    </g>

    <!-- Whale Tail Fluke -->
    <g class="cw-tail">
      <path d="M 88 70 Q 102 64 106 50 Q 112 56 104 68 Q 114 74 108 82 Q 98 78 88 74 Z" fill="url(#cwBody)" stroke="#4338ca" stroke-width="1.6" stroke-linejoin="round"/>
    </g>

    <!-- Chibi Whale Body -->
    <path d="M 20 68 C 18 44, 42 38, 66 44 C 84 48, 92 60, 94 70 C 90 84, 70 90, 44 88 C 26 86, 20 78, 20 68 Z" fill="url(#cwBody)" stroke="#4338ca" stroke-width="1.8"/>

    <!-- Warm Sunset Belly with pleats -->
    <path d="M 22 71 C 34 70, 56 72, 82 76 C 72 87, 48 89, 30 85 C 23 82, 21 76, 22 71 Z" fill="url(#cwBelly)"/>
    <path d="M 28 76 Q 48 79 68 80 M 32 81 Q 48 84 62 84" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>

    <!-- Starry Constellation Spots on Back -->
    <circle cx="64" cy="52" r="1.8" fill="#fef08a"/>
    <circle cx="72" cy="56" r="1.3" fill="#ffffff"/>
    <circle cx="78" cy="62" r="1.6" fill="#fef08a"/>

    <!-- Cute Eye, Rosy Cheek va Gentle Smile -->
    <circle cx="35" cy="60" r="4.2" fill="#1e1b4b"/>
    <circle cx="33.6" cy="58.5" r="1.6" fill="#ffffff"/>
    <ellipse cx="42" cy="65" rx="4.5" ry="2.4" fill="#fb7185" opacity="0.75"/>
    <path d="M 23 68 Q 30 73 37 69" fill="none" stroke="#312e81" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Side Pectoral Fin -->
    <g class="cw-fin">
      <path d="M 54 74 C 50 86, 62 92, 66 82 C 66 77, 60 74, 54 74 Z" fill="#818cf8" stroke="#4338ca" stroke-width="1.5"/>
    </g>

    <!-- 15s Little Swallow Bird (Chim Én) perching on Whale's back -->
    <g class="cw-bird-15s">
      <g transform="translate(66, 39)">
        <path d="M 6 4 L 14 1 L 10 5 L 14 7 L 6 6 Z" fill="#1e1b4b"/>
        <ellipse cx="4" cy="4" rx="5" ry="3.5" fill="#312e81"/>
        <ellipse cx="3" cy="5.2" rx="3.2" ry="2" fill="#fff1f2"/>
        <circle cx="1.5" cy="3" r="1" fill="#ffffff"/>
        <polygon points="-1,3.5 -4,4.5 -1,5.2" fill="#f59e0b"/>
      </g>
    </g>
  </g>

  <!-- Foreground Fluffy Sunset Cloud Wisps -->
  <path d="M 26 98 Q 26 90 36 90 Q 42 84 54 88 Q 66 83 76 90 Q 86 90 86 98 Z" fill="url(#cwCloud)"/>
</svg>
