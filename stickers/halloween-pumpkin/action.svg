<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95">
  <defs>
    <radialGradient id="hpaMoon" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <radialGradient id="hpaPump" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <clipPath id="hpaClip">
      <rect x="0" y="0" width="260" height="71"/>
    </clipPath>
    <style>
      .hpa-flyer { animation: hpaFlyAcross 3.2s ease-in-out infinite; }
      .hpa-ghost-buddy { animation: hpaGhostFollow 3.2s ease-in-out infinite; }
      .hpa-bat1 { animation: hpaBatFlap 0.35s ease-in-out infinite alternate; transform-origin: 0px 0px; }
      .hpa-moon-pulse { transform-origin: 214px 22px; animation: hpaMoonGlow 2.4s ease-in-out infinite alternate; }
      .hpa-candy-drop { animation: hpaDropCandy 3.2s linear infinite; opacity: 0; }

      @keyframes hpaFlyAcross {
        0%   { transform: translate(235px, 26px) rotate(4deg); }
        25%  { transform: translate(172px, 12px) rotate(-5deg); }
        50%  { transform: translate(115px, 24px) rotate(5deg); }
        75%  { transform: translate(55px, 12px) rotate(-4deg); }
        100% { transform: translate(-45px, 22px) rotate(3deg); }
      }
      @keyframes hpaGhostFollow {
        0%   { transform: translate(268px, 34px); }
        25%  { transform: translate(206px, 20px); }
        50%  { transform: translate(148px, 14px); }
        75%  { transform: translate(88px, 22px); }
        100% { transform: translate(-12px, 16px); }
      }
      @keyframes hpaBatFlap {
        0% { transform: scaleY(1); }
        100% { transform: scaleY(0.45); }
      }
      @keyframes hpaMoonGlow {
        0% { transform: scale(0.97); opacity: 0.9; }
        100% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes hpaDropCandy {
        0%, 32% { opacity: 0; transform: translate(142px, 28px) rotate(0deg); }
        38%, 68% { opacity: 1; transform: translate(134px, 52px) rotate(140deg); }
        80%, 100% { opacity: 0; transform: translate(130px, 65px) rotate(240deg); }
      }
    </style>
  </defs>

  <g clip-path="url(#hpaClip)">
    <!-- Glowing Blood-Orange Full Moon -->
    <g class="hpa-moon-pulse">
      <circle cx="214" cy="22" r="19" fill="#f97316" opacity="0.24"/>
      <circle cx="214" cy="22" r="14" fill="url(#hpaMoon)"/>
    </g>

    <!-- Spooky Mist Hills, Haunted Castle Spire and Tombstones flush on y=70 -->
    <path d="M4 70 Q55 54 115 64 T256 60 L256 71 L4 71 Z" fill="#1e1035" opacity="0.92"/>
    <g fill="#130924" stroke="#581c87" stroke-width="1">
      <polygon points="28,66 28,34 38,18 48,34 48,66"/>
      <polygon points="23,38 38,14 53,38"/>
      <rect x="35" y="40" width="6" height="9" rx="3" fill="#facc15" stroke="none"/>
    </g>
    <path d="M174 66 L174 44 M174 52 L163 42 M174 48 L186 38" stroke="#2e1065" stroke-width="3" stroke-linecap="round"/>
    <path d="M92 67 L92 54 A7 7 0 0 1 106 54 L106 67 Z" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
    <line x1="99" y1="55" x2="99" y2="62" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="96" y1="58" x2="102" y2="58" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="122" cy="64" rx="6" ry="4.5" fill="#ea580c" stroke="#431407" stroke-width="1.2"/>
    <circle cx="120" cy="63" r="1" fill="#fef08a"/>
    <circle cx="124" cy="63" r="1" fill="#fef08a"/>

    <!-- Ambient Bats -->
    <g transform="translate(190, 18)">
      <path class="hpa-bat1" d="M-8,0 Q-4,-5 0,-1 Q4,-5 8,0 Q4,2 0,3 Q-4,2 -8,0 Z" fill="#3b0764"/>
    </g>
    <g transform="translate(234, 34) scale(0.85)">
      <path class="hpa-bat1" d="M-8,0 Q-4,-5 0,-1 Q4,-5 8,0 Q4,2 0,3 Q-4,2 -8,0 Z" fill="#3b0764"/>
    </g>

    <!-- Dropped Halloween Candy -->
    <g class="hpa-candy-drop">
      <polygon points="-5,-3 -2,0 -5,3" fill="#ec4899"/>
      <polygon points="5,-3 2,0 5,3" fill="#ec4899"/>
      <circle cx="0" cy="0" r="3.2" fill="#facc15"/>
    </g>

    <!-- Trailing Cute Baby Ghost Buddy -->
    <g class="hpa-ghost-buddy">
      <path d="M-8,6 C-8,-6 8,-6 8,6 L8,12 L4,9 L0,12 L-4,9 L-8,12 Z" fill="#f8fafc" stroke="#6b21a8" stroke-width="1.4" opacity="0.92"/>
      <circle cx="-3" cy="2" r="1.3" fill="#1e1b4b"/>
      <circle cx="2" cy="2" r="1.3" fill="#1e1b4b"/>
      <ellipse cx="-0.5" cy="5" rx="1.5" ry="2" fill="#fb7185"/>
    </g>

    <!-- Flying Chibi Pumpkin Witch on Broomstick -->
    <g class="hpa-flyer">
      <line x1="-14" y1="22" x2="24" y2="24" stroke="#92400e" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M22 19 L36 15 L34 24 L37 31 L22 27 Z" fill="#f59e0b" stroke="#78350f" stroke-width="1.4"/>
      <line x1="22" y1="19" x2="22" y2="28" stroke="#facc15" stroke-width="2"/>
      <path d="M6 16 Q20 14 26 22 Q18 28 6 24 Z" fill="#7e22ce" stroke="#3b0764" stroke-width="1.3"/>
      <ellipse cx="4" cy="12" rx="14" ry="11.5" fill="url(#hpaPump)" stroke="#431407" stroke-width="1.6"/>
      <polygon points="-5,10 -1,5 2,10" fill="#fef08a"/>
      <polygon points="4,10 8,5 11,10" fill="#fef08a"/>
      <path d="M-5 15 Q3 21 11 15" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="4" cy="1" rx="15" ry="4" fill="#7e22ce" stroke="#2e1065" stroke-width="1.5"/>
      <path d="M-5 0 Q0 -11 9 -13 Q6 -7 12 0 Z" fill="#9333ea" stroke="#2e1065" stroke-width="1.5"/>
      <rect x="-2" y="-2" width="12" height="2.5" fill="#f97316"/>
    </g>
  </g>
</svg>
