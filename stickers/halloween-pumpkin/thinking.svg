<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="hpThBody" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="62%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <radialGradient id="hpThEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="65%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
    <linearGradient id="hpThHat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <style>
      .hpTh-root { transform-origin: 58px 104px; animation: hpThBob 2.8s ease-in-out infinite; }
      .hpTh-lid { transform-origin: 36px 50px; animation: hpThLid 2.8s ease-in-out infinite; }
      .hpTh-ghost { transform-origin: 60px 46px; animation: hpThGhost 2.6s ease-in-out infinite; }
      .hpTh-lens { transform-origin: 80px 48px; animation: hpThLens 2.4s ease-in-out infinite; }
      .hpTh-wisp { animation: hpThWisp 2.4s ease-in-out infinite; }

      @keyframes hpThBob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2.5px); }
      }
      @keyframes hpThLid {
        0%, 100% { transform: translate(-8px, -12px) rotate(-18deg); }
        50% { transform: translate(-10px, -15px) rotate(-22deg); }
      }
      @keyframes hpThGhost {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-4px) rotate(3deg); }
      }
      @keyframes hpThLens {
        0%, 100% { transform: translate(0, 0) rotate(-6deg); }
        50% { transform: translate(4px, 3px) rotate(8deg); }
      }
      @keyframes hpThWisp {
        0%, 100% { transform: translateY(0) scale(0.95); opacity: 0.7; }
        50% { transform: translateY(-5px) scale(1.1); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="58" cy="109" rx="34" ry="6" fill="#09040f" opacity="0.48"/>

  <!-- Floating spooky purple wisp -->
  <g class="hpTh-wisp">
    <circle cx="15" cy="54" r="4.5" fill="#a855f7" opacity="0.4"/>
    <path d="M15 58 C12 58, 12 52, 15 47 C18 52, 18 58, 15 58 Z" fill="#c084fc"/>
    <circle cx="15" cy="54" r="1.6" fill="#f3e8ff"/>
  </g>

  <g class="hpTh-root">
    <!-- Purple Vampire Collar behind -->
    <path d="M28 76 Q20 94 24 104 Q58 110 92 104 Q96 94 88 76 Z" fill="#581c87" stroke="#3b0764" stroke-width="2"/>
    <polygon points="32,74 22,60 40,68" fill="#7e22ce" stroke="#3b0764" stroke-width="1.5"/>
    <polygon points="84,74 94,60 76,68" fill="#7e22ce" stroke="#3b0764" stroke-width="1.5"/>

    <!-- Leafy Feet -->
    <ellipse cx="44" cy="105" rx="9" ry="5" fill="#15803d" stroke="#052e16" stroke-width="1.8"/>
    <ellipse cx="72" cy="105" rx="9" ry="5" fill="#15803d" stroke="#052e16" stroke-width="1.8"/>

    <!-- Dark hollow opening inside pumpkin top -->
    <ellipse cx="58" cy="54" rx="22" ry="7.5" fill="#2e1065"/>

    <!-- Baby Ghost Peeking Out Holding Magnifying Glass -->
    <g class="hpTh-ghost">
      <path d="M46 56 C46 36, 72 36, 72 56 L72 62 L46 62 Z" fill="#f8fafc" stroke="#6b21a8" stroke-width="2"/>
      <circle cx="55" cy="46" r="2.2" fill="#1e1b4b"/>
      <circle cx="65" cy="46" r="2.2" fill="#1e1b4b"/>
      <ellipse cx="51" cy="49" rx="2.2" ry="1.2" fill="#fb7185" opacity="0.7"/>
      <ellipse cx="69" cy="49" rx="2.2" ry="1.2" fill="#fb7185" opacity="0.7"/>
      <path d="M58 50 Q60 52 62 50" fill="none" stroke="#4c1d95" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Ghost little arm holding magnifying glass -->
      <ellipse cx="74" cy="50" rx="4" ry="2.8" fill="#f8fafc" stroke="#6b21a8" stroke-width="1.6"/>
      <g class="hpTh-lens">
        <line x1="76" y1="51" x2="84" y2="57" stroke="#78350f" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="88" cy="48" r="7.5" fill="#bae6fd" fill-opacity="0.55" stroke="#facc15" stroke-width="2.2"/>
        <path d="M84 45 A4.5 4.5 0 0 1 89 43" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Main Chibi Pumpkin Body -->
    <ellipse cx="58" cy="78" rx="34" ry="25" fill="url(#hpThBody)" stroke="#431407" stroke-width="2.4"/>
    <path d="M44 54 C36 66, 36 90, 45 102" fill="none" stroke="#9a3412" stroke-width="2" opacity="0.7"/>
    <path d="M72 54 C80 66, 80 90, 71 102" fill="none" stroke="#9a3412" stroke-width="2" opacity="0.7"/>
    <path d="M58 53 L58 103" fill="none" stroke="#9a3412" stroke-width="1.6" opacity="0.45"/>

    <!-- Curious Carved Eyes looking toward map -->
    <polygon points="40,74 47,65 53,74" fill="url(#hpThEye)" stroke="#7c2d12" stroke-width="1.4"/>
    <polygon points="65,74 71,65 78,74" fill="url(#hpThEye)" stroke="#7c2d12" stroke-width="1.4"/>
    <circle cx="49" cy="71" r="1.6" fill="#ffffff"/>
    <circle cx="73" cy="71" r="1.6" fill="#ffffff"/>

    <!-- Cheeks, nose, thoughtful wavy grin -->
    <ellipse cx="36" cy="79" rx="3.8" ry="2.2" fill="#fb7185" opacity="0.55"/>
    <ellipse cx="80" cy="79" rx="3.8" ry="2.2" fill="#fb7185" opacity="0.55"/>
    <polygon points="55,78 58,74 61,78" fill="#fef08a"/>
    <path d="M46 86 Q52 83 58 86 Q64 89 70 85" fill="none" stroke="#fef08a" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Candy Map held on right side -->
    <g transform="rotate(8 96 74)">
      <rect x="82" y="56" width="28" height="32" rx="3" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
      <!-- Dashed trail to candy X -->
      <path d="M87 82 Q94 74 91 68 Q96 63 103 63" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="2.5 2"/>
      <!-- Tiny candy icon on map -->
      <circle cx="102" cy="63" r="3.2" fill="#ec4899"/>
      <polygon points="97,61 99,63 97,65" fill="#f472b6"/>
      <polygon points="107,61 105,63 107,65" fill="#f472b6"/>
      <circle cx="88" cy="81" r="2" fill="#f97316"/>
    </g>

    <!-- Pumpkin Hands -->
    <ellipse cx="26" cy="82" rx="5.5" ry="4.2" fill="#ea580c" stroke="#431407" stroke-width="2"/>
    <ellipse cx="86" cy="82" rx="5.5" ry="4.2" fill="#ea580c" stroke="#431407" stroke-width="2"/>

    <!-- Slightly Ajar Top Lid + Crooked Witch Hat -->
    <g class="hpTh-lid">
      <path d="M66 48 Q76 42 73 50 Q70 55 64 51" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="58" cy="49" rx="32" ry="8" fill="url(#hpThHat)" stroke="#2e1065" stroke-width="2.2"/>
      <path d="M36 48 Q44 22 54 16 Q64 12 76 20 Q66 24 64 30 L80 48 Z" fill="url(#hpThHat)" stroke="#2e1065" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M38 46 Q58 51 78 46 L76 41 Q58 45 40 41 Z" fill="#f97316"/>
      <rect x="53" y="40" width="10" height="8" rx="1.5" fill="none" stroke="#facc15" stroke-width="2.2"/>
    </g>
  </g>
</svg>
