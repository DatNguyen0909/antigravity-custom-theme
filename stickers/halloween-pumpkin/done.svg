<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="hpDnBody" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="62%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <radialGradient id="hpDnEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="65%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
    <linearGradient id="hpDnHat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <style>
      .hpDn-root { transform-origin: 60px 104px; animation: hpDnHop 2.0s ease-in-out infinite; }
      .hpDn-hat { transform-origin: 60px 46px; animation: hpDnHatPop 2.0s ease-in-out infinite; }
      .hpDn-candy1 { transform-origin: 24px 36px; animation: hpDnFloat1 2.2s ease-in-out infinite; }
      .hpDn-candy2 { transform-origin: 96px 34px; animation: hpDnFloat2 2.4s ease-in-out infinite; }
      .hpDn-candy3 { transform-origin: 18px 66px; animation: hpDnFloat1 2.6s ease-in-out 0.5s infinite; }
      .hpDn-fw1 { transform-origin: 22px 20px; animation: hpDnBurst 2.2s ease-out infinite; }
      .hpDn-fw2 { transform-origin: 100px 22px; animation: hpDnBurst 2.2s ease-out 0.9s infinite; }

      @keyframes hpDnHop {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        45% { transform: translateY(-7px) scale(0.98, 1.04); }
        65% { transform: translateY(-3px) scale(1.03, 0.97); }
      }
      @keyframes hpDnHatPop {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(-6deg); }
      }
      @keyframes hpDnFloat1 {
        0%, 100% { transform: translateY(0) rotate(-12deg); }
        50% { transform: translateY(-7px) rotate(14deg); }
      }
      @keyframes hpDnFloat2 {
        0%, 100% { transform: translateY(0) rotate(12deg); }
        50% { transform: translateY(-8px) rotate(-15deg); }
      }
      @keyframes hpDnBurst {
        0% { transform: scale(0.3); opacity: 0; }
        35% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1.35); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Purple-Orange Spooky Fireworks -->
  <g class="hpDn-fw1" stroke-width="2" stroke-linecap="round">
    <line x1="22" y1="10" x2="22" y2="15" stroke="#c084fc"/>
    <line x1="22" y1="25" x2="22" y2="30" stroke="#fb923c"/>
    <line x1="12" y1="20" x2="17" y2="20" stroke="#facc15"/>
    <line x1="27" y1="20" x2="32" y2="20" stroke="#c084fc"/>
    <line x1="15" y1="13" x2="18.5" y2="16.5" stroke="#fb923c"/>
    <line x1="25.5" y1="23.5" x2="29" y2="27" stroke="#facc15"/>
    <line x1="29" y1="13" x2="25.5" y2="16.5" stroke="#a855f7"/>
    <line x1="15" y1="27" x2="18.5" y2="23.5" stroke="#fb923c"/>
  </g>
  <g class="hpDn-fw2" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="12" x2="100" y2="17" stroke="#fb923c"/>
    <line x1="100" y1="27" x2="100" y2="32" stroke="#c084fc"/>
    <line x1="90" y1="22" x2="95" y2="22" stroke="#a855f7"/>
    <line x1="105" y1="22" x2="110" y2="22" stroke="#facc15"/>
    <line x1="93" y1="15" x2="96.5" y2="18.5" stroke="#facc15"/>
    <line x1="103.5" y1="25.5" x2="107" y2="29" stroke="#fb923c"/>
    <line x1="107" y1="15" x2="103.5" y2="18.5" stroke="#c084fc"/>
    <line x1="93" y1="29" x2="96.5" y2="25.5" stroke="#a855f7"/>
  </g>

  <!-- Floating Colorful Candies -->
  <g class="hpDn-candy1">
    <polygon points="15,32 19,36 15,40" fill="#ec4899"/>
    <polygon points="33,32 29,36 33,40" fill="#ec4899"/>
    <circle cx="24" cy="36" r="5" fill="#f472b6" stroke="#831843" stroke-width="1.3"/>
    <path d="M21 34 Q24 32 27 34" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <g class="hpDn-candy2">
    <polygon points="87,32 91,36 87,40" fill="#a855f7"/>
    <polygon points="105,32 101,36 105,40" fill="#a855f7"/>
    <circle cx="96" cy="36" r="5" fill="#facc15" stroke="#713f12" stroke-width="1.3"/>
    <path d="M93 34 Q96 32 99 34" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <g class="hpDn-candy3">
    <polygon points="10,63 14,66 10,69" fill="#22c55e"/>
    <polygon points="26,63 22,66 26,69" fill="#22c55e"/>
    <circle cx="18" cy="66" r="4.2" fill="#4ade80" stroke="#14532d" stroke-width="1.2"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="60" cy="109" rx="32" ry="5.5" fill="#09040f" opacity="0.45"/>

  <g class="hpDn-root">
    <!-- Purple Vampire Collar behind -->
    <path d="M30 74 Q22 92 26 102 Q60 108 94 102 Q98 92 90 74 Z" fill="#581c87" stroke="#3b0764" stroke-width="2"/>
    <polygon points="34,72 24,58 42,66" fill="#7e22ce" stroke="#3b0764" stroke-width="1.5"/>
    <polygon points="86,72 96,58 78,66" fill="#7e22ce" stroke="#3b0764" stroke-width="1.5"/>

    <!-- Leafy Feet -->
    <ellipse cx="46" cy="104" rx="9" ry="5" fill="#15803d" stroke="#052e16" stroke-width="1.8"/>
    <ellipse cx="74" cy="104" rx="9" ry="5" fill="#15803d" stroke="#052e16" stroke-width="1.8"/>

    <!-- Main Chibi Pumpkin Body -->
    <ellipse cx="60" cy="76" rx="34" ry="26" fill="url(#hpDnBody)" stroke="#431407" stroke-width="2.4"/>
    <path d="M46 51 C38 64, 38 88, 47 101" fill="none" stroke="#9a3412" stroke-width="2" opacity="0.7"/>
    <path d="M74 51 C82 64, 82 88, 73 101" fill="none" stroke="#9a3412" stroke-width="2" opacity="0.7"/>
    <path d="M60 50 L60 102" fill="none" stroke="#9a3412" stroke-width="1.6" opacity="0.45"/>

    <!-- Joyful Glowing Laughing Arcs Eyes -->
    <path d="M41 71 Q47 61 54 71" fill="none" stroke="#fef08a" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M66 71 Q73 61 79 71" fill="none" stroke="#fef08a" stroke-width="3.6" stroke-linecap="round"/>

    <!-- Rosy cheeks + Nose + Big Celebratory Grin -->
    <ellipse cx="37" cy="77" rx="4.5" ry="2.4" fill="#fb7185" opacity="0.7"/>
    <ellipse cx="83" cy="77" rx="4.5" ry="2.4" fill="#fb7185" opacity="0.7"/>
    <polygon points="57,75 60,71 63,75" fill="#fef08a"/>
    <path d="M40 80 Q60 96 80 80 Q73 93 60 93 Q47 93 40 80 Z" fill="url(#hpDnEye)" stroke="#7c2d12" stroke-width="1.5"/>
    <rect x="51" y="83" width="4" height="4" fill="#ea580c"/>
    <rect x="65" y="83" width="4" height="4" fill="#ea580c"/>

    <!-- Both Hands Raised in Celebration -->
    <ellipse cx="26" cy="70" rx="5.5" ry="4.2" transform="rotate(-25 26 70)" fill="#ea580c" stroke="#431407" stroke-width="2"/>
    <ellipse cx="94" cy="70" rx="5.5" ry="4.2" transform="rotate(25 94 70)" fill="#ea580c" stroke="#431407" stroke-width="2"/>

    <!-- Bouncing Crooked Witch Hat -->
    <g class="hpDn-hat">
      <path d="M68 48 Q78 42 75 50 Q72 55 66 51" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="60" cy="49" rx="34" ry="8.5" fill="url(#hpDnHat)" stroke="#2e1065" stroke-width="2.2"/>
      <path d="M38 48 Q46 20 56 14 Q66 10 78 18 Q68 22 66 28 L82 48 Z" fill="url(#hpDnHat)" stroke="#2e1065" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M40 46 Q60 51 80 46 L78 41 Q60 45 42 41 Z" fill="#f97316"/>
      <rect x="55" y="40" width="10" height="8" rx="1.5" fill="none" stroke="#facc15" stroke-width="2.2"/>
    </g>
  </g>
</svg>
