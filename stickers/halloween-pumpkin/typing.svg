<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="hptBody" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="65%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <linearGradient id="hptHat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <style>
      /* Bí Ngô Ma Trơi khuấy vạc kẹo tím lấp lánh bằng kẹo mút phép thuật, kẹo màu bay tung tóe! */
      .hpt-char { transform-origin: 44px 102px; animation: hptBounce 0.48s ease-in-out infinite alternate; }
      .hpt-wand { transform-origin: 62px 74px; animation: hptStir 0.55s ease-in-out infinite alternate; }
      .hpt-brew { animation: hptBrewGlow 0.6s ease-in-out infinite alternate; }
      .hpt-c1 { animation: hptCandyUp1 0.85s ease-out infinite; }
      .hpt-c2 { animation: hptCandyUp2 0.85s ease-out -0.42s infinite; }

      @keyframes hptBounce {
        0% { transform: translateY(0) rotate(-3deg); }
        100% { transform: translateY(-4px) rotate(3deg); }
      }
      @keyframes hptStir {
        0% { transform: rotate(-18deg) translateX(-3px); }
        100% { transform: rotate(18deg) translateX(5px); }
      }
      @keyframes hptBrewGlow {
        0% { fill: #a855f7; }
        100% { fill: #4ade80; }
      }
      @keyframes hptCandyUp1 {
        0% { opacity: 0; transform: translate(84px, 72px) scale(0.5) rotate(0deg); }
        40% { opacity: 1; }
        100% { opacity: 0; transform: translate(74px, 36px) scale(1.05) rotate(-90deg); }
      }
      @keyframes hptCandyUp2 {
        0% { opacity: 0; transform: translate(92px, 72px) scale(0.5) rotate(0deg); }
        40% { opacity: 1; }
        100% { opacity: 0; transform: translate(104px, 38px) scale(1.05) rotate(110deg); }
      }
    </style>
  </defs>

  <ellipse cx="60" cy="108" rx="42" ry="6" fill="#09040f" opacity="0.5"/>

  <!-- Chibi Pumpkin Witch on the left -->
  <g class="hpt-char">
    <!-- Cape va Feet -->
    <path d="M18 76 Q14 94 18 102 Q44 107 68 102 Q72 94 66 76 Z" fill="#581c87" stroke="#3b0764" stroke-width="2"/>
    <ellipse cx="32" cy="104" rx="7.5" ry="4.5" fill="#15803d" stroke="#052e16" stroke-width="1.6"/>
    <ellipse cx="54" cy="104" rx="7.5" ry="4.5" fill="#15803d" stroke="#052e16" stroke-width="1.6"/>

    <!-- Pumpkin Head -->
    <ellipse cx="44" cy="76" rx="27" ry="22" fill="url(#hptBody)" stroke="#431407" stroke-width="2.2"/>
    <path d="M33 55 C27 66, 27 86, 34 97" fill="none" stroke="#9a3412" stroke-width="1.8" opacity="0.65"/>
    <path d="M55 55 C61 66, 61 86, 54 97" fill="none" stroke="#9a3412" stroke-width="1.8" opacity="0.65"/>

    <!-- Excited Starry Eyes va Grin facing right toward candy cauldron -->
    <polygon points="34,72 40,63 45,72" fill="#fef08a" stroke="#7c2d12" stroke-width="1.2"/>
    <polygon points="50,72 56,63 61,72" fill="#fef08a" stroke="#7c2d12" stroke-width="1.2"/>
    <path d="M34 80 Q48 91 62 80 Q56 89 48 89 Q40 89 34 80 Z" fill="#fef08a" stroke="#7c2d12" stroke-width="1.3"/>

    <!-- Witch Hat -->
    <ellipse cx="44" cy="54" rx="28" ry="7" fill="url(#hptHat)" stroke="#2e1065" stroke-width="2"/>
    <path d="M26 53 Q33 28 43 22 Q52 18 62 25 Q54 29 52 35 L64 53 Z" fill="url(#hptHat)" stroke="#2e1065" stroke-width="2"/>
    <path d="M28 51 Q44 55 60 51 L58 47 Q44 50 30 47 Z" fill="#f97316"/>
    <rect x="41" y="46" width="8" height="6.5" rx="1" fill="none" stroke="#facc15" stroke-width="2"/>

    <!-- Swirling Giant Lollipop Magic Wand stirring the candy pot -->
    <g class="hpt-wand">
      <ellipse cx="62" cy="78" rx="5" ry="4" fill="#ea580c" stroke="#431407" stroke-width="1.8"/>
      <line x1="62" y1="76" x2="88" y2="82" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
      <circle cx="76" cy="62" r="9" fill="#f472b6" stroke="#831843" stroke-width="1.8"/>
      <path d="M76 62 m-5 0 a5 5 0 1 0 10 0 a3 3 0 1 0 -6 0" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
      <line x1="76" y1="71" x2="84" y2="82" stroke="#fef3c7" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Bubbling Spooky Candy Cauldron on the right -->
  <g>
    <ellipse cx="88" cy="91" rx="20" ry="15" fill="#1e1b4b" stroke="#4c1d95" stroke-width="2.2"/>
    <ellipse cx="88" cy="78" rx="18" ry="5.5" fill="#312e81" stroke="#4c1d95" stroke-width="2"/>
    <ellipse class="hpt-brew" cx="88" cy="78" rx="14" ry="3.8" fill="#a855f7"/>
    <!-- Mini skull emblem on cauldron -->
    <circle cx="88" cy="92" r="4.5" fill="#e2e8f0"/>
    <circle cx="86.5" cy="91.5" r="1.1" fill="#1e1b4b"/>
    <circle cx="89.5" cy="91.5" r="1.1" fill="#1e1b4b"/>
  </g>

  <!-- Candies va magic stars popping up from cauldron -->
  <g class="hpt-c1">
    <polygon points="-6,-4 -2,0 -6,4" fill="#f97316"/>
    <polygon points="6,-4 2,0 6,4" fill="#f97316"/>
    <circle cx="0" cy="0" r="4" fill="#facc15" stroke="#7c2d12" stroke-width="1.2"/>
  </g>
  <g class="hpt-c2">
    <polygon points="-6,-4 -2,0 -6,4" fill="#ec4899"/>
    <polygon points="6,-4 2,0 6,4" fill="#ec4899"/>
    <circle cx="0" cy="0" r="4" fill="#c084fc" stroke="#581c87" stroke-width="1.2"/>
  </g>
</svg>
