<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="vcHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="vcToga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <style>
      .vc-body { transform-origin: 54px 66px; animation: vcFloat 2.6s ease-in-out infinite; }
      .vc-wing-l { transform-origin: 36px 66px; animation: vcFlapL 0.7s ease-in-out infinite alternate; }
      .vc-wing-r { transform-origin: 72px 66px; animation: vcFlapR 0.7s ease-in-out infinite alternate; }

      /* 15s Valentine Skit: Cupid shoots -> Heart cracks in two -> Cupid sweats va sticks X band-aid -> Heals into sparkling double hearts! */
      .vc-heart-crack { transform-origin: 96px 40px; animation: vcCrack15s 15s ease-out infinite; opacity: 0; }
      .vc-heart-healed { transform-origin: 96px 40px; animation: vcHeal15s 15s cubic-bezier(0.22, 1, 0.36, 1) infinite; opacity: 0; }
      .vc-sweat { animation: vcSweat15s 15s linear infinite; opacity: 0; }
      .vc-eyes-norm { animation: vcEyeN15s 15s steps(1) infinite; }
      .vc-blink { transform-origin: 54px 48px; animation: vcBlink 3.5s infinite; }
      @keyframes vcBlink { 0%, 44%, 48%, 94%, 100% { transform: scaleY(1); } 46%, 96% { transform: scaleY(0.08); } }
      .vc-eyes-oops { animation: vcEyeO15s 15s steps(1) infinite; opacity: 0; }

      @keyframes vcFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes vcFlapL {
        0% { transform: rotate(-8deg); }
        100% { transform: rotate(16deg); }
      }
      @keyframes vcFlapR {
        0% { transform: rotate(8deg); }
        100% { transform: rotate(-16deg); }
      }

      @keyframes vcCrack15s {
        0%, 68%, 81%, 100% { opacity: 0; transform: scale(0.6); }
        71%, 80% { opacity: 1; transform: scale(1); }
      }
      @keyframes vcHeal15s {
        0%, 80%, 95%, 100% { opacity: 0; transform: scale(0.6); }
        83%, 92% { opacity: 1; transform: scale(1.12); }
      }
      @keyframes vcSweat15s {
        0%, 71%, 81%, 100% { opacity: 0; transform: translateY(0); }
        73%, 79% { opacity: 1; transform: translateY(5px); }
      }
      @keyframes vcEyeN15s { 0%, 70%, 82%, 100% { opacity: 1; } 71%, 81% { opacity: 0; } }
      @keyframes vcEyeO15s { 0%, 70%, 82%, 100% { opacity: 0; } 71%, 81% { opacity: 1; } }
    </style>
  </defs>

  <!-- Soft rosy cloud shadow -->
  <ellipse cx="54" cy="108" rx="26" ry="5" fill="#881337" opacity="0.28"/>

  <g class="vc-body">
    <!-- Feathered Angel Wings -->
    <g class="vc-wing-l">
      <path d="M38 66 C14 52, 10 72, 24 78 C16 82, 22 90, 38 80 Z" fill="#ffffff" stroke="#fb7185" stroke-width="1.8"/>
    </g>
    <g class="vc-wing-r">
      <path d="M70 66 C94 52, 98 72, 84 78 C92 82, 86 90, 70 80 Z" fill="#ffffff" stroke="#fb7185" stroke-width="1.8"/>
    </g>

    <!-- Chibi Feet -->
    <ellipse cx="46" cy="99" rx="5.5" ry="4" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5"/>
    <ellipse cx="62" cy="99" rx="5.5" ry="4" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5"/>

    <!-- Silk Cherub Toga + Pink Ribbon Sash -->
    <path d="M36 66 L72 66 L76 94 Q54 98 32 94 Z" fill="url(#vcToga)" stroke="#f43f5e" stroke-width="1.8"/>
    <path d="M38 68 L70 88" stroke="#f43f5e" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Chibi Head -->
    <circle cx="54" cy="46" r="22" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/>

    <!-- Curly Golden Hair va Floating Heart Halo -->
    <ellipse cx="54" cy="15" rx="14" ry="4" fill="none" stroke="#facc15" stroke-width="2.4"/>
    <path d="M31 42 C28 24, 46 18, 55 23 C65 18, 80 25, 77 42 C72 34, 64 31, 54 33 C44 31, 36 34, 31 42 Z" fill="url(#vcHair)" stroke="#b45309" stroke-width="1.8"/>
    <circle cx="34" cy="34" r="5.5" fill="url(#vcHair)" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="74" cy="34" r="5.5" fill="url(#vcHair)" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="54" cy="26" r="6" fill="url(#vcHair)" stroke="#b45309" stroke-width="1.5"/>

    <!-- Normal Sweet Sparkling Eyes -->
    <g class="vc-eyes-norm">
      <g class="vc-blink">
        <circle cx="45" cy="48" r="4.3" fill="#881337"/>
        <circle cx="63" cy="48" r="4.3" fill="#881337"/>
        <circle cx="43.6" cy="46.5" r="1.6" fill="#ffffff"/>
        <circle cx="61.6" cy="46.5" r="1.6" fill="#ffffff"/>
      </g>
    </g>
    <!-- Panicked '> <' Eyes when heart cracks -->
    <g class="vc-eyes-oops" stroke="#881337" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M41 45 L47 48 L41 51"/>
      <path d="M67 45 L61 48 L67 51"/>
    </g>

    <!-- Sweat drop -->
    <path class="vc-sweat" d="M75 36 C75 36, 79 42, 75 44 C71 42, 75 36, 75 36 Z" fill="#38bdf8"/>

    <!-- Rosy Blush va Smile -->
    <ellipse cx="39" cy="53" rx="4" ry="2.2" fill="#fb7185" opacity="0.65"/>
    <ellipse cx="69" cy="53" rx="4" ry="2.2" fill="#fb7185" opacity="0.65"/>
    <path d="M50 54 Q54 58 58 54" fill="none" stroke="#9a3412" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Golden Heart Bow va Pink Heart Arrow -->
    <path d="M74 56 C86 62, 86 82, 74 88" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    <line x1="74" y1="56" x2="74" y2="88" stroke="#fda4af" stroke-width="1.2"/>
    <line x1="66" y1="72" x2="92" y2="72" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <path d="M92 72 L87 68 C90 65, 96 68, 96 72 C96 76, 90 79, 87 76 Z" fill="#f43f5e"/>
    <circle cx="72" cy="74" r="4.2" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/>
  </g>

  <!-- 15s Skit Step 1: Cracked Heart -->
  <g class="vc-heart-crack">
    <path d="M96 52 C82 42, 80 28, 90 28 C93 28, 95 30, 96 33 C97 30, 99 28, 102 28 C112 28, 110 42, 96 52 Z" fill="#fb7185" stroke="#9f1239" stroke-width="1.8"/>
    <polyline points="96,31 93,37 98,42 94,49" fill="none" stroke="#fff1f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 15s Skit Step 2: Heart patched with cute Band-Aid va glowing sparkles! -->
  <g class="vc-heart-healed">
    <path d="M96 52 C82 42, 80 28, 90 28 C93 28, 95 30, 96 33 C97 30, 99 28, 102 28 C112 28, 110 42, 96 52 Z" fill="#f43f5e" stroke="#881337" stroke-width="1.8"/>
    <!-- Band-aid patch -->
    <rect x="89" y="36" width="14" height="5" rx="2.5" transform="rotate(-22 96 38.5)" fill="#fde68a" stroke="#b45309" stroke-width="1.1"/>
    <circle cx="84" cy="24" r="2.2" fill="#fde047"/>
    <circle cx="109" cy="25" r="2.2" fill="#fde047"/>
  </g>
</svg>
