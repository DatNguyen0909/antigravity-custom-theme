<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="vcThHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="vcThToga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <style>
      .vcTh-body { transform-origin: 58px 68px; animation: vcThFloat 2.8s ease-in-out infinite; }
      .vcTh-head { transform-origin: 58px 56px; animation: vcThScan 3.2s ease-in-out infinite; }
      .vcTh-wing-l { transform-origin: 40px 68px; animation: vcThFlapL 1.1s ease-in-out infinite alternate; }
      .vcTh-wing-r { transform-origin: 76px 68px; animation: vcThFlapR 1.1s ease-in-out infinite alternate; }
      .vcTh-target { transform-origin: 100px 26px; animation: vcThTarget 2.4s ease-in-out infinite; }

      @keyframes vcThFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes vcThScan {
        0%, 100% { transform: rotate(-7deg); }
        50% { transform: rotate(7deg); }
      }
      @keyframes vcThFlapL {
        0% { transform: rotate(-6deg); }
        100% { transform: rotate(12deg); }
      }
      @keyframes vcThFlapR {
        0% { transform: rotate(6deg); }
        100% { transform: rotate(-12deg); }
      }
      @keyframes vcThTarget {
        0%, 100% { transform: scale(0.85); opacity: 0.65; }
        50% { transform: scale(1.12); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Floating Heart Radar Target being scanned -->
  <g class="vcTh-target">
    <circle cx="100" cy="26" r="10" fill="none" stroke="#f43f5e" stroke-width="1.4" stroke-dasharray="3 2"/>
    <line x1="100" y1="13" x2="100" y2="18" stroke="#f43f5e" stroke-width="1.4"/>
    <line x1="100" y1="34" x2="100" y2="39" stroke="#f43f5e" stroke-width="1.4"/>
    <line x1="87" y1="26" x2="92" y2="26" stroke="#f43f5e" stroke-width="1.4"/>
    <line x1="108" y1="26" x2="113" y2="26" stroke="#f43f5e" stroke-width="1.4"/>
    <path d="M100 31 C95 27, 94 22, 98 22 C99 22, 100 23, 100 24 C100 23, 101 22, 102 22 C106 22, 105 27, 100 31 Z" fill="#fb7185"/>
  </g>

  <!-- Soft rosy cloud shadow -->
  <ellipse cx="58" cy="108" rx="26" ry="5" fill="#881337" opacity="0.28"/>

  <g class="vcTh-body">
    <!-- Feathered Angel Wings -->
    <g class="vcTh-wing-l">
      <path d="M42 68 C18 54, 14 74, 28 80 C20 84, 26 92, 42 82 Z" fill="#ffffff" stroke="#fb7185" stroke-width="1.8"/>
    </g>
    <g class="vcTh-wing-r">
      <path d="M74 68 C98 54, 102 74, 88 80 C96 84, 90 92, 74 82 Z" fill="#ffffff" stroke="#fb7185" stroke-width="1.8"/>
    </g>

    <!-- Chibi Feet -->
    <ellipse cx="50" cy="99" rx="5.5" ry="4" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5"/>
    <ellipse cx="66" cy="99" rx="5.5" ry="4" fill="#fed7aa" stroke="#9a3412" stroke-width="1.5"/>

    <!-- Silk Cherub Toga + Pink Ribbon Sash -->
    <path d="M40 68 L76 68 L80 94 Q58 98 36 94 Z" fill="url(#vcThToga)" stroke="#f43f5e" stroke-width="1.8"/>
    <path d="M42 70 L74 88" stroke="#f43f5e" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Tilting Head + Heart-Shaped Binoculars -->
    <g class="vcTh-head">
      <!-- Chibi Head -->
      <circle cx="58" cy="48" r="22" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/>

      <!-- Curly Golden Hair and Halo -->
      <ellipse cx="58" cy="17" rx="14" ry="4" fill="none" stroke="#facc15" stroke-width="2.4"/>
      <path d="M35 44 C32 26, 50 20, 59 25 C69 20, 84 27, 81 44 C76 36, 68 33, 58 35 C48 33, 40 36, 35 44 Z" fill="url(#vcThHair)" stroke="#b45309" stroke-width="1.8"/>
      <circle cx="38" cy="36" r="5.5" fill="url(#vcThHair)" stroke="#b45309" stroke-width="1.5"/>
      <circle cx="78" cy="36" r="5.5" fill="url(#vcThHair)" stroke="#b45309" stroke-width="1.5"/>
      <circle cx="58" cy="28" r="6" fill="url(#vcThHair)" stroke="#b45309" stroke-width="1.5"/>

      <!-- Rosy Blush and Curious O Mouth -->
      <ellipse cx="42" cy="58" rx="3.8" ry="2.1" fill="#fb7185" opacity="0.65"/>
      <ellipse cx="74" cy="58" rx="3.8" ry="2.1" fill="#fb7185" opacity="0.65"/>
      <circle cx="58" cy="61" r="2.2" fill="#f43f5e"/>

      <!-- Heart-Shaped Binoculars held up to eyes -->
      <g>
        <!-- Bridge -->
        <rect x="54" y="47" width="8" height="4" rx="1.5" fill="#facc15" stroke="#b45309" stroke-width="1.2"/>
        <!-- Left Heart Lens -->
        <path d="M47 59 C36 52, 35 41, 43 41 C45 41, 46.5 42.5, 47 44.5 C47.5 42.5, 49 41, 51 41 C59 41, 58 52, 47 59 Z" fill="#f43f5e" stroke="#881337" stroke-width="1.8"/>
        <path d="M47 56 C39 51, 38.5 43.5, 43.5 43.5 C45 43.5, 46.5 44.8, 47 46 C47.5 44.8, 49 43.5, 50.5 43.5 C55.5 43.5, 55 51, 47 56 Z" fill="#bae6fd"/>
        <circle cx="43.5" cy="47.5" r="1.8" fill="#ffffff"/>
        <!-- Right Heart Lens -->
        <path d="M69 59 C58 52, 57 41, 65 41 C67 41, 68.5 42.5, 69 44.5 C69.5 42.5, 71 41, 73 41 C81 41, 80 52, 69 59 Z" fill="#f43f5e" stroke="#881337" stroke-width="1.8"/>
        <path d="M69 56 C61 51, 60.5 43.5, 65.5 43.5 C67 43.5, 68.5 44.8, 69 46 C69.5 44.8, 71 43.5, 72.5 43.5 C77.5 43.5, 77 51, 69 56 Z" fill="#bae6fd"/>
        <circle cx="65.5" cy="47.5" r="1.8" fill="#ffffff"/>
        <!-- Chibi Hands holding binoculars -->
        <circle cx="37" cy="52" r="4.2" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/>
        <circle cx="79" cy="52" r="4.2" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/>
      </g>
    </g>
  </g>
</svg>
