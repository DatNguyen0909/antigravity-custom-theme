<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="vctHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      /* Tiểu Thần Cupid vỗ cánh bắn tên tình yêu và thư tình 💌 liên thanh! */
      .vct-cupid { transform-origin: 42px 68px; animation: vctHover 0.55s ease-in-out infinite alternate; }
      .vct-wing { transform-origin: 28px 66px; animation: vctFastFlap 0.28s ease-in-out infinite alternate; }
      .vct-arrow { animation: vctShootArrow 0.75s ease-out infinite; }
      .vct-letter { animation: vctFlyLetter 0.95s ease-out -0.35s infinite; }

      @keyframes vctHover {
        0% { transform: translateY(0) rotate(-3deg); }
        100% { transform: translateY(-5px) rotate(2deg); }
      }
      @keyframes vctFastFlap {
        0% { transform: rotate(-12deg) scaleX(1); }
        100% { transform: rotate(18deg) scaleX(0.88); }
      }
      @keyframes vctShootArrow {
        0% { opacity: 1; transform: translate(0, 0); }
        75% { opacity: 1; }
        100% { opacity: 0; transform: translate(38px, -10px); }
      }
      @keyframes vctFlyLetter {
        0% { opacity: 0; transform: translate(68px, 78px) scale(0.6) rotate(-10deg); }
        35% { opacity: 1; }
        100% { opacity: 0; transform: translate(98px, 34px) scale(1.05) rotate(16deg); }
      }
    </style>
  </defs>

  <ellipse cx="46" cy="108" rx="28" ry="5" fill="#881337" opacity="0.25"/>

  <g class="vct-cupid">
    <!-- Flapping Wing -->
    <g class="vct-wing">
      <path d="M30 66 C6 50, 4 72, 18 79 C12 84, 18 92, 32 80 Z" fill="#ffffff" stroke="#fb7185" stroke-width="1.8"/>
    </g>

    <!-- Toga va Feet -->
    <ellipse cx="36" cy="98" rx="5" ry="3.8" fill="#fed7aa" stroke="#9a3412" stroke-width="1.4"/>
    <ellipse cx="50" cy="96" rx="5" ry="3.8" fill="#fed7aa" stroke="#9a3412" stroke-width="1.4"/>
    <path d="M28 66 L58 66 L62 92 Q43 96 24 92 Z" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.8"/>
    <path d="M30 68 L56 86" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>

    <!-- Head va Halo -->
    <ellipse cx="44" cy="18" rx="12" ry="3.5" fill="none" stroke="#facc15" stroke-width="2.2"/>
    <circle cx="44" cy="46" r="20" fill="#ffedd5" stroke="#9a3412" stroke-width="1.9"/>
    <path d="M24 42 C22 25, 38 20, 46 24 C56 20, 68 26, 65 42 C60 35, 53 32, 44 34 C35 32, 28 35, 24 42 Z" fill="url(#vctHair)" stroke="#b45309" stroke-width="1.6"/>

    <!-- Winking Aiming Eye + Sparkling Eye -->
    <path d="M34 47 L41 49 L34 51" fill="none" stroke="#881337" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="53" cy="48" r="4" fill="#881337"/>
    <circle cx="52" cy="46.6" r="1.4" fill="#ffffff"/>
    <ellipse cx="58" cy="53" rx="3.8" ry="2" fill="#fb7185" opacity="0.65"/>

    <!-- Drawn Golden Bow -->
    <path d="M64 46 C78 54, 78 78, 64 86" fill="none" stroke="#facc15" stroke-width="3.2" stroke-linecap="round"/>
    <polyline points="64,46 54,66 64,86" fill="none" stroke="#fda4af" stroke-width="1.5"/>
  </g>

  <!-- Flying Heart Arrow -->
  <g class="vct-arrow">
    <line x1="56" y1="66" x2="82" y2="60" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M86 59 C81 54, 77 58, 80 61 C78 64, 83 66, 86 59 Z" fill="#f43f5e" stroke="#881337" stroke-width="1"/>
  </g>

  <!-- Floating Love Letter (💌) -->
  <g class="vct-letter">
    <rect x="-10" y="-7" width="20" height="14" rx="2" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <polyline points="-9,-6 0,2 9,-6" fill="none" stroke="#fb7185" stroke-width="1.4"/>
    <circle cx="0" cy="1" r="2.6" fill="#e11d48"/>
  </g>
</svg>
