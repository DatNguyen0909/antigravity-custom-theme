<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <radialGradient id="vcaSkyGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#fde68a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vcaCloudBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#f5d0fe"/>
    </linearGradient>
    <linearGradient id="vcaCloudFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="65%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="vcaRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#fb7185" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vcaHeartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="vcaClip">
      <rect x="0" y="0" width="260" height="71"/>
    </clipPath>
    <style>
      .vca-cloud-bg { animation: vcaCloudBackDrift 6.4s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .vca-cloud-fg { animation: vcaCloudFrontDrift 4.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .vca-star1 { transform-origin: 24px 18px; animation: vcaStarTwinkle 1.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .vca-star2 { transform-origin: 128px 10px; animation: vcaStarTwinkle 2.2s cubic-bezier(0.37, 0, 0.63, 1) 0.5s infinite alternate; }
      .vca-star3 { transform-origin: 214px 16px; animation: vcaStarTwinkle 2.0s cubic-bezier(0.37, 0, 0.63, 1) 1.0s infinite alternate; }
      .vca-star4 { transform-origin: 242px 30px; animation: vcaStarTwinkle 2.4s cubic-bezier(0.37, 0, 0.63, 1) 0.3s infinite alternate; }
      .vca-letter1 { transform-origin: 112px 48px; animation: vcaLetterBob 2.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .vca-letter2 { transform-origin: 216px 46px; animation: vcaLetterBobRev 3.0s cubic-bezier(0.37, 0, 0.63, 1) 0.6s infinite alternate; }
      .vca-heart1 { transform-origin: 155px 24px; animation: vcaHeartPulse 2.0s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .vca-heart2 { transform-origin: 84px 18px; animation: vcaHeartPulse 2.3s cubic-bezier(0.37, 0, 0.63, 1) 0.8s infinite alternate; }

      /* Silky 60fps decoupled glide: linear X + sine Y */
      .vca-flyerX { animation: vcaFlyAcrossX 3.4s linear infinite; }
      .vca-flyerY { transform-origin: 0px 6px; animation: vcaFlyAcrossY 1.0s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .vca-wing { transform-origin: 8px 6px; animation: vcaWingFlap 0.28s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .vca-trail { transform-origin: 18px 12px; animation: vcaTrailFlutter 0.45s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }

      @keyframes vcaCloudBackDrift {
        0% { transform: translateX(-7px); }
        100% { transform: translateX(7px); }
      }
      @keyframes vcaCloudFrontDrift {
        0% { transform: translateX(5px); }
        100% { transform: translateX(-5px); }
      }
      @keyframes vcaStarTwinkle {
        0% { transform: scale(0.6) rotate(-10deg); opacity: 0.35; }
        100% { transform: scale(1.18) rotate(10deg); opacity: 1; }
      }
      @keyframes vcaLetterBob {
        0% { transform: translateY(3px) rotate(-6deg); }
        100% { transform: translateY(-4px) rotate(5deg); }
      }
      @keyframes vcaLetterBobRev {
        0% { transform: translateY(-3px) rotate(6deg); }
        100% { transform: translateY(4px) rotate(-5deg); }
      }
      @keyframes vcaHeartPulse {
        0% { transform: scale(0.86) translateY(2px); opacity: 0.72; }
        100% { transform: scale(1.12) translateY(-2px); opacity: 1; }
      }
      @keyframes vcaFlyAcrossX {
        0%   { transform: translateX(250px); opacity: 0; }
        7%   { opacity: 1; }
        93%  { opacity: 1; }
        100% { transform: translateX(-56px); opacity: 0; }
      }
      @keyframes vcaFlyAcrossY {
        0%   { transform: translateY(15px) rotate(-4.5deg); }
        100% { transform: translateY(30px) rotate(4.5deg); }
      }
      @keyframes vcaWingFlap {
        0%   { transform: rotate(-12deg) scaleY(1); }
        100% { transform: rotate(16deg) scaleY(0.76); }
      }
      @keyframes vcaTrailFlutter {
        0%   { transform: scaleY(0.85) rotate(-3deg); opacity: 0.75; }
        100% { transform: scaleY(1.12) rotate(3deg); opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#vcaClip)">
    <!-- Soft Rose-Gold Twilight Glow -->
    <rect x="0" y="0" width="260" height="71" fill="url(#vcaSkyGlow)"/>

    <!-- Glowing Pastel Rainbow Arc -->
    <g fill="none" stroke-linecap="round">
      <path d="M18 69 Q130 -2 242 69" stroke="#f472b6" stroke-width="5.5" opacity="0.34"/>
      <path d="M24 69 Q130 5 236 69" stroke="#fb923c" stroke-width="4.2" opacity="0.28"/>
      <path d="M30 69 Q130 12 230 69" stroke="#fde047" stroke-width="3.6" opacity="0.32"/>
      <path d="M36 69 Q130 19 224 69" stroke="#c084fc" stroke-width="3" opacity="0.24"/>
    </g>

    <!-- Twinkling Golden Stars -->
    <g fill="#fef08a">
      <path class="vca-star1" d="M24 14 L25.2 16.8 L28 18 L25.2 19.2 L24 22 L22.8 19.2 L20 18 L22.8 16.8 Z"/>
      <path class="vca-star2" d="M128 6.5 L129.1 9 L131.5 10 L129.1 11 L128 13.5 L126.9 11 L124.5 10 L126.9 9 Z"/>
      <path class="vca-star3" d="M214 12 L215.2 14.8 L218 16 L215.2 17.2 L214 20 L212.8 17.2 L210 16 L212.8 14.8 Z"/>
      <path class="vca-star4" d="M242 27 L243 29.1 L245 30 L243 30.9 L242 33 L241 30.9 L239 30 L241 29.1 Z"/>
    </g>

    <!-- Background Parallax Cotton-Candy Clouds -->
    <g class="vca-cloud-bg" fill="url(#vcaCloudBack)" opacity="0.72">
      <path d="M76 70 q0 -12 16 -12 q9 -11 24 -5 q14 -8 24 4 q13 -1 14 13 Z"/>
      <path d="M140 69 q0 -10 14 -10 q8 -9 22 -4 q12 -6 20 4 q11 0 11 10 Z"/>
    </g>

    <!-- Marble va Rose Love Arch -->
    <g>
      <path d="M34 57 L34 34 A14 14 0 0 1 62 34 L62 57" fill="none" stroke="#fff1f2" stroke-width="4.2" stroke-linecap="round"/>
      <path d="M34 57 L34 34 A14 14 0 0 1 62 34 L62 57" fill="none" stroke="#fbcfe8" stroke-width="1.2" stroke-dasharray="3 3"/>
      <circle cx="34" cy="36" r="3.6" fill="#f43f5e" stroke="#fff1f2" stroke-width="0.9"/>
      <circle cx="48" cy="20" r="4.2" fill="#f43f5e" stroke="#fef08a" stroke-width="1"/>
      <circle cx="62" cy="36" r="3.6" fill="#f43f5e" stroke="#fff1f2" stroke-width="0.9"/>
    </g>

    <!-- Floating Love Letters -->
    <g class="vca-letter1">
      <rect x="105" y="43" width="14" height="10" rx="1.8" fill="#fffbeb" stroke="#f472b6" stroke-width="1.1"/>
      <path d="M105.5 43.8 L112 49 L118.5 43.8" fill="none" stroke="#f472b6" stroke-width="1"/>
      <circle cx="112" cy="48.5" r="1.8" fill="#f43f5e"/>
    </g>
    <g class="vca-letter2">
      <rect x="209" y="41" width="13" height="9.2" rx="1.6" fill="#fffbeb" stroke="#f472b6" stroke-width="1.1"/>
      <path d="M209.5 41.8 L215.5 46.6 L221.5 41.8" fill="none" stroke="#f472b6" stroke-width="1"/>
      <circle cx="215.5" cy="46.2" r="1.7" fill="#ec4899"/>
    </g>

    <!-- Glowing Floating Hearts -->
    <g class="vca-heart1">
      <circle cx="155" cy="23" r="12" fill="url(#vcaHeartGlow)"/>
      <path d="M155 32 C145 24, 144 14, 151 14 C153 14, 154 16, 155 18 C156 16, 157 14, 159 14 C166 14, 165 24, 155 32 Z" fill="#f43f5e" stroke="#fff1f2" stroke-width="1.4"/>
    </g>
    <g class="vca-heart2">
      <circle cx="84" cy="17" r="11" fill="url(#vcaHeartGlow)"/>
      <path d="M84 26 C74 18, 73 8, 80 8 C82 8, 83 10, 84 12 C85 10, 86 8, 88 8 C95 8, 94 18, 84 26 Z" fill="#ec4899" stroke="#fff1f2" stroke-width="1.4"/>
    </g>

    <!-- Flying Chibi Cupid with Fluttering Heart-Ribbon Trail -->
    <g class="vca-flyerX">
      <g class="vca-flyerY">
        <!-- Fluttering Heart-Ribbon Trail -->
        <g class="vca-trail">
          <path d="M16 14 Q28 8 38 14 T58 11" fill="none" stroke="url(#vcaRibbon)" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M18 17 Q30 13 42 18" fill="none" stroke="#fde047" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
          <path d="M36 9 C33 6.5, 33 4, 35 4 C35.6 4, 35.9 4.5, 36 5 C36.1 4.5, 36.4 4, 37 4 C39 4, 39 6.5, 36 9 Z" fill="#fb7185"/>
          <circle cx="48" cy="14" r="1.4" fill="#fef08a"/>
        </g>

        <!-- Back Wing -->
        <path class="vca-wing" d="M8 6 C18 -8, 28 -2, 20 8 C26 10, 22 17, 10 12 Z" fill="#ffffff" stroke="#fb7185" stroke-width="1.4"/>
        <!-- Toga Body -->
        <ellipse cx="8" cy="14" rx="11" ry="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.4"/>
        <!-- Golden Halo -->
        <ellipse cx="-2" cy="-11" rx="8" ry="2.2" fill="none" stroke="#facc15" stroke-width="1.7"/>
        <!-- Head va Golden Hair -->
        <circle cx="-2" cy="4" r="11.5" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/>
        <path d="M-13 1 C-13 -9, -3 -11, 2 -8 C8 -10, 12 -3, 9 3 C5 -2, -5 -3, -13 1 Z" fill="#facc15" stroke="#b45309" stroke-width="1.2"/>
        <!-- Eye va Rosy Blush -->
        <circle cx="-6" cy="5" r="2.2" fill="#881337"/>
        <circle cx="-6.7" cy="4.2" r="0.75" fill="#ffffff"/>
        <ellipse cx="-3" cy="8" rx="2.5" ry="1.3" fill="#fb7185" opacity="0.72"/>
        <!-- Golden Bow va Heart Arrow -->
        <path d="M-14 -4 C-22 2, -22 14, -14 20" fill="none" stroke="#facc15" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="-14" y1="-3" x2="-14" y2="19" stroke="#fef08a" stroke-width="0.9" opacity="0.85"/>
        <line x1="-10" y1="8" x2="-26" y2="8" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M-29 8 L-24.5 5.2 L-25.5 8 L-24.5 10.8 Z" fill="#f43f5e"/>
      </g>
    </g>

    <!-- Foreground Parallax Fluffy Cotton-Candy Clouds flush on y=71 -->
    <g class="vca-cloud-fg" fill="url(#vcaCloudFront)" stroke="#f9a8d4" stroke-width="1.3">
      <path d="M-4 71 q0 -16 19 -16 q9 -14 28 -7 q16 -10 27 5 q16 0 17 18 Z"/>
      <path d="M164 71 q0 -15 19 -15 q9 -14 29 -7 q16 -8 25 6 q15 0 16 16 Z"/>
    </g>
  </g>
</svg>
