<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sctFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <style>
      /* Corgi đeo kính râm hì hục xúc cát đắp Lâu Đài Cát Mùa Hè! */
      .sct-dog { transform-origin: 42px 102px; animation: sctDigBob 0.42s ease-in-out infinite alternate; }
      .sct-shovel { transform-origin: 56px 78px; animation: sctScoop 0.42s ease-in-out infinite alternate; }
      .sct-sand1 { animation: sctSandFly1 0.65s ease-out infinite; }
      .sct-sand2 { animation: sctSandFly2 0.65s ease-out -0.32s infinite; }
      .sct-flag { transform-origin: 88px 54px; animation: sctFlagWave 0.8s ease-in-out infinite alternate; }

      @keyframes sctDigBob {
        0% { transform: translateY(0) rotate(-2deg); }
        100% { transform: translateY(-3px) rotate(3deg); }
      }
      @keyframes sctScoop {
        0% { transform: rotate(-22deg); }
        100% { transform: rotate(24deg); }
      }
      @keyframes sctSandFly1 {
        0% { opacity: 0; transform: translate(72px, 86px) scale(0.5); }
        45% { opacity: 1; }
        100% { opacity: 0; transform: translate(62px, 60px) scale(1.1); }
      }
      @keyframes sctSandFly2 {
        0% { opacity: 0; transform: translate(76px, 84px) scale(0.5); }
        45% { opacity: 1; }
        100% { opacity: 0; transform: translate(98px, 62px) scale(1.1); }
      }
      @keyframes sctFlagWave {
        0% { transform: skewY(-6deg); }
        100% { transform: skewY(6deg); }
      }
    </style>
  </defs>

  <!-- Golden beach sand mound -->
  <ellipse cx="62" cy="106" rx="46" ry="7" fill="#fde68a" stroke="#d97706" stroke-width="1.4"/>

  <!-- Corgi digging on the left -->
  <g class="sct-dog">
    <rect x="24" y="68" width="36" height="30" rx="12" fill="#06b6d4" stroke="#0e7490" stroke-width="1.8"/>
    <polygon points="24,44 20,20 38,34" fill="url(#sctFur)" stroke="#78350f" stroke-width="1.8"/>
    <polygon points="60,44 66,20 48,34" fill="url(#sctFur)" stroke="#78350f" stroke-width="1.8"/>
    <ellipse cx="42" cy="50" rx="22" ry="19" fill="url(#sctFur)" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="44" cy="56" rx="13" ry="11" fill="#fffbeb"/>
    <!-- Cool Sunglasses pushed onto forehead + Happy focused eyes -->
    <rect x="28" y="34" width="13" height="7" rx="2" fill="#0f172a"/>
    <rect x="45" y="34" width="13" height="7" rx="2" fill="#0f172a"/>
    <line x1="41" y1="37" x2="45" y2="37" stroke="#0f172a" stroke-width="2"/>
    <circle cx="36" cy="49" r="3.2" fill="#1e293b"/>
    <circle cx="52" cy="49" r="3.2" fill="#1e293b"/>
    <ellipse cx="45" cy="55" rx="3.4" ry="2.4" fill="#1e293b"/>
    <path d="M42 60 Q45 65 48 60 Z" fill="#fb7185"/>

    <!-- Red Plastic Beach Shovel scooping sand -->
    <g class="sct-shovel">
      <ellipse cx="56" cy="78" rx="5" ry="4" fill="#fffbeb" stroke="#78350f" stroke-width="1.6"/>
      <line x1="56" y1="78" x2="72" y2="86" stroke="#ef4444" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M70 82 L80 86 L76 93 L67 88 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.4"/>
    </g>
  </g>

  <!-- Cute Sandcastle with Red Flag va Starfish on the right -->
  <g>
    <rect x="74" y="80" width="28" height="22" rx="2" fill="#fcd34d" stroke="#b45309" stroke-width="1.8"/>
    <rect x="81" y="66" width="14" height="15" rx="1.5" fill="#fde047" stroke="#b45309" stroke-width="1.6"/>
    <!-- Castle battlements va door -->
    <rect x="74" y="76" width="6" height="5" fill="#fcd34d" stroke="#b45309" stroke-width="1.4"/>
    <rect x="96" y="76" width="6" height="5" fill="#fcd34d" stroke="#b45309" stroke-width="1.4"/>
    <path d="M84 102 L84 92 A4 4 0 0 1 92 92 L92 102 Z" fill="#92400e"/>
    <!-- Flag on top -->
    <line x1="88" y1="66" x2="88" y2="50" stroke="#78350f" stroke-width="1.8"/>
    <polygon class="sct-flag" points="88,50 101,54 88,58" fill="#f43f5e"/>
    <!-- Pink starfish decoration -->
    <circle cx="98" cy="96" r="3.5" fill="#fb7185"/>
  </g>

  <!-- Flying Sand Puffs -->
  <g class="sct-sand1"><circle cx="0" cy="0" r="2.8" fill="#fde047"/></g>
  <g class="sct-sand2"><circle cx="0" cy="0" r="2.5" fill="#fbbf24"/></g>
</svg>
