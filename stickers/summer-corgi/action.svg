<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95">
  <defs>
    <linearGradient id="scaWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <style>
      /* Bãi biển nhiệt đới nắng vàng: Corgi đeo kính râm lướt ván cưỡi sóng xanh qua đảo dừa! */
      .sca-surfer { animation: scaSurfRide 3.0s ease-in-out infinite; }
      .sca-sun { transform-origin: 222px 24px; animation: scaSunSpin 8s linear infinite; }
      .sca-spray { animation: scaSprayPop 0.45s ease-in-out infinite alternate; }

      @keyframes scaSurfRide {
        0%   { transform: translate(236px, 56px) rotate(-6deg); }
        25%  { transform: translate(172px, 38px) rotate(8deg); }
        50%  { transform: translate(112px, 54px) rotate(-8deg); }
        75%  { transform: translate(52px, 36px) rotate(6deg); }
        100% { transform: translate(-44px, 52px) rotate(-4deg); }
      }
      @keyframes scaSunSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scaSprayPop {
        0% { transform: scale(0.9); opacity: 0.75; }
        100% { transform: scale(1.15); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Blazing Tropical Sun -->
  <g class="sca-sun">
    <circle cx="222" cy="24" r="18" fill="#fde047" opacity="0.28"/>
    <circle cx="222" cy="24" r="12.5" fill="#facc15" stroke="#f97316" stroke-width="1.8"/>
  </g>

  <!-- Sandy Island with Palm Tree va Beach Umbrella (left background) -->
  <path d="M10 84 Q46 64 86 84 Z" fill="#fde68a" stroke="#d97706" stroke-width="1.4"/>
  <!-- Palm trunk va fronds -->
  <path d="M42 74 Q36 52 46 34" fill="none" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
  <path d="M46 34 Q30 28 24 38 M46 34 Q38 20 52 22 M46 34 Q62 26 66 38 M46 34 Q58 38 60 46" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Striped Beach Umbrella -->
  <line x1="66" y1="76" x2="70" y2="56" stroke="#78350f" stroke-width="1.8"/>
  <path d="M56 58 Q70 46 82 60 Z" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Back Ocean Swell -->
  <path d="M4 80 Q44 70 84 80 T164 80 T256 80 L256 94 L4 94 Z" fill="url(#scaWave)"/>

  <!-- Surfing Chibi Corgi riding Surfboard (right to left) -->
  <g class="sca-surfer">
    <!-- White Surf Spray behind board -->
    <g class="sca-spray" fill="#e0f2fe">
      <circle cx="24" cy="20" r="4.5"/>
      <circle cx="31" cy="17" r="3.2"/>
    </g>

    <!-- Striped Surfboard -->
    <ellipse cx="4" cy="20" rx="24" ry="5.5" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.8"/>
    <line x1="-14" y1="20" x2="22" y2="20" stroke="#f43f5e" stroke-width="2"/>

    <!-- Corgi Body in Hawaiian Shirt -->
    <rect x="-6" y="6" width="18" height="13" rx="6" fill="#06b6d4" stroke="#0e7490" stroke-width="1.3"/>
    <!-- Pointy Ears + Golden Corgi Head -->
    <polygon points="-6,-4 -10,-16 -1,-8" fill="#fbbf24" stroke="#78350f" stroke-width="1.3"/>
    <polygon points="10,-4 15,-16 6,-8" fill="#fbbf24" stroke="#78350f" stroke-width="1.3"/>
    <ellipse cx="2" cy="0" rx="12" ry="10" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
    <ellipse cx="-2" cy="3" rx="6.5" ry="5.5" fill="#fffbeb"/>
    <!-- Cool Sunglasses facing left -->
    <rect x="-9" y="-3" width="8" height="5" rx="1.5" fill="#0f172a"/>
    <rect x="1" y="-3" width="7" height="5" rx="1.5" fill="#0f172a"/>
    <line x1="-1" y1="-1" x2="1" y2="-1" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Happy Tongue -->
    <circle cx="-6" cy="3" r="1.6" fill="#1e293b"/>
    <path d="M-4 6 Q-2 10 1 6 Z" fill="#fb7185"/>
  </g>

  <!-- Front White-Crested Ocean Wave -->
  <path d="M4 86 Q36 78 68 86 T132 86 T196 86 T256 86 L256 94 L4 94 Z" fill="#0ea5e9" opacity="0.88"/>
  <path d="M4 86 Q36 78 68 86 T132 86 T196 86 T256 86" fill="none" stroke="#f0f9ff" stroke-width="2" opacity="0.85"/>
</svg>
