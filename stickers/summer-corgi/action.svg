<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 95" width="260" height="95">
  <defs>
    <radialGradient id="scaSkyGlow" cx="84%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.38"/>
      <stop offset="48%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scaSunCore" cx="45%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#fef08a"/>
      <stop offset="85%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
    <radialGradient id="scaSunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#facc15" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scaSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="scaWaveBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="scaWaveMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="scaWaveFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.98"/>
    </linearGradient>
    <clipPath id="scaClip">
      <rect x="0" y="0" width="260" height="71"/>
    </clipPath>
    <style>
      .sca-sun-rays { transform-origin: 222px 20px; animation: scaSunSpin 12s linear infinite; }
      .sca-sun-halo { transform-origin: 222px 20px; animation: scaHaloPulse 2.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .sca-cloud1 { animation: scaCloudDrift1 6.2s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .sca-cloud2 { animation: scaCloudDrift2 5.4s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .sca-fronds { transform-origin: 46px 18px; animation: scaPalmSway 2.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .sca-wave-back { animation: scaWaveDrift 3.6s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .sca-wave-front { animation: scaWaveDriftRev 2.8s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }

      /* Silky 60fps decoupled surf carve: linear X + sine Y */
      .sca-surferX { animation: scaSurfRideX 3.0s linear infinite; }
      .sca-surferY { transform-origin: 4px 10px; animation: scaSurfRideY 0.88s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }
      .sca-spray { transform-origin: 24px 20px; animation: scaSprayPop 0.38s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate; }

      @keyframes scaSunSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scaHaloPulse {
        0% { transform: scale(0.92); opacity: 0.75; }
        100% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes scaCloudDrift1 {
        0% { transform: translateX(-6px); }
        100% { transform: translateX(9px); }
      }
      @keyframes scaCloudDrift2 {
        0% { transform: translateX(7px); }
        100% { transform: translateX(-7px); }
      }
      @keyframes scaPalmSway {
        0% { transform: rotate(-4.5deg); }
        100% { transform: rotate(4.5deg); }
      }
      @keyframes scaWaveDrift {
        0% { transform: translateX(-6px); }
        100% { transform: translateX(6px); }
      }
      @keyframes scaWaveDriftRev {
        0% { transform: translateX(6px); }
        100% { transform: translateX(-6px); }
      }
      @keyframes scaSurfRideX {
        0%   { transform: translateX(248px); opacity: 0; }
        7%   { opacity: 1; }
        93%  { opacity: 1; }
        100% { transform: translateX(-54px); opacity: 0; }
      }
      @keyframes scaSurfRideY {
        0%   { transform: translateY(18px) rotate(-6deg); }
        100% { transform: translateY(34px) rotate(6deg); }
      }
      @keyframes scaSprayPop {
        0%   { transform: scale(0.86) translateY(1px); opacity: 0.72; }
        100% { transform: scale(1.16) translateY(-1.5px); opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#scaClip)">
    <!-- Tropical Summer Sky Glow -->
    <rect x="0" y="0" width="260" height="71" fill="url(#scaSkyGlow)"/>

    <!-- Puffy Summer Clouds -->
    <g class="sca-cloud1" fill="#ffffff" opacity="0.82">
      <path d="M98 22 q2 -7 10 -6 q6 -7 15 -2 q8 -3 11 5 q6 0 6 4 Z"/>
    </g>
    <g class="sca-cloud2" fill="#ffffff" opacity="0.72">
      <path d="M154 27 q2 -5 8 -4 q5 -5 12 -1 q6 -2 8 5 Z"/>
    </g>

    <!-- Glowing Rotating Golden Sun -->
    <g>
      <circle class="sca-sun-halo" cx="222" cy="20" r="24" fill="url(#scaSunHalo)"/>
      <g class="sca-sun-rays" stroke="#facc15" stroke-width="2" stroke-linecap="round" opacity="0.82">
        <line x1="222" y1="3" x2="222" y2="7"/>
        <line x1="222" y1="33" x2="222" y2="37"/>
        <line x1="205" y1="20" x2="209" y2="20"/>
        <line x1="235" y1="20" x2="239" y2="20"/>
        <line x1="210" y1="8" x2="213" y2="11"/>
        <line x1="231" y1="29" x2="234" y2="32"/>
        <line x1="234" y1="8" x2="231" y2="11"/>
        <line x1="213" y1="29" x2="210" y2="32"/>
      </g>
      <circle cx="222" cy="20" r="11" fill="url(#scaSunCore)" stroke="#f97316" stroke-width="1.4"/>
    </g>

    <!-- Distant Sandy Palm-Tree Island va Beach Umbrella -->
    <g>
      <path d="M8 65 Q48 44 90 65 Z" fill="url(#scaSand)" stroke="#d97706" stroke-width="1.3"/>
      <!-- Curved Palm Trunk -->
      <path d="M41 55 Q35 35 46 18" fill="none" stroke="#92400e" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M39.5 47 L42.5 46 M38.5 39 L41.8 38.5 M40 31 L43.2 31.5" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Swaying Palm Fronds va Coconuts -->
      <g class="sca-fronds">
        <path d="M46 18 Q30 11 21 22" fill="none" stroke="#15803d" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M46 18 Q36 5 52 7" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M46 18 Q62 9 68 21" fill="none" stroke="#16a34a" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M46 18 Q58 22 61 31" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
        <path d="M46 18 Q33 22 29 30" fill="none" stroke="#22c55e" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="44" cy="20.5" r="2" fill="#78350f"/>
        <circle cx="48" cy="21" r="2" fill="#78350f"/>
      </g>
      <!-- Striped Beach Umbrella -->
      <line x1="66" y1="57" x2="70" y2="37" stroke="#78350f" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M55 40 Q70 27 84 42 Z" fill="#ef4444" stroke="#ffffff" stroke-width="1.1"/>
      <path d="M63 36.5 Q70 31 76 37.5 L72 41 L66 40.5 Z" fill="#ffffff"/>
    </g>

    <!-- Back Turquoise Ocean Swell -->
    <g class="sca-wave-back">
      <path d="M-10 59 Q28 50 66 59 T142 59 T218 59 T270 59 L270 72 L-10 72 Z" fill="url(#scaWaveBack)"/>
      <path d="M-10 59 Q28 50 66 59 T142 59 T218 59 T270 59" fill="none" stroke="#e0f2fe" stroke-width="1.4" opacity="0.65"/>
    </g>

    <!-- Mid Ocean Swell -->
    <path d="M-6 63 Q38 56 82 63 T170 63 T266 63 L266 72 L-6 72 Z" fill="url(#scaWaveMid)" opacity="0.88"/>

    <!-- Surfing Chibi Corgi carving smoothly across the waves -->
    <g class="sca-surferX">
      <g class="sca-surferY">
        <!-- Dynamic Seafoam Wake va Spray -->
        <g class="sca-spray">
          <circle cx="25" cy="20" r="4.6" fill="#e0f2fe"/>
          <circle cx="32" cy="17" r="3.4" fill="#f0f9ff"/>
          <circle cx="38" cy="19.5" r="2.2" fill="#bae6fd"/>
          <circle cx="29" cy="12" r="1.6" fill="#ffffff"/>
          <circle cx="36" cy="12.5" r="1.3" fill="#e0f2fe"/>
        </g>
        <!-- Surfboard -->
        <ellipse cx="4" cy="20" rx="24" ry="5.5" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.8"/>
        <line x1="-14" y1="20" x2="22" y2="20" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
        <!-- Corgi Rashguard va Body -->
        <rect x="-6" y="6" width="18" height="13" rx="6" fill="#06b6d4" stroke="#0e7490" stroke-width="1.3"/>
        <line x1="-1" y1="9" x2="7" y2="9" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Pointy Ears -->
        <polygon points="-6,-4 -10,-15 -1,-8" fill="#fbbf24" stroke="#78350f" stroke-width="1.3" stroke-linejoin="round"/>
        <polygon points="10,-4 15,-15 6,-8" fill="#fbbf24" stroke="#78350f" stroke-width="1.3" stroke-linejoin="round"/>
        <!-- Head va Cream Muzzle -->
        <ellipse cx="2" cy="0" rx="12" ry="10" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
        <ellipse cx="-2" cy="3" rx="6.5" ry="5.5" fill="#fffbeb"/>
        <!-- Cool Sunglasses with Glint -->
        <rect x="-9" y="-3" width="8" height="5" rx="1.5" fill="#0f172a"/>
        <rect x="1" y="-3" width="7" height="5" rx="1.5" fill="#0f172a"/>
        <line x1="-1" y1="-1" x2="1" y2="-1" stroke="#0f172a" stroke-width="1.5"/>
        <line x1="-7.5" y1="-1.5" x2="-4.5" y2="-1.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
        <line x1="2.5" y1="-1.5" x2="5.5" y2="-1.5" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
        <!-- Nose va Happy Tongue -->
        <circle cx="-6" cy="3" r="1.6" fill="#1e293b"/>
        <path d="M-4 6 Q-2 10 1 6 Z" fill="#fb7185"/>
      </g>
    </g>

    <!-- Front Curling White-Crested Ocean Wave flush on y=71 -->
    <g class="sca-wave-front">
      <path d="M-10 65 Q22 57 54 65 T118 65 T182 65 T270 65 L270 72 L-10 72 Z" fill="url(#scaWaveFront)"/>
      <path d="M-10 65 Q22 57 54 65 T118 65 T182 65 T270 65" fill="none" stroke="#f0f9ff" stroke-width="2.2" stroke-linecap="round" opacity="0.94"/>
      <circle cx="24" cy="60.5" r="1.4" fill="#ffffff" opacity="0.85"/>
      <circle cx="88" cy="60.5" r="1.4" fill="#ffffff" opacity="0.85"/>
      <circle cx="152" cy="60.5" r="1.4" fill="#ffffff" opacity="0.85"/>
      <circle cx="216" cy="60.5" r="1.4" fill="#ffffff" opacity="0.85"/>
    </g>
  </g>
</svg>
